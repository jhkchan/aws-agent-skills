# Eval configuration for storage-gateway-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: storage-gateway-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: s3-file-gateway-nfs
    difficulty: hard
    prompt_file: prompts/s3-file-gateway-nfs.md
    baseline_file: baselines/s3-file-gateway-nfs.md
    expected_verdict: READY_TO_DEPLOY

  - id: volume-gateway-iscsi
    difficulty: hard
    prompt_file: prompts/volume-gateway-iscsi.md
    baseline_file: baselines/volume-gateway-iscsi.md
    expected_verdict: READY_TO_DEPLOY

  - id: smb-active-directory
    difficulty: hard
    prompt_file: prompts/smb-active-directory.md
    baseline_file: baselines/smb-active-directory.md
    expected_verdict: READY_TO_DEPLOY

  - id: tape-gateway-vtl
    difficulty: medium
    prompt_file: prompts/tape-gateway-vtl.md
    baseline_file: baselines/tape-gateway-vtl.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-activation-key
    difficulty: easy
    prompt_file: prompts/missing-activation-key.md
    baseline_file: baselines/missing-activation-key.md
    expected_verdict: PREREQUISITES_MISSING
