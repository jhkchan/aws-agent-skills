# Eval configuration for ec2-launch-template-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: ec2-launch-template-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: imdsv2-tags-graviton
    difficulty: hard
    prompt_file: prompts/imdsv2-tags-graviton.md
    baseline_file: baselines/imdsv2-tags-graviton.md
    expected_verdict: READY_TO_DEPLOY

  - id: capacity-reservation-targeting
    difficulty: hard
    prompt_file: prompts/capacity-reservation-targeting.md
    baseline_file: baselines/capacity-reservation-targeting.md
    expected_verdict: READY_TO_DEPLOY

  - id: multi-volume-block-device
    difficulty: hard
    prompt_file: prompts/multi-volume-block-device.md
    baseline_file: baselines/multi-volume-block-device.md
    expected_verdict: READY_TO_DEPLOY

  - id: network-interface-public-ip-ipv6
    difficulty: hard
    prompt_file: prompts/network-interface-public-ip-ipv6.md
    baseline_file: baselines/network-interface-public-ip-ipv6.md
    expected_verdict: READY_TO_DEPLOY

  - id: architecture-mismatch
    difficulty: easy
    prompt_file: prompts/architecture-mismatch.md
    baseline_file: baselines/architecture-mismatch.md
    expected_verdict: PREREQUISITES_MISSING
