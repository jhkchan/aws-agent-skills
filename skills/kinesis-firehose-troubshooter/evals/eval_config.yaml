# Eval configuration for kinesis-firehose-troubleshooter.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it - it adds the structured with-skill-vs-baseline dimension.
skill_name: kinesis-firehose-troubleshooter
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: delivery-to-s3-kms-gap
    difficulty: easy
    prompt_file: prompts/delivery-to-s3-kms-gap.md
    baseline_file: baselines/delivery-to-s3-kms-gap.md
    expected_verdict: ROOT_CAUSE_FOUND
  - id: lambda-transform-6mb-cap
    difficulty: medium
    prompt_file: prompts/lambda-transform-6mb-cap.md
    baseline_file: baselines/lambda-transform-6mb-cap.md
    expected_verdict: ROOT_CAUSE_FOUND
  - id: format-conversion-0-byte
    difficulty: medium
    prompt_file: prompts/format-conversion-0-byte.md
    baseline_file: baselines/format-conversion-0-byte.md
    expected_verdict: ROOT_CAUSE_FOUND
  - id: opensearch-circuit-breaker
    difficulty: hard
    prompt_file: prompts/opensearch-circuit-breaker.md
    baseline_file: baselines/opensearch-circuit-breaker.md
    expected_verdict: ESCALATE
  - id: redshift-copy-column-mismatch
    difficulty: hard
    prompt_file: prompts/redshift-copy-column-mismatch.md
    baseline_file: baselines/redshift-copy-column-mismatch.md
    expected_verdict: ROOT_CAUSE_FOUND
