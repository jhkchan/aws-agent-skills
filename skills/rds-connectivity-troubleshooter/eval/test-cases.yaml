# Eval test cases for rds-connectivity-troubleshooter
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five deterministic cases — one per root-cause layer family. Each case's
# TARGET embeds the test-case id so the model naturally echoes it (avoids
# assertion-token mismatch). The diagnostic ordering in SKILL.md produces
# exactly the expected verdicts below.
skill: rds-connectivity-troubleshooter
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: timeout-sg-missing-rule
    description: >-
      MySQL instance reachable from one CIDR but the caller's app-server
      lives in a different subnet not covered by the SG inbound rule.
      Symptom: telnet hangs and times out. Expected layer: NETWORK_SG.
    input: |
      Symptom: application on EC2 instance i-app-server (private IP
      10.42.5.10, subnet subnet-bbb, SG sg-app, AZ us-east-1a) cannot
      reach db-timeout-sg-missing-rule. telnet db-timeout-sg-missing-rule.cid.on.aws
      3306 hangs and returns "Operation timed out" after 10 seconds. No
      error appears in the MySQL engine log.

      DBInstanceIdentifier: db-timeout-sg-missing-rule
      Engine: mysql
      DBInstanceStatus: available
      Endpoint: db-timeout-sg-missing-rule.cid.on.aws:3306
      VpcSecurityGroups: [{VpcSecurityGroupId: sg-rds-prod, Status: active}]
      Security group sg-rds-prod inbound rules:
        - tcp/3306 from 10.42.0.0/24
        - tcp/3306 from sg-app-old (a deleted security group)
      DBSubnetGroup: prod-db-subnet-group (subnets in us-east-1a, us-east-1b)

      Emit the standard diagnostic block (TARGET, VERDICT, REASON, LAYER,
      EVIDENCE, REMEDIATION).
    expected_verdict: ROOT_CAUSE_FOUND
    assertions:
      must_contain:
        - "ROOT_CAUSE_FOUND"
        - "timeout-sg-missing-rule"
        - "NETWORK_SG"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: NEED_MORE_INFO"
        - "VERDICT: ESCALATE"

  - id: auth-failed-iam-token-expiry
    description: >-
      PostgreSQL instance with IAM database auth enabled. First ~50
      connections succeed each morning, then subsequent connections fail
      with "password authentication failed". Symptom pattern indicates
      IAM auth token cached too long in the connection pool.
    input: |
      Symptom: application uses IAM database auth against
      db-auth-iam-token-expiry. First ~50 connections each morning
      succeed; subsequent new connections fail with
      "FATAL: password authentication failed for user 'iam_app_role'".
      Engine logs show no password change. Restarting the application
      temporarily resolves the issue.

      DBInstanceIdentifier: db-auth-iam-token-expiry
      Engine: postgres
      DBInstanceStatus: available
      IAMDatabaseAuthenticationEnabled: true
      Endpoint: db-auth-iam-token-expiry.cid.on.aws:5432
      VpcSecurityGroups: [{VpcSecurityGroupId: sg-rds-prod, Status: active}]
      Application context: Java/HikariCP connection pool, maxLifetime=30 minutes.

      Emit the standard diagnostic block (TARGET, VERDICT, REASON, LAYER,
      EVIDENCE, REMEDIATION).
    expected_verdict: ROOT_CAUSE_FOUND
    assertions:
      must_contain:
        - "ROOT_CAUSE_FOUND"
        - "auth-iam-token-expiry"
        - "AUTH_IAM"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: NEED_MORE_INFO"
        - "LAYER: AUTH_CREDENTIALS"

  - id: tls-cert-mismatch
    description: >-
      MySQL instance recently rotated to rds-ca-e2024. Java client
      truststore still has only rds-ca-2019. Connections fail with
      "unable to get local issuer certificate".
    input: |
      Symptom: Java application cannot connect to db-tls-cert-mismatch
      after a recent maintenance window. Error:
      "unable to get local issuer certificate". Before the window,
      connections worked. The instance's CA was rotated from rds-ca-2019
      to rds-ca-e2024 during the maintenance window.

      DBInstanceIdentifier: db-tls-cert-mismatch
      Engine: mysql
      DBInstanceStatus: available
      Endpoint: db-tls-cert-mismatch.cid.on.aws:3306
      CACertificateIdentifier: rds-ca-e2024
      require_secure_transport: 1
      Client truststore: contains rds-ca-2019 only

      Emit the standard diagnostic block (TARGET, VERDICT, REASON, LAYER,
      EVIDENCE, REMEDIATION).
    expected_verdict: ROOT_CAUSE_FOUND
    assertions:
      must_contain:
        - "ROOT_CAUSE_FOUND"
        - "tls-cert-mismatch"
        - "TLS_CERT"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: NEED_MORE_INFO"
        - "LAYER: TLS_CONFIG"

  - id: connection-refused-failover
    description: >-
      Aurora PostgreSQL cluster mid-failover. Application sees "server
      closed the connection unexpectedly". Events show Multi-AZ failover
      started 45 seconds ago. Expected verdict: ESCALATE.
    input: |
      Symptom: application cannot connect to Aurora PostgreSQL writer
      endpoint. Error: "server closed the connection unexpectedly".
      Connections to reader endpoint also fail intermittently.

      DBClusterIdentifier: db-connection-refused-failover
      Engine: aurora-postgresql
      Status: modifying
      Endpoint: db-connection-refused-failover.cluster-on.aws:5432
      MultiAZ: true
      DBClusterMembers: writer flipped 45 seconds ago
      Recent events:
        - "Multi-AZ failover started" (45 seconds ago)
      No SG/NACL/route changes in the last 24 hours.

      Emit the standard diagnostic block (TARGET, VERDICT, REASON, LAYER,
      EVIDENCE, REMEDIATION).
    expected_verdict: ESCALATE
    assertions:
      must_contain:
        - "ESCALATE"
        - "connection-refused-failover"
        - "INSTANCE_FAILOVER"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: ROOT_CAUSE_FOUND"
        - "LAYER: NETWORK_SG"

  - id: too-many-connections-aurora-derived
    description: >-
      Aurora MySQL cluster hitting the derived max_connections cap on a
      db.r6i.large writer. Engine returns "Too many connections" on
      connect. Instance-class upsizing or RDS Proxy is required.
    input: |
      Symptom: application cannot open new connections to Aurora MySQL
      writer. Error: "Too many connections". Engine reports
      Threads_connected = 6000, max_connections = 6000 (derived).

      DBClusterIdentifier: db-too-many-connections-aurora
      Engine: aurora-mysql
      Status: available
      Endpoint: db-too-many-connections-aurora.cluster-on.aws:3306
      Writer instance class: db.r6i.large
      Threads_connected: 6000
      max_connections: 6000 (derived from db.r6i.large; parameter-group
        override to 8000 was applied but ignored)
      Recent events: no maintenance, no failover.

      Emit the standard diagnostic block (TARGET, VERDICT, REASON, LAYER,
      EVIDENCE, REMEDIATION).
    expected_verdict: ROOT_CAUSE_FOUND
    assertions:
      must_contain:
        - "ROOT_CAUSE_FOUND"
        - "too-many-connections-aurora"
        - "CAPACITY_MAX_CONNECTIONS"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: NEED_MORE_INFO"
        - "LAYER: INSTANCE_UNAVAILABLE"
