# Eval configuration for stepfunctions-statemachine-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: stepfunctions-statemachine-deployer
snapshot_date: "2026-08-09"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: standard-lambda-orchestration
    difficulty: easy
    prompt_file: prompts/standard-lambda-orchestration.md
    baseline_file: baselines/standard-lambda-orchestration.md
    expected_verdict: READY_TO_DEPLOY
  - id: express-sync-api-gateway
    difficulty: medium
    prompt_file: prompts/express-sync-api-gateway.md
    baseline_file: baselines/express-sync-api-gateway.md
    expected_verdict: READY_TO_DEPLOY
  - id: distributed-map-s3-batch
    difficulty: hard
    prompt_file: prompts/distributed-map-s3-batch.md
    baseline_file: baselines/distributed-map-s3-batch.md
    expected_verdict: READY_TO_DEPLOY
  - id: missing-iam-role-trust
    difficulty: easy
    prompt_file: prompts/missing-iam-role-trust.md
    baseline_file: baselines/missing-iam-role-trust.md
    expected_verdict: PREREQUISITES_MISSING
  - id: express-timeout-exceeds-cap
    difficulty: hard
    prompt_file: prompts/express-timeout-exceeds-cap.md
    baseline_file: baselines/express-timeout-exceeds-cap.md
    expected_verdict: PREREQUISITES_MISSING
