# Eval configuration for msk-cluster-auditor.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: msk-cluster-auditor
snapshot_date: "2026-08-05"
baseline_model: amazon.nova-pro-v1:0
judge_model: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: plaintext-broker
    difficulty: easy
    prompt_file: prompts/plaintext-broker.md
    baseline_file: baselines/plaintext-broker.md
    expected_verdict: NO_ENCRYPTION
  - id: unauthenticated-clients
    difficulty: medium
    prompt_file: prompts/unauthenticated-clients.md
    baseline_file: baselines/unauthenticated-clients.md
    expected_verdict: UNAUTHENTICATED
  - id: public-access-brokers
    difficulty: medium
    prompt_file: prompts/public-access-brokers.md
    baseline_file: baselines/public-access-brokers.md
    expected_verdict: PUBLIC_ACCESS
  - id: no-broker-logging
    difficulty: medium
    prompt_file: prompts/no-broker-logging.md
    baseline_file: baselines/no-broker-logging.md
    expected_verdict: CONFIG_GAP
  - id: tls-plaintext-mixed
    difficulty: hard
    prompt_file: prompts/tls-plaintext-mixed.md
    baseline_file: baselines/tls-plaintext-mixed.md
    expected_verdict: NO_ENCRYPTION
  - id: fully-hardened-cluster
    difficulty: easy
    prompt_file: prompts/fully-hardened-cluster.md
    baseline_file: baselines/fully-hardened-cluster.md
    expected_verdict: OK
