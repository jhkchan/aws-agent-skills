# Eval configuration for route53-routing-policy-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: route53-routing-policy-deployer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: weighted-canary-with-health-checks
    difficulty: hard
    prompt_file: prompts/weighted-canary-with-health-checks.md
    baseline_file: baselines/weighted-canary-with-health-checks.md
    expected_verdict: READY_TO_DEPLOY

  - id: weighted-without-health-check
    difficulty: medium
    prompt_file: prompts/weighted-without-health-check.md
    baseline_file: baselines/weighted-without-health-check.md
    expected_verdict: PREREQUISITES_MISSING

  - id: failover-primary-secondary-with-eth
    difficulty: hard
    prompt_file: prompts/failover-primary-secondary-with-eth.md
    baseline_file: baselines/failover-primary-secondary-with-eth.md
    expected_verdict: READY_TO_DEPLOY

  - id: geolocation-with-default-record
    difficulty: hard
    prompt_file: prompts/geolocation-with-default-record.md
    baseline_file: baselines/geolocation-with-default-record.md
    expected_verdict: READY_TO_DEPLOY

  - id: arc-routing-control-with-safety-rule
    difficulty: hard
    prompt_file: prompts/arc-routing-control-with-safety-rule.md
    baseline_file: baselines/arc-routing-control-with-safety-rule.md
    expected_verdict: READY_TO_DEPLOY
