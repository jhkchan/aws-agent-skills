# "who published this", never "is this safe".
---
name: organizations-account-deployer
version: "0.1.0"

# The runtime whose skill-directory format this package is validated against
# (agentskills.io spec compliance + @skills resolution, verified end-to-end).
# SKILL.md `compatibility` names the broader expected set; only the checked
# runtime is declared here.
platforms: [claude]

description: >-
  Provisions AWS Organizations member accounts with production defaults: account creation (create-account with unique root email, IAM role name), Control Tower Account Factory (automation, blueprints, landing zone vending), cross-account role (OrganizationAccountAccessRole), consolidated billing, SCP and tag policy attachment at correct scope, CloudTrail organization trail propagation, IAM Identity Center SSO permission sets, and latest features (Terraform aws_organizations_account, Account Factory custom baselines). Emits a READY_TO_DEPLOY checklist with verification commands.

author:
  name: "aws-agent-skills contributors"
  # identity + signing_key are written by the release signer in the same
  # operation as `signature` below, and both are inside the signed payload.
  # `identity` and `signing_key` are written by scripts/sign_usf.py in the same
  # operation as `signature` below, and both are INSIDE the signed payload. A
  # signature whose key anchors to nothing is the false trust signal AST10 warns
  # about, so the signer cannot produce one without the anchor, and neither field
  # can be swapped for another publisher's without breaking the signature.
  # The key is published at https://jhkchan.github.io/.well-known/did.json; this
  # anchor is worth exactly as much as control of that domain and its TLS. A
  # verified signature answers "who published this", never "is this safe".
  identity: "did:web:jhkchan.github.io"
  signing_key: "ed25519:77fb87cd4a46dd524190f72cee510d0ad934b0df4acc40366f9b8a8dc87593a6"

permissions:
  files:
    read:
      - ./SKILL.md
      - ./skill.usf.yaml
      - ./references/advanced-patterns.md
      - ./references/creation-paths-and-baselines.md
      - ./references/error-handling.md
      - ./references/provisioning-cli-commands.md
      - ./examples/README.md
    # The package is instructions: it writes nothing, ever.
    write: []
    deny_write:
      # The identity-file floor. `write: []` is a property of this package;
      # `deny_write` is what has to survive a port to a runtime whose default
      # is write-everything.
      - SOUL.md
      - MEMORY.md
      - AGENTS.md
  network:
    # No package egress. Default-deny with an empty allowlist means no host is
    # reachable. AWS API calls the instructions direct are runtime-mediated via
    # the aws CLI (see requires.binaries), not package egress.
    allow: []
    deny: "*"
  shell: false
  tools:
    - read_file

requires:
  # Every skill drives or ingests AWS CLI output (see SKILL.md compatibility).
  binaries: [aws]

# Permission-derived floor is L0 (read-only, no egress, no shell). The tier
# reflects the skill's instructed effect class, which over-declares on purpose:
# following this skill creates or modifies cloud infrastructure, so the effect is elevated even though the package itself writes nothing.
risk_tier: L2

scan_status:
  scanner: "jhkchan/owasp-ast10-agent-skills audit"
  last_scanned: "2026-09-07"
  result: "pass"

signature: "ed25519:7dc642c66c7adb53c859aaacdf0351d37a652399ca46fa397cba8bc40ac5297f4d8211f692cde410febd6d0e1792fa53d3c4efbc417e23c1e224a3d3c5ab1c05"

