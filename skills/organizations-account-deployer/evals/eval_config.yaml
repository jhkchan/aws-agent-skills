# Eval configuration for organizations-account-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: organizations-account-deployer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: production-account-via-control-tower
    difficulty: hard
    prompt_file: prompts/production-account-via-control-tower.md
    baseline_file: baselines/production-account-via-control-tower.md
    expected_verdict: READY_TO_DEPLOY

  - id: workload-account-create-account-scp-tags
    difficulty: hard
    prompt_file: prompts/workload-account-create-account-scp-tags.md
    baseline_file: baselines/workload-account-create-account-scp-tags.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-root-email-and-iam-role
    difficulty: easy
    prompt_file: prompts/missing-root-email-and-iam-role.md
    baseline_file: baselines/missing-root-email-and-iam-role.md
    expected_verdict: PREREQUISITES_MISSING

  - id: consolidated-billing-budget-account
    difficulty: medium
    prompt_file: prompts/consolidated-billing-budget-account.md
    baseline_file: baselines/consolidated-billing-budget-account.md
    expected_verdict: READY_TO_DEPLOY

  - id: terraform-account-factory-baseline
    difficulty: hard
    prompt_file: prompts/terraform-account-factory-baseline.md
    baseline_file: baselines/terraform-account-factory-baseline.md
    expected_verdict: READY_TO_DEPLOY
