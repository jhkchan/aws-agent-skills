# Eval configuration for cloudtrail-cost-optimizer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: cloudtrail-cost-optimizer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: org-trail-consolidation
    difficulty: hard
    prompt_file: prompts/org-trail-consolidation.md
    baseline_file: baselines/org-trail-consolidation.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
  - id: s3-lifecycle-glacier-transition
    difficulty: medium
    prompt_file: prompts/s3-lifecycle-glacier-transition.md
    baseline_file: baselines/s3-lifecycle-glacier-transition.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
  - id: data-event-volume-curation
    difficulty: hard
    prompt_file: prompts/data-event-volume-curation.md
    baseline_file: baselines/data-event-volume-curation.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
  - id: cloudtrail-lake-scoping
    difficulty: medium
    prompt_file: prompts/cloudtrail-lake-scoping.md
    baseline_file: baselines/cloudtrail-lake-scoping.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
  - id: already-optimized-org-setup
    difficulty: easy
    prompt_file: prompts/already-optimized-org-setup.md
    baseline_file: baselines/already-optimized-org-setup.md
    expected_verdict: OPTIMIZED
