        - "open-security-group"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
        - "10250"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: PUBLIC_ENDPOINT"
        - "VERDICT: LOGGING_DISABLED"

  - id: outdated-version
    description: >-
