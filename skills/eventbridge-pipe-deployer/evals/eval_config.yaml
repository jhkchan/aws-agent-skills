# Eval configuration for eventbridge-pipe-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: eventbridge-pipe-deployer
snapshot_date: "2026-08-07"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: ddb-streams-lambda-filter-dlq
    difficulty: easy
    prompt_file: prompts/ddb-streams-lambda-filter-dlq.md
    baseline_file: baselines/ddb-streams-lambda-filter-dlq.md
    expected_verdict: READY_TO_DEPLOY
  - id: kinesis-stepfunctions-batch-window
    difficulty: medium
    prompt_file: prompts/kinesis-stepfunctions-batch-window.md
    baseline_file: baselines/kinesis-stepfunctions-batch-window.md
    expected_verdict: READY_TO_DEPLOY
  - id: sqs-source-missing-redrive-policy
    difficulty: medium
    prompt_file: prompts/sqs-source-missing-redrive-policy.md
    baseline_file: baselines/sqs-source-missing-redrive-policy.md
    expected_verdict: PREREQUISITES_MISSING
  - id: enrichment-lambda-transformation
    difficulty: hard
    prompt_file: prompts/enrichment-lambda-transformation.md
    baseline_file: baselines/enrichment-lambda-transformation.md
    expected_verdict: READY_TO_DEPLOY
  - id: aws-batch-target-from-msk
    difficulty: hard
    prompt_file: prompts/aws-batch-target-from-msk.md
    baseline_file: baselines/aws-batch-target-from-msk.md
    expected_verdict: READY_TO_DEPLOY
