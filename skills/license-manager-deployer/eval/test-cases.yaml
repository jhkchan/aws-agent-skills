# Eval test cases for license-manager-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the READY_TO_DEPLOY /
# PREREQUISITES_MISSING classification across license types
# (Oracle vCPU tracking with cross-Org sharing, SQL Server core-
# based counting, instance-based counting with SSM discovery,
# cross-account distribution via Organizations, missing license
# rules prerequisite failure).
skill: license-manager-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: oracle-vcpu-tracking
    description: >-
      Provision an Oracle Database license configuration with vCPU-
      based counting, hard limit enforcement, Oracle tenancy rules,
      and cross-account sharing via Organizations. Expects
      READY_TO_DEPLOY with HonorVcpuOptimization=true, Tenancy=Shared,
      Organizations all-features verified, and EventBridge alerting
      configured.
    input: |
      Create a License Manager configuration for Oracle Database
      Standard Edition. 200 vCPU entitlement. Shared tenancy, honor
      vCPU optimization. Hard limit enforcement. Associate with EC2
      launch template lt-aaa111222333 in us-east-1. Share across the
      Organization (all-features, OU ou-app-abcdef). Delegated
      administrator account 999999999999. Alert violations via SNS
      topic arn:aws:sns:us-east-1:123456789012:license-alerts.
      Tags: Vendor=Oracle, Environment=production.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "vCPU"
        - "Tenancy=Shared"
        - "HonorVcpuOptimization=true"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
        - "license-manager"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: sql-server-core-tracking
    description: >-
      Provision a SQL Server license configuration with core-based
      counting, 0.5 core factor (Standard Edition), and hard limit
      enforcement. Expects READY_TO_DEPLOY with Core counting,
      coreFactor=0.5, and consumption tracked against physical cores.
    input: |
      Create a License Manager configuration for SQL Server Standard
      Edition. 24 core entitlement. EC2 location, 0.5 core factor.
      Hard limit enforcement. Associate with EC2 launch template
      lt-sql111222333 in us-east-1. Account 123456789012. Tags:
      Vendor=SQLServer, Edition=Standard, Environment=production.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "Core"
        - "coreFactor=0.5"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: instance-based-ssm-discovery
    description: >-
      Provision an instance-based license configuration for per-
      instance middleware with SSM-managed on-premises discovery.
      Expects READY_TO_DEPLOY with Instance counting type, SSM
      inventory enabled, and resource association via SSM managed
      instances.
    input: |
      Create a License Manager configuration for a per-instance
      commercial middleware product. 50 instance entitlement. Soft
      limit (alert only). On-premises servers managed via SSM with
      inventory collecting Applications data. Account
      123456789012 in us-east-1. Tags: Vendor=Middleware,
      Environment=production.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "Instance"
        - "SSM"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: cross-account-org-sharing
    description: >-
      Provision a license configuration with cross-account sharing
      across an Organization. Expects READY_TO_DEPLOY with
      Organizations all-features verified, License Manager trusted
      service enabled, delegated administrator registered, and
      license configuration shared to an OU.
    input: |
      Create a License Manager configuration for shared developer
      tools licensing. 100 instance entitlement. Instance counting,
      soft limit. Share across the Organization. Organization ID
      o-abc123def4, all-features enabled. License Manager is a
      trusted service. Delegated administrator 999999999999. Share
      to OU ou-dev-xyz789. Account 123456789012 in us-east-1.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "cross-account"
        - "Organizations"
        - "999999999999"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: missing-license-rules
    description: >-
      Operator requests an Oracle Database license configuration but
      does not provide license rules (Tenancy, HonorVcpuOptimization).
      Oracle licensing requires vendor-specific rules for enforcement.
      Expects PREREQUISITES_MISSING with license rules cited.
    input: |
      Create a License Manager configuration for Oracle Database.
      200 vCPU entitlement. vCPU counting. Hard limit enforcement.
      Associate with EC2 launch template lt-oracle111 in us-east-1.
      Account 123456789012. No vendor-specific rules specified.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "license rules"
        - "VERDICT"
        - "CHECKLIST"
        - "Oracle"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"
