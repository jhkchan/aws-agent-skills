# Eval configuration for elasticache-cache-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: elasticache-cache-deployer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: production-redis-cluster-mode
    difficulty: hard
    prompt_file: prompts/production-redis-cluster-mode.md
    baseline_file: baselines/production-redis-cluster-mode.md
    expected_verdict: READY_TO_DEPLOY

  - id: session-store-redis-replication
    difficulty: medium
    prompt_file: prompts/session-store-redis-replication.md
    baseline_file: baselines/session-store-redis-replication.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-subnet-group-and-sg
    difficulty: easy
    prompt_file: prompts/missing-subnet-group-and-sg.md
    baseline_file: baselines/missing-subnet-group-and-sg.md
    expected_verdict: PREREQUISITES_MISSING

  - id: memcached-simple-cache
    difficulty: medium
    prompt_file: prompts/memcached-simple-cache.md
    baseline_file: baselines/memcached-simple-cache.md
    expected_verdict: READY_TO_DEPLOY

  - id: global-datastore-cross-region
    difficulty: hard
    prompt_file: prompts/global-datastore-cross-region.md
    baseline_file: baselines/global-datastore-cross-region.md
    expected_verdict: READY_TO_DEPLOY
