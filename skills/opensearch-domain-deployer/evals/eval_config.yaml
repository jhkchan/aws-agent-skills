# Eval configuration for opensearch-domain-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: opensearch-domain-deployer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: production-managed-cluster-multiaz
    difficulty: hard
    prompt_file: prompts/production-managed-cluster-multiaz.md
    baseline_file: baselines/production-managed-cluster-multiaz.md
    expected_verdict: READY_TO_DEPLOY

  - id: serverless-vector-search
    difficulty: medium
    prompt_file: prompts/serverless-vector-search.md
    baseline_file: baselines/serverless-vector-search.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-vpc-and-kms
    difficulty: easy
    prompt_file: prompts/missing-vpc-and-kms.md
    baseline_file: baselines/missing-vpc-and-kms.md
    expected_verdict: PREREQUISITES_MISSING

  - id: dedicated-master-large-cluster
    difficulty: hard
    prompt_file: prompts/dedicated-master-large-cluster.md
    baseline_file: baselines/dedicated-master-large-cluster.md
    expected_verdict: READY_TO_DEPLOY

  - id: dev-t3-single-node
    difficulty: medium
    prompt_file: prompts/dev-t3-single-node.md
    baseline_file: baselines/dev-t3-single-node.md
    expected_verdict: READY_TO_DEPLOY
