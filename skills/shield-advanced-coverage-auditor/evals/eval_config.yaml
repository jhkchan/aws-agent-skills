# Eval configuration for shield-advanced-coverage-auditor.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: shield-advanced-coverage-auditor
snapshot_date: "2026-08-05"
baseline_model: amazon.nova-pro-v1:0
judge_model: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: fully-configured-ok
    difficulty: easy
    prompt_file: prompts/fully-configured-ok.md
    baseline_file: baselines/fully-configured-ok.md
    expected_verdict: OK
    expected_risk: LOW
  - id: unprotected-elastic-ip
    difficulty: easy
    prompt_file: prompts/unprotected-elastic-ip.md
    baseline_file: baselines/unprotected-elastic-ip.md
    expected_verdict: UNPROTECTED
    expected_risk: HIGH
  - id: no-drt-role
    difficulty: medium
    prompt_file: prompts/no-drt-role.md
    baseline_file: baselines/no-drt-role.md
    expected_verdict: NO_DRT_ACCESS
    expected_risk: HIGH
  - id: no-health-based-detection
    difficulty: hard
    prompt_file: prompts/no-health-based-detection.md
    baseline_file: baselines/no-health-based-detection.md
    expected_verdict: CONFIG_GAP
    expected_risk: MEDIUM
  - id: proactive-engagement-disabled
    difficulty: medium
    prompt_file: prompts/proactive-engagement-disabled.md
    baseline_file: baselines/proactive-engagement-disabled.md
    expected_verdict: CONFIG_GAP
    expected_risk: MEDIUM
  - id: drt-role-no-log-bucket
    difficulty: hard
    prompt_file: prompts/drt-role-no-log-bucket.md
    baseline_file: baselines/drt-role-no-log-bucket.md
    expected_verdict: CONFIG_GAP
    expected_risk: MEDIUM
