# Eval configuration for event-driven-automator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: event-driven-automator
snapshot_date: "2026-08-07"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: guardduty-lambda-auto-remediation
    difficulty: easy
    prompt_file: prompts/guardduty-lambda-auto-remediation.md
    baseline_file: baselines/guardduty-lambda-auto-remediation.md
    expected_verdict: AUTOMATED
  - id: codebuild-failure-sns-notify
    difficulty: medium
    prompt_file: prompts/codebuild-failure-sns-notify.md
    baseline_file: baselines/codebuild-failure-sns-notify.md
    expected_verdict: AUTOMATED
  - id: circular-dependency-detected
    difficulty: hard
    prompt_file: prompts/circular-dependency-detected.md
    baseline_file: baselines/circular-dependency-detected.md
    expected_verdict: MANUAL_STEP_REQUIRED
  - id: dlq-idempotency-gap
    difficulty: hard
    prompt_file: prompts/dlq-idempotency-gap.md
    baseline_file: baselines/dlq-idempotency-gap.md
    expected_verdict: MANUAL_STEP_REQUIRED
  - id: pipes-enrichment-pipeline
    difficulty: hard
    prompt_file: prompts/pipes-enrichment-pipeline.md
    baseline_file: baselines/pipes-enrichment-pipeline.md
    expected_verdict: AUTOMATED
