# Eval configuration for acm-certificate-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: acm-certificate-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: public-dns-cloudfront
    difficulty: hard
    prompt_file: prompts/public-dns-cloudfront.md
    baseline_file: baselines/public-dns-cloudfront.md
    expected_verdict: READY_TO_DEPLOY

  - id: wildcard-san-certificate
    difficulty: hard
    prompt_file: prompts/wildcard-san-certificate.md
    baseline_file: baselines/wildcard-san-certificate.md
    expected_verdict: READY_TO_DEPLOY

  - id: import-third-party-cert
    difficulty: medium
    prompt_file: prompts/import-third-party-cert.md
    baseline_file: baselines/import-third-party-cert.md
    expected_verdict: READY_TO_DEPLOY

  - id: private-cert-via-pca
    difficulty: medium
    prompt_file: prompts/private-cert-via-pca.md
    baseline_file: baselines/private-cert-via-pca.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-region-cloudfront
    difficulty: easy
    prompt_file: prompts/missing-region-cloudfront.md
    baseline_file: baselines/missing-region-cloudfront.md
    expected_verdict: PREREQUISITES_MISSING
