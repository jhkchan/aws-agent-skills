# Eval test cases for rekognition-collection-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the READY_TO_DEPLOY /
# PREREQUISITES_MISSING classification across Rekognition topologies
# (collection with KMS and face indexing, stream processor with Kinesis
# integration, content moderation and label detection pipeline, custom
# labels model lifecycle, missing KMS key for encrypted collection).
skill: rekognition-collection-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: kms-collection-face-index
    description: >-
      Provision a Rekognition collection with KMS encryption, index faces
      with ExternalImageId, and configure face search with an 85%
      similarity threshold. Expects READY_TO_DEPLOY with KMS noted at
      creation, ExternalImageId configured, and threshold at 80%+.
    input: |
      Create a Rekognition collection "employee-faces" in us-east-1
      with KMS encryption using key arn:aws:kms:us-east-1:123456789012:key/abcd-1234.
      Index faces from S3 bucket my-face-bucket using ExternalImageId
      employee-001. Set face search threshold to 85%. IAM role
      arn:aws:iam::123456789012:role/RekognitionRole. Tags:
      Environment=production, UseCase=employee-access.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "employee-faces"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
        - "kms"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: stream-processor-kinesis
    description: >-
      Provision a Rekognition stream processor reading from a Kinesis
      input stream and writing to a Kinesis output stream with
      shard-level parallelism. Expects READY_TO_DEPLOY with both streams
      noted, shard count flagged, and IAM role with all three permissions.
    input: |
      Create a Rekognition stream processor "camera-feed-processor" in
      us-east-1. Input stream: rekognition-input (4 shards). Output
      stream: rekognition-output (2 shards). Collection: employee-faces.
      Face match threshold: 85%. IAM role:
      arn:aws:iam::123456789012:role/RekognitionStreamProcessorRole.
      Tags: Environment=production, Pipeline=video-access.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "camera-feed-processor"
        - "rekognition-input"
        - "rekognition-output"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: moderation-and-labels-pipeline
    description: >-
      Provision a content moderation and label detection pipeline with
      SNS notification for async video jobs. Expects READY_TO_DEPLOY with
      moderation min confidence, label max labels, and SNS topic noted.
    input: |
      Create a Rekognition content moderation and label detection
      pipeline in us-east-1. Min moderation confidence: 60%. Max labels:
      50, min label confidence: 75%. Async video jobs from S3 bucket
      my-video-bucket. SNS notification topic:
      arn:aws:sns:us-east-1:123456789012:rekognition-complete. IAM role
      for SNS: arn:aws:iam::123456789012:role/RekognitionSNSRole. Tags:
      Environment=production, Pipeline=moderation.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "moderation"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: custom-labels-lifecycle
    description: >-
      Provision a custom labels project with training dataset and model
      deployment. Expects READY_TO_DEPLOY with project noted, training
      data cited, model started, and inference units specified.
    input: |
      Create a Rekognition custom labels project "industrial-defects" in
      us-east-1. Training data manifest at
      s3://my-bucket/training/manifest.json. Model output bucket:
      my-bucket/model-output/. Start model with 1 inference unit. IAM
      role: arn:aws:iam::123456789012:role/RekognitionCustomLabelsRole.
      Tags: Environment=production, UseCase=defect-detection.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "industrial-defects"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: missing-kms-key
    description: >-
      Operator requests an encrypted Rekognition collection but does not
      provide a valid KMS key ARN. This is a prerequisite failure.
      Expects PREREQUISITES_MISSING with the KMS key gap cited.
    input: |
      Create a Rekognition collection "secure-faces" in us-east-1 with
      KMS encryption. I need compliance-grade encryption but I don't
      have a KMS key ARN yet. Index 10000 faces. Tags:
      Environment=production, Compliance=GDPR.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "KMS"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"
