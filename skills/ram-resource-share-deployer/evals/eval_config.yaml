# Eval configuration for ram-resource-share-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob).
skill_name: ram-resource-share-deployer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: subnet-share-with-accounts
    difficulty: medium
    prompt_file: prompts/subnet-share-with-accounts.md
    baseline_file: baselines/subnet-share-with-accounts.md
    expected_verdict: READY_TO_DEPLOY

  - id: transit-gateway-share-organization
    difficulty: hard
    prompt_file: prompts/transit-gateway-share-organization.md
    baseline_file: baselines/transit-gateway-share-organization.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-principal-ids
    difficulty: hard
    prompt_file: prompts/missing-principal-ids.md
    baseline_file: baselines/missing-principal-ids.md
    expected_verdict: PREREQUISITES_MISSING

  - id: route53-resolver-rules-share-ou
    difficulty: hard
    prompt_file: prompts/route53-resolver-rules-share-ou.md
    baseline_file: baselines/route53-resolver-rules-share-ou.md
    expected_verdict: READY_TO_DEPLOY

  - id: customer-managed-permissions-subnet
    difficulty: hard
    prompt_file: prompts/customer-managed-permissions-subnet.md
    baseline_file: baselines/customer-managed-permissions-subnet.md
    expected_verdict: READY_TO_DEPLOY
