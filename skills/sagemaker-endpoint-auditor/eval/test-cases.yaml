  - id: ok-hardened-endpoint
    description: >-
      Fully hardened SageMaker real-time endpoint — VpcConfig with restrictive
      security groups, KMS encryption, inter-container encryption enabled,
      scoped execution role, data capture at 100% sampling, active monitoring
      schedule, and multi-instance HA. Isolating the OK verdict.
    input: |
      Endpoint name: ok-hardened-endpoint
      Endpoint metadata:
        EndpointStatus: InService
        EndpointType: real-time

      Model (describe-model):
        ModelName: ok-hardened-endpoint-model
        ExecutionRoleArn: arn:aws:iam::111111111111:role/sagemaker-scoped-invoke-role
        EnableNetworkIsolation: true
        VpcConfig:
