# Eval configuration for datazone-domain-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: datazone-domain-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: domain-with-s3-source
    difficulty: hard
    prompt_file: prompts/domain-with-s3-source.md
    baseline_file: baselines/domain-with-s3-source.md
    expected_verdict: READY_TO_DEPLOY

  - id: cross-account-subscription
    difficulty: hard
    prompt_file: prompts/cross-account-subscription.md
    baseline_file: baselines/cross-account-subscription.md
    expected_verdict: READY_TO_DEPLOY

  - id: redshift-environment-profile
    difficulty: medium
    prompt_file: prompts/redshift-environment-profile.md
    baseline_file: baselines/redshift-environment-profile.md
    expected_verdict: READY_TO_DEPLOY

  - id: glossary-governance
    difficulty: medium
    prompt_file: prompts/glossary-governance.md
    baseline_file: baselines/glossary-governance.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-iam-role
    difficulty: easy
    prompt_file: prompts/missing-iam-role.md
    baseline_file: baselines/missing-iam-role.md
    expected_verdict: PREREQUISITES_MISSING
