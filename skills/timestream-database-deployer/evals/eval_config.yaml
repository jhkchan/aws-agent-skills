# Eval configuration for timestream-database-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: timestream-database-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: database-table-scheduled-query
    difficulty: hard
    prompt_file: prompts/database-table-scheduled-query.md
    baseline_file: baselines/database-table-scheduled-query.md
    expected_verdict: READY_TO_DEPLOY

  - id: magnetic-store-write-s3
    difficulty: hard
    prompt_file: prompts/magnetic-store-write-s3.md
    baseline_file: baselines/magnetic-store-write-s3.md
    expected_verdict: READY_TO_DEPLOY

  - id: partition-key-enforcement
    difficulty: medium
    prompt_file: prompts/partition-key-enforcement.md
    baseline_file: baselines/partition-key-enforcement.md
    expected_verdict: READY_TO_DEPLOY

  - id: batch-load-task
    difficulty: medium
    prompt_file: prompts/batch-load-task.md
    baseline_file: baselines/batch-load-task.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-s3-bucket-policy
    difficulty: easy
    prompt_file: prompts/missing-s3-bucket-policy.md
    baseline_file: baselines/missing-s3-bucket-policy.md
    expected_verdict: PREREQUISITES_MISSING
