# Eval test cases for timestream-database-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the READY_TO_DEPLOY /
# PREREQUISITES_MISSING classification across Timestream topologies
# (database+table with retention properties and scheduled query,
# magnetic store write properties with S3 integration, partition key
# enforcement, batch load task, missing S3 bucket policy for magnetic
# store writes).
skill: timestream-database-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: database-table-scheduled-query
    description: >-
      Provision a Timestream database, table with retention properties,
      and a scheduled query for hourly temperature aggregation. Expects
      READY_TO_DEPLOY with memory/magnetic TTLs, scheduled query target
      table, and SNS notification configured.
    input: |
      Create a Timestream database named IoTSensorData in us-east-1.
      Create a table TemperatureReadings with memory store TTL of 12
      hours and magnetic store TTL of 365 days. Create a scheduled
      query named HourlyTemperatureAggregation that aggregates
      temperature readings hourly into a target table
      HourlyTempAggregates. SNS topic for errors:
      arn:aws:sns:us-east-1:123456789012:timestream-errors. Execution
      role: arn:aws:iam::123456789012:role/TimestreamSQRole. Tags:
      Environment=production, Team=iot.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "IoTSensorData"
        - "TemperatureReadings"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
        - "HourlyTemperatureAggregation"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: magnetic-store-write-s3
    description: >-
      Provision a Timestream table with magnetic store write properties
      enabled, routing late-arrival data to an S3 bucket. Expects
      READY_TO_DEPLOY with S3 bucket integration and bucket policy
      noted.
    input: |
      Create a Timestream database named IoTSensorData and table
      EventLogs in us-east-1. Memory store TTL 6 hours, magnetic store
      TTL 730 days. Enable magnetic store writes with S3 bucket
      timestream-late-arrival-us-east-1 for late-arrival data. The
      bucket already has a policy granting Timestream s3:PutObject.
      Tags: Environment=production.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "EventLogs"
        - "magnetic store writes"
        - "timestream-late-arrival-us-east-1"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: partition-key-enforcement
    description: >-
      Provision a Timestream table with partition key enforcement set
      to REQUIRED for query performance optimization. Expects
      READY_TO_DEPLOY with partition key enforcement noted.
    input: |
      Create a Timestream database named MetricsDB and table
      HighCardinalityMetrics in us-east-1. Memory store TTL 1 hour,
      magnetic store TTL 90 days. Enable partition key enforcement
      with EnforcementInRecord=REQUIRED. Queries frequently filter by
      device_id and region. Tags: Environment=production,
      Workload=high-cardinality.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "HighCardinalityMetrics"
        - "partition key"
        - "REQUIRED"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: batch-load-task
    description: >-
      Create a batch load task to bulk-ingest historical data from S3
      into a Timestream table. Expects READY_TO_DEPLOY with batch load
      task, data source S3 bucket, and report configuration noted.
    input: |
      Create a Timestream database named HistoricalData and table
      SensorArchive in us-east-1 with memory store TTL 1 hour and
      magnetic store TTL 3650 days. Create a batch load task to ingest
      CSV data from S3 bucket historical-sensor-data (prefix 2024/)
      into the table. Report bucket: batch-load-reports. Tags:
      Environment=production, Purpose=historical-backfill.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "SensorArchive"
        - "batch load"
        - "historical-sensor-data"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: missing-s3-bucket-policy
    description: >-
      Operator requests magnetic store write properties but the S3
      bucket lacks the required bucket policy granting Timestream
      write access. This is a prerequisite failure. Expects
      PREREQUISITES_MISSING with the missing bucket policy cited.
    input: |
      Create a Timestream table LateArrivalData with magnetic store
      writes enabled using S3 bucket my-data-bucket. The bucket does
      NOT have a bucket policy granting Timestream s3:PutObject.
      Database name IoTSensorData, region us-east-1. Memory store TTL
      6h, magnetic store TTL 365d.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "bucket policy"
        - "VERDICT"
        - "CHECKLIST"
        - "my-data-bucket"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"
