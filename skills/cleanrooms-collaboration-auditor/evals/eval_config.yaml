# Eval configuration for cleanrooms-collaboration-auditor.
#
# Maps each eval case to its external prompt and baseline files so the
# same case can run with-skill (SKILL.md loaded) vs without-skill
# (baseline only) for delta comparison. This is the canonical structured-
# eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer
# shim discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This
# file does not replace it — it adds the structured with-skill-vs-
# baseline dimension.
skill_name: cleanrooms-collaboration-auditor
snapshot_date: "2026-08-05"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: membership-gap-invited-not-active
    difficulty: medium
    prompt_file: prompts/membership-gap-invited-not-active.md
    baseline_file: baselines/membership-gap-invited-not-active.md
    expected_verdict: MEMBERSHIP_GAP
  - id: privacy-risk-no-differential-privacy
    difficulty: medium
    prompt_file: prompts/privacy-risk-no-differential-privacy.md
    baseline_file: baselines/privacy-risk-no-differential-privacy.md
    expected_verdict: PRIVACY_RISK
  - id: privacy-risk-depleted-epsilon-budget
    difficulty: hard
    prompt_file: prompts/privacy-risk-depleted-epsilon-budget.md
    baseline_file: baselines/privacy-risk-depleted-epsilon-budget.md
    expected_verdict: PRIVACY_RISK
  - id: config-gap-invalid-analysis-template-sql
    difficulty: hard
    prompt_file: prompts/config-gap-invalid-analysis-template-sql.md
    baseline_file: baselines/config-gap-invalid-analysis-template-sql.md
    expected_verdict: CONFIG_GAP
  - id: config-gap-untrained-configured-audience
    difficulty: hard
    prompt_file: prompts/config-gap-untrained-configured-audience.md
    baseline_file: baselines/config-gap-untrained-configured-audience.md
    expected_verdict: CONFIG_GAP
  - id: ok-fully-configured-clean-collaboration
    difficulty: easy
    prompt_file: prompts/ok-fully-configured-clean-collaboration.md
    baseline_file: baselines/ok-fully-configured-clean-collaboration.md
    expected_verdict: OK
