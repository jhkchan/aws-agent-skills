# Eval configuration for grafana-dashboard-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: grafana-dashboard-deployer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: cloudwatch-dashboard-production
    difficulty: hard
    prompt_file: prompts/cloudwatch-dashboard-production.md
    baseline_file: baselines/cloudwatch-dashboard-production.md
    expected_verdict: READY_TO_DEPLOY

  - id: amp-prometheus-dashboard
    difficulty: medium
    prompt_file: prompts/amp-prometheus-dashboard.md
    baseline_file: baselines/amp-prometheus-dashboard.md
    expected_verdict: READY_TO_DEPLOY

  - id: multi-datasource-alerting
    difficulty: hard
    prompt_file: prompts/multi-datasource-alerting.md
    baseline_file: baselines/multi-datasource-alerting.md
    expected_verdict: READY_TO_DEPLOY

  - id: enterprise-incident-oncall
    difficulty: hard
    prompt_file: prompts/enterprise-incident-oncall.md
    baseline_file: baselines/enterprise-incident-oncall.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-iam-role-and-sso
    difficulty: easy
    prompt_file: prompts/missing-iam-role-and-sso.md
    baseline_file: baselines/missing-iam-role-and-sso.md
    expected_verdict: PREREQUISITES_MISSING
