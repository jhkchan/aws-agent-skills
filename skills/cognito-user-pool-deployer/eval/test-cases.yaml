# Eval test cases for cognito-user-pool-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
skill: cognito-user-pool-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: deploy-standard-user-pool-ready
    description: >-
      Deploy a standard production user pool with email login, TOTP MFA ON,
      password policy 16/4-class, ENFORCED ASF, four attributes (one
      custom:tenantId), DeletionProtection ACTIVE. All pre-checks pass;
      plan should produce READY_TO_DEPLOY with create-user-pool and
      create-user-pool-client CLIs, CONFIRM gate, and the TOTP-only MFA
      rationale note.
    input: |
      Operation: create
      Pool name: prod-users
      Region: us-east-1
      Account: 111111111111
      Username attributes: ["email"]
      Schema:
        - Name: email, Type: String, Required: true, Mutable: false
        - Name: given_name, Type: String, Required: true
        - Name: family_name, Type: String, Required: true
        - Name: custom:tenantId, Type: String, Required: false, Mutable: false
      PasswordPolicy: MinLength=16, all classes=true, TempValidity=1 day
      MfaConfiguration: ON
      EnabledMfas: ["TOTP"]
      AdvancedSecurityMode: ENFORCED
      DeletionProtection: ACTIVE
      PreventUserExistenceErrors: ENABLED
      App client:
        Name: prod-web-spa
        GenerateClientSecret: true
        ExplicitAuthFlows: ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH
        AllowedOAuthFlows: code
        AllowedOAuthScopes: openid email profile
        CallbackURLs: ["https://app.example.com/callback"]
        LogoutURLs: ["https://app.example.com/logout"]
        AccessTokenValidity: 1 hour
        IdTokenValidity: 1 hour
        RefreshTokenValidity: 30 days
        EnableTokenRevocation: true

      Pre-flight (already performed by caller):
        aws cognito-idp list-user-pools --max-results 60:
          no pool named prod-users
        aws iam get-role --role-name CognitoOperatorRole:
          OK (operator principal holds cognito-idp:CreateUserPool)

      Emit the standard VERDICT block (POOL, VERDICT, TARGET,
      PRE_CHECKS, STEPS, POST_VERIFY, ATTRIBUTES, MFA, OAUTH_FLOWS,
      IDPS, ASF, NOTES).
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "prod-users"
        - "create-user-pool"
        - "create-user-pool-client"
        - "VERDICT"
        - "CONFIRM"
        - "TOTP"
        - "ENFORCED"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: PREREQUISITES_MISSING"
        - "implicit"

  - id: deploy-user-pool-with-saml-idp-ready
    description: >-
      Deploy a user pool federated with a corporate SAML identity provider
      (Okta) for workforce B2B login. SAML metadata URL resolves, attribute
      mapping covers email and given_name, TOTP MFA ON, ENFORCED ASF.
      All pre-checks pass; plan should produce READY_TO_DEPLOY with the
      SAML IdP create-identity-provider CLI.
    input: |
      Operation: create
      Pool name: corp-workforce-pool
      Region: us-east-1
      Account: 111111111111
      Username attributes: ["email"]
      Schema:
        - Name: email, Type: String, Required: true
        - Name: given_name, Type: String
        - Name: family_name, Type: String
      PasswordPolicy: MinLength=14, all classes=true
      MfaConfiguration: ON
      EnabledMfas: ["TOTP"]
      AdvancedSecurityMode: ENFORCED
      DeletionProtection: ACTIVE
      PreventUserExistenceErrors: ENABLED
      Identity providers:
        - Name: CorpOkta
          Type: SAML
          MetadataURL: https://corp.okta.com/app/abc123/sso/saml
          AttributeMapping:
            email: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress
            given_name: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/givenname
      App client:
        Name: corp-web-app
        GenerateClientSecret: true
        ExplicitAuthFlows: ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH
        AllowedOAuthFlows: code
        AllowedOAuthScopes: openid email profile
        CallbackURLs: ["https://workforce.example.com/auth/callback"]

      Pre-flight:
        curl -s https://corp.okta.com/app/abc123/sso/saml | head -c 200:
          returns XML with EntityDescriptor
        aws iam get-role --role-name CognitoOperatorRole: OK

      Emit the standard VERDICT block.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "corp-workforce-pool"
        - "create-identity-provider"
        - "SAML"
        - "VERDICT"
        - "CONFIRM"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: deploy-app-client-client-credentials-ready
    description: >-
      Deploy a machine-to-machine app client using OAuth client-credentials
      grant with a resource server and custom scopes. GenerateClientSecret
      true, custom scopes reference the resource server identifier
      correctly. All pre-checks pass; plan should produce READY_TO_DEPLOY
      with the create-resource-server CLI before the client CLI.
    input: |
      Operation: create
      Pool name: prod-platform-pool (existing pool-id: us-east-1_abc123)
      Region: us-east-1
      Account: 111111111111
      Existing pool MFA: ON TOTP, ASF ENFORCED, deletion protection ACTIVE

      Resource server:
        Identifier: https://api.example.com
        Name: products-api
        Scopes:
          - products.read (Read products)
          - products.write (Write products)

      New app client (M2M):
        Name: m2m-orders-service
        GenerateClientSecret: true
        ExplicitAuthFlows: ALLOW_CUSTOM_AUTH, ALLOW_REFRESH_TOKEN_AUTH
        AllowedOAuthFlows: client-credentials
        AllowedOAuthScopes: ["https://api.example.com/products.read"]
        AccessTokenValidity: 1 hour

      Pre-flight:
        aws cognito-idp describe-user-pool --user-pool-id us-east-1_abc123:
          OK (MfaConfiguration ON, AdvancedSecurityMode ENFORCED)
        aws cognito-idp list-resource-servers --user-pool-id us-east-1_abc123:
          no resource server with identifier https://api.example.com
        aws iam get-role --role-name CognitoOperatorRole: OK

      Emit the standard VERDICT block.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "create-resource-server"
        - "client-credentials"
        - "products.read"
        - "VERDICT"
        - "CONFIRM"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: PREREQUISITES_MISSING"
        - "implicit"

  - id: deploy-user-pool-implicit-flow-blocked
    description: >-
      Attempt to deploy an app client requesting OAuth implicit flow so
      tokens are returned in the URL fragment. The pre-check gate must
      block this configuration with PREREQUISITES_MISSING — the skill
      must not silently rewrite to code flow.
    input: |
      Operation: create
      Pool name: prod-users
      Region: us-east-1
      Account: 111111111111
      Username attributes: ["email"]
      Schema:
        - Name: email, Type: String, Required: true
      PasswordPolicy: MinLength=12, all classes=true
      MfaConfiguration: ON
      EnabledMfas: ["TOTP"]
      AdvancedSecurityMode: ENFORCED
      DeletionProtection: ACTIVE
      PreventUserExistenceErrors: ENABLED
      App client:
        Name: legacy-spa
        GenerateClientSecret: false
        ExplicitAuthFlows: ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH
        AllowedOAuthFlows: code, implicit
        AllowedOAuthScopes: openid email
        CallbackURLs: ["https://app.example.com/callback"]

      Pre-flight:
        aws cognito-idp list-user-pools --max-results 60:
          no pool named prod-users
        aws iam get-role --role-name CognitoOperatorRole: OK

      Emit the standard VERDICT block.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "implicit"
        - "code"
        - "VERDICT"
        - "URL fragment"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: READY_TO_DEPLOY"

  - id: deploy-user-pool-sms-mfa-missing-sns-role
    description: >-
      Attempt to deploy a user pool with SMS MFA enabled but the
      configured SNS caller IAM role does not exist. The pool would
      deploy cleanly but every SMS-OTP signup would fail at runtime —
      pre-checks must produce PREREQUISITES_MISSING naming the missing
      SNS caller role.
    input: |
      Operation: create
      Pool name: prod-b2c-pool
      Region: us-east-1
      Account: 111111111111
      Username attributes: ["phone_number"]
      Schema:
        - Name: phone_number, Type: String, Required: true
        - Name: email, Type: String, Required: true
      PasswordPolicy: MinLength=12, all classes=true
      MfaConfiguration: ON
      EnabledMfas: ["SMS"]
      SmsConfiguration:
        SnsCallerArn: arn:aws:iam::111111111111:role/CognitoSmsCaller
        ExternalId: pool-prod-b2c
      AdvancedSecurityMode: ENFORCED
      DeletionProtection: ACTIVE
      PreventUserExistenceErrors: ENABLED

      Pre-flight:
        aws iam get-role --role-name CognitoSmsCaller:
          NoSuchEntity (role does not exist)
        aws cognito-idp list-user-pools: no pool named prod-b2c-pool
        aws iam get-role --role-name CognitoOperatorRole: OK

      Emit the standard VERDICT block.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "CognitoSmsCaller"
        - "SNS"
        - "VERDICT"
        - "SmsConfiguration"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: READY_TO_DEPLOY"
