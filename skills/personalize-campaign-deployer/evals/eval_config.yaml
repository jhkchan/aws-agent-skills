# Eval configuration for personalize-campaign-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: personalize-campaign-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: user-personalization-campaign
    difficulty: hard
    prompt_file: prompts/user-personalization-campaign.md
    baseline_file: baselines/user-personalization-campaign.md
    expected_verdict: READY_TO_DEPLOY

  - id: domain-ecommerce-recommender
    difficulty: hard
    prompt_file: prompts/domain-ecommerce-recommender.md
    baseline_file: baselines/domain-ecommerce-recommender.md
    expected_verdict: READY_TO_DEPLOY

  - id: batch-inference-s3
    difficulty: medium
    prompt_file: prompts/batch-inference-s3.md
    baseline_file: baselines/batch-inference-s3.md
    expected_verdict: READY_TO_DEPLOY

  - id: event-tracker-realtime
    difficulty: medium
    prompt_file: prompts/event-tracker-realtime.md
    baseline_file: baselines/event-tracker-realtime.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-interactions-schema
    difficulty: easy
    prompt_file: prompts/missing-interactions-schema.md
    baseline_file: baselines/missing-interactions-schema.md
    expected_verdict: PREREQUISITES_MISSING
