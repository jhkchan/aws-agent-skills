# Eval test cases for transfer-cost-optimizer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five deterministic cases — one per optimization pattern. Each case's
# identifier embeds the test-case id so the model naturally echoes it
# (avoids assertion-token mismatch). The decision framework in SKILL.md
# produces exactly the expected verdicts below.
skill: transfer-cost-optimizer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: vpc-to-public-endpoint-migration
    description: >-
      Transfer Family server on VPC endpoint with outbound traffic via
      NAT Gateway. Clients connect from the public internet. Near-idle
      sessions. Managed workflow with 5 steps on 2M files/month.
      CloudWatch Logs volume 300 GB/month. Expected verdict:
      FURTHER_OPTIMIZATION_AVAILABLE with endpoint migration + workflow
      simplification + log reduction.
    input: |
      ServerId: s-vpc-to-public-endpoint-migration
      EndpointType: VPC
      Protocols: [SFTP]
      Region: us-east-1
      IdentityProviderType: SERVICE_MANAGED
      LoggingRole: arn:aws:iam::<acct>:role/TransferLogging
      Concurrency: 10 (configured), observed avg 0.5, p95 2, p99 3
      Users: 25 configured, 8 active in last 30 days

      Managed workflow: 1 (post-upload, 5-step Step Functions)
        executions: 2,000,000 files/month

      Metrics (last 30 days):
        - ConcurrentSessions: avg 0.5, p95 2, p99 3
        - FilesIn: 2,000,000/month
        - FilesOut: 500,000/month
        - BytesIn: 1,500 GB/month (outbound via NAT Gateway)
        - BytesOut: 200 GB/month
        - UserSessionsStarted: 6,000/month

      CloudWatch Logs volume: 300 GB/month from Transfer logging
      Cost Explorer (Service=Transfer, last 30 days): $819.50

      Workload context: partner file exchange. All partners connect
      from the public internet — no internal/VPC-only access required.
      Concurrency peak of 3 is well under the configured 10. Workflow
      has 5 steps (validation, transformation, notification, archival,
      audit) — the archival and audit steps could be combined.

      Emit the standard optimization block (TARGET, VERDICT, REASON,
      RECOMMENDATION, ESTIMATED_SAVINGS, MIGRATION_STEPS).
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
    assertions:
      must_contain:
        - "FURTHER_OPTIMIZATION_AVAILABLE"
        - "vpc-to-public-endpoint-migration"
        - "RECOMMENDATION"
        - "ESTIMATED_SAVINGS"
        - "MIGRATION_STEPS"
        - "PUBLIC"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OPTIMIZED"
        - "VERDICT: NEED_MORE_INFO"

  - id: idle-server-consolidation
    description: >-
      Three Transfer Family servers, each averaging 2 concurrent
      sessions against a configured concurrency of 10 each. Combined
      peak is 6 sessions. Two servers could be consolidated into one.
      Expected verdict: FURTHER_OPTIMIZATION_AVAILABLE with server
      consolidation.
    input: |
      DeploymentId: transfer-idle-server-consolidation
      Region: us-east-1
      Servers (3 total):
        - ServerId: s-partner-exchange-a
          EndpointType: PUBLIC
          Protocols: [SFTP]
          Concurrency: 10, observed avg 2, p99 4
          Users: 12 active
        - ServerId: s-partner-exchange-b
          EndpointType: PUBLIC
          Protocols: [SFTP]
          Concurrency: 10, observed avg 2, p99 3
          Users: 8 active
        - ServerId: s-internal-reports
          EndpointType: PUBLIC
          Protocols: [SFTP]
          Concurrency: 10, observed avg 0.5, p99 2
          Users: 5 active

      Combined ConcurrentSessions: avg 4.5, peak 9, p99 6

      Metrics (last 30 days):
        - FilesIn (all servers): 800,000/month
        - FilesOut (all servers): 200,000/month
        - BytesIn: 600 GB/month
        - BytesOut: 100 GB/month
        - UserSessionsStarted: 3,000/month total

      No managed workflows configured.
      CloudWatch Logs volume: 80 GB/month across all servers
      Cost Explorer (Service=Transfer, last 30 days): $727.00

      Workload context: three PUBLIC SFTP servers for different partner
      groups. All use SERVICE_MANAGED identity. No workflow. Combined
      peak (9 sessions) fits within a single server's concurrency limit
      of 10. Servers are in the same region and could be consolidated.

      Emit the standard optimization block (TARGET, VERDICT, REASON,
      RECOMMENDATION, ESTIMATED_SAVINGS, MIGRATION_STEPS).
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
    assertions:
      must_contain:
        - "FURTHER_OPTIMIZATION_AVAILABLE"
        - "idle-server-consolidation"
        - "RECOMMENDATION"
        - "ESTIMATED_SAVINGS"
        - "consolidat"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OPTIMIZED"
        - "VERDICT: NEED_MORE_INFO"

  - id: workflow-and-log-cost-reduction
    description: >-
      PUBLIC Transfer server with a 7-step managed workflow on 5M
      small files/month and 500 GB/month CloudWatch Logs volume. No
      endpoint or idle issue. Expected verdict:
      FURTHER_OPTIMIZATION_AVAILABLE with workflow simplification +
      log reduction.
    input: |
      ServerId: s-workflow-and-log-cost-reduction
      EndpointType: PUBLIC
      Protocols: [SFTP]
      Region: us-east-1
      IdentityProviderType: SERVICE_MANAGED
      Concurrency: 20 (configured), observed avg 5, p99 12
      Users: 30 active

      Managed workflow: 1 (post-upload, 7-step Step Functions)
        Steps: validation, virus-scan, transformation, enrichment,
          notification, archival, audit-logging
        executions: 5,000,000 files/month (small files, avg 50 KB)

      Metrics (last 30 days):
        - ConcurrentSessions: avg 5, p95 12, p99 12
        - FilesIn: 5,000,000/month
        - FilesOut: 100,000/month
        - BytesIn: 250 GB/month (5M small files)
        - UserSessionsStarted: 12,000/month

      CloudWatch Logs volume: 500 GB/month (one log event per file
      transfer at INFO level)
      Cost Explorer (Service=Transfer, last 30 days): $1,768.50

      Workload context: data ingestion pipeline. Partners upload small
      JSON files (avg 50 KB). The 7-step workflow processes each file.
      The archival and audit-logging steps could be combined into one.
      The virus-scan and validation steps could run in parallel. Logs
      are currently at INFO level — reducing to WARNING would cut
      volume by ~80%. Audit compliance requires only authentication and
      error logging.

      Emit the standard optimization block (TARGET, VERDICT, REASON,
      RECOMMENDATION, ESTIMATED_SAVINGS, MIGRATION_STEPS).
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
    assertions:
      must_contain:
        - "FURTHER_OPTIMIZATION_AVAILABLE"
        - "workflow-and-log-cost-reduction"
        - "RECOMMENDATION"
        - "ESTIMATED_SAVINGS"
        - "workflow"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OPTIMIZED"
        - "VERDICT: NEED_MORE_INFO"

  - id: already-optimized-transfer
    description: >-
      Transfer Family server on PUBLIC endpoint, right-sized
      concurrency, no managed workflow, log volume controlled (WARNING
      level, 20 GB/month), service-managed IdP. All dimensions pass.
      Expected verdict: OPTIMIZED.
    input: |
      ServerId: s-already-optimized-transfer
      EndpointType: PUBLIC
      Protocols: [SFTP]
      Region: us-east-1
      IdentityProviderType: SERVICE_MANAGED
      Concurrency: 10 (configured), observed avg 3, p99 7
      Users: 15 active

      Managed workflow: NONE
      CloudWatch Logs volume: 20 GB/month (WARNING level only, 7-day
        retention, archived to S3 for long-term)

      Metrics (last 30 days):
        - ConcurrentSessions: avg 3, p95 7, p99 7
        - FilesIn: 150,000/month
        - FilesOut: 30,000/month
        - BytesIn: 80 GB/month
        - BytesOut: 20 GB/month
        - UserSessionsStarted: 800/month

      Cost Explorer (Service=Transfer, last 30 days): $237.00
        ($219 server + $4 data transfer + $4 logs + $10 S3 storage)

      Workload context: well-tuned PUBLIC SFTP server for a small
      partner group. Concurrency is right-sized (p99 = 7 vs limit 10).
      No managed workflow. Logs are at WARNING level with 7-day
      retention and S3 archive. Service-managed identity (no Lambda
      IdP cost). No NAT Gateway (PUBLIC endpoint).

      Emit the standard optimization block (TARGET, VERDICT, REASON,
      RECOMMENDATION, ESTIMATED_SAVINGS, MIGRATION_STEPS).
    expected_verdict: OPTIMIZED
    assertions:
      must_contain:
        - "OPTIMIZED"
        - "already-optimized-transfer"
        - "REASON"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: FURTHER_OPTIMIZATION_AVAILABLE"
        - "VERDICT: NEED_MORE_INFO"

  - id: custom-idp-and-session-optimization
    description: >-
      PUBLIC Transfer server with custom API_GATEWAY identity provider
      (Lambda per-auth) processing 80,000 session starts/month with no
      auth caching. Average session duration 45 min with few files per
      session. Expected verdict: FURTHER_OPTIMIZATION_AVAILABLE with
      IdP caching + session duration investigation.
    input: |
      ServerId: s-custom-idp-and-session-optimization
      EndpointType: PUBLIC
      Protocols: [SFTP]
      Region: us-east-1
      IdentityProviderType: API_GATEWAY (custom Lambda IdP)
      Concurrency: 15 (configured), observed avg 4, p99 8
      Users: 40 active

      Custom IdP Lambda:
        - Function: transfer-idp-auth
        - Invocations: 80,000/month (one per session start)
        - Average duration: 250 ms
        - No auth caching configured
        - Cold starts: 15% of invocations
        - API Gateway requests: 80,000/month

      Managed workflow: NONE

      Metrics (last 30 days):
        - ConcurrentSessions: avg 4, p95 8, p99 8
        - FilesIn: 40,000/month
        - FilesOut: 10,000/month
        - BytesIn: 30 GB/month
        - BytesOut: 10 GB/month
        - UserSessionsStarted: 80,000/month
        - Average session duration: 45 minutes
        - Average files per session: 0.6 (most sessions transfer < 1 file)

      CloudWatch Logs volume: 30 GB/month
      Cost Explorer (Service=Transfer, last 30 days): $312.00

      Workload context: partner portal with custom authentication via
      API Gateway + Lambda. High session-start rate (80,000/month) but
      low file-transfer rate (0.6 files per session). Most sessions are
      partners connecting, checking for files, and disconnecting
      without transferring. Auth caching is not configured — every
      session start triggers a fresh Lambda invocation.

      Emit the standard optimization block (TARGET, VERDICT, REASON,
      RECOMMENDATION, ESTIMATED_SAVINGS, MIGRATION_STEPS).
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
    assertions:
      must_contain:
        - "FURTHER_OPTIMIZATION_AVAILABLE"
        - "custom-idp-and-session-optimization"
        - "RECOMMENDATION"
        - "ESTIMATED_SAVINGS"
        - "cach"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OPTIMIZED"
        - "VERDICT: NEED_MORE_INFO"
