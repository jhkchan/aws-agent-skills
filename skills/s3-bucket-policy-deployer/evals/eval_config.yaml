# Eval configuration for s3-bucket-policy-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: s3-bucket-policy-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: https-only-secure-transport
    difficulty: hard
    prompt_file: prompts/https-only-secure-transport.md
    baseline_file: baselines/https-only-secure-transport.md
    expected_verdict: READY_TO_DEPLOY

  - id: cross-account-external-id
    difficulty: hard
    prompt_file: prompts/cross-account-external-id.md
    baseline_file: baselines/cross-account-external-id.md
    expected_verdict: READY_TO_DEPLOY

  - id: vpc-endpoint-only-access
    difficulty: hard
    prompt_file: prompts/vpc-endpoint-only-access.md
    baseline_file: baselines/vpc-endpoint-only-access.md
    expected_verdict: READY_TO_DEPLOY

  - id: cloudfront-oac-policy
    difficulty: hard
    prompt_file: prompts/cloudfront-oac-policy.md
    baseline_file: baselines/cloudfront-oac-policy.md
    expected_verdict: READY_TO_DEPLOY

  - id: policy-size-limit-exceeded
    difficulty: easy
    prompt_file: prompts/policy-size-limit-exceeded.md
    baseline_file: baselines/policy-size-limit-exceeded.md
    expected_verdict: PREREQUISITES_MISSING
