# Eval configuration for ecr-replication-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: ecr-replication-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: cross-region-replication
    difficulty: hard
    prompt_file: prompts/cross-region-replication.md
    baseline_file: baselines/cross-region-replication.md
    expected_verdict: READY_TO_DEPLOY

  - id: cross-account-replication
    difficulty: hard
    prompt_file: prompts/cross-account-replication.md
    baseline_file: baselines/cross-account-replication.md
    expected_verdict: READY_TO_DEPLOY

  - id: pull-through-cache-docker-hub
    difficulty: medium
    prompt_file: prompts/pull-through-cache-docker-hub.md
    baseline_file: baselines/pull-through-cache-docker-hub.md
    expected_verdict: READY_TO_DEPLOY

  - id: multi-region-dr-with-lifecycle
    difficulty: medium
    prompt_file: prompts/multi-region-dr-with-lifecycle.md
    baseline_file: baselines/multi-region-dr-with-lifecycle.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-destination-registry-id
    difficulty: easy
    prompt_file: prompts/missing-destination-registry-id.md
    baseline_file: baselines/missing-destination-registry-id.md
    expected_verdict: PREREQUISITES_MISSING
