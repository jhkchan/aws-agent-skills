# Eval test cases for ec2-security-group-auditor
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
skill: ec2-security-group-auditor
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: web-tier-https
    description: Web tier SG with HTTPS to internet and SSH restricted to private CIDR
    input: |
      Security Group: web-tier-https
      Inbound rules:
        - Port: 443
          Protocol: TCP
          Source: 0.0.0.0/0
        - Port: 22
          Protocol: TCP
          Source: 10.0.0.0/8
    expected_verdict: PUBLIC_NONCRITICAL
    assertions:
      must_contain:
        - "PUBLIC_NONCRITICAL"
        - "web-tier-https"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OPEN"
        - "VERDICT: RESTRICTED"

  - id: bastion-ssh-open
    description: Bastion SG with SSH open to the entire internet — critical exposure
    input: |
      Security Group: bastion-ssh-open
      Inbound rules:
        - Port: 22
          Protocol: TCP
          Source: 0.0.0.0/0
    expected_verdict: OPEN
    assertions:
      must_contain:
        - "OPEN"
        - "bastion-ssh-open"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: RESTRICTED"
        - "VERDICT: PUBLIC_NONCRITICAL"

  - id: db-private-cidr
    description: Database SG with MySQL port restricted to private network CIDR
    input: |
      Security Group: db-private-cidr
      Inbound rules:
        - Port: 3306
          Protocol: TCP
          Source: 10.0.0.0/8
    expected_verdict: RESTRICTED
    assertions:
      must_contain:
        - "RESTRICTED"
        - "db-private-cidr"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OPEN"
        - "VERDICT: PUBLIC_NONCRITICAL"

  - id: db-mysql-open
    description: Database SG with MySQL port open to the entire internet — critical exposure
    input: |
      Security Group: db-mysql-open
      Inbound rules:
        - Port: 3306
          Protocol: TCP
          Source: 0.0.0.0/0
    expected_verdict: OPEN
    assertions:
      must_contain:
        - "OPEN"
        - "db-mysql-open"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: RESTRICTED"
        - "VERDICT: PUBLIC_NONCRITICAL"

  - id: all-ports-open
    description: SG with all TCP ports open to the entire internet — maximum exposure
    input: |
      Security Group: all-ports-open
      Inbound rules:
        - Port: 0-65535
          Protocol: TCP
          Source: 0.0.0.0/0
    expected_verdict: OPEN
    assertions:
      must_contain:
        - "OPEN"
        - "all-ports-open"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: RESTRICTED"
        - "VERDICT: PUBLIC_NONCRITICAL"
