# Eval test cases for appconfig-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the READY_TO_DEPLOY /
# PREREQUISITES_MISSING classification across AppConfig topologies
# (linear deployment with alarms, exponential with validators and
# feature flags, all-at-once JSON config, missing deployment strategy,
# missing configuration profile).
skill: appconfig-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: linear-deployment-with-alarms
    description: >-
      Provision an AppConfig application with a linear deployment
      strategy (20% growth, 10-minute bake), a JSON configuration
      profile, a Lambda validator, and a CloudWatch alarm for
      rollback. Expects READY_TO_DEPLOY with all components cited.
    input: |
      Create an AppConfig application named my-app-config in
      us-east-1. Environment: production. Configuration profile:
      app-settings (JSON). Deployment strategy: linear, 20% growth
      factor, 10-minute bake time. Attach a Lambda validator
      (config-validator function). Configure a CloudWatch alarm
      (appconfig-deploy-error-rate) for rollback during bake time.
      Application ID abc12345. Environment ID def67890. Profile ID
      ghi11111. Strategy ID jkl22222. Tags: Environment=production.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "LINEAR"
        - "growth=20%"
        - "bake=10"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
        - "Lambda validator"
        - "CloudWatch alarms"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: exponential-with-validators-and-feature-flags
    description: >-
      Provision an AppConfig application with an exponential
      deployment strategy (2% initial growth, 10-minute bake),
      feature flags, a Lambda validator, and JSON schema validation.
      Expects READY_TO_DEPLOY with feature flags and exponential
      strategy cited.
    input: |
      Create an AppConfig application named feature-flag-platform in
      us-east-1. Environment: staging. Configuration profile:
      feature-flag-store with feature flag schema. Deployment
      strategy: exponential, 2% growth factor, 10-minute bake time.
      Attach a Lambda validator (flag-validator function). Enable JSON
      schema validation for flag structure. Tags: Environment=staging,
      Application=feature-platform.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "EXPONENTIAL"
        - "Feature flags"
        - "VERDICT"
        - "CHECKLIST"
        - "JSON schema validation"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: all-at-once-json-config
    description: >-
      Provision an AppConfig application with an all-at-once
      deployment strategy for a non-critical YAML configuration.
      Expects READY_TO_DEPLOY with all-at-once strategy noted and
      the risk of no bake time flagged.
    input: |
      Create an AppConfig application named simple-config-app in
      us-east-1. Environment: development. Configuration profile:
      banner-text (YAML, free form). Deployment strategy: all-at-once
      (100% growth, 0-minute bake). This is a non-critical
      development config for UI banner text. Tags:
      Environment=development.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "all-at-once"
        - "bake=0"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: missing-deployment-strategy
    description: >-
      Operator requests an AppConfig deployment but provides no
      deployment strategy. This is a prerequisite failure. Expects
      PREREQUISITES_MISSING with the missing deployment strategy
      cited.
    input: |
      Deploy a new configuration version to AppConfig application
      abc12345, environment def67890. Configuration profile ghi11111,
      version 5. No deployment strategy specified. Just deploy it
      to production.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "deployment strategy"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"

  - id: missing-configuration-profile
    description: >-
      Operator requests an AppConfig deployment but no configuration
      profile or version exists. This is a prerequisite failure.
      Expects PREREQUISITES_MISSING with the missing configuration
      profile cited.
    input: |
      Create an AppConfig deployment for application my-app-config
      (abc12345), environment production (def67890). Use deployment
      strategy linear-20pct-10min (jkl22222). No configuration
      profile has been created yet — just deploy what we have.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "configuration profile"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"
