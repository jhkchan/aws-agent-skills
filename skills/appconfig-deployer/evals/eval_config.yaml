# Eval configuration for appconfig-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: appconfig-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: linear-deployment-with-alarms
    difficulty: hard
    prompt_file: prompts/linear-deployment-with-alarms.md
    baseline_file: baselines/linear-deployment-with-alarms.md
    expected_verdict: READY_TO_DEPLOY

  - id: exponential-with-validators-and-feature-flags
    difficulty: hard
    prompt_file: prompts/exponential-with-validators-and-feature-flags.md
    baseline_file: baselines/exponential-with-validators-and-feature-flags.md
    expected_verdict: READY_TO_DEPLOY

  - id: all-at-once-json-config
    difficulty: medium
    prompt_file: prompts/all-at-once-json-config.md
    baseline_file: baselines/all-at-once-json-config.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-deployment-strategy
    difficulty: easy
    prompt_file: prompts/missing-deployment-strategy.md
    baseline_file: baselines/missing-deployment-strategy.md
    expected_verdict: PREREQUISITES_MISSING

  - id: missing-configuration-profile
    difficulty: easy
    prompt_file: prompts/missing-configuration-profile.md
    baseline_file: baselines/missing-configuration-profile.md
    expected_verdict: PREREQUISITES_MISSING
