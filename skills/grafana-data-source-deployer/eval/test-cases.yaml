# Eval test cases for grafana-data-source-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the READY_TO_DEPLOY /
# PREREQUISITES_MISSING classification across Grafana workspace
# provisioning (CloudWatch data source with SSO, Prometheus AMP
# data source with SigV4, multi-data-source with SAML SSO,
# dashboard provisioning via API key, missing workspace role
# permissions prerequisite failure).
skill: grafana-data-source-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: cloudwatch-data-source
    description: >-
      Provision a Managed Grafana workspace with CloudWatch data source
      using IAM Identity Center authentication. Expects READY_TO_DEPLOY
      with per-service CloudWatch permissions (ListMetrics, GetMetricData,
      logs:StartQuery), workspace IAM role attached, and workspace
      endpoint noted.
    input: |
      Create a Managed Grafana workspace named prod-observability
      in us-east-1, account 123456789012. Use IAM Identity Center
      authentication with SERVICE_MANAGED permissions. Data source:
      CloudWatch (default region us-east-1). Workspace IAM role
      GrafanaWorkspaceRole with CloudWatch metrics and logs read
      permissions. Tags: Environment=production, Team=ops.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "CloudWatch"
        - "cloudwatch:GetMetricData"
        - "AWS_SSO"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: prometheus-amp-data-source
    description: >-
      Provision a Managed Grafana workspace with Prometheus (AMP) data
      source using SigV4 authentication. Expects READY_TO_DEPLOY with
      aps:QueryMetrics permission, AMP workspace URL configured, and
      SigV4 auth type noted.
    input: |
      Create a Managed Grafana workspace named amp-observability
      in us-east-1. Use IAM Identity Center authentication. Data source:
      Prometheus connected to AMP workspace ws-aaa111. Workspace IAM
      role GrafanaWorkspaceRole with aps:QueryMetrics and
      aps:ListWorkspaces permissions. SigV4 authentication using
      workspace IAM role. Tags: Environment=production, Source=amp.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "Prometheus"
        - "aps:QueryMetrics"
        - "sigV4Auth"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: multi-data-source-saml-sso
    description: >-
      Provision a Managed Grafana workspace with multiple data sources
      (CloudWatch, Athena, Timestream) and SAML SSO authentication.
      Expects READY_TO_DEPLOY with all per-service permissions noted,
      IdP metadata configured, and SAML assertion attributes mapped.
    input: |
      Create a Managed Grafana workspace named enterprise-grafana
      in us-east-1. Use SAML SSO authentication with Okta as the IdP.
      IdP metadata URL: https://idp.example.com/saml/metadata.
      Permission type CUSTOM. Data sources: CloudWatch, Athena
      (workgroup primary, results bucket s3://athena-results-123456789012),
      and Timestream. Workspace IAM role GrafanaWorkspaceRole with
      per-service read permissions for all three data sources.
      Tags: Environment=production, Auth=saml.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "SAML"
        - "cloudwatch:GetMetricData"
        - "athena:StartQueryExecution"
        - "timestream:SelectQuery"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: dashboard-provisioning
    description: >-
      Provision dashboards in an existing ACTIVE Grafana workspace via
      API key and JSON import. Expects READY_TO_DEPLOY with API key
      created, dashboards imported, and data source UID verification
      noted.
    input: |
      Provision dashboards in existing Grafana workspace g-aaaa1111
      in us-east-1. The workspace is ACTIVE with CloudWatch and
      Prometheus data sources already configured. Create a workspace
      API key named ci-cd-provisioning with ADMIN role and 86400 second
      TTL. Import 3 dashboards from JSON files: overview.json,
      metrics.json, logs.json. Ensure data source UIDs in dashboard
      JSON match the workspace data source UIDs.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "api-key"
        - "ADMIN"
        - "86400"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: missing-workspace-role-permissions
    description: >-
      Operator requests a Grafana workspace with CloudWatch data source
      but the workspace IAM role lacks cloudwatch:GetMetricData
      permission. This is a prerequisite failure.
      Expects PREREQUISITES_MISSING with the missing permission cited.
    input: |
      Create a Managed Grafana workspace named prod-grafana in
      us-east-1 with CloudWatch data source. Use IAM Identity Center
      authentication. Workspace IAM role GrafanaWorkspaceRole exists
      but only has cloudwatch:ListMetrics — it is missing
      cloudwatch:GetMetricData, cloudwatch:GetMetricStatistics, and
      logs:StartQuery permissions.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "cloudwatch:GetMetricData"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"
