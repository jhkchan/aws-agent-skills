# Eval configuration for resiliencehub-app-assessment-auditor.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: resiliencehub-app-assessment-auditor
snapshot_date: "2026-08-05"
baseline_model: amazon.nova-pro-v1:0
judge_model: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: stale-95-days
    difficulty: hard
    prompt_file: prompts/stale-95-days.md
    baseline_file: baselines/stale-95-days.md
    expected_verdict: STALE_ASSESSMENT
  - id: mission-critical-breach
    difficulty: hard
    prompt_file: prompts/mission-critical-breach.md
    baseline_file: baselines/mission-critical-breach.md
    expected_verdict: HIGH_RISK
  - id: low-score-standard-tier
    difficulty: medium
    prompt_file: prompts/low-score-standard-tier.md
    baseline_file: baselines/low-score-standard-tier.md
    expected_verdict: LOW_COMPLIANCE
  - id: missing-policy-no-alarms
    difficulty: medium
    prompt_file: prompts/missing-policy-no-alarms.md
    baseline_file: baselines/missing-policy-no-alarms.md
    expected_verdict: CONFIG_GAP
  - id: failed-assessment-no-data
    difficulty: medium
    prompt_file: prompts/failed-assessment-no-data.md
    baseline_file: baselines/failed-assessment-no-data.md
    expected_verdict: CONFIG_GAP
  - id: healthy-app
    difficulty: easy
    prompt_file: prompts/healthy-app.md
    baseline_file: baselines/healthy-app.md
    expected_verdict: OK
