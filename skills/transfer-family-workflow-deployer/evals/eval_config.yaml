# Eval configuration for transfer-family-workflow-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: transfer-family-workflow-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: sftp-service-managed-public
    difficulty: hard
    prompt_file: prompts/sftp-service-managed-public.md
    baseline_file: baselines/sftp-service-managed-public.md
    expected_verdict: READY_TO_DEPLOY

  - id: sftp-custom-lambda-vpc
    difficulty: hard
    prompt_file: prompts/sftp-custom-lambda-vpc.md
    baseline_file: baselines/sftp-custom-lambda-vpc.md
    expected_verdict: READY_TO_DEPLOY

  - id: managed-workflow-file-processing
    difficulty: hard
    prompt_file: prompts/managed-workflow-file-processing.md
    baseline_file: baselines/managed-workflow-file-processing.md
    expected_verdict: READY_TO_DEPLOY

  - id: as2-connector-trading-partner
    difficulty: medium
    prompt_file: prompts/as2-connector-trading-partner.md
    baseline_file: baselines/as2-connector-trading-partner.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-iam-role
    difficulty: easy
    prompt_file: prompts/missing-iam-role.md
    baseline_file: baselines/missing-iam-role.md
    expected_verdict: PREREQUISITES_MISSING
