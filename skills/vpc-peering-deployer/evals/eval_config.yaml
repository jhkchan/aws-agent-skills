# Eval configuration for vpc-peering-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: vpc-peering-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: same-account-same-region-dns
    difficulty: hard
    prompt_file: prompts/same-account-same-region-dns.md
    baseline_file: baselines/same-account-same-region-dns.md
    expected_verdict: READY_TO_DEPLOY

  - id: cross-account-same-region
    difficulty: hard
    prompt_file: prompts/cross-account-same-region.md
    baseline_file: baselines/cross-account-same-region.md
    expected_verdict: READY_TO_DEPLOY

  - id: inter-region-peering
    difficulty: medium
    prompt_file: prompts/inter-region-peering.md
    baseline_file: baselines/inter-region-peering.md
    expected_verdict: READY_TO_DEPLOY

  - id: ipv6-peering
    difficulty: medium
    prompt_file: prompts/ipv6-peering.md
    baseline_file: baselines/ipv6-peering.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-cidr-overlap-check
    difficulty: easy
    prompt_file: prompts/missing-cidr-overlap-check.md
    baseline_file: baselines/missing-cidr-overlap-check.md
    expected_verdict: PREREQUISITES_MISSING
