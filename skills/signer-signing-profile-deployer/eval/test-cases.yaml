# Eval test cases for signer-signing-profile-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the READY_TO_DEPLOY /
# PREREQUISITES_MISSING classification across AWS Signer scenarios
# (Lambda SHA384-ECDSA profile with CSC and deploy-time enforcement,
# IoT firmware signing profile, signing job against S3 source with
# destination prefix, profile revocation impact tracking, and a
# wrong-platform profile that Lambda will reject).
skill: signer-signing-profile-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: lambda-sha384-ecdsa-profile-with-csc
    description: >-
      Provision an AWSLambda-SHA384-ECDSA signing profile and a
      matching Lambda code signing config with Enforce on violation,
      associated with a function. Expects READY_TO_DEPLOY with the
      platform determining the SHA-384 + ECDSA algorithm, CSC ARN,
      AllowedPublishingProfiles with version suffix, and
      UntrustedArtifactOnViolation=Enforce.
    input: |
      Create a Signer signing profile "lambda-signing-prod" on the
      AWSLambda-SHA384-ECDSA platform in us-east-1, account
      111122223333. Create a Lambda code signing config
      "lambda-csc-prod" that allows publishing from that profile,
      sets UntrustedArtifactOnViolation to Enforce, and is associated
      with function my-prod-function. Source bucket
      my-unsigned-artifacts, destination bucket my-signed-artifacts
      with prefix lambda/signed/. Tags: Environment=production,
      Workload=lambda, Owner=platform-team.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "AWSLambda-SHA384-ECDSA"
        - "lambda-signing-prod"
        - "lambda-csc-prod"
        - "Enforce"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
        - "AllowedPublishingProfiles"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: iot-firmware-signing-profile
    description: >-
      Provision an AWSIoT-platform signing profile for IoT device
      firmware. Expects READY_TO_DEPLOY with the IoT platform cited
      (NOT valid for Lambda CSC) and an OTA-style consumption flow.
    input: |
      Create a Signer signing profile "iot-firmware-prod" on the
      AWSIoT platform in us-east-1, account 111122223333. Source
      bucket my-unsigned-firmware, destination bucket
      my-signed-firmware with prefix firmware/signed/. This profile
      will be used by AWS IoT OTA update jobs. Tags:
      Environment=production, Workload=iot-firmware.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "AWSIoT"
        - "iot-firmware-prod"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: signing-job-from-s3-source
    description: >-
      Start a Signer signing job against an S3 source object and
      write the signed artifact to a destination prefix. Expects
      READY_TO_DEPLOY with the immutability of the signed artifact
      noted and the source/destination buckets cited.
    input: |
      Start a signing job using the existing profile
      "lambda-signing-prod" (AWSLambda-SHA384-ECDSA) in us-east-1.
      Source: s3://my-unsigned-artifacts/lambda/my-prod-function.zip
      (version v1abc). Destination:
      s3://my-signed-artifacts/lambda/signed/. The signed artifact
      must be consumed by a subsequent UpdateFunctionCode call.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "my-unsigned-artifacts"
        - "my-signed-artifacts"
        - "lambda-signing-prod"
        - "StartSigningJob"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: revoked-profile-impact
    description: >-
      Operator reports that a previously-trusted profile version was
      revoked and asks what to do next. Expects READY_TO_DEPLOY with
      a revocation handling workflow that removes the ARN from the
      CSC's AllowedPublishingProfiles and redeploys from a
      known-good signed artifact under a new profile version.
    input: |
      The profile version IVYAAABRQEXAMPLE of signing profile
      "lambda-signing-prod" has been revoked. Function
      my-prod-function still has CSC "lambda-csc-prod" listing that
      version in AllowedPublishingProfiles. Tell me what to do,
      including removing the ARN from the CSC and redeploying from a
      known-good signed artifact under a new profile version.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "IVYAAABRQEXAMPLE"
        - "AllowedPublishingProfiles"
        - "redeploy"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: wrong-platform-for-lambda
    description: >-
      Operator requests an AWSIoT-platform profile to use in a
      Lambda code signing config. AWSIoT is not the
      AWSLambda-SHA384-ECDSA platform that Lambda's verifier
      expects. This is a prerequisite failure.
      Expects PREREQUISITES_MISSING with the wrong-platform gap
      cited.
    input: |
      Create a Signer signing profile "lambda-iot-wrong" on the
      AWSIoT platform in us-east-1 and add it to the
      AllowedPublishingProfiles of CSC "lambda-csc-prod" for
      function my-prod-function.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "AWSIoT"
        - "AWSLambda-SHA384-ECDSA"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"
