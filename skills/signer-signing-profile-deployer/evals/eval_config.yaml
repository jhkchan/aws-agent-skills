# Eval configuration for signer-signing-profile-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: signer-signing-profile-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: lambda-sha384-ecdsa-profile-with-csc
    difficulty: hard
    prompt_file: prompts/lambda-sha384-ecdsa-profile-with-csc.md
    baseline_file: baselines/lambda-sha384-ecdsa-profile-with-csc.md
    expected_verdict: READY_TO_DEPLOY

  - id: iot-firmware-signing-profile
    difficulty: hard
    prompt_file: prompts/iot-firmware-signing-profile.md
    baseline_file: baselines/iot-firmware-signing-profile.md
    expected_verdict: READY_TO_DEPLOY

  - id: signing-job-from-s3-source
    difficulty: medium
    prompt_file: prompts/signing-job-from-s3-source.md
    baseline_file: baselines/signing-job-from-s3-source.md
    expected_verdict: READY_TO_DEPLOY

  - id: revoked-profile-impact
    difficulty: medium
    prompt_file: prompts/revoked-profile-impact.md
    baseline_file: baselines/revoked-profile-impact.md
    expected_verdict: READY_TO_DEPLOY

  - id: wrong-platform-for-lambda
    difficulty: easy
    prompt_file: prompts/wrong-platform-for-lambda.md
    baseline_file: baselines/wrong-platform-for-lambda.md
    expected_verdict: PREREQUISITES_MISSING
