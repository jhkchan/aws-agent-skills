# Eval configuration for efs-access-point-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: efs-access-point-deployer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: efs-ap-with-posix-identity
    difficulty: hard
    prompt_file: prompts/efs-ap-with-posix-identity.md
    baseline_file: baselines/efs-ap-with-posix-identity.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-mount-target-az
    difficulty: medium
    prompt_file: prompts/missing-mount-target-az.md
    baseline_file: baselines/missing-mount-target-az.md
    expected_verdict: PREREQUISITES_MISSING

  - id: iam-policy-access-point-enforcement
    difficulty: hard
    prompt_file: prompts/iam-policy-access-point-enforcement.md
    baseline_file: baselines/iam-policy-access-point-enforcement.md
    expected_verdict: READY_TO_DEPLOY

  - id: eks-csi-driver-dynamic-ap
    difficulty: hard
    prompt_file: prompts/eks-csi-driver-dynamic-ap.md
    baseline_file: baselines/eks-csi-driver-dynamic-ap.md
    expected_verdict: READY_TO_DEPLOY

  - id: lambda-efs-cross-az
    difficulty: hard
    prompt_file: prompts/lambda-efs-cross-az.md
    baseline_file: baselines/lambda-efs-cross-az.md
    expected_verdict: PREREQUISITES_MISSING
