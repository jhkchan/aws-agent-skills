# Eval configuration for stepfunctions-express-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: stepfunctions-express-deployer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: express-distributed-map-logging
    difficulty: hard
    prompt_file: prompts/express-distributed-map-logging.md
    baseline_file: baselines/express-distributed-map-logging.md
    expected_verdict: READY_TO_DEPLOY

  - id: standard-migration-waitfortasktoken
    difficulty: hard
    prompt_file: prompts/standard-migration-waitfortasktoken.md
    baseline_file: baselines/standard-migration-waitfortasktoken.md
    expected_verdict: PREREQUISITES_MISSING

  - id: sync-apigateway-timeout-alignment
    difficulty: hard
    prompt_file: prompts/sync-apigateway-timeout-alignment.md
    baseline_file: baselines/sync-apigateway-timeout-alignment.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-logging-on-async
    difficulty: medium
    prompt_file: prompts/missing-logging-on-async.md
    baseline_file: baselines/missing-logging-on-async.md
    expected_verdict: PREREQUISITES_MISSING

  - id: express-idempotency-for-at-least-once
    difficulty: hard
    prompt_file: prompts/express-idempotency-for-at-least-once.md
    baseline_file: baselines/express-idempotency-for-at-least-once.md
    expected_verdict: READY_TO_DEPLOY
