# Eval configuration for quicksight-dashboard-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: quicksight-dashboard-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: enterprise-spice-athena-dashboard
    difficulty: hard
    prompt_file: prompts/enterprise-spice-athena-dashboard.md
    baseline_file: baselines/enterprise-spice-athena-dashboard.md
    expected_verdict: READY_TO_DEPLOY

  - id: template-multi-tenant-deployment
    difficulty: hard
    prompt_file: prompts/template-multi-tenant-deployment.md
    baseline_file: baselines/template-multi-tenant-deployment.md
    expected_verdict: READY_TO_DEPLOY

  - id: vpc-connection-private-rds
    difficulty: hard
    prompt_file: prompts/vpc-connection-private-rds.md
    baseline_file: baselines/vpc-connection-private-rds.md
    expected_verdict: READY_TO_DEPLOY

  - id: direct-query-redshift
    difficulty: medium
    prompt_file: prompts/direct-query-redshift.md
    baseline_file: baselines/direct-query-redshift.md
    expected_verdict: READY_TO_DEPLOY

  - id: standard-edition-vpc-prerequisite-fail
    difficulty: easy
    prompt_file: prompts/standard-edition-vpc-prerequisite-fail.md
    baseline_file: baselines/standard-edition-vpc-prerequisite-fail.md
    expected_verdict: PREREQUISITES_MISSING
