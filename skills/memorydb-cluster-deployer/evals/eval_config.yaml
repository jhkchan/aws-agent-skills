# Eval configuration for memorydb-cluster-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: memorydb-cluster-deployer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: production-multiaz-durable
    difficulty: hard
    prompt_file: prompts/production-multiaz-durable.md
    baseline_file: baselines/production-multiaz-durable.md
    expected_verdict: READY_TO_DEPLOY

  - id: data-tiering-cost-optimized
    difficulty: hard
    prompt_file: prompts/data-tiering-cost-optimized.md
    baseline_file: baselines/data-tiering-cost-optimized.md
    expected_verdict: READY_TO_DEPLOY

  - id: dev-single-shard
    difficulty: easy
    prompt_file: prompts/dev-single-shard.md
    baseline_file: baselines/dev-single-shard.md
    expected_verdict: READY_TO_DEPLOY

  - id: elasticache-redirect-boundary
    difficulty: medium
    prompt_file: prompts/elasticache-redirect-boundary.md
    baseline_file: baselines/elasticache-redirect-boundary.md
    expected_verdict: PREREQUISITES_MISSING

  - id: missing-subnet-group-and-acl
    difficulty: easy
    prompt_file: prompts/missing-subnet-group-and-acl.md
    baseline_file: baselines/missing-subnet-group-and-acl.md
    expected_verdict: PREREQUISITES_MISSING
