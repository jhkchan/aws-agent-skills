# Eval configuration for cur-automation-automator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: cur-automation-automator
snapshot_date: "2026-08-07"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: greenfield-cur-athena-automated
    difficulty: easy
    prompt_file: prompts/greenfield-cur-athena-automated.md
    baseline_file: baselines/greenfield-cur-athena-automated.md
    expected_verdict: AUTOMATED
    expected_risk: LOW
  - id: linked-account-caller-manual
    difficulty: hard
    prompt_file: prompts/linked-account-caller-manual.md
    baseline_file: baselines/linked-account-caller-manual.md
    expected_verdict: MANUAL_STEP_REQUIRED
    expected_risk: HIGH
  - id: quicksight-standard-edition-manual
    difficulty: hard
    prompt_file: prompts/quicksight-standard-edition-manual.md
    baseline_file: baselines/quicksight-standard-edition-manual.md
    expected_verdict: MANUAL_STEP_REQUIRED
    expected_risk: MODERATE
  - id: cur2-split-cost-allocation-automated
    difficulty: medium
    prompt_file: prompts/cur2-split-cost-allocation-automated.md
    baseline_file: baselines/cur2-split-cost-allocation-automated.md
    expected_verdict: AUTOMATED
    expected_risk: MODERATE
  - id: missing-bucket-policy-manual
    difficulty: medium
    prompt_file: prompts/missing-bucket-policy-manual.md
    baseline_file: baselines/missing-bucket-policy-manual.md
    expected_verdict: MANUAL_STEP_REQUIRED
    expected_risk: HIGH
