# Eval configuration for dataexchange-dataset-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: dataexchange-dataset-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: s3-export-lake-formation
    difficulty: hard
    prompt_file: prompts/s3-export-lake-formation.md
    baseline_file: baselines/s3-export-lake-formation.md
    expected_verdict: READY_TO_DEPLOY

  - id: auto-export-eventbridge
    difficulty: hard
    prompt_file: prompts/auto-export-eventbridge.md
    baseline_file: baselines/auto-export-eventbridge.md
    expected_verdict: READY_TO_DEPLOY

  - id: api-asset-live-access
    difficulty: medium
    prompt_file: prompts/api-asset-live-access.md
    baseline_file: baselines/api-asset-live-access.md
    expected_verdict: READY_TO_DEPLOY

  - id: entitlement-cross-account
    difficulty: medium
    prompt_file: prompts/entitlement-cross-account.md
    baseline_file: baselines/entitlement-cross-account.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-finalized-revision
    difficulty: easy
    prompt_file: prompts/missing-finalized-revision.md
    baseline_file: baselines/missing-finalized-revision.md
    expected_verdict: PREREQUISITES_MISSING
