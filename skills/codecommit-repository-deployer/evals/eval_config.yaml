# Eval configuration for codecommit-repository-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: codecommit-repository-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: standard-repo-with-kms
    difficulty: hard
    prompt_file: prompts/standard-repo-with-kms.md
    baseline_file: baselines/standard-repo-with-kms.md
    expected_verdict: READY_TO_DEPLOY

  - id: cross-account-resource-policy
    difficulty: hard
    prompt_file: prompts/cross-account-resource-policy.md
    baseline_file: baselines/cross-account-resource-policy.md
    expected_verdict: READY_TO_DEPLOY

  - id: branch-protection-and-notification
    difficulty: medium
    prompt_file: prompts/branch-protection-and-notification.md
    baseline_file: baselines/branch-protection-and-notification.md
    expected_verdict: READY_TO_DEPLOY

  - id: git-remote-codecommit-iam-auth
    difficulty: medium
    prompt_file: prompts/git-remote-codecommit-iam-auth.md
    baseline_file: baselines/git-remote-codecommit-iam-auth.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-kms-key-policy-cross-account
    difficulty: easy
    prompt_file: prompts/missing-kms-key-policy-cross-account.md
    baseline_file: baselines/missing-kms-key-policy-cross-account.md
    expected_verdict: PREREQUISITES_MISSING
