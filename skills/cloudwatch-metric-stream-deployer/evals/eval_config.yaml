# Eval configuration for cloudwatch-metric-stream-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: cloudwatch-metric-stream-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: json-stream-single-namespace
    difficulty: hard
    prompt_file: prompts/json-stream-single-namespace.md
    baseline_file: baselines/json-stream-single-namespace.md
    expected_verdict: READY_TO_DEPLOY

  - id: opentelemetry-multi-namespace
    difficulty: medium
    prompt_file: prompts/opentelemetry-multi-namespace.md
    baseline_file: baselines/opentelemetry-multi-namespace.md
    expected_verdict: READY_TO_DEPLOY

  - id: exclude-namespace-filter
    difficulty: medium
    prompt_file: prompts/exclude-namespace-filter.md
    baseline_file: baselines/exclude-namespace-filter.md
    expected_verdict: READY_TO_DEPLOY

  - id: cross-account-metrics
    difficulty: hard
    prompt_file: prompts/cross-account-metrics.md
    baseline_file: baselines/cross-account-metrics.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-firehose-role
    difficulty: easy
    prompt_file: prompts/missing-firehose-role.md
    baseline_file: baselines/missing-firehose-role.md
    expected_verdict: PREREQUISITES_MISSING
