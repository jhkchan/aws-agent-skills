# Eval configuration for budget-action-automator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: budget-action-automator
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: cost-budget-sns-notification
    difficulty: easy
    prompt_file: prompts/cost-budget-sns-notification.md
    baseline_file: baselines/cost-budget-sns-notification.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: forecast-proactive-action
    difficulty: medium
    prompt_file: prompts/forecast-proactive-action.md
    baseline_file: baselines/forecast-proactive-action.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: scp-deny-hard-enforcement
    difficulty: hard
    prompt_file: prompts/scp-deny-hard-enforcement.md
    baseline_file: baselines/scp-deny-hard-enforcement.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: missing-cost-allocation-tag
    difficulty: medium
    prompt_file: prompts/missing-cost-allocation-tag.md
    baseline_file: baselines/missing-cost-allocation-tag.md
    expected_verdict: REVIEW_REQUIRED
  - id: ri-coverage-budget
    difficulty: hard
    prompt_file: prompts/ri-coverage-budget.md
    baseline_file: baselines/ri-coverage-budget.md
    expected_verdict: AUTOMATION_DEPLOYED
