# Eval test cases for mq-broker-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the READY_TO_DEPLOY /
# PREREQUISITES_MISSING classification across Amazon MQ broker
# topologies (ActiveMQ active/standby with LDAP, RabbitMQ cluster
# with IAM auth, ActiveMQ single-instance with CloudWatch alarms,
# RabbitMQ missing VPC/subnet, ActiveMQ missing KMS key).
skill: mq-broker-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: activemq-active-standby-ldap
    description: >-
      Provision a production ActiveMQ broker in active/standby mode
      with LDAP authentication, KMS encryption, CloudWatch alarms,
      and a maintenance window. Expects READY_TO_DEPLOY with
      deployment mode, auth, encryption, and alarms captured.
    input: |
      Create a production Amazon MQ ActiveMQ broker "prod-mq" in
      us-east-1. Active/standby HA. mq.m5.large. LDAP auth against
      Managed AD d-1234567890. CMK alias/prod-mq-kms. TLS. OpenWire +
      AMQP protocols. CloudWatch alarms for CpuUtilization >80%,
      MemoryUtilization >80%, EnqueueCount anomaly. Subnets subnet-aaa
      and subnet-bbb in 2 AZs. Security group sg-mq123 inbound 61617,
      5671, 8162 from sg-app456. Auto minor version upgrade. Maintenance
      window SUN 03:00 UTC. Tags: Environment=production.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "ActiveMQ"
        - "Active/Standby"
        - "LDAP"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
        - "mq.m5.large"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: rabbitmq-cluster-iam-auth
    description: >-
      Provision a RabbitMQ broker in cluster mode with IAM
      authentication, KMS encryption, and quorum queues. Expects
      READY_TO_DEPLOY with cluster mode (3 AZs), IAM auth via
      authenticationStrategy=LDAP, and 3 subnets.
    input: |
      Create a production Amazon MQ RabbitMQ broker "prod-rmq" in
      us-east-1. Cluster mode (3 brokers). mq.m5.large. IAM
      authentication. CMK alias/prod-rmq-kms. TLS. AMQP + STOMP
      protocols. Quorum queues for HA. Subnets subnet-aaa, subnet-bbb,
      subnet-ccc in 3 AZs. Security group sg-rmq456 inbound 5671, 61614.
      CloudWatch alarms for CpuUtilization and QueueSize. Tags:
      Environment=production, Engine=rabbitmq.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "RabbitMQ"
        - "Cluster"
        - "IAM"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: activemq-single-instance-basic-alarms
    description: >-
      Provision a single-instance ActiveMQ broker with basic auth and
      CloudWatch alarms for broker metrics. Expects READY_TO_DEPLOY
      with single-instance mode, basic auth, and alarm configuration.
    input: |
      Create a small Amazon MQ ActiveMQ broker "dev-mq" in us-east-1.
      Single-instance. mq.t3.small. Basic auth (admin user). TLS.
      OpenWire protocol on port 61617. Security group sg-devmq789
      inbound 61617 from 10.0.0.0/16. Subnet subnet-devaaa. CloudWatch
      alarms for CpuUtilization >80%, MemoryUtilization >80%, and
      EnqueueCount drop. Tags: Environment=dev.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "Single-Instance"
        - "ActiveMQ"
        - "VERDICT"
        - "CHECKLIST"
        - "CpuUtilization"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: missing-vpc-subnet
    description: >-
      Operator requests an ActiveMQ active/standby broker but does not
      provide a VPC or subnet IDs. This is a prerequisite failure.
      Expects PREREQUISITES_MISSING with the missing subnet
      requirement cited.
    input: |
      Create an Amazon MQ ActiveMQ broker "prod-mq2" in us-east-1.
      Active/standby HA. mq.m5.large. LDAP auth. CMK alias/prod-mq-kms.
      TLS. OpenWire protocol. Security group sg-mq999. No subnets or
      VPC specified yet — will figure those out later.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "subnet"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"

  - id: missing-kms-key
    description: >-
      Operator requests a production RabbitMQ broker with encryption
      but the KMS key alias does not exist. This is a prerequisite
      failure.
    input: |
      Create a production Amazon MQ RabbitMQ broker "prod-rmq2" in
      us-east-1. Cluster mode. mq.m5.xlarge. IAM auth. Encryption with
      CMK alias/does-not-exist-yet. TLS. AMQP protocol. Subnets
      subnet-aaa, subnet-bbb, subnet-ccc in 3 AZs. Security group
      sg-rmq999. Tags: Environment=production.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "KMS"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"
