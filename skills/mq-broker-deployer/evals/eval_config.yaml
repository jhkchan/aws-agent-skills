# Eval configuration for mq-broker-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: mq-broker-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: activemq-active-standby-ldap
    difficulty: hard
    prompt_file: prompts/activemq-active-standby-ldap.md
    baseline_file: baselines/activemq-active-standby-ldap.md
    expected_verdict: READY_TO_DEPLOY

  - id: rabbitmq-cluster-iam-auth
    difficulty: hard
    prompt_file: prompts/rabbitmq-cluster-iam-auth.md
    baseline_file: baselines/rabbitmq-cluster-iam-auth.md
    expected_verdict: READY_TO_DEPLOY

  - id: activemq-single-instance-basic-alarms
    difficulty: medium
    prompt_file: prompts/activemq-single-instance-basic-alarms.md
    baseline_file: baselines/activemq-single-instance-basic-alarms.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-vpc-subnet
    difficulty: easy
    prompt_file: prompts/missing-vpc-subnet.md
    baseline_file: baselines/missing-vpc-subnet.md
    expected_verdict: PREREQUISITES_MISSING

  - id: missing-kms-key
    difficulty: easy
    prompt_file: prompts/missing-kms-key.md
    baseline_file: baselines/missing-kms-key.md
    expected_verdict: PREREQUISITES_MISSING
