# Eval configuration for cloudtrail-lake-query-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: cloudtrail-lake-query-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: mgmt-eds-with-data-protection
    difficulty: hard
    prompt_file: prompts/mgmt-eds-with-data-protection.md
    baseline_file: baselines/mgmt-eds-with-data-protection.md
    expected_verdict: READY_TO_DEPLOY

  - id: data-events-eds-with-selectors
    difficulty: hard
    prompt_file: prompts/data-events-eds-with-selectors.md
    baseline_file: baselines/data-events-eds-with-selectors.md
    expected_verdict: READY_TO_DEPLOY

  - id: multi-account-org-eds
    difficulty: hard
    prompt_file: prompts/multi-account-org-eds.md
    baseline_file: baselines/multi-account-org-eds.md
    expected_verdict: READY_TO_DEPLOY

  - id: forensic-query-patterns
    difficulty: medium
    prompt_file: prompts/forensic-query-patterns.md
    baseline_file: baselines/forensic-query-patterns.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-event-type-decision
    difficulty: easy
    prompt_file: prompts/missing-event-type-decision.md
    baseline_file: baselines/missing-event-type-decision.md
    expected_verdict: PREREQUISITES_MISSING
