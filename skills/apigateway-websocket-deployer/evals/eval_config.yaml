# Eval configuration for apigateway-websocket-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: apigateway-websocket-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: basic-connect-disconnect
    difficulty: hard
    prompt_file: prompts/basic-connect-disconnect.md
    baseline_file: baselines/basic-connect-disconnect.md
    expected_verdict: READY_TO_DEPLOY

  - id: custom-routes-selection
    difficulty: hard
    prompt_file: prompts/custom-routes-selection.md
    baseline_file: baselines/custom-routes-selection.md
    expected_verdict: READY_TO_DEPLOY

  - id: lambda-authorizer-waf
    difficulty: hard
    prompt_file: prompts/lambda-authorizer-waf.md
    baseline_file: baselines/lambda-authorizer-waf.md
    expected_verdict: READY_TO_DEPLOY

  - id: route-response-keepalive
    difficulty: medium
    prompt_file: prompts/route-response-keepalive.md
    baseline_file: baselines/route-response-keepalive.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-route-selection
    difficulty: easy
    prompt_file: prompts/missing-route-selection.md
    baseline_file: baselines/missing-route-selection.md
    expected_verdict: PREREQUISITES_MISSING
