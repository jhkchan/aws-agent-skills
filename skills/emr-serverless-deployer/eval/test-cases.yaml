# Eval test cases for emr-serverless-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the READY_TO_DEPLOY / PREREQUISITES_MISSING
# classification across application creation (Spark/Hive, release label),
# pre-initialized capacity, maximum capacity, VPC access, IAM execution
# role, job submission (entry point, arguments, configuration overrides),
# Spark Connect interactive endpoints, and prerequisite failure branches
# (missing execution role, missing VPC subnets for private-resource jobs).
skill: emr-serverless-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: spark-production-etl
    description: >-
      Deploy a production EMR Serverless Spark application with
      pre-initialized capacity (50 workers), maximum capacity (200
      workers burst), VPC access for S3 via VPC endpoint, IAM
      execution role scoped for S3/Glue/CloudWatch/Secrets Manager,
      S3 log bucket, CloudWatch logging, Spark AQE enabled, and job
      submission with entry point, arguments, and configuration
      overrides. Expects READY_TO_DEPLOY.
    input: |
      Deploy a production EMR Serverless Spark application named
      "etl-spark-prod" in us-east-1. Release label emr-7.2.0.
      Execution role EMRServerlessExecRole with S3 GetObject on
      etl-scripts and raw-data buckets, S3 PutObject on curated and
      emr-logs-123456789012 buckets, Glue GetTable/GetDatabase,
      CloudWatch Logs, Secrets Manager GetSecretValue on etl/db-creds.
      Pre-initialized capacity: 50 workers, 4 vCPU / 16 GB each.
      Maximum capacity: 200 workers burst ceiling. VPC access:
      subnets subnet-aaa, subnet-bbb, security group sg-emr-prod.
      S3 log bucket s3://emr-logs-123456789012/etl-spark-prod/.
      CloudWatch log group /aws/emr-serverless/etl-spark-prod.
      Job: entry point s3://etl-scripts/daily_transform.py, args
      --source s3://raw-data/events/ --target s3://curated/events/
      --date 2026-08-11. Spark config: AQE enabled, shuffle
      partitions 200, KryoSerializer. Auto-start enabled, auto-stop
      idle 15 min. Account: 123456789012.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "etl-spark-prod"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
        - "execution role"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: hive-batch-application
    description: >-
      Deploy a production EMR Serverless Hive application for legacy
      HiveQL batch processing with maximum capacity, S3 log bucket,
      CloudWatch logging, and Hive job submission. Expects
      READY_TO_DEPLOY.
    input: |
      Deploy a production EMR Serverless Hive application named
      "hive-batch-prod" in us-east-1. Release label emr-7.2.0.
      Execution role EMRHiveExecRole with S3 GetObject on
      hive-scripts bucket, S3 PutObject on emr-logs-123456789012,
      Glue GetTable/GetDatabase/GetPartitions. No pre-initialized
      capacity (cold start acceptable for nightly batch). Maximum
      capacity: 50 workers. No VPC access needed (Glue catalog only).
      S3 log bucket s3://emr-logs-123456789012/hive-batch/. CloudWatch
      log group /aws/emr-serverless/hive-batch-prod. Job: HiveQL
      query SELECT COUNT(*) FROM sales WHERE dt = '2026-08-11', init
      script s3://hive-scripts/hive-init.sql, Tez engine.
      Auto-start enabled, auto-stop idle 5 min. Account: 123456789012.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "hive-batch-prod"
        - "VERDICT"
        - "CHECKLIST"
        - "Hive"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: missing-execution-role
    description: >-
      Deploy an EMR Serverless Spark application but no execution role
      is provided (the operator forgot to create the IAM role). Expects
      PREREQUISITES_MISSING — execution role required for runtime AWS
      API calls.
    input: |
      Deploy an EMR Serverless Spark application named "report-spark-prod"
      in us-east-1. Release label emr-7.2.0. Execution role: NONE
      PROVIDED (the operator forgot to create the IAM role). Pre-
      initialized capacity: 20 workers. Maximum capacity: 100 workers.
      VPC access: subnets subnet-aaa, subnet-bbb, security group
      sg-emr-prod. S3 log bucket s3://emr-logs-123456789012/report/.
      Job: entry point s3://etl-scripts/report.py, args --source
      s3://raw-data/sales/ --target s3://curated/sales/. Account:
      123456789012.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "report-spark-prod"
        - "VERDICT"
        - "CHECKLIST"
        - "execution role"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"

  - id: spark-connect-interactive
    description: >-
      Deploy a production EMR Serverless Spark application with Spark
      Connect interactive endpoint for notebook-based exploration,
      pre-initialized capacity, VPC access, and CloudWatch logging.
      Expects READY_TO_DEPLOY.
    input: |
      Deploy a production EMR Serverless Spark application named
      "analytics-spark-prod" in us-east-1. Release label emr-7.2.0.
      Execution role EMRAnalyticsExecRole with S3 GetObject on
      curated bucket, Glue GetTable/GetDatabase, CloudWatch Logs.
      Pre-initialized capacity: 10 workers, 4 vCPU / 16 GB each.
      Maximum capacity: 100 workers. VPC access: subnets subnet-aaa,
      subnet-bbb, subnet-ccc, security group sg-emr-analytics. S3 log
      bucket s3://emr-logs-123456789012/analytics/. CloudWatch log
      group /aws/emr-serverless/analytics-spark-prod. Interactive
      endpoint: Spark Connect for Jupyter notebooks. Auto-start
      enabled, auto-stop idle 60 min (interactive workload). Account:
      123456789012.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "analytics-spark-prod"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
        - "Spark Connect"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: missing-vpc-subnets
    description: >-
      Deploy an EMR Serverless Spark application that reads from a
      private Aurora PostgreSQL cluster but no VPC subnets are
      provided. Expects PREREQUISITES_MISSING — VPC access required
      for private database resources.
    input: |
      Deploy an EMR Serverless Spark application named "db-spark-prod"
      in us-east-1. Release label emr-7.2.0. Execution role
      EMRDbExecRole with S3 GetObject on etl-scripts, Secrets Manager
      GetSecretValue on etl/db-creds. Pre-initialized capacity: 30
      workers. Maximum capacity: 100 workers. The Spark job reads from
      a private Aurora PostgreSQL cluster at
      db.cluster-xxx.us-east-1.rds.amazonaws.com in private subnets
      subnet-aaa, subnet-bbb. NO VPC SUBNETS OR SECURITY GROUPS
      CONFIGURED. S3 log bucket s3://emr-logs-123456789012/db-spark/.
      Job: entry point s3://etl-scripts/db_read.py, args --jdbc-url
      jdbc:postgresql://db.cluster-xxx.us-east-1.rds.amazonaws.com:5432/analytics
      --secret etl/db-creds. Account: 123456789012.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "db-spark-prod"
        - "VERDICT"
        - "CHECKLIST"
        - "VPC"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
