# Eval configuration for emr-serverless-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob).
skill_name: emr-serverless-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: spark-production-etl
    difficulty: hard
    prompt_file: prompts/spark-production-etl.md
    baseline_file: baselines/spark-production-etl.md
    expected_verdict: READY_TO_DEPLOY

  - id: hive-batch-application
    difficulty: hard
    prompt_file: prompts/hive-batch-application.md
    baseline_file: baselines/hive-batch-application.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-execution-role
    difficulty: hard
    prompt_file: prompts/missing-execution-role.md
    baseline_file: baselines/missing-execution-role.md
    expected_verdict: PREREQUISITES_MISSING

  - id: spark-connect-interactive
    difficulty: hard
    prompt_file: prompts/spark-connect-interactive.md
    baseline_file: baselines/spark-connect-interactive.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-vpc-subnets
    difficulty: medium
    prompt_file: prompts/missing-vpc-subnets.md
    baseline_file: baselines/missing-vpc-subnets.md
    expected_verdict: PREREQUISITES_MISSING
