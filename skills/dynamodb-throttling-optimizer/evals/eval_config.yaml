# Eval configuration for dynamodb-throttling-optimizer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: dynamodb-throttling-optimizer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: write-sharding-hot-partition
    difficulty: hard
    prompt_file: prompts/write-sharding-hot-partition.md
    baseline_file: baselines/write-sharding-hot-partition.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
  - id: gsi-backpressure-throttling
    difficulty: hard
    prompt_file: prompts/gsi-backpressure-throttling.md
    baseline_file: baselines/gsi-backpressure-throttling.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
  - id: capacity-mode-switch
    difficulty: medium
    prompt_file: prompts/capacity-mode-switch.md
    baseline_file: baselines/capacity-mode-switch.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
  - id: already-optimized-table
    difficulty: easy
    prompt_file: prompts/already-optimized-table.md
    baseline_file: baselines/already-optimized-table.md
    expected_verdict: OPTIMIZED
  - id: batch-write-migration
    difficulty: medium
    prompt_file: prompts/batch-write-migration.md
    baseline_file: baselines/batch-write-migration.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
