# Eval test cases for organizations-scp-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
skill: organizations-scp-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: guardrail-deny-regions-ready
    description: >-
      Deploy a guardrail-strategy SCP that denies unapproved regions
      at the org root. Policy type is enabled; FullAWSAccess is
      preserved; caller holds organizations:CreatePolicy and
      :AttachPolicy. All pre-checks pass; plan should produce
      READY_TO_DEPLOY with the create-policy and attach-policy CLI,
      CONFIRM gate, and the global-service exemption caveat.
    input: |
      Operation: deploy-scp
      Policy name: deny-unapproved-regions
      Strategy: guardrail
      Target: r-abc1 (root)
      Policy goal: deny regions outside us-east-1, eu-west-1, us-west-2
      Condition keys: aws:RequestedRegion

      Pre-checks (already performed by caller):
        aws organizations describe-organization:
          Organization.FeatureSet: ALL_FEATURES
        aws organizations list-roots --query 'Roots[0].PolicyTypes':
          [{'Type': 'SERVICE_CONTROL_POLICY', 'Status': 'ENABLED'}]
        aws organizations list-policies-for-target --target-id r-abc1
          --filter SERVICE_CONTROL_POLICY:
          [{'Name': 'FullAWSAccess', 'AwsManaged': true}]
        Caller IAM role: AWSOrgAdminRole with
          organizations:CreatePolicy, organizations:AttachPolicy

      Emit the standard VERDICT block (POLICY_SPEC, VERDICT,
      ARCHITECTURE, CHECKLIST, FINDINGS, DEPLOY_COMMANDS).
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "deny-unapproved-regions"
        - "create-policy"
        - "attach-policy"
        - "VERDICT"
        - "CONFIRM"
        - "guardrail"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: policy-type-not-enabled-blocked
    description: >-
      Deploy an SCP when the policy type is not enabled on the root.
      Plan should produce PREREQUISITES_MISSING with the
      enable-policy-type remediation step and NOT proceed to
      create-policy.
    input: |
      Operation: deploy-scp
      Policy name: deny-root-user-actions
      Strategy: guardrail
      Target: r-abc1 (root)
      Policy goal: deny root principal actions

      Pre-checks:
        aws organizations describe-organization:
          Organization.FeatureSet: CONSOLIDATED_BILLING
        aws organizations list-roots --query 'Roots[0].PolicyTypes':
          []
        Caller IAM role: AWSOrgAdminRole

      Emit the standard VERDICT block.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "SERVICE_CONTROL_POLICY"
        - "enable-policy-type"
        - "VERDICT"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: READY_TO_DEPLOY"
        - "create-policy"

  - id: delegate-allowlist-ready-with-warning
    description: >-
      Deploy a delegate-strategy allowlist SCP. Policy type is enabled;
      a comprehensive allowlist is attached FIRST, then FullAWSAccess
      is detached. Plan should produce READY_TO_DEPLOY with an explicit
      WARNING about the lockout risk and the ordered deployment
      sequence (allowlist attach BEFORE FullAWSAccess detach).
    input: |
      Operation: deploy-scp
      Policy name: allowlist-approved-services
      Strategy: delegate
      Target: r-abc1 (root)
      Approved services: ec2, s3, rds, lambda, iam, logs, kms,
        dynamodb, sns, sqs, sts
      Order: attach allowlist BEFORE detaching FullAWSAccess

      Pre-checks:
        aws organizations describe-organization:
          Organization.FeatureSet: ALL_FEATURES
        aws organizations list-roots --query 'Roots[0].PolicyTypes':
          [{'Type': 'SERVICE_CONTROL_POLICY', 'Status': 'ENABLED'}]
        Caller IAM role: AWSOrgAdminRole

      Emit the standard VERDICT block. Include the lockout warning
      and the explicit ordering requirement.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "delegate"
        - "FullAWSAccess"
        - "detach"
        - "VERDICT"
        - "CONFIRM"
        - "WARN"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: root-deny-cannot-be-overridden-blocked
    description: >-
      User asks to deploy a Deny SCP at the root and a corresponding
      Allow SCP at a child OU to override it. This violates the
      intersection model — root Deny cannot be overridden. Plan
      should produce PREREQUISITES_MISSING explaining the intersection
      rule and recommending OU-scoped Deny or condition keys instead.
    input: |
      Operation: deploy-scp
      Requested: Deny ec2:* at root, Allow ec2:* at ou-prod-a
      Reason: "allow ec2 only in prod OU"
      Target root: r-abc1
      Target child OU: ou-prod-a

      Pre-checks:
        aws organizations list-roots --query 'Roots[0].PolicyTypes':
          [{'Type': 'SERVICE_CONTROL_POLICY', 'Status': 'ENABLED'}]
        Caller IAM role: AWSOrgAdminRole

      Emit the standard VERDICT block. Explain the intersection rule
      and recommend the correct pattern.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "intersection"
        - "VERDICT"
        - "OU"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: READY_TO_DEPLOY"

  - id: called-via-chained-service-ready
    description: >-
      Deploy a guardrail SCP that uses aws:CalledVia to scope
      CloudFormation-driven IAM calls. All pre-checks pass. Plan
      should produce READY_TO_DEPLOY with the aws:CalledVia
      condition in the statement and the chained-service rationale
      in NOTES.
    input: |
      Operation: deploy-scp
      Policy name: allow-iam-via-cloudformation
      Strategy: guardrail
      Target: ou-app-a
      Policy goal: allow iam:CreateRole, iam:PassRole only when
        invoked via CloudFormation
      Condition keys: aws:CalledVia

      Pre-checks:
        aws organizations list-roots --query 'Roots[0].PolicyTypes':
          [{'Type': 'SERVICE_CONTROL_POLICY', 'Status': 'ENABLED'}]
        aws organizations list-organizational-units-for-parent
          --parent-id r-abc1:
          [{'Id': 'ou-app-a', 'Name': 'app-a'}]
        Caller IAM role: AWSOrgAdminRole

      Emit the standard VERDICT block.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "aws:CalledVia"
        - "cloudformation.amazonaws.com"
        - "VERDICT"
        - "CONFIRM"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: PREREQUISITES_MISSING"
