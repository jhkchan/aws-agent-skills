# Eval configuration for eks-autoscaling-automator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: eks-autoscaling-automator
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: karpenter-spot-full-deploy
    difficulty: hard
    prompt_file: prompts/karpenter-spot-full-deploy.md
    baseline_file: baselines/karpenter-spot-full-deploy.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: missing-metrics-server
    difficulty: easy
    prompt_file: prompts/missing-metrics-server.md
    baseline_file: baselines/missing-metrics-server.md
    expected_verdict: REVIEW_REQUIRED
  - id: ca-to-karpenter-migration
    difficulty: hard
    prompt_file: prompts/ca-to-karpenter-migration.md
    baseline_file: baselines/ca-to-karpenter-migration.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: vpa-hpa-conflict
    difficulty: medium
    prompt_file: prompts/vpa-hpa-conflict.md
    baseline_file: baselines/vpa-hpa-conflict.md
    expected_verdict: REVIEW_REQUIRED
  - id: keda-sqs-scale-to-zero
    difficulty: medium
    prompt_file: prompts/keda-sqs-scale-to-zero.md
    baseline_file: baselines/keda-sqs-scale-to-zero.md
    expected_verdict: AUTOMATION_DEPLOYED
