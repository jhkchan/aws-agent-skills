# Eval configuration for lambda-cold-start-optimizer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: lambda-cold-start-optimizer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: snapstart-enablement
    difficulty: medium
    prompt_file: prompts/snapstart-enablement.md
    baseline_file: baselines/snapstart-enablement.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
  - id: provisioned-concurrency-sizing
    difficulty: hard
    prompt_file: prompts/provisioned-concurrency-sizing.md
    baseline_file: baselines/provisioned-concurrency-sizing.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
  - id: init-phase-refactor
    difficulty: medium
    prompt_file: prompts/init-phase-refactor.md
    baseline_file: baselines/init-phase-refactor.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
  - id: already-optimized-function
    difficulty: easy
    prompt_file: prompts/already-optimized-function.md
    baseline_file: baselines/already-optimized-function.md
    expected_verdict: OPTIMIZED
  - id: memory-tuning-for-cold-start
    difficulty: hard
    prompt_file: prompts/memory-tuning-for-cold-start.md
    baseline_file: baselines/memory-tuning-for-cold-start.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
