# Eval test cases for cloudfront-response-headers-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
skill: cloudfront-response-headers-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: custom-security-headers-ready
    description: >-
      Greenfield custom response headers policy request for a production
      distribution. All requirements satisfied (distribution Deployed,
      no existing policy, CSP compatible with site script inventory,
      HSTS scope verified). Plan should produce READY_TO_DEPLOY with the
      full CloudFormation template for a custom policy with security
      headers + CORS.
    input: |
      Operation: create
      Policy name: prod-security-headers-policy
      Distribution: E27TVSIEXAMPLE (Deployed)
      Target behavior: DefaultCacheBehavior
      Security headers: CSP default-src 'self'; object-src 'none';
        frame-ancestors 'none'; HSTS max-age=63072000 includeSubDomains
        preload; X-Frame-Options DENY; X-Content-Type-Options nosniff;
        Referrer-Policy strict-origin-when-cross-origin;
        Permissions-Policy camera=(), microphone=()
      CORS: origin https://app.example.com, methods GET/POST/OPTIONS,
        headers Authorization/Content-Type, credentials true,
        max-age 86400
      Custom headers: X-Content-Classification=Restricted
      Removal headers: X-Powered-By
      Template format: CloudFormation

      Requirement checks (already performed by caller):
        aws cloudfront get-distribution --id E27TVSIEXAMPLE:
          Status: Deployed (OK)
        aws cloudfront get-distribution-config --id E27TVSIEXAMPLE:
          DefaultCacheBehavior.ResponseHeadersPolicyId: "" (none — OK)
        aws cloudfront list-response-headers-policies:
          no policy named prod-security-headers-policy (OK to create)
        curl -I https://app.example.com:
          HTTP/2 200, HTTPS reachable (OK)
        cert SAN for app.example.com: matches CORS origin (OK)
        site script audit (DevTools console, Report-Only mode):
          no inline scripts, no external CDNs (CSP compatible — OK)
        subdomain audit:
          all subdomains serve HTTPS (HSTS includeSubDomains safe — OK)

      Emit the standard VERDICT block (OPERATION, VERDICT, TARGET,
      REQUIREMENTS, IAC_TEMPLATE, MANUAL_GAPS, NOTES).
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "prod-security-headers-policy"
        - "VERDICT"
        - "Content-Security-Policy"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: cors-wildcard-with-credentials-missing
    description: >-
      CORS config uses Access-Control-Allow-Origin: "*" combined with
      AllowCredentials: true. Browsers reject this combination.
      Plan should produce PREREQUISITES_MISSING with the specific gap
      and the exact snippet to use specific origins instead.
    input: |
      Operation: create
      Policy name: prod-cors-policy
      Distribution: E27TVSIEXAMPLE (Deployed)
      CORS: origin "*", methods GET/POST/OPTIONS, credentials true

      Requirement checks:
        aws cloudfront get-distribution --id E27TVSIEXAMPLE:
          Status: Deployed (OK)
        CORS config review:
          AccessControlAllowOrigins: ["*"]
          AccessControlAllowCredentials: true
          => Browser-rejected combination (FAIL)

      Emit the standard VERDICT block.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "credentials"
        - "VERDICT"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: READY_TO_DEPLOY"

  - id: managed-securityheaders-policy-ready
    description: >-
      Request to attach the managed SecurityHeadersPolicy to an existing
      distribution. All requirements satisfied (distribution Deployed,
      no existing policy, managed policy ID valid). Plan should produce
      READY_TO_DEPLOY with the managed policy reference and the
      distribution update plan.
    input: |
      Operation: attach
      Policy: managed SecurityHeadersPolicy
        (ID: 0857826db9cffff310d5ad62955c9c26)
      Distribution: E27TVSIEXAMPLE (Deployed)
      Target behavior: DefaultCacheBehavior

      Requirement checks:
        aws cloudfront get-distribution --id E27TVSIEXAMPLE:
          Status: Deployed (OK)
        aws cloudfront get-distribution-config --id E27TVSIEXAMPLE:
          DefaultCacheBehavior.ResponseHeadersPolicyId: "" (OK)
        aws cloudfront get-response-headers-policy \
          --id 0857826db9cffff310d5ad62955c9c26:
          SecurityHeadersPolicy managed policy exists (OK)

      Emit the standard VERDICT block.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "0857826db9cffff310d5ad62955c9c26"
        - "VERDICT"
        - "SecurityHeadersPolicy"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: hsts-include-subdomains-http-only-gap-missing
    description: >-
      Request for HSTS with includeSubDomains on a domain where a
      subdomain is HTTP-only. Plan should produce PREREQUISITES_MISSING
      with the specific gap and the snippet to either disable
      includeSubDomains or migrate the subdomain to HTTPS.
    input: |
      Operation: create
      Policy name: prod-hsts-policy
      Distribution: E27TVSIEXAMPLE (Deployed)
      HSTS: max-age=63072000, includeSubDomains=true, preload=true
      Domain: example.com
      Subdomains: app.example.com (HTTPS), staging.example.com (HTTP-only)

      Requirement checks:
        aws cloudfront get-distribution --id E27TVSIEXAMPLE:
          Status: Deployed (OK)
        subdomain HTTPS audit:
          app.example.com: HTTPS reachable (OK)
          staging.example.com: HTTP-only (FAIL — HSTS includeSubDomains
            would break this subdomain)

      Emit the standard VERDICT block.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "includeSubDomains"
        - "VERDICT"
        - "staging.example.com"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: READY_TO_DEPLOY"

  - id: distribution-in-progress-missing
    description: >-
      Distribution is in InProgress state (cannot accept policy attach).
      Plan should produce PREREQUISITES_MISSING with the wait-and-retry
      note.
    input: |
      Operation: attach
      Policy: managed SecurityHeadersPolicy
      Distribution: E27TVSIEXAMPLE

      Requirement checks:
        aws cloudfront get-distribution --id E27TVSIEXAMPLE:
          Status: InProgress (FAIL — cannot update distribution
            mid-deploy)

      Emit the standard VERDICT block.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "InProgress"
        - "VERDICT"
        - "Deployed"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: READY_TO_DEPLOY"
