# Eval test cases for ecr-repository-auditor
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
skill: ecr-repository-auditor
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: public-pull-wildcard-no-condition
    description: >-
      ECR private repository granting ecr:BatchGetImage and
      ecr:GetDownloadUrlForLayer to Principal "*" with no condition — any AWS
      account holder can pull every image layer.
    input: |
      Repository: 111111111111.dkr.ecr.us-east-1.amazonaws.com/public-pull-wildcard-no-condition
      Registry ID: 111111111111
      imageScanningConfiguration:
        scanOnPush: true
      imageTagMutability: IMMUTABLE
      lifecyclePolicyText: present
      Repository policy:

      ```json
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "PublicPull",
            "Effect": "Allow",
            "Principal": "*",
            "Action": [
              "ecr:BatchGetImage",
              "ecr:GetDownloadUrlForLayer",
              "ecr:BatchCheckLayerAvailability"
            ],
            "Resource": "*"
          }
        ]
      }
      ```
      Emit the standard VERDICT block (REPO, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: PUBLIC
    assertions:
      must_contain:
        - "PUBLIC"
        - "public-pull-wildcard-no-condition"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
        - "Principal"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: NO_SCAN"
        - "VERDICT: NO_LIFECYCLE"
        - "VERDICT: CONFIG_GAP"

  - id: scan-off-unscanned-images
    description: >-
      ECR repo with same-account-only repository policy (secure), scanOnPush
      false, and images with imageScanStatus null — vulnerability blind spot.
    input: |
      Repository: 111111111111.dkr.ecr.us-east-1.amazonaws.com/scan-off-unscanned-images
      Registry ID: 111111111111
      imageScanningConfiguration:
        scanOnPush: false
      imageTagMutability: IMMUTABLE
      lifecyclePolicyText: present
      Images:
        - imageDigest: sha256:aaa, imageTags: ["v1.0"], imageScanStatus: null
        - imageDigest: sha256:bbb, imageTags: ["v1.1"], imageScanStatus: {"status": "PENDING"}
      Repository policy:

      ```json
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "RootAccess",
            "Effect": "Allow",
            "Principal": {"AWS": "arn:aws:iam::111111111111:root"},
            "Action": "ecr:*",
            "Resource": "*"
          }
        ]
      }
      ```
      Emit the standard VERDICT block (REPO, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: NO_SCAN
    assertions:
      must_contain:
        - "NO_SCAN"
        - "scan-off-unscanned-images"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PUBLIC"
        - "VERDICT: OK"

  - id: no-lifecycle-policy
    description: >-
      ECR repo with secure same-account policy, scanOnPush true, tag immutable,
      but no lifecyclePolicyText — images accumulate indefinitely.
    input: |
      Repository: 111111111111.dkr.ecr.us-east-1.amazonaws.com/no-lifecycle-policy
      Registry ID: 111111111111
      imageScanningConfiguration:
        scanOnPush: true
      imageTagMutability: IMMUTABLE
      lifecyclePolicyText: absent
      Images:
        - imageDigest: sha256:ccc, imageTags: ["v1.0"], imageScanStatus: {"status": "COMPLETE"}
      Repository policy:

      ```json
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "RootAccess",
            "Effect": "Allow",
            "Principal": {"AWS": "arn:aws:iam::111111111111:root"},
            "Action": "ecr:*",
            "Resource": "*"
          }
        ]
      }
      ```
      Emit the standard VERDICT block (REPO, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: NO_LIFECYCLE
    assertions:
      must_contain:
        - "NO_LIFECYCLE"
        - "no-lifecycle-policy"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PUBLIC"
        - "VERDICT: OK"

  - id: tag-mutable-config-gap
    description: >-
      ECR repo with secure same-account policy, scanOnPush true, lifecycle
      policy present, but imageTagMutability is MUTABLE — supply-chain tag
      overwrite risk.
    input: |
      Repository: 111111111111.dkr.ecr.us-east-1.amazonaws.com/tag-mutable-config-gap
      Registry ID: 111111111111
      imageScanningConfiguration:
        scanOnPush: true
      imageTagMutability: MUTABLE
      lifecyclePolicyText: present
      Images:
        - imageDigest: sha256:ddd, imageTags: ["v2.0"], imageScanStatus: {"status": "COMPLETE"}
      Repository policy:

      ```json
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "RootAccess",
            "Effect": "Allow",
            "Principal": {"AWS": "arn:aws:iam::111111111111:root"},
            "Action": "ecr:*",
            "Resource": "*"
          }
        ]
      }
      ```
      Emit the standard VERDICT block (REPO, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: CONFIG_GAP
    assertions:
      must_contain:
        - "CONFIG_GAP"
        - "tag-mutable-config-gap"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PUBLIC"
        - "VERDICT: OK"

  - id: clean-ok
    description: >-
      ECR repo with same-account-only policy, scanOnPush true, lifecycle
      policy present, tag immutable, all images scanned — clean posture.
    input: |
      Repository: 111111111111.dkr.ecr.us-east-1.amazonaws.com/clean-ok
      Registry ID: 111111111111
      imageScanningConfiguration:
        scanOnPush: true
      imageTagMutability: IMMUTABLE
      lifecyclePolicyText: present
      Images:
        - imageDigest: sha256:eee, imageTags: ["v3.0"], imageScanStatus: {"status": "COMPLETE"}
      Repository policy:

      ```json
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "RootAccess",
            "Effect": "Allow",
            "Principal": {"AWS": "arn:aws:iam::111111111111:root"},
            "Action": "ecr:*",
            "Resource": "*"
          }
        ]
      }
      ```
      Emit the standard VERDICT block (REPO, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: OK
    assertions:
      must_contain:
        - "OK"
        - "clean-ok"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PUBLIC"
        - "VERDICT: NO_SCAN"

  - id: public-pull-sourcevpce-scoped-config-gap
    description: >-
      ECR repo with Principal "*" granting pull actions but restricted by
      aws:SourceVpce condition (STRONG) — scoped to a VPC endpoint, downgraded
      from PUBLIC to CONFIG_GAP per Step 1e condition-strength evaluation.
      All other dimensions clean.
    input: |
      Repository: 111111111111.dkr.ecr.us-east-1.amazonaws.com/public-pull-sourcevpce-scoped-config-gap
      Registry ID: 111111111111
      imageScanningConfiguration:
        scanOnPush: true
      imageTagMutability: IMMUTABLE
      lifecyclePolicyText: present
      Images:
        - imageDigest: sha256:fff, imageTags: ["v4.0"], imageScanStatus: {"status": "COMPLETE"}
      Repository policy:

      ```json
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "RootAccess",
            "Effect": "Allow",
            "Principal": {"AWS": "arn:aws:iam::111111111111:root"},
            "Action": "ecr:*",
            "Resource": "*"
          },
          {
            "Sid": "VpceScopedPull",
            "Effect": "Allow",
            "Principal": "*",
            "Action": [
              "ecr:BatchGetImage",
              "ecr:GetDownloadUrlForLayer"
            ],
            "Resource": "*",
            "Condition": {
              "StringEquals": {
                "aws:SourceVpce": "vpce-abc123def456"
              }
            }
          }
        ]
      }
      ```
      Emit the standard VERDICT block (REPO, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: CONFIG_GAP
    assertions:
      must_contain:
        - "CONFIG_GAP"
        - "public-pull-sourcevpce-scoped-config-gap"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PUBLIC"
        - "VERDICT: OK"
