# Eval configuration for waf-rule-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: waf-rule-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: cloudfront-managed-and-custom-allow
    difficulty: hard
    prompt_file: prompts/cloudfront-managed-and-custom-allow.md
    baseline_file: baselines/cloudfront-managed-and-custom-allow.md
    expected_verdict: READY_TO_DEPLOY

  - id: regional-alb-rate-and-geo
    difficulty: hard
    prompt_file: prompts/regional-alb-rate-and-geo.md
    baseline_file: baselines/regional-alb-rate-and-geo.md
    expected_verdict: READY_TO_DEPLOY

  - id: wcu-budget-exceeded
    difficulty: medium
    prompt_file: prompts/wcu-budget-exceeded.md
    baseline_file: baselines/wcu-budget-exceeded.md
    expected_verdict: PREREQUISITES_MISSING

  - id: logging-missing-firehose-prefix
    difficulty: easy
    prompt_file: prompts/logging-missing-firehose-prefix.md
    baseline_file: baselines/logging-missing-firehose-prefix.md
    expected_verdict: PREREQUISITES_MISSING

  - id: cloudfront-acl-wrong-region
    difficulty: easy
    prompt_file: prompts/cloudfront-acl-wrong-region.md
    baseline_file: baselines/cloudfront-acl-wrong-region.md
    expected_verdict: PREREQUISITES_MISSING
