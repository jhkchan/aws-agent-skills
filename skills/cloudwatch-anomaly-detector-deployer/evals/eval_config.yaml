# Eval configuration for cloudwatch-anomaly-detector-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: cloudwatch-anomaly-detector-deployer
snapshot_date: "2026-08-12"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: builtin-cpu-anomaly-alarm
    difficulty: hard
    prompt_file: prompts/builtin-cpu-anomaly-alarm.md
    baseline_file: baselines/builtin-cpu-anomaly-alarm.md
    expected_verdict: READY_TO_DEPLOY

  - id: custom-metric-anomaly
    difficulty: hard
    prompt_file: prompts/custom-metric-anomaly.md
    baseline_file: baselines/custom-metric-anomaly.md
    expected_verdict: READY_TO_DEPLOY

  - id: insufficient-training-data
    difficulty: easy
    prompt_file: prompts/insufficient-training-data.md
    baseline_file: baselines/insufficient-training-data.md
    expected_verdict: PREREQUISITES_MISSING

  - id: cross-account-anomaly
    difficulty: medium
    prompt_file: prompts/cross-account-anomaly.md
    baseline_file: baselines/cross-account-anomaly.md
    expected_verdict: READY_TO_DEPLOY

  - id: std-dev-sensitivity-tuning
    difficulty: medium
    prompt_file: prompts/std-dev-sensitivity-tuning.md
    baseline_file: baselines/std-dev-sensitivity-tuning.md
    expected_verdict: READY_TO_DEPLOY
