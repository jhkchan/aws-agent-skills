# Eval configuration for mwaa-environment-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: mwaa-environment-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: small-public-webserver
    difficulty: hard
    prompt_file: prompts/small-public-webserver.md
    baseline_file: baselines/small-public-webserver.md
    expected_verdict: READY_TO_DEPLOY

  - id: medium-private-logs
    difficulty: hard
    prompt_file: prompts/medium-private-logs.md
    baseline_file: baselines/medium-private-logs.md
    expected_verdict: READY_TO_DEPLOY

  - id: custom-requirements-plugins
    difficulty: medium
    prompt_file: prompts/custom-requirements-plugins.md
    baseline_file: baselines/custom-requirements-plugins.md
    expected_verdict: READY_TO_DEPLOY

  - id: large-config-overrides
    difficulty: medium
    prompt_file: prompts/large-config-overrides.md
    baseline_file: baselines/large-config-overrides.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-subnet-requirements
    difficulty: easy
    prompt_file: prompts/missing-subnet-requirements.md
    baseline_file: baselines/missing-subnet-requirements.md
    expected_verdict: PREREQUISITES_MISSING
