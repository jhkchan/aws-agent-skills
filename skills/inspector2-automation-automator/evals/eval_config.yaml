# Eval configuration for inspector2-automation-automator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: inspector2-automation-automator
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: ec2-critical-auto-patch
    difficulty: easy
    prompt_file: prompts/ec2-critical-auto-patch.md
    baseline_file: baselines/ec2-critical-auto-patch.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: ecr-image-scan-rebuild
    difficulty: medium
    prompt_file: prompts/ecr-image-scan-rebuild.md
    baseline_file: baselines/ecr-image-scan-rebuild.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: lambda-finding-notify
    difficulty: medium
    prompt_file: prompts/lambda-finding-notify.md
    baseline_file: baselines/lambda-finding-notify.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: delegated-admin-multiaccount
    difficulty: hard
    prompt_file: prompts/delegated-admin-multiaccount.md
    baseline_file: baselines/delegated-admin-multiaccount.md
    expected_verdict: REVIEW_REQUIRED
  - id: finding-suppression-accepted-risk
    difficulty: hard
    prompt_file: prompts/finding-suppression-accepted-risk.md
    baseline_file: baselines/finding-suppression-accepted-risk.md
    expected_verdict: AUTOMATION_DEPLOYED
