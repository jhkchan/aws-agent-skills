# Eval configuration for incident-response-automator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: incident-response-automator
snapshot_date: "2026-08-07"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: guardduty-ec2-quarantine
    difficulty: easy
    prompt_file: prompts/guardduty-ec2-quarantine.md
    baseline_file: baselines/guardduty-ec2-quarantine.md
    expected_verdict: AUTOMATED
  - id: iam-key-revocation-workflow
    difficulty: medium
    prompt_file: prompts/iam-key-revocation-workflow.md
    baseline_file: baselines/iam-key-revocation-workflow.md
    expected_verdict: AUTOMATED
  - id: stepfunctions-full-playbook
    difficulty: hard
    prompt_file: prompts/stepfunctions-full-playbook.md
    baseline_file: baselines/stepfunctions-full-playbook.md
    expected_verdict: AUTOMATED
  - id: missing-kill-switch
    difficulty: hard
    prompt_file: prompts/missing-kill-switch.md
    baseline_file: baselines/missing-kill-switch.md
    expected_verdict: MANUAL_STEP_REQUIRED
  - id: eventbridge-pattern-gap
    difficulty: medium
    prompt_file: prompts/eventbridge-pattern-gap.md
    baseline_file: baselines/eventbridge-pattern-gap.md
    expected_verdict: MANUAL_STEP_REQUIRED
