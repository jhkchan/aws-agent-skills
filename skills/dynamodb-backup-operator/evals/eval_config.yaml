# Eval configuration for dynamodb-backup-operator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: dynamodb-backup-operator
snapshot_date: "2026-08-09"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: pitr-restore-pitr-disabled
    difficulty: hard
    prompt_file: prompts/pitr-restore-pitr-disabled.md
    baseline_file: baselines/pitr-restore-pitr-disabled.md
    expected_verdict: BLOCKED
    expected_risk: HIGH
  - id: pitr-restore-in-window
    difficulty: medium
    prompt_file: prompts/pitr-restore-in-window.md
    baseline_file: baselines/pitr-restore-in-window.md
    expected_verdict: READY
    expected_risk: MODERATE
  - id: snapshot-restore-backup-creating
    difficulty: medium
    prompt_file: prompts/snapshot-restore-backup-creating.md
    baseline_file: baselines/snapshot-restore-backup-creating.md
    expected_verdict: BLOCKED
    expected_risk: HIGH
  - id: on-demand-backup-create-ready
    difficulty: easy
    prompt_file: prompts/on-demand-backup-create-ready.md
    baseline_file: baselines/on-demand-backup-create-ready.md
    expected_verdict: READY
    expected_risk: LOW
  - id: snapshot-restore-verified-completed
    difficulty: easy
    prompt_file: prompts/snapshot-restore-verified-completed.md
    baseline_file: baselines/snapshot-restore-verified-completed.md
    expected_verdict: COMPLETED
    expected_risk: LOW
