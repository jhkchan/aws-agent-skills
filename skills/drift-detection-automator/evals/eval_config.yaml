# Eval configuration for drift-detection-automator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: drift-detection-automator
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: staging-daily-drift-auto-remediate
    difficulty: medium
    prompt_file: prompts/staging-daily-drift-auto-remediate.md
    baseline_file: baselines/staging-daily-drift-auto-remediate.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: prod-drift-notify-only
    difficulty: hard
    prompt_file: prompts/prod-drift-notify-only.md
    baseline_file: baselines/prod-drift-notify-only.md
    expected_verdict: REVIEW_REQUIRED
  - id: multi-account-stackset-drift
    difficulty: hard
    prompt_file: prompts/multi-account-stackset-drift.md
    baseline_file: baselines/multi-account-stackset-drift.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: terraform-plan-drift-check
    difficulty: medium
    prompt_file: prompts/terraform-plan-drift-check.md
    baseline_file: baselines/terraform-plan-drift-check.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: drift-suppression-asg-capacity
    difficulty: medium
    prompt_file: prompts/drift-suppression-asg-capacity.md
    baseline_file: baselines/drift-suppression-asg-capacity.md
    expected_verdict: AUTOMATION_DEPLOYED
