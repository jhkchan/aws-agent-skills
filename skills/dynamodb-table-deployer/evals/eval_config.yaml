# Eval configuration for dynamodb-table-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: dynamodb-table-deployer
snapshot_date: "2026-08-07"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: high-throughput-session-store
    difficulty: hard
    prompt_file: prompts/high-throughput-session-store.md
    baseline_file: baselines/high-throughput-session-store.md
    expected_verdict: READY_TO_DEPLOY

  - id: compliance-audit-log-table
    difficulty: medium
    prompt_file: prompts/compliance-audit-log-table.md
    baseline_file: baselines/compliance-audit-log-table.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-cmk-and-key-schema
    difficulty: easy
    prompt_file: prompts/missing-cmk-and-key-schema.md
    baseline_file: baselines/missing-cmk-and-key-schema.md
    expected_verdict: PREREQUISITES_MISSING

  - id: ad-tech-event-ingest
    difficulty: hard
    prompt_file: prompts/ad-tech-event-ingest.md
    baseline_file: baselines/ad-tech-event-ingest.md
    expected_verdict: READY_TO_DEPLOY

  - id: cost-optimized-ia-table
    difficulty: medium
    prompt_file: prompts/cost-optimized-ia-table.md
    baseline_file: baselines/cost-optimized-ia-table.md
    expected_verdict: READY_TO_DEPLOY
