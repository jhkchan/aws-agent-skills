# Eval configuration for service-catalog-portfolio-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: service-catalog-portfolio-deployer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: s3-product-local-account-with-constraints
    difficulty: hard
    prompt_file: prompts/s3-product-local-account-with-constraints.md
    baseline_file: baselines/s3-product-local-account-with-constraints.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-launch-role-rejected
    difficulty: hard
    prompt_file: prompts/missing-launch-role-rejected.md
    baseline_file: baselines/missing-launch-role-rejected.md
    expected_verdict: PREREQUISITES_MISSING

  - id: ou-share-with-delegated-admin
    difficulty: hard
    prompt_file: prompts/ou-share-with-delegated-admin.md
    baseline_file: baselines/ou-share-with-delegated-admin.md
    expected_verdict: READY_TO_DEPLOY

  - id: cross-region-share-visibility-check
    difficulty: hard
    prompt_file: prompts/cross-region-share-visibility-check.md
    baseline_file: baselines/cross-region-share-visibility-check.md
    expected_verdict: READY_TO_DEPLOY

  - id: terraform-open-source-product
    difficulty: hard
    prompt_file: prompts/terraform-open-source-product.md
    baseline_file: baselines/terraform-open-source-product.md
    expected_verdict: READY_TO_DEPLOY
