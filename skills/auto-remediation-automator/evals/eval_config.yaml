# Eval configuration for auto-remediation-automator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: auto-remediation-automator
snapshot_date: "2026-08-07"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: s3-public-access-auto
    difficulty: easy
    prompt_file: prompts/s3-public-access-auto.md
    baseline_file: baselines/s3-public-access-auto.md
    expected_verdict: AUTOMATED
  - id: iam-unused-key-revoke
    difficulty: medium
    prompt_file: prompts/iam-unused-key-revoke.md
    baseline_file: baselines/iam-unused-key-revoke.md
    expected_verdict: AUTOMATED
  - id: manual-gap-custom-resource
    difficulty: medium
    prompt_file: prompts/manual-gap-custom-resource.md
    baseline_file: baselines/manual-gap-custom-resource.md
    expected_verdict: MANUAL_STEP_REQUIRED
  - id: safety-destructive-blocked
    difficulty: hard
    prompt_file: prompts/safety-destructive-blocked.md
    baseline_file: baselines/safety-destructive-blocked.md
    expected_verdict: MANUAL_STEP_REQUIRED
  - id: conformance-pack-bulk
    difficulty: hard
    prompt_file: prompts/conformance-pack-bulk.md
    baseline_file: baselines/conformance-pack-bulk.md
    expected_verdict: AUTOMATED
