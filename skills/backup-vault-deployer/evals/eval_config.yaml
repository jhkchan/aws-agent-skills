# Eval configuration for backup-vault-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: backup-vault-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: compliance-vault-with-cross-region-dr
    difficulty: hard
    prompt_file: prompts/compliance-vault-with-cross-region-dr.md
    baseline_file: baselines/compliance-vault-with-cross-region-dr.md
    expected_verdict: READY_TO_DEPLOY

  - id: governance-vault-with-continuous-backup
    difficulty: hard
    prompt_file: prompts/governance-vault-with-continuous-backup.md
    baseline_file: baselines/governance-vault-with-continuous-backup.md
    expected_verdict: READY_TO_DEPLOY

  - id: lifecycle-outside-lock-window
    difficulty: easy
    prompt_file: prompts/lifecycle-outside-lock-window.md
    baseline_file: baselines/lifecycle-outside-lock-window.md
    expected_verdict: PREREQUISITES_MISSING

  - id: cross-account-missing-vault-policy
    difficulty: medium
    prompt_file: prompts/cross-account-missing-vault-policy.md
    baseline_file: baselines/cross-account-missing-vault-policy.md
    expected_verdict: PREREQUISITES_MISSING

  - id: kms-key-not-found
    difficulty: easy
    prompt_file: prompts/kms-key-not-found.md
    baseline_file: baselines/kms-key-not-found.md
    expected_verdict: PREREQUISITES_MISSING
