# Eval configuration for sagemaker-endpoint-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: sagemaker-endpoint-deployer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: real-time-endpoint-production
    difficulty: hard
    prompt_file: prompts/real-time-endpoint-production.md
    baseline_file: baselines/real-time-endpoint-production.md
    expected_verdict: READY_TO_DEPLOY

  - id: ab-testing-deployment
    difficulty: medium
    prompt_file: prompts/ab-testing-deployment.md
    baseline_file: baselines/ab-testing-deployment.md
    expected_verdict: READY_TO_DEPLOY

  - id: serverless-inference-intermittent
    difficulty: medium
    prompt_file: prompts/serverless-inference-intermittent.md
    baseline_file: baselines/serverless-inference-intermittent.md
    expected_verdict: READY_TO_DEPLOY

  - id: async-inference-large-model
    difficulty: hard
    prompt_file: prompts/async-inference-large-model.md
    baseline_file: baselines/async-inference-large-model.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-artifact-and-role
    difficulty: easy
    prompt_file: prompts/missing-artifact-and-role.md
    baseline_file: baselines/missing-artifact-and-role.md
    expected_verdict: PREREQUISITES_MISSING
