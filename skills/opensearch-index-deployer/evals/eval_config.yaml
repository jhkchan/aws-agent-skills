# Eval configuration for opensearch-index-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: opensearch-index-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: production-logs-ilm
    difficulty: hard
    prompt_file: prompts/production-logs-ilm.md
    baseline_file: baselines/production-logs-ilm.md
    expected_verdict: READY_TO_DEPLOY

  - id: knn-vector-search
    difficulty: hard
    prompt_file: prompts/knn-vector-search.md
    baseline_file: baselines/knn-vector-search.md
    expected_verdict: READY_TO_DEPLOY

  - id: alias-reindex-zero-downtime
    difficulty: medium
    prompt_file: prompts/alias-reindex-zero-downtime.md
    baseline_file: baselines/alias-reindex-zero-downtime.md
    expected_verdict: READY_TO_DEPLOY

  - id: data-stream-time-series
    difficulty: medium
    prompt_file: prompts/data-stream-time-series.md
    baseline_file: baselines/data-stream-time-series.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-domain-endpoint
    difficulty: easy
    prompt_file: prompts/missing-domain-endpoint.md
    baseline_file: baselines/missing-domain-endpoint.md
    expected_verdict: PREREQUISITES_MISSING
