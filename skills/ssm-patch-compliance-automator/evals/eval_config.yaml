# Eval configuration for ssm-patch-compliance-automator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: ssm-patch-compliance-automator
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: al2023-prod-auto-install
    difficulty: easy
    prompt_file: prompts/al2023-prod-auto-install.md
    baseline_file: baselines/al2023-prod-auto-install.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: win2022-nat-gap
    difficulty: medium
    prompt_file: prompts/win2022-nat-gap.md
    baseline_file: baselines/win2022-nat-gap.md
    expected_verdict: REVIEW_REQUIRED
  - id: tag-key-drift
    difficulty: medium
    prompt_file: prompts/tag-key-drift.md
    baseline_file: baselines/tag-key-drift.md
    expected_verdict: REVIEW_REQUIRED
  - id: stackset-multi-account
    difficulty: hard
    prompt_file: prompts/stackset-multi-account.md
    baseline_file: baselines/stackset-multi-account.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: critical-exception-list
    difficulty: hard
    prompt_file: prompts/critical-exception-list.md
    baseline_file: baselines/critical-exception-list.md
    expected_verdict: AUTOMATION_DEPLOYED
