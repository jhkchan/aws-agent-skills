# Eval configuration for cloudfront-distribution-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: cloudfront-distribution-deployer
snapshot_date: "2026-08-07"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: s3-oac-full-security
    difficulty: easy
    prompt_file: prompts/s3-oac-full-security.md
    baseline_file: baselines/s3-oac-full-security.md
    expected_verdict: READY_TO_DEPLOY
  - id: alb-custom-origin-deploy
    difficulty: medium
    prompt_file: prompts/alb-custom-origin-deploy.md
    baseline_file: baselines/alb-custom-origin-deploy.md
    expected_verdict: READY_TO_DEPLOY
  - id: acm-cert-wrong-region
    difficulty: medium
    prompt_file: prompts/acm-cert-wrong-region.md
    baseline_file: baselines/acm-cert-wrong-region.md
    expected_verdict: PREREQUISITES_MISSING
  - id: origin-group-failover
    difficulty: hard
    prompt_file: prompts/origin-group-failover.md
    baseline_file: baselines/origin-group-failover.md
    expected_verdict: READY_TO_DEPLOY
  - id: missing-required-fields
    difficulty: easy
    prompt_file: prompts/missing-required-fields.md
    baseline_file: baselines/missing-required-fields.md
    expected_verdict: PREREQUISITES_MISSING
