# Eval configuration for acm-certificate-monitor-operator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: acm-certificate-monitor-operator
snapshot_date: "2026-08-12"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: standard-expiry-monitoring
    difficulty: medium
    prompt_file: prompts/standard-expiry-monitoring.md
    baseline_file: baselines/standard-expiry-monitoring.md
    expected_verdict: OPERATION_COMPLETED

  - id: critical-expiry-escalation
    difficulty: hard
    prompt_file: prompts/critical-expiry-escalation.md
    baseline_file: baselines/critical-expiry-escalation.md
    expected_verdict: OPERATION_COMPLETED

  - id: multi-region-inventory
    difficulty: medium
    prompt_file: prompts/multi-region-inventory.md
    baseline_file: baselines/multi-region-inventory.md
    expected_verdict: OPERATION_COMPLETED

  - id: caa-record-conflict
    difficulty: hard
    prompt_file: prompts/caa-record-conflict.md
    baseline_file: baselines/caa-record-conflict.md
    expected_verdict: REVIEW_REQUIRED

  - id: multi-account-org-audit
    difficulty: hard
    prompt_file: prompts/multi-account-org-audit.md
    baseline_file: baselines/multi-account-org-audit.md
    expected_verdict: OPERATION_COMPLETED
