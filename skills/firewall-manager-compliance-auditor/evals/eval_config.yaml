# Eval configuration for firewall-manager-compliance-auditor.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: firewall-manager-compliance-auditor
snapshot_date: "2026-08-05"
baseline_model: amazon.nova-pro-v1:0
judge_model: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: policy-not-ready
    difficulty: easy
    prompt_file: prompts/policy-not-ready.md
    baseline_file: baselines/policy-not-ready.md
    expected_verdict: CONFIG_GAP
    expected_risk: CONFIG_GAP
  - id: waf-noncompliant-remediation
    difficulty: medium
    prompt_file: prompts/waf-noncompliant-remediation.md
    baseline_file: baselines/waf-noncompliant-remediation.md
    expected_verdict: NONCOMPLIANT
    expected_risk: NONCOMPLIANT
  - id: shield-tag-scope-incomplete
    difficulty: hard
    prompt_file: prompts/shield-tag-scope-incomplete.md
    baseline_file: baselines/shield-tag-scope-incomplete.md
    expected_verdict: INCOMPLETE_COVERAGE
    expected_risk: INCOMPLETE_COVERAGE
  - id: remediation-disabled-config-gap
    difficulty: medium
    prompt_file: prompts/remediation-disabled-config-gap.md
    baseline_file: baselines/remediation-disabled-config-gap.md
    expected_verdict: CONFIG_GAP
    expected_risk: CONFIG_GAP
  - id: sg-common-full-coverage-ok
    difficulty: easy
    prompt_file: prompts/sg-common-full-coverage-ok.md
    baseline_file: baselines/sg-common-full-coverage-ok.md
    expected_verdict: OK
    expected_risk: OK
  - id: waf-legacy-policy-type
    difficulty: hard
    prompt_file: prompts/waf-legacy-policy-type.md
    baseline_file: baselines/waf-legacy-policy-type.md
    expected_verdict: CONFIG_GAP
    expected_risk: CONFIG_GAP
