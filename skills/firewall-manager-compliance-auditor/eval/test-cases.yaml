# Eval test cases for firewall-manager-compliance-auditor
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Each case embeds its identifier in the policy id so the model output can
# be asserted for self-attribution. The CONCEPT tokens used in must_contain
# are verdict strings (NONCOMPLIANT, INCOMPLETE_COVERAGE, CONFIG_GAP, OK) and
# structural field names (VERDICT, REASON, FINDINGS, REMEDIATION), never
# test-case identifiers or raw API field names.
skill: firewall-manager-compliance-auditor
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: policy-not-ready
    description: >-
      WAFV2 FMS policy stuck in PolicyState NOT_READY. The policy exists but
      does not enforce — a silent lifecycle trap. Expected verdict CONFIG_GAP.
    input: |
      Audit the following AWS Firewall Manager policy for compliance posture.
      Emit the standard VERDICT block (POLICY, POLICY_NAME, POLICY_TYPE,
      VERDICT, REASON, FINDINGS, REMEDIATION).

      Policy id: policy-not-ready
      Policy metadata:
        PolicyName: edge-waf-staging
        PolicyType: WAFV2
        PolicyState: NOT_READY
        RemediationEnabled: true
        DeleteUnusedFMSPolicies: false
        ResourceTypeLists:
          - AwsWafv2WebAcl
          - AwsApiGatewayStage
          - AwsElasticLoadBalancingV2LoadBalancer
          - CloudFrontDistribution
        ResourceTags: []
        IncludeMap:
          ORG_UNIT:
            - ou-abcd-12345678
        ExcludeMap: {}
      Protection status:
        ProtectedResourceCount: 0
        NonCompliantResourceCount: 0
      FMS admin scope: Org root (delegated administrator configured).
    expected_verdict: CONFIG_GAP
    assertions:
      must_contain:
        - "CONFIG_GAP"
        - "policy-not-ready"
        - "VERDICT"
        - "REASON"
        - "FINDINGS"
        - "REMEDIATION"
        - "NOT_READY"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: NONCOMPLIANT"
        - "VERDICT: INCOMPLETE_COVERAGE"

  - id: waf-noncompliant-remediation
    description: >-
      WAFV2 FMS policy READY with RemediationEnabled=true but 14 live
      non-compliant resources across three member accounts — the loudest
      NONCOMPLIANT signal.
    input: |
      Audit the following AWS Firewall Manager policy for compliance posture.
      Emit the standard VERDICT block (POLICY, POLICY_NAME, POLICY_TYPE,
      VERDICT, REASON, FINDINGS, REMEDIATION).

      Policy id: waf-noncompliant-remediation
      Policy metadata:
        PolicyName: prod-edge-waf
        PolicyType: WAFV2
        PolicyState: READY
        RemediationEnabled: true
        DeleteUnusedFMSPolicies: false
        ResourceTypeLists:
          - AwsWafv2WebAcl
          - AwsApiGatewayStage
          - AwsElasticLoadBalancingV2LoadBalancer
          - CloudFrontDistribution
        ResourceTags: []
        IncludeMap:
          ORG_UNIT:
            - ou-abcd-12345678
        ExcludeMap: {}
      Protection status:
        ProtectedResourceCount: 86
        NonCompliantResourceCount: 14
        PerAccountViolators:
          "111111111111": 4
          "222222222222": 8
          "333333333333": 2
      FMS admin scope: Org root (delegated administrator configured).
    expected_verdict: NONCOMPLIANT
    assertions:
      must_contain:
        - "NONCOMPLIANT"
        - "waf-noncompliant-remediation"
        - "VERDICT"
        - "REASON"
        - "FINDINGS"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: CONFIG_GAP"
        - "VERDICT: INCOMPLETE_COVERAGE"

  - id: shield-tag-scope-incomplete
    description: >-
      Shield Advanced FMS policy READY with RemediationEnabled=true and zero
      non-compliant resources, but scope is ResourceTags-only (env=prod) with
      no ResourceTypeLists — untagged resources are silently unprotected.
      Expected verdict INCOMPLETE_COVERAGE.
    input: |
      Audit the following AWS Firewall Manager policy for compliance posture.
      Emit the standard VERDICT block (POLICY, POLICY_NAME, POLICY_TYPE,
      VERDICT, REASON, FINDINGS, REMEDIATION).

      Policy id: shield-tag-scope-incomplete
      Policy metadata:
        PolicyName: prod-shield-advanced
        PolicyType: SHIELD_ADVANCED
        PolicyState: READY
        RemediationEnabled: true
        DeleteUnusedFMSPolicies: false
        ResourceTypeLists: []
        ResourceTags:
          - Key: env
            Value: prod
        IncludeMap:
          ACCOUNT:
            - "111111111111"
            - "222222222222"
        ExcludeMap: {}
      Protection status:
        ProtectedResourceCount: 4
        NonCompliantResourceCount: 0
      Context: A separate AWS Config inventory shows the two in-scope accounts
      collectively own 12 in-scope Shield-Advanced-eligible resources
      (Elastic IPs, ALBs, CloudFront distributions); only 4 carry the env=prod
      tag and are therefore reachable by this policy.
      FMS admin scope: Org root (delegated administrator configured).
    expected_verdict: INCOMPLETE_COVERAGE
    assertions:
      must_contain:
        - "INCOMPLETE_COVERAGE"
        - "shield-tag-scope-incomplete"
        - "VERDICT"
        - "REASON"
        - "FINDINGS"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: NONCOMPLIANT"
        - "VERDICT: CONFIG_GAP"

  - id: remediation-disabled-config-gap
    description: >-
      SECURITY_GROUPS_CONTENT_AUDIT FMS policy READY with RemediationEnabled
      false — detect-only posture. Even with zero violations, this is a
      configuration gap in steady state.
    input: |
      Audit the following AWS Firewall Manager policy for compliance posture.
      Emit the standard VERDICT block (POLICY, POLICY_NAME, POLICY_TYPE,
      VERDICT, REASON, FINDINGS, REMEDIATION).

      Policy id: remediation-disabled-config-gap
      Policy metadata:
        PolicyName: sg-content-audit-steady
        PolicyType: SECURITY_GROUPS_CONTENT_AUDIT
        PolicyState: READY
        RemediationEnabled: false
        DeleteUnusedFMSPolicies: false
        ResourceTypeLists:
          - AwsEc2Instance
          - AwsEc2NetworkInterface
        ResourceTags: []
        IncludeMap:
          ORG_UNIT:
            - ou-abcd-12345678
        ExcludeMap: {}
      Protection status:
        ProtectedResourceCount: 248
        NonCompliantResourceCount: 0
      Context: This policy was created 95 days ago and has remained in
      detect-only mode since onboarding. No transition to enforcement has
      been scheduled.
      FMS admin scope: Org root (delegated administrator configured).
    expected_verdict: CONFIG_GAP
    assertions:
      must_contain:
        - "CONFIG_GAP"
        - "remediation-disabled-config-gap"
        - "VERDICT"
        - "REASON"
        - "FINDINGS"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: NONCOMPLIANT"
        - "VERDICT: INCOMPLETE_COVERAGE"

  - id: sg-common-full-coverage-ok
    description: >-
      SECURITY_GROUPS_COMMON FMS policy READY, RemediationEnabled=true,
      org-wide IncludeMap, full critical-type ResourceTypeLists, zero
      non-compliant resources, healthy ProtectedResourceCount — clean posture.
    input: |
      Audit the following AWS Firewall Manager policy for compliance posture.
      Emit the standard VERDICT block (POLICY, POLICY_NAME, POLICY_TYPE,
      VERDICT, REASON, FINDINGS, REMEDIATION).

      Policy id: sg-common-full-coverage-ok
      Policy metadata:
        PolicyName: ec2-baseline-sg
        PolicyType: SECURITY_GROUPS_COMMON
        PolicyState: READY
        RemediationEnabled: true
        DeleteUnusedFMSPolicies: true
        ResourceTypeLists:
          - AwsEc2Instance
          - AwsEc2NetworkInterface
          - AwsElasticLoadBalancingV2LoadBalancer
          - AwsElasticLoadBalancingLoadBalancer
        ResourceTags: []
        IncludeMap:
          ORG_UNIT:
            - ou-root-orgwide
        ExcludeMap: {}
        ManagedApplicationRules:
          - baseline-sg-prod
      Protection status:
        ProtectedResourceCount: 612
        NonCompliantResourceCount: 0
      FMS admin scope: Org root (delegated administrator configured).
      Notification channel: SNS topic configured (fms-alerts).
    expected_verdict: OK
    assertions:
      must_contain:
        - "OK"
        - "sg-common-full-coverage-ok"
        - "VERDICT"
        - "REASON"
        - "FINDINGS"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: NONCOMPLIANT"
        - "VERDICT: CONFIG_GAP"
        - "VERDICT: INCOMPLETE_COVERAGE"

  - id: waf-legacy-policy-type
    description: >-
      FMS policy using PolicyType WAF (WAF Classic, legacy). Even with READY
      state and remediation enabled, the legacy PolicyType is a migration gap
      — AWS actively recommends WAFV2. Expected verdict CONFIG_GAP.
    input: |
      Audit the following AWS Firewall Manager policy for compliance posture.
      Emit the standard VERDICT block (POLICY, POLICY_NAME, POLICY_TYPE,
      VERDICT, REASON, FINDINGS, REMEDIATION).

      Policy id: waf-legacy-policy-type
      Policy metadata:
        PolicyName: classic-edge-waf
        PolicyType: WAF
        PolicyState: READY
        RemediationEnabled: true
        DeleteUnusedFMSPolicies: false
        ResourceTypeLists:
          - AwsWafRuleGroup
          - AwsWafWebAcl
        ResourceTags: []
        IncludeMap:
          ACCOUNT:
            - "111111111111"
        ExcludeMap: {}
      Protection status:
        ProtectedResourceCount: 18
        NonCompliantResourceCount: 0
      FMS admin scope: Org root (delegated administrator configured).
    expected_verdict: CONFIG_GAP
    assertions:
      must_contain:
        - "CONFIG_GAP"
        - "waf-legacy-policy-type"
        - "VERDICT"
        - "REASON"
        - "FINDINGS"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: NONCOMPLIANT"
        - "VERDICT: INCOMPLETE_COVERAGE"
