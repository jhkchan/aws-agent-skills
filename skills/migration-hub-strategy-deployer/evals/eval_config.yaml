# Eval configuration for migration-hub-strategy-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: migration-hub-strategy-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: full-portfolio-assessment
    difficulty: hard
    prompt_file: prompts/full-portfolio-assessment.md
    baseline_file: baselines/full-portfolio-assessment.md
    expected_verdict: READY_TO_DEPLOY
  - id: agentless-only-short-window
    difficulty: medium
    prompt_file: prompts/agentless-only-short-window.md
    baseline_file: baselines/agentless-only-short-window.md
    expected_verdict: PREREQUISITES_MISSING
  - id: eol-os-anti-pattern
    difficulty: hard
    prompt_file: prompts/eol-os-anti-pattern.md
    baseline_file: baselines/eol-os-anti-pattern.md
    expected_verdict: READY_TO_DEPLOY
  - id: database-replatform-dms
    difficulty: hard
    prompt_file: prompts/database-replatform-dms.md
    baseline_file: baselines/database-replatform-dms.md
    expected_verdict: READY_TO_DEPLOY
  - id: collector-network-blocker
    difficulty: medium
    prompt_file: prompts/collector-network-blocker.md
    baseline_file: baselines/collector-network-blocker.md
    expected_verdict: PREREQUISITES_MISSING
