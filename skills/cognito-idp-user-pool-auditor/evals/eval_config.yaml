# Eval configuration for cognito-idp-user-pool-auditor
# Maps each structured eval (in evals.json) to its external prompt and baseline
# files. The canonical eval surface is this evals/ directory; the legacy
# eval/test-cases.yaml is preserved as a compatibility shim for eval/run_eval.py
# (which discovers skills/*/eval/*.yaml).
#
# structured-eval pattern: eval_config.yaml provides the with-skill-vs-baseline comparison
# surface. Each eval has a prompt_file (the input the model receives) and a
# baseline_file (what a no-skill model produces — demonstrating skill value).

skill_name: cognito-idp-user-pool-auditor
snapshot_date: "2026-08-04"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

# Legacy compatibility: the eval/test-cases.yaml file is the discovery surface
# for eval/run_eval.py (skills/*/eval/*.yaml glob). This evals/ directory is the
# canonical structured eval surface (structured-eval pattern). Both surfaces contain the
# same 6 test cases with identical assertions.
legacy_spec: ../eval/test-cases.yaml

evals:
  - id: insecure-no-mfa-weak-password
    prompt_file: prompts/insecure-no-mfa-weak-password.md
    baseline_file: baselines/insecure-no-mfa-weak-password.md
    expected_verdict: INSECURE
    expected_risk: CRITICAL
    difficulty: easy

  - id: insecure-implicit-oauth
    prompt_file: prompts/insecure-implicit-oauth.md
    baseline_file: baselines/insecure-implicit-oauth.md
    expected_verdict: INSECURE
    expected_risk: CRITICAL
    difficulty: medium

  - id: weak-optional-mfa
    prompt_file: prompts/weak-optional-mfa.md
    baseline_file: baselines/weak-optional-mfa.md
    expected_verdict: WEAK
    expected_risk: HIGH
    difficulty: medium

  - id: weak-admin-auth-flow
    prompt_file: prompts/weak-admin-auth-flow.md
    baseline_file: baselines/weak-admin-auth-flow.md
    expected_verdict: WEAK
    expected_risk: HIGH
    difficulty: medium

  - id: adequate-enforced-mfa-minor-gaps
    prompt_file: prompts/adequate-enforced-mfa-minor-gaps.md
    baseline_file: baselines/adequate-enforced-mfa-minor-gaps.md
    expected_verdict: ADEQUATE
    expected_risk: MODERATE
    difficulty: hard

  - id: ok-hardened-pool
    prompt_file: prompts/ok-hardened-pool.md
    baseline_file: baselines/ok-hardened-pool.md
    expected_verdict: OK
    expected_risk: LOW
    difficulty: easy
