# Eval configuration for managed-blockchain-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: managed-blockchain-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: fabric-standard-network
    difficulty: hard
    prompt_file: prompts/fabric-standard-network.md
    baseline_file: baselines/fabric-standard-network.md
    expected_verdict: READY_TO_DEPLOY

  - id: fabric-chaincode-2x
    difficulty: hard
    prompt_file: prompts/fabric-chaincode-2x.md
    baseline_file: baselines/fabric-chaincode-2x.md
    expected_verdict: READY_TO_DEPLOY

  - id: ethereum-mainnet-node
    difficulty: medium
    prompt_file: prompts/ethereum-mainnet-node.md
    baseline_file: baselines/ethereum-mainnet-node.md
    expected_verdict: READY_TO_DEPLOY

  - id: query-token-balances
    difficulty: medium
    prompt_file: prompts/query-token-balances.md
    baseline_file: baselines/query-token-balances.md
    expected_verdict: READY_TO_DEPLOY

  - id: starter-edition-rejected
    difficulty: easy
    prompt_file: prompts/starter-edition-rejected.md
    baseline_file: baselines/starter-edition-rejected.md
    expected_verdict: PREREQUISITES_MISSING
