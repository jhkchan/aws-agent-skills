# Eval configuration for codepipeline-v2-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: codepipeline-v2-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: codecommit-codebuild-cloudformation
    difficulty: easy
    prompt_file: prompts/codecommit-codebuild-cloudformation.md
    baseline_file: baselines/codecommit-codebuild-cloudformation.md
    expected_verdict: READY_TO_DEPLOY
  - id: manual-approval-flow
    difficulty: medium
    prompt_file: prompts/manual-approval-flow.md
    baseline_file: baselines/manual-approval-flow.md
    expected_verdict: READY_TO_DEPLOY
  - id: cross-account-deployment
    difficulty: hard
    prompt_file: prompts/cross-account-deployment.md
    baseline_file: baselines/cross-account-deployment.md
    expected_verdict: READY_TO_DEPLOY
  - id: github-codeconnections-ecs
    difficulty: medium
    prompt_file: prompts/github-codeconnections-ecs.md
    baseline_file: baselines/github-codeconnections-ecs.md
    expected_verdict: READY_TO_DEPLOY
  - id: missing-source-config
    difficulty: easy
    prompt_file: prompts/missing-source-config.md
    baseline_file: baselines/missing-source-config.md
    expected_verdict: PREREQUISITES_MISSING
