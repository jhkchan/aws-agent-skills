# Eval test cases for iot-core-thing-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the READY_TO_DEPLOY /
# PREREQUISITES_MISSING classification across IoT Core topologies
# (thing with cert + policy + binding, topic rule with SQL and
# Timestream, device shadow with named shadows, Greengrass component
# deployment, missing certificate-to-thing binding prerequisite
# failure).
skill: iot-core-thing-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: full-thing-cert-policy-binding
    description: >-
      Provision an IoT thing with X.509 certificate, IoT policy for
      MQTT pub/sub, and both bindings (cert→thing and policy→cert).
      Expects READY_TO_DEPLOY with all bindings noted.
    input: |
      Create an IoT thing "sensor-001" in us-east-1 with X.509
      certificate. Create IoT policy "sensor-publish-policy" allowing
      connect with client ID sensor-*, publish to device/+/telemetry,
      and subscribe to device/+/commands. Attach the certificate to
      the thing and the policy to the certificate. Thing type:
      temperature-sensor. Thing group: factory-floor-sensors. Tags:
      Environment=production, DeviceType=sensor.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "sensor-001"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: topic-rule-sql-timestream
    description: >-
      Provision an IoT topic rule with SQL SELECT filtering temperature
      from device/+/telemetry and republishing to Timestream. Expects
      READY_TO_DEPLOY with SQL noted, IAM role cited, and actions listed.
    input: |
      Create an IoT topic rule "telemetry-to-timestream" in us-east-1.
      SQL: SELECT temperature, humidity, device_id FROM
      'device/+/telemetry' WHERE temperature > 30. Actions: write to
      Timestream database sensors table telemetry, and republish to
      device/alerts. IAM role:
      arn:aws:iam::123456789012:role/IoTTopicRuleRole. Error action:
      republish to device/errors. Tags: Environment=production.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "telemetry-to-timestream"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: device-shadow-named
    description: >-
      Provision an IoT thing with named device shadows for config and
      firmware state. Expects READY_TO_DEPLOY with named shadows noted
      and delta state mechanism described.
    input: |
      Create an IoT thing "actuator-001" in us-east-1 with X.509
      certificate and IoT policy for pub/sub. Configure named device
      shadows: "config" for configuration state and "firmware" for
      firmware version state. The device should receive delta
      notifications. Thing group: factory-actuators. Tags:
      Environment=production, DeviceType=actuator.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "actuator-001"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: greengrass-component-deployment
    description: >-
      Provision a Greengrass component deployment to a thing group.
      Expects READY_TO_DEPLOY with component noted, target cited, and
      deployment created.
    input: |
      Create a Greengrass V2 component deployment in us-east-1.
      Component: com.example.TelemetryAgent version 1.0.0. Deploy to
      thing group factory-edge-devices. Configuration: sampleRate=5s.
      Tags: Environment=production, EdgeCompute=greengrass.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "TelemetryAgent"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: missing-cert-thing-binding
    description: >-
      Operator creates a thing and certificate but does not attach the
      certificate to the thing. This is a prerequisite failure.
      Expects PREREQUISITES_MISSING with the binding gap cited.
    input: |
      Create an IoT thing "device-001" in us-east-1. I already have a
      certificate but haven't attached it to the thing. Create an IoT
      policy for connect and publish. Tags: Environment=dev.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "attach"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"
