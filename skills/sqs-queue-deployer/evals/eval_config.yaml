# Eval configuration for sqs-queue-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob).
skill_name: sqs-queue-deployer
snapshot_date: "2026-08-09"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: standard-queue-with-dlq
    difficulty: medium
    prompt_file: prompts/standard-queue-with-dlq.md
    baseline_file: baselines/standard-queue-with-dlq.md
    expected_verdict: READY_TO_DEPLOY

  - id: fifo-dlq-type-mismatch
    difficulty: hard
    prompt_file: prompts/fifo-dlq-type-mismatch.md
    baseline_file: baselines/fifo-dlq-type-mismatch.md
    expected_verdict: PREREQUISITES_MISSING

  - id: high-throughput-fifo
    difficulty: hard
    prompt_file: prompts/high-throughput-fifo.md
    baseline_file: baselines/high-throughput-fifo.md
    expected_verdict: READY_TO_DEPLOY

  - id: sse-kms-missing-key
    difficulty: medium
    prompt_file: prompts/sse-kms-missing-key.md
    baseline_file: baselines/sse-kms-missing-key.md
    expected_verdict: PREREQUISITES_MISSING

  - id: cross-account-sse-kms
    difficulty: hard
    prompt_file: prompts/cross-account-sse-kms.md
    baseline_file: baselines/cross-account-sse-kms.md
    expected_verdict: READY_TO_DEPLOY
