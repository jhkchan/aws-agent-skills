# Eval configuration for iam-role-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: iam-role-deployer
snapshot_date: "2026-08-07"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: lambda-service-role-scoped
    difficulty: easy
    prompt_file: prompts/lambda-service-role-scoped.md
    baseline_file: baselines/lambda-service-role-scoped.md
    expected_verdict: READY_TO_DEPLOY
  - id: cross-account-externalid-deploy-role
    difficulty: medium
    prompt_file: prompts/cross-account-externalid-deploy-role.md
    baseline_file: baselines/cross-account-externalid-deploy-role.md
    expected_verdict: READY_TO_DEPLOY
  - id: oidc-github-actions-role
    difficulty: hard
    prompt_file: prompts/oidc-github-actions-role.md
    baseline_file: baselines/oidc-github-actions-role.md
    expected_verdict: READY_TO_DEPLOY
  - id: wildcard-principal-trust-policy
    difficulty: hard
    prompt_file: prompts/wildcard-principal-trust-policy.md
    baseline_file: baselines/wildcard-principal-trust-policy.md
    expected_verdict: PREREQUISITES_MISSING
  - id: service-role-missing-sourcearn
    difficulty: medium
    prompt_file: prompts/service-role-missing-sourcearn.md
    baseline_file: baselines/service-role-missing-sourcearn.md
    expected_verdict: PREREQUISITES_MISSING
