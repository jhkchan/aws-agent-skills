# Eval configuration for s3-access-points-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: s3-access-points-deployer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: vpc-only-team-ap
    difficulty: hard
    prompt_file: prompts/vpc-only-team-ap.md
    baseline_file: baselines/vpc-only-team-ap.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-vpc-endpoint
    difficulty: medium
    prompt_file: prompts/missing-vpc-endpoint.md
    baseline_file: baselines/missing-vpc-endpoint.md
    expected_verdict: PREREQUISITES_MISSING

  - id: object-lambda-pii-redaction
    difficulty: hard
    prompt_file: prompts/object-lambda-pii-redaction.md
    baseline_file: baselines/object-lambda-pii-redaction.md
    expected_verdict: READY_TO_DEPLOY

  - id: mrap-two-region-active-active
    difficulty: hard
    prompt_file: prompts/mrap-two-region-active-active.md
    baseline_file: baselines/mrap-two-region-active-active.md
    expected_verdict: READY_TO_DEPLOY

  - id: cross-account-ap-delegation
    difficulty: hard
    prompt_file: prompts/cross-account-ap-delegation.md
    baseline_file: baselines/cross-account-ap-delegation.md
    expected_verdict: READY_TO_DEPLOY
