# Eval configuration for cost-anomaly-detection-automator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: cost-anomaly-detection-automator
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: service-monitor-auto
    difficulty: easy
    prompt_file: prompts/service-monitor-auto.md
    baseline_file: baselines/service-monitor-auto.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: severity-routing-lambda
    difficulty: medium
    prompt_file: prompts/severity-routing-lambda.md
    baseline_file: baselines/severity-routing-lambda.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: org-payer-coverage-gap
    difficulty: medium
    prompt_file: prompts/org-payer-coverage-gap.md
    baseline_file: baselines/org-payer-coverage-gap.md
    expected_verdict: REVIEW_REQUIRED
  - id: budgets-integration-hard-limit
    difficulty: hard
    prompt_file: prompts/budgets-integration-hard-limit.md
    baseline_file: baselines/budgets-integration-hard-limit.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: auto-remediation-prod-impact
    difficulty: hard
    prompt_file: prompts/auto-remediation-prod-impact.md
    baseline_file: baselines/auto-remediation-prod-impact.md
    expected_verdict: REVIEW_REQUIRED
