# Eval configuration for eventbridge-rule-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: eventbridge-rule-deployer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: guardduty-lambda-ready-to-deploy
    difficulty: easy
    prompt_file: prompts/guardduty-lambda-ready-to-deploy.md
    baseline_file: baselines/guardduty-lambda-ready-to-deploy.md
    expected_verdict: READY_TO_DEPLOY
  - id: scheduled-step-functions-deploy
    difficulty: medium
    prompt_file: prompts/scheduled-step-functions-deploy.md
    baseline_file: baselines/scheduled-step-functions-deploy.md
    expected_verdict: READY_TO_DEPLOY
  - id: dlq-missing-prerequisites
    difficulty: hard
    prompt_file: prompts/dlq-missing-prerequisites.md
    baseline_file: baselines/dlq-missing-prerequisites.md
    expected_verdict: PREREQUISITES_MISSING
  - id: cross-account-bus-policy-deploy
    difficulty: hard
    prompt_file: prompts/cross-account-bus-policy-deploy.md
    baseline_file: baselines/cross-account-bus-policy-deploy.md
    expected_verdict: READY_TO_DEPLOY
  - id: input-transformer-lambda-deploy
    difficulty: hard
    prompt_file: prompts/input-transformer-lambda-deploy.md
    baseline_file: baselines/input-transformer-lambda-deploy.md
    expected_verdict: READY_TO_DEPLOY
