# Eval test cases for eventbridge-rule-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
skill: eventbridge-rule-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: guardduty-lambda-ready-to-deploy
    description: >-
      Standard GuardDuty high-severity finding to Lambda deployment
      with all prerequisites (DLQ, idempotent consumer, invocation
      permission pre-verified). Skill should produce READY_TO_DEPLOY
      with the correct put-rule and put-targets CLI.
    input: |
      Design reference: guardduty-lambda-ready-to-deploy
      Account: 111111111111
      Region: us-east-1

      Source: AWS GuardDuty high-severity findings (severity >= 7)
      Desired action: invoke Lambda `isolate-instance` to move the
      implicated EC2 instance into an isolation security group.
      The Lambda is idempotent (dedupes on finding-id) and tested.
      DLQ: arn:aws:sqs:us-east-1:111111111111:eventbridge-guardduty-dlq
        (already created with 14-day retention).
      Lambda ARN: arn:aws:lambda:us-east-1:111111111111:function:isolate-instance
      Lambda invocation permission for events.amazonaws.com: already granted.

      Emit the standard PLAN block (RULE, TARGETS, RETRY, DLQ,
      INPUT_TRANSFORM, PREREQUISITES, VERDICT, GAP, TEMPLATE).
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "guardduty-lambda-ready-to-deploy"
        - "aws.guardduty"
        - "VERDICT"
        - "TEMPLATE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: scheduled-step-functions-deploy
    description: >-
      Nightly Step Functions state machine trigger via schedule rule.
      READY_TO_DEPLOY with correct cron syntax (? in DOM/DOW) and
      bounded retry for long-running workflows.
    input: |
      Design reference: scheduled-step-functions-deploy
      Account: 111111111111
      Region: us-east-1

      Schedule: nightly at 02:00 UTC
      Target: Step Functions state machine nightly-reconciliation
        ARN: arn:aws:states:us-east-1:111111111111:stateMachine:nightly-reconciliation
      DLQ: arn:aws:sqs:us-east-1:111111111111:eventbridge-nightly-recon-dlq
        (created with 14-day retention).
      Role trusts events.amazonaws.com.

      Emit the standard PLAN block.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "scheduled-step-functions-deploy"
        - "cron"
        - "VERDICT"
        - "TEMPLATE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: dlq-missing-prerequisites
    description: >-
      CodeBuild failure to Slack Lambda notification deployment where
      the target has no DLQ configured and default retry policy is
      too aggressive. Skill must classify PREREQUISITES_MISSING and
      cite the DLQ gap and idempotency gap.
    input: |
      Design reference: dlq-missing-prerequisites
      Account: 111111111111
      Region: us-east-1

      Source: AWS CodeBuild build state change (FAILED only)
      Desired action: invoke Lambda `notify-slack` to post to a Slack channel.
      The Lambda is NOT idempotent.
      DLQ: NONE (not yet created).
      Lambda ARN: arn:aws:lambda:us-east-1:111111111111:function:notify-slack
      Lambda invocation permission for events.amazonaws.com: granted.

      Emit the standard PLAN block. Identify the gaps.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "dlq-missing-prerequisites"
        - "VERDICT"
        - "DLQ"
        - "GAP"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"

  - id: cross-account-bus-policy-deploy
    description: >-
      Cross-account event routing from producer account 222222222222
      to consumer account 111111111111 custom bus. READY_TO_DEPLOY
      with put-permission on the receiving bus and producer-side
      PutEvents CLI template.
    input: |
      Design reference: cross-account-bus-policy-deploy
      Producer account: 222222222222
      Receiver account: 111111111111
      Region: us-east-1

      Source: my.app.order (custom application event)
      Receiver event bus: arn:aws:events:us-east-1:111111111111:event-bus/app-events
        (already created in receiver account).
      Receiver Lambda target: arn:aws:lambda:us-east-1:111111111111:function:process-order
        (idempotent on order_id; invocation permission granted).
      DLQ in receiver account: arn:aws:sqs:us-east-1:111111111111:eventbridge-order-dlq
        (created).

      Emit the standard PLAN block including the cross-account
      bus policy configuration.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "cross-account-bus-policy-deploy"
        - "put-permission"
        - "PutEvents"
        - "VERDICT"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: input-transformer-lambda-deploy
    description: >-
      S3 object-created event to Lambda with custom InputTransformer
      extracting bucket, key, and etag into a simplified payload.
      READY_TO_DEPLOY with the InputPathsMap and InputTemplate
      correctly wired.
    input: |
      Design reference: input-transformer-lambda-deploy
      Account: 111111111111
      Region: us-east-1

      Source: AWS S3 object-created events (uploads/ prefix only)
      Bucket: my-uploads-bucket
      Desired action: invoke Lambda `process-upload` with a simplified
      payload containing only bucket, key, and etag.
      The Lambda is idempotent on bucket+key+etag.
      DLQ: arn:aws:sqs:us-east-1:111111111111:eventbridge-upload-dlq (created).
      Lambda ARN: arn:aws:lambda:us-east-1:111111111111:function:process-upload
      Lambda invocation permission: granted.

      Emit the standard PLAN block including the InputTransformer
      configuration with InputPathsMap and InputTemplate.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "input-transformer-lambda-deploy"
        - "InputTransformer"
        - "InputPathsMap"
        - "InputTemplate"
        - "VERDICT"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"
