# Eval test cases for ce-cost-anomaly-auditor
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
skill: ce-cost-anomaly-auditor
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: no-cad-monitors-at-all
    description: >-
      Account with zero Cost Anomaly Detection monitors — no ML cost-spike
      detection. Any runaway resource or compromised credential goes
      undetected.
    input: |
      Account id: 111111111111 (label: no-cad-monitors-at-all)
      Cost Explorer: enabled
      Account spend profile: $12,000/month (EC2-dominant, steady-state)
      Cost Anomaly Detection monitors: [] (zero monitors)
      Cost Anomaly Detection subscriptions: [] (zero subscriptions)
      RI coverage (7-day avg): 78% (over $9,000 eligible EC2 spend)
      SP coverage (7-day avg): 65% (over $9,000 eligible EC2/Fargate spend)
      CUR v2 with IncludeResourceIDs: enabled (Athena-integrated)
      Free-tier: no (production account)
      Emit the standard VERDICT block (ACCOUNT, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: NO_ANOMALY_SUB
    assertions:
      must_contain:
        - "NO_ANOMALY_SUB"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
        - "zero"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: CONFIG_GAP"
        - "VERDICT: LOW_RI_COVERAGE"

  - id: monitors-no-subscriptions
    description: >-
      Account with two CAD monitors (one IMMEDIATE, one DAILY) but zero
      anomaly subscriptions — CAD detects anomalies but nobody receives
      notifications.
    input: |
      Account id: 111111111111 (label: monitors-no-subscriptions)
      Cost Explorer: enabled
      Account spend profile: $8,000/month (mixed EC2/Fargate)
      Cost Anomaly Detection monitors:
        - MonitorArn: arn:aws:ce::111111111111:anomalyMonitor/imm-prod
          MonitorName: imm-prod
          MonitorType: IMMEDIATE
        - MonitorArn: arn:aws:ce::111111111111:anomalyMonitor/daily-prod
          MonitorName: daily-prod
          MonitorType: DAILY
      Cost Anomaly Detection subscriptions: [] (zero subscriptions)
      RI coverage (7-day avg): 72% (over $6,000 eligible compute spend)
      SP coverage (7-day avg): 60% (over $6,000 eligible compute spend)
      CUR v2 with IncludeResourceIDs: enabled (Athena-integrated)
      Free-tier: no
      Emit the standard VERDICT block (ACCOUNT, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: NO_ANOMALY_SUB
    assertions:
      must_contain:
        - "NO_ANOMALY_SUB"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
        - "subscription"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: CONFIG_GAP"

  - id: low-ri-coverage-steady-state
    description: >-
      Account with $18,000/month eligible EC2 compute spend, 22% RI coverage
      and 12% SP coverage — significant on-demand leak on a steady-state
      fleet where a commitment would offset material spend.
    input: |
      Account id: 111111111111 (label: low-ri-coverage-steady-state)
      Cost Explorer: enabled
      Account spend profile: $20,000/month (steady-state EC2)
      Cost Anomaly Detection monitors:
        - MonitorArn: arn:aws:ce::111111111111:anomalyMonitor/org-imm
          MonitorName: org-imm
          MonitorType: IMMEDIATE
      Cost Anomaly Detection subscriptions:
        - SubscriptionArn: arn:aws:ce::111111111111:anomalySubscription/finops
          SubscriptionName: finops-alerts
          Threshold: 100.0
          Frequency: IMMEDIATE
          MonitorArn: arn:aws:ce::111111111111:anomalyMonitor/org-imm
          Subscribers: [{Address: finops@corp.com, Type: EMAIL}]
      RI coverage (7-day avg): 22% (over $18,000 eligible EC2 spend)
      SP coverage (7-day avg): 12% (over $18,000 eligible EC2 spend)
      CUR v2 with IncludeResourceIDs: enabled (Athena-integrated)
      Free-tier: no
      Emit the standard VERDICT block (ACCOUNT, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: LOW_RI_COVERAGE
    assertions:
      must_contain:
        - "LOW_RI_COVERAGE"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
        - "22%"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: CONFIG_GAP"
        - "VERDICT: NO_ANOMALY_SUB"

  - id: immediate-monitor-weekly-subscription
    description: >-
      IMMEDIATE monitor paired with a WEEKLY subscription and the $100
      default threshold on a $20,000/month account — detection is fast but
      notification latency is 7 days, and the threshold is miscalibrated.
      Coverage is healthy so the verdict is CONFIG_GAP not LOW_RI_COVERAGE.
    input: |
      Account id: 111111111111 (label: immediate-monitor-weekly-subscription)
      Cost Explorer: enabled
      Account spend profile: $20,000/month (steady-state EC2/Fargate)
      Cost Anomaly Detection monitors:
        - MonitorArn: arn:aws:ce::111111111111:anomalyMonitor/imm-prod
          MonitorName: imm-prod
          MonitorType: IMMEDIATE
      Cost Anomaly Detection subscriptions:
        - SubscriptionArn: arn:aws:ce::111111111111:anomalySubscription/weekly-digest
          SubscriptionName: weekly-digest
          Threshold: 100.0
          Frequency: WEEKLY
          MonitorArn: arn:aws:ce::111111111111:anomalyMonitor/imm-prod
          Subscribers: [{Address: finops@corp.com, Type: EMAIL}]
      RI coverage (7-day avg): 82% (over $16,000 eligible compute spend)
      SP coverage (7-day avg): 75% (over $16,000 eligible compute spend)
      CUR v2 with IncludeResourceIDs: enabled (Athena-integrated)
      Free-tier: no
      Emit the standard VERDICT block (ACCOUNT, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: CONFIG_GAP
    assertions:
      must_contain:
        - "CONFIG_GAP"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
        - "WEEKLY"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: NO_ANOMALY_SUB"

  - id: daily-only-no-cur
    description: >-
      Account with only DAILY monitors (no IMMEDIATE) on $8,000/month spend
      and no CUR v2 with resource IDs — idle-resource detection impossible
      via CE and sub-day runaway spikes invisible.
    input: |
      Account id: 111111111111 (label: daily-only-no-cur)
      Cost Explorer: enabled
      Account spend profile: $8,000/month (EC2-heavy)
      Cost Anomaly Detection monitors:
        - MonitorArn: arn:aws:ce::111111111111:anomalyMonitor/daily-all
          MonitorName: daily-all
          MonitorType: DAILY
      Cost Anomaly Detection subscriptions:
        - SubscriptionArn: arn:aws:ce::111111111111:anomalySubscription/daily-sub
          SubscriptionName: daily-sub
          Threshold: 50.0
          Frequency: DAILY
          MonitorArn: arn:aws:ce::111111111111:anomalyMonitor/daily-all
          Subscribers: [{Address: finops@corp.com, Type: EMAIL}]
      RI coverage (7-day avg): 68% (over $6,500 eligible EC2 spend)
      SP coverage (7-day avg): 55% (over $6,500 eligible compute spend)
      CUR v2 with IncludeResourceIDs: NOT configured (no resource-level cost data)
      Free-tier: no
      Emit the standard VERDICT block (ACCOUNT, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: CONFIG_GAP
    assertions:
      must_contain:
        - "CONFIG_GAP"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
        - "DAILY"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: NO_ANOMALY_SUB"

  - id: well-configured-production
    description: >-
      Well-configured production account: IMMEDIATE monitor with IMMEDIATE
      subscription, calibrated $500 threshold (5% of $10k/mo), 85% RI and
      80% SP coverage, CUR v2 with resource IDs enabled. All dimensions
      healthy.
    input: |
      Account id: 111111111111 (label: well-configured-production)
      Cost Explorer: enabled
      Account spend profile: $10,000/month (steady-state EC2/Fargate)
      Cost Anomaly Detection monitors:
        - MonitorArn: arn:aws:ce::111111111111:anomalyMonitor/imm-org
          MonitorName: imm-org
          MonitorType: IMMEDIATE
      Cost Anomaly Detection subscriptions:
        - SubscriptionArn: arn:aws:ce::111111111111:anomalySubscription/finops-imm
          SubscriptionName: finops-imm
          Threshold: 500.0
          Frequency: IMMEDIATE
          MonitorArn: arn:aws:ce::111111111111:anomalyMonitor/imm-org
          Subscribers: [{Address: finops@corp.com, Type: EMAIL}]
      RI coverage (7-day avg): 85% (over $8,000 eligible EC2 spend)
      SP coverage (7-day avg): 80% (over $8,000 eligible compute spend)
      CUR v2 with IncludeResourceIDs: enabled (Athena-integrated)
      Free-tier: no
      Emit the standard VERDICT block (ACCOUNT, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: OK
    assertions:
      must_contain:
        - "OK"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: NO_ANOMALY_SUB"
        - "VERDICT: LOW_RI_COVERAGE"
        - "VERDICT: CONFIG_GAP"
