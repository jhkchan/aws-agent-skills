# Eval test cases for kms-key-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the READY_TO_DEPLOY / PREREQUISITES_MISSING
# classification across workload types (data encryption, code signing,
# cross-account) and prerequisite failure branches (missing root break-glass,
# multi-Region without replica policy sync).
skill: kms-key-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: symmetric-data-encryption
    description: >-
      Provision a production symmetric AES-256 CMK for general data
      encryption (EBS, S3, Secrets Manager). Includes separated key
      administrators vs key users, root break-glass, annual automatic
      rotation, alias, deletion window of 30 days, and tags. Expects
      READY_TO_DEPLOY.
    input: |
      Provision a customer-managed KMS key for production data
      encryption in us-east-1. Alias: alias/payments-cmk. Workload:
      encrypt EBS volumes, S3 objects, and Secrets Manager secrets
      for the payments service. Key administrators: the kms-admin
      IAM role. Key users: the payments-svc IAM role. Enable annual
      automatic rotation. Deletion window: 30 days. Tags:
      Environment=production, Application=payments. Account:
      123456789012.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "alias/payments-cmk"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
        - "SYMMETRIC_DEFAULT"
        - "automatic rotation"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: missing-root-break-glass
    description: >-
      Provision a KMS key whose requested key policy omits the account
      root break-glass statement. Expects PREREQUISITES_MISSING —
      without root fallback, an accidental policy lockout is
      unrecoverable.
    input: |
      Provision a customer-managed KMS key in us-east-1. Alias:
      alias/audit-cmk. The intended key policy grants kms:Encrypt,
      kms:Decrypt, kms:GenerateDataKey*, and kms:* (admin) to the
      audit-team IAM role, but does NOT include the account root as
      a break-glass principal. Workload: encrypt audit logs in S3.
      Deletion window: 7 days. Account: 123456789012.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "alias/audit-cmk"
        - "VERDICT"
        - "CHECKLIST"
        - "break-glass"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"

  - id: rsa-code-signing
    description: >-
      Provision an RSA_4096 signing key for AWS Signer (code signing).
      Expects READY_TO_DEPLOY with SIGN_VERIFY usage and a note that
      asymmetric keys cannot auto-rotate.
    input: |
      Provision a customer-managed KMS key for code signing in
      us-east-1. Alias: alias/code-signing-cmk. The key will be used
      by AWS Signer to sign Lambda deployment packages. Key spec:
      RSA_4096. Key usage: SIGN_VERIFY. Key administrators: kms-admin
      role. Key users: the signer-service IAM role. Deletion window:
      30 days. Tags: Environment=production, Application=code-signing.
      Account: 123456789012.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "alias/code-signing-cmk"
        - "VERDICT"
        - "CHECKLIST"
        - "RSA_4096"
        - "SIGN_VERIFY"
        - "VERIFICATION_COMMANDS"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: multi-region-with-replicas
    description: >-
      Provision a multi-Region symmetric CMK with replicas in us-west-2
      and eu-west-1 for cross-Region disaster recovery. Expects
      READY_TO_DEPLOY with a note that multi-Region keys cannot
      auto-rotate and require manual rotation.
    input: |
      Provision a multi-Region customer-managed KMS key for
      cross-Region disaster recovery in us-east-1. Alias:
      alias/dr-cmk (primary). Replicate to us-west-2 and eu-west-1.
      Workload: encrypt DynamoDB global tables data. Key spec:
      SYMMETRIC_DEFAULT. Key administrators: kms-admin role. Key
      users: the dr-service IAM role (in each Region). Deletion
      window: 30 days. Tags: Environment=production,
      Application=dr. Account: 123456789012.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "alias/dr-cmk"
        - "VERDICT"
        - "CHECKLIST"
        - "multi-Region"
        - "us-west-2"
        - "eu-west-1"
        - "VERIFICATION_COMMANDS"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: hmac-jwt-signing
    description: >-
      Provision an HMAC_256 KMS key for JWT signing. Expects
      READY_TO_DEPLOY with GENERATE_VERIFY_MAC usage and a note that
      HMAC keys cannot auto-rotate (manual rotation required).
    input: |
      Provision a customer-managed KMS key for JWT signing in
      us-east-1. Alias: alias/jwt-signing-cmk. Workload: sign and
      verify JWTs issued by the auth service. Key spec: HMAC_256.
      Key usage: GENERATE_VERIFY_MAC. Key administrators: kms-admin
      role. Key users: the auth-svc IAM role. Deletion window: 30
      days. Tags: Environment=production, Application=auth. Account:
      123456789012.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "alias/jwt-signing-cmk"
        - "VERDICT"
        - "CHECKLIST"
        - "HMAC_256"
        - "GENERATE_VERIFY_MAC"
        - "VERIFICATION_COMMANDS"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"
