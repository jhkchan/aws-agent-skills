# Eval configuration for cloudtrail-org-trail-auditor.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: cloudtrail-org-trail-auditor
snapshot_date: "2026-08-05"
baseline_model: amazon.nova-pro-v1:0
judge_model: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: org-trail-ok
    difficulty: easy
    prompt_file: prompts/org-trail-ok.md
    baseline_file: baselines/org-trail-ok.md
    expected_verdict: OK
  - id: no-org-trail
    difficulty: easy
    prompt_file: prompts/no-org-trail.md
    baseline_file: baselines/no-org-trail.md
    expected_verdict: NO_ORG_TRAIL
  - id: org-trail-no-encryption
    difficulty: medium
    prompt_file: prompts/org-trail-no-encryption.md
    baseline_file: baselines/org-trail-no-encryption.md
    expected_verdict: NO_ENCRYPTION
  - id: org-trail-no-validation
    difficulty: medium
    prompt_file: prompts/org-trail-no-validation.md
    baseline_file: baselines/org-trail-no-validation.md
    expected_verdict: NO_VALIDATION
  - id: org-trail-no-insights
    difficulty: hard
    prompt_file: prompts/org-trail-no-insights.md
    baseline_file: baselines/org-trail-no-insights.md
    expected_verdict: NO_INSIGHTS
  - id: org-trail-config-gap
    difficulty: hard
    prompt_file: prompts/org-trail-config-gap.md
    baseline_file: baselines/org-trail-config-gap.md
    expected_verdict: CONFIG_GAP
