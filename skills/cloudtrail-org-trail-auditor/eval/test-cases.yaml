      VERDICT block (TRAIL, VERDICT, REASON, FINDINGS, REMEDIATION).

      Trail name: org-trail-no-validation
      Trail ARN: arn:aws:cloudtrail:us-east-1:111111111111:trail/org-trail-no-validation
      S3BucketName: org-trail-no-validation-logs-111111111111

      Trail configuration (describe-trails):
        IsOrganizationTrail: true
        IsMultiRegionTrail: true
        KmsKeyId: arn:aws:kms:us-east-1:111111111111:key/org-trail-no-validation-kms
        LogFileValidationEnabled: false
        IncludeGlobalServiceEvents: true
        CloudWatchLogsLogGroupArn: arn:aws:logs:us-east-1:111111111111:log-group:org-trail-no-validation-cw:*
        CloudWatchLogsRoleArn: arn:aws:iam::111111111111:role/CloudTrail-CW-no-validation

      Trail status (get-trail-status):
        IsLogging: true

      Insights selectors (get-insight-selectors):
        - InsightType: ApiCallRateInsight
        - InsightType: ApiErrorRateInsight

      CloudWatch Logs log-group retention: 365 days
    expected_verdict: NO_VALIDATION
    assertions:
      must_contain:
        - "NO_VALIDATION"
        - "org-trail-no-validation"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"

  - id: org-trail-no-insights
    description: >-
      Organization trail with KMS encryption and log file validation enabled,
      but no CloudTrail Insights selectors configured — no anomaly detection
      on API call volume or error rates.
    input: |
      Audit the following CloudTrail trail configuration. Emit the standard
      VERDICT block (TRAIL, VERDICT, REASON, FINDINGS, REMEDIATION).

      Trail name: org-trail-no-insights
      Trail ARN: arn:aws:cloudtrail:us-east-1:111111111111:trail/org-trail-no-insights
      S3BucketName: org-trail-no-insights-logs-111111111111

      Trail configuration (describe-trails):
        IsOrganizationTrail: true
        IsMultiRegionTrail: true
        KmsKeyId: arn:aws:kms:us-east-1:111111111111:key/org-trail-no-insights-kms
        LogFileValidationEnabled: true
        IncludeGlobalServiceEvents: true
        CloudWatchLogsLogGroupArn: arn:aws:logs:us-east-1:111111111111:log-group:org-trail-no-insights-cw:*
        CloudWatchLogsRoleArn: arn:aws:iam::111111111111:role/CloudTrail-CW-no-insights

      Trail status (get-trail-status):
        IsLogging: true

      Insights selectors (get-insight-selectors):
        (empty — no selectors configured)

      CloudWatch Logs log-group retention: 365 days
    expected_verdict: NO_INSIGHTS
    assertions:
      must_contain:
        - "NO_INSIGHTS"
        - "org-trail-no-insights"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"

  - id: org-trail-config-gap
    description: >-
      Organization trail with KMS encryption, validation, and Insights, but
      single-region only, no CloudWatch Logs delivery, global service events
      disabled, and no CloudWatch Logs retention — multiple config gaps.
    input: |
      Audit the following CloudTrail trail configuration. Emit the standard
      VERDICT block (TRAIL, VERDICT, REASON, FINDINGS, REMEDIATION).

      Trail name: org-trail-config-gap
      Trail ARN: arn:aws:cloudtrail:us-east-1:111111111111:trail/org-trail-config-gap
      S3BucketName: org-trail-config-gap-logs-111111111111

      Trail configuration (describe-trails):
        IsOrganizationTrail: true
        IsMultiRegionTrail: false
        KmsKeyId: arn:aws:kms:us-east-1:111111111111:key/org-trail-config-gap-kms
        LogFileValidationEnabled: true
        IncludeGlobalServiceEvents: false
        CloudWatchLogsLogGroupArn: null
        CloudWatchLogsRoleArn: null

      Trail status (get-trail-status):
        IsLogging: true

      Insights selectors (get-insight-selectors):
        - InsightType: ApiCallRateInsight
        - InsightType: ApiErrorRateInsight

      CloudWatch Logs log-group retention: N/A (no log group configured)
    expected_verdict: CONFIG_GAP
    assertions:
      must_contain:
        - "CONFIG_GAP"
        - "org-trail-config-gap"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
