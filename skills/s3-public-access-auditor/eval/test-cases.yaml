# Eval test cases for s3-public-access-auditor
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-bucket proven set from Phase 1 first-person eval (eval-results.md):
# exercises every branch of the classification logic.
# Expected verdicts: SAFE, PUBLIC, PUBLIC, AMBIGUOUS, SAFE.
skill: s3-public-access-auditor
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: app-data-prod
    description: >-
      Production data bucket with BPA fully enabled and an HTTPS-enforce deny
      policy — SAFE regardless of policy (BPA wins).
    input: |
      Bucket: app-data-prod
      Block Public Access (account + bucket level):
        BlockPublicAcls: True
        IgnorePublicAcls: True
        BlockPublicPolicy: True
        RestrictPublicBuckets: True
      ACL: private
      Bucket Policy:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - "arn:aws:s3:::app-data-prod"
              - "arn:aws:s3:::app-data-prod/*"
            Condition:
              Bool:
                aws:SecureTransport: false
    expected_verdict: SAFE
    assertions:
      must_contain:
        - "SAFE"
        - "app-data-prod"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PUBLIC"
        - "VERDICT: AMBIGUOUS"

  - id: public-assets-cdn
    description: >-
      CDN bucket with BPA disabled and a wildcard s3:GetObject policy with no
      condition — PUBLIC via unrestricted policy.
    input: |
      Bucket: public-assets-cdn
      Block Public Access (account + bucket level):
        BlockPublicAcls: False
        IgnorePublicAcls: False
        BlockPublicPolicy: False
        RestrictPublicBuckets: False
      ACL: private
      Bucket Policy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: "arn:aws:s3:::public-assets-cdn/*"
    expected_verdict: PUBLIC
    assertions:
      must_contain:
        - "PUBLIC"
        - "public-assets-cdn"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: SAFE"
        - "VERDICT: AMBIGUOUS"

  - id: logs-archive-2024
    description: >-
      Log archive bucket with BPA disabled and an ACL granting READ to AllUsers
      — PUBLIC via ACL leak.
    input: |
      Bucket: logs-archive-2024
      Block Public Access (account + bucket level):
        BlockPublicAcls: False
        IgnorePublicAcls: False
        BlockPublicPolicy: False
        RestrictPublicBuckets: False
      ACL: READ granted to http://acs.amazonaws.com/groups/global/AllUsers
      Bucket Policy: (none)
    expected_verdict: PUBLIC
    assertions:
      must_contain:
        - "PUBLIC"
        - "logs-archive-2024"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: SAFE"
        - "VERDICT: AMBIGUOUS"

  - id: internal-reports-finance
    description: >-
      Finance bucket with BPA disabled but a wildcard policy restricted by a
      VPCe condition — AMBIGUOUS (restricted access but BPA off = fragile).
    input: |
      Bucket: internal-reports-finance
      Block Public Access (account + bucket level):
        BlockPublicAcls: False
        IgnorePublicAcls: False
        BlockPublicPolicy: False
        RestrictPublicBuckets: False
      ACL: private
      Bucket Policy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: "arn:aws:s3:::internal-reports-finance/*"
            Condition:
              StringEquals:
                aws:sourceVpce: "vpce-1a2b3c4d5e6f7g8h9"
    expected_verdict: AMBIGUOUS
    assertions:
      must_contain:
        - "AMBIGUOUS"
        - "internal-reports-finance"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: SAFE"
        - "VERDICT: PUBLIC"

  - id: backup-exports
    description: >-
      Backup bucket with BPA fully enabled and no policy or ACL issues — SAFE.
    input: |
      Bucket: backup-exports
      Block Public Access (account + bucket level):
        BlockPublicAcls: True
        IgnorePublicAcls: True
        BlockPublicPolicy: True
        RestrictPublicBuckets: True
      ACL: private
      Bucket Policy: (none)
    expected_verdict: SAFE
    assertions:
      must_contain:
        - "SAFE"
        - "backup-exports"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PUBLIC"
        - "VERDICT: AMBIGUOUS"
