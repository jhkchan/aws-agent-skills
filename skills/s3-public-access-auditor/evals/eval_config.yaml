# Eval configuration for s3-public-access-auditor
# Maps each structured eval (in evals.json) to its external prompt and baseline
# files. The canonical eval surface is this evals/ directory; the legacy
# eval/test-cases.yaml is preserved as a compatibility shim for eval/run_eval.py
# (which discovers skills/*/eval/*.yaml).
#
# structured-eval pattern: eval_config.yaml provides the with-skill-vs-baseline comparison
# surface. Each eval has a prompt_file (the input the model receives) and a
# baseline_file (what a no-skill model produces — demonstrating skill value).

skill_name: s3-public-access-auditor
snapshot_date: "2026-08-04"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

# Legacy compatibility: the eval/test-cases.yaml file is the discovery surface
# for eval/run_eval.py (skills/*/eval/*.yaml glob). This evals/ directory is the
# canonical structured eval surface (structured-eval pattern). Both surfaces contain the
# same 5 test cases with identical assertions.
legacy_spec: ../eval/test-cases.yaml

evals:
  - id: app-data-prod
    prompt_file: prompts/app-data-prod.md
    baseline_file: baselines/app-data-prod.md
    expected_verdict: SAFE
    difficulty: medium

  - id: public-assets-cdn
    prompt_file: prompts/public-assets-cdn.md
    baseline_file: baselines/public-assets-cdn.md
    expected_verdict: PUBLIC
    difficulty: medium

  - id: logs-archive-2024
    prompt_file: prompts/logs-archive-2024.md
    baseline_file: baselines/logs-archive-2024.md
    expected_verdict: PUBLIC
    difficulty: medium

  - id: internal-reports-finance
    prompt_file: prompts/internal-reports-finance.md
    baseline_file: baselines/internal-reports-finance.md
    expected_verdict: AMBIGUOUS
    difficulty: hard

  - id: backup-exports
    prompt_file: prompts/backup-exports.md
    baseline_file: baselines/backup-exports.md
    expected_verdict: SAFE
    difficulty: easy
