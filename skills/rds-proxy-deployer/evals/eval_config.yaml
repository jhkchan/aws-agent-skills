# Eval configuration for rds-proxy-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: rds-proxy-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: aurora-proxy-iam-auth-tls
    difficulty: hard
    prompt_file: prompts/aurora-proxy-iam-auth-tls.md
    baseline_file: baselines/aurora-proxy-iam-auth-tls.md
    expected_verdict: READY_TO_DEPLOY

  - id: serverless-v2-acu-sizing
    difficulty: medium
    prompt_file: prompts/serverless-v2-acu-sizing.md
    baseline_file: baselines/serverless-v2-acu-sizing.md
    expected_verdict: READY_TO_DEPLOY

  - id: multi-az-failover-security-groups
    difficulty: medium
    prompt_file: prompts/multi-az-failover-security-groups.md
    baseline_file: baselines/multi-az-failover-security-groups.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-secrets-manager-secret
    difficulty: easy
    prompt_file: prompts/missing-secrets-manager-secret.md
    baseline_file: baselines/missing-secrets-manager-secret.md
    expected_verdict: PREREQUISITES_MISSING

  - id: missing-subnet-group-multi-az
    difficulty: easy
    prompt_file: prompts/missing-subnet-group-multi-az.md
    baseline_file: baselines/missing-subnet-group-multi-az.md
    expected_verdict: PREREQUISITES_MISSING
