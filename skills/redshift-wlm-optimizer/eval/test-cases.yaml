# Eval test cases for redshift-wlm-optimizer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five deterministic cases — one per optimization pattern. Each case's
# ClusterIdentifier embeds the test-case id so the model naturally echoes
# it (avoids assertion-token mismatch). The decision framework in SKILL.md
# produces exactly the expected verdicts below.
skill: redshift-wlm-optimizer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: manual-to-auto-wlm-migration
    description: >-
      Redshift cluster running manual WLM with 3 static queues, SQA
      disabled, concurrency scaling disabled. Mixed workload of short
      dashboard lookups and long aggregate queries. WLMQueueLength p99
      = 22. Expected verdict: FURTHER_OPTIMIZATION_AVAILABLE with
      switch to auto WLM + concurrency scaling + SQA.
    input: |
      ClusterIdentifier: rs-manual-to-auto-wlm-migration
      NodeType: ra3.16xlarge
      NumberOfNodes: 4
      Region: us-east-1
      WLM mode: manual (3 static queues)
      Concurrency scaling: disabled
      SQA: disabled
      Query priority: all Normal

      Metrics (last 30 days):
        - CPUUtilization avg: 88%, p95: 97%
        - QueryDuration avg: 45 s, p95: 180 s
        - QueryThroughput avg: 12/s, peak: 18/s
        - WLMQueueLength avg: 4, p99: 22
        - ConcurrencyScalingClustersActive: 0

      Top queries (STL_QUERY, last 7 days):
        - Dashboard aggregate (4 joins, GROUP BY date): avg 35 s, 12B row scan
        - Single-row lookup by primary key: avg 200 ms
        - ETL MERGE into fact table: avg 120 s

      Materialized views: none
      QMR rules: none
      AQUA: disabled

      Workload context: mixed — dashboard lookups (short) competing with
      ETL aggregates (long) in the same queue. Customer-facing dashboards
      stall during evening peak when ETL runs.

      Emit the standard optimization block (TARGET, VERDICT, REASON,
      RECOMMENDATION, ESTIMATED_IMPACT, MIGRATION_STEPS).
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
    assertions:
      must_contain:
        - "FURTHER_OPTIMIZATION_AVAILABLE"
        - "manual-to-auto-wlm-migration"
        - "RECOMMENDATION"
        - "ESTIMATED_IMPACT"
        - "MIGRATION_STEPS"
        - "auto WLM"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OPTIMIZED"
        - "VERDICT: NEED_MORE_INFO"

  - id: short-query-acceleration-enablement
    description: >-
      Cluster with auto WLM and concurrency scaling enabled, but SQA
      disabled. Short lookup queries (200 ms) are stuck behind long
      aggregate queries in the queue. Expected verdict:
      FURTHER_OPTIMIZATION_AVAILABLE with SQA enablement.
    input: |
      ClusterIdentifier: rs-short-query-acceleration-enablement
      NodeType: ra3.4xlarge
      NumberOfNodes: 6
      Region: us-east-1
      WLM mode: auto
      Concurrency scaling: enabled (auto)
      SQA: disabled
      Query priority: all Normal

      Metrics (last 30 days):
        - CPUUtilization avg: 65%, p95: 78%
        - QueryDuration avg: 12 s, p95: 95 s
        - QueryThroughput avg: 25/s, peak: 35/s
        - WLMQueueLength avg: 2, p99: 8
        - ConcurrencyScalingClustersActive avg: 0.3

      Top queries (STL_QUERY, last 7 days):
        - Point lookup by primary key: avg 200 ms, p95 wait 45 s
        - Daily aggregate report: avg 90 s
        - Dashboard drill-down: avg 500 ms, p95 wait 60 s

      STL_QUERY_METRICS:
        - Short queries (< 1 s elapsed): 40% of total queries
        - Short queries queue_time p95: 45,000,000 µs (45 s)
        - Long queries (> 60 s elapsed): 15% of total

      Materialized views: none
      QMR rules: none
      AQUA: disabled

      Workload context: operational dashboard. Lookups are customer-
      facing and latency-sensitive. Aggregates run concurrently. SQA is
      the missing isolation layer.

      Emit the standard optimization block (TARGET, VERDICT, REASON,
      RECOMMENDATION, ESTIMATED_IMPACT, MIGRATION_STEPS).
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
    assertions:
      must_contain:
        - "FURTHER_OPTIMIZATION_AVAILABLE"
        - "short-query-acceleration-enablement"
        - "RECOMMENDATION"
        - "ESTIMATED_IMPACT"
        - "SQA"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OPTIMIZED"
        - "VERDICT: NEED_MORE_INFO"

  - id: materialized-view-for-dashboard
    description: >-
      Dashboard workload with repeated GROUP BY date queries scanning
      12B rows. No materialized views exist. Each query takes ~35 s.
      Expected verdict: FURTHER_OPTIMIZATION_AVAILABLE with materialized
      view creation recommendation.
    input: |
      ClusterIdentifier: rs-materialized-view-for-dashboard
      NodeType: ra3.16xlarge
      NumberOfNodes: 4
      Region: us-east-1
      WLM mode: auto
      Concurrency scaling: enabled (auto)
      SQA: enabled (max_execution_time: 120)
      Query priority: dashboard = Highest, ETL = Normal

      Metrics (last 30 days):
        - CPUUtilization avg: 75%, p95: 85%
        - QueryDuration avg: 28 s, p95: 120 s
        - QueryThroughput avg: 15/s
        - WLMQueueLength avg: 1, p99: 5
        - ConcurrencyScalingClustersActive avg: 0.2

      Top queries (SYS_QUERY_HISTORY, last 14 days):
        - Dashboard daily revenue (GROUP BY date, region): 500 executions/day, avg 35 s each
          Query hash: qh_a1b2c3d4, same SQL pattern, scans 12B rows
        - Dashboard weekly summary (GROUP BY week, product): 100/day, avg 45 s
        - ETL MERGE: 10/day, avg 90 s

      STL_QUERY_METRICS:
        - Dashboard daily revenue: scan_row_count = 12,000,000,000
        - Dashboard weekly summary: scan_row_count = 12,000,000,000

      Materialized views: none
      QMR rules: 2 rules (log action, query_execution_time > 300 s)
      AQUA: disabled

      Workload context: BI dashboard serving executive reports. Same
      aggregate queries run every few minutes. Base table (orders)
      updated hourly by ETL.

      Emit the standard optimization block (TARGET, VERDICT, REASON,
      RECOMMENDATION, ESTIMATED_IMPACT, MIGRATION_STEPS).
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
    assertions:
      must_contain:
        - "FURTHER_OPTIMIZATION_AVAILABLE"
        - "materialized-view-for-dashboard"
        - "RECOMMENDATION"
        - "ESTIMATED_IMPACT"
        - "materialized view"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OPTIMIZED"
        - "VERDICT: NEED_MORE_INFO"

  - id: query-monitoring-rule-setup
    description: >-
      Cluster with no QMR rules. Runaway analyst queries consuming 10x
      median CPU time, causing queue stalls for other workloads.
      Expected verdict: FURTHER_OPTIMIZATION_AVAILABLE with QMR rule
      setup.
    input: |
      ClusterIdentifier: rs-query-monitoring-rule-setup
      NodeType: ra3.4xlarge
      NumberOfNodes: 4
      Region: us-east-1
      WLM mode: auto
      Concurrency scaling: enabled (auto)
      SQA: enabled (max_execution_time: 120)
      Query priority: all Normal

      Metrics (last 30 days):
        - CPUUtilization avg: 82%, p95: 99%
        - QueryDuration avg: 35 s, p95: 240 s
        - QueryThroughput avg: 18/s
        - WLMQueueLength avg: 3, p99: 15

      Top queries (STL_QUERY, last 14 days):
        - Analyst ad-hoc cross-join without filter: avg 300 s, cpu_time 280,000,000,000 µs
        - Analyst full-table scan with SELECT *: avg 180 s, scan_row_count 50,000,000,000
        - Normal workload: avg 8 s, cpu_time 5,000,000,000 µs

      STL_QUERY_METRICS:
        - Median cpu_time: 5,000,000,000 µs (5,000 s CPU)
        - p99 cpu_time: 280,000,000,000 µs (56x median)
        - Median query_execution_time: 8,000,000 µs (8 s)
        - p99 query_execution_time: 300,000,000 µs (300 s, 37x median)

      Materialized views: 3 (dashboard aggregates, auto-refresh on)
      QMR rules: none
      AQUA: disabled

      Workload context: multi-tenant analytics cluster. Ad-hoc analysts
      occasionally submit runaway cross-join queries that monopolize
      cluster resources and stall production dashboard queries.

      Emit the standard optimization block (TARGET, VERDICT, REASON,
      RECOMMENDATION, ESTIMATED_IMPACT, MIGRATION_STEPS).
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
    assertions:
      must_contain:
        - "FURTHER_OPTIMIZATION_AVAILABLE"
        - "query-monitoring-rule-setup"
        - "RECOMMENDATION"
        - "ESTIMATED_IMPACT"
        - "query monitoring"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OPTIMIZED"
        - "VERDICT: NEED_MORE_INFO"

  - id: already-optimal-wlm-config
    description: >-
      Cluster with auto WLM, concurrency scaling enabled, SQA enabled,
      materialized views for dashboard aggregates, QMR rules with log
      action. All dimensions verified. Expected verdict: OPTIMIZED.
    input: |
      ClusterIdentifier: rs-already-optimal-wlm-config
      NodeType: ra3.16xlarge
      NumberOfNodes: 4
      Region: us-east-1
      WLM mode: auto
      Concurrency scaling: enabled (auto)
      SQA: enabled (max_execution_time: 120)
      Query priority: dashboard = Highest, ETL = Normal, ad-hoc = Low

      Metrics (last 30 days):
        - CPUUtilization avg: 55%, p95: 70%
        - QueryDuration avg: 2.5 s, p95: 8 s
        - QueryThroughput avg: 40/s, peak: 55/s
        - WLMQueueLength avg: 0, p99: 2
        - ConcurrencyScalingClustersActive avg: 0.1 (active < 10 min/day)

      Top queries (SYS_QUERY_HISTORY, last 14 days):
        - Dashboard daily revenue (MV hit): avg 300 ms, scans 50K rows from MV
        - Dashboard weekly summary (MV hit): avg 450 ms
        - ETL MERGE: avg 60 s

      STL_QUERY_METRICS:
        - Median cpu_time: 1,000,000,000 µs
        - p99 cpu_time: 15,000,000,000 µs (15x median, within QMR threshold)

      Materialized views: 4 (dashboard aggregates, auto-refresh on, last refresh < 10 min ago)
      QMR rules: 3 rules (action: log, thresholds at 10x median, no aborts triggered)
      AQUA: disabled (no LIKE/REGEXP workload pattern — correct skip)

      Workload context: well-managed analytics cluster serving executive
      dashboards and ETL. All WLM best practices already in place. No
      optimization dimension has a positive improvement.

      Emit the standard optimization block (TARGET, VERDICT, REASON,
      RECOMMENDATION, ESTIMATED_IMPACT, MIGRATION_STEPS).
    expected_verdict: OPTIMIZED
    assertions:
      must_contain:
        - "OPTIMIZED"
        - "already-optimal-wlm-config"
        - "REASON"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: FURTHER_OPTIMIZATION_AVAILABLE"
        - "VERDICT: NEED_MORE_INFO"
