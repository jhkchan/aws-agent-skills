# Eval configuration for ec2-instance-rightsizer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: ec2-instance-rightsizer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: idle-downsize
    difficulty: medium
    prompt_file: prompts/idle-downsize.md
    baseline_file: baselines/idle-downsize.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
  - id: graviton-migration
    difficulty: hard
    prompt_file: prompts/graviton-migration.md
    baseline_file: baselines/graviton-migration.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
  - id: burstable-credit-exhaustion
    difficulty: hard
    prompt_file: prompts/burstable-credit-exhaustion.md
    baseline_file: baselines/burstable-credit-exhaustion.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
  - id: already-optimized
    difficulty: easy
    prompt_file: prompts/already-optimized.md
    baseline_file: baselines/already-optimized.md
    expected_verdict: OPTIMIZED
  - id: memory-missing-blocked
    difficulty: medium
    prompt_file: prompts/memory-missing-blocked.md
    baseline_file: baselines/memory-missing-blocked.md
    expected_verdict: NEED_MORE_INFO
