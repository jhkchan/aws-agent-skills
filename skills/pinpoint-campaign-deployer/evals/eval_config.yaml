# Eval configuration for pinpoint-campaign-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: pinpoint-campaign-deployer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: email-campaign-full-security
    difficulty: easy
    prompt_file: prompts/email-campaign-full-security.md
    baseline_file: baselines/email-campaign-full-security.md
    expected_verdict: READY_TO_DEPLOY
  - id: journey-multistep-deploy
    difficulty: hard
    prompt_file: prompts/journey-multistep-deploy.md
    baseline_file: baselines/journey-multistep-deploy.md
    expected_verdict: READY_TO_DEPLOY
  - id: ses-identity-not-verified
    difficulty: medium
    prompt_file: prompts/ses-identity-not-verified.md
    baseline_file: baselines/ses-identity-not-verified.md
    expected_verdict: PREREQUISITES_MISSING
  - id: segment-zero-endpoints
    difficulty: medium
    prompt_file: prompts/segment-zero-endpoints.md
    baseline_file: baselines/segment-zero-endpoints.md
    expected_verdict: PREREQUISITES_MISSING
  - id: missing-required-fields
    difficulty: easy
    prompt_file: prompts/missing-required-fields.md
    baseline_file: baselines/missing-required-fields.md
    expected_verdict: PREREQUISITES_MISSING
