# Eval configuration for s3-table-bucket-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: s3-table-bucket-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: basic-table-bucket-iceberg
    difficulty: hard
    prompt_file: prompts/basic-table-bucket-iceberg.md
    baseline_file: baselines/basic-table-bucket-iceberg.md
    expected_verdict: READY_TO_DEPLOY

  - id: athena-lake-formation-integration
    difficulty: medium
    prompt_file: prompts/athena-lake-formation-integration.md
    baseline_file: baselines/athena-lake-formation-integration.md
    expected_verdict: READY_TO_DEPLOY

  - id: table-maintenance-configuration
    difficulty: medium
    prompt_file: prompts/table-maintenance-configuration.md
    baseline_file: baselines/table-maintenance-configuration.md
    expected_verdict: READY_TO_DEPLOY

  - id: table-bucket-policy-separate
    difficulty: hard
    prompt_file: prompts/table-bucket-policy-separate.md
    baseline_file: baselines/table-bucket-policy-separate.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-namespace-prerequisite
    difficulty: easy
    prompt_file: prompts/missing-namespace-prerequisite.md
    baseline_file: baselines/missing-namespace-prerequisite.md
    expected_verdict: PREREQUISITES_MISSING
