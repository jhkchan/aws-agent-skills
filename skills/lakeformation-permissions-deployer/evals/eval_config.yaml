# Eval configuration for lakeformation-permissions-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob).
skill_name: lakeformation-permissions-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: lf-tag-based-access
    difficulty: hard
    prompt_file: prompts/lf-tag-based-access.md
    baseline_file: baselines/lf-tag-based-access.md
    expected_verdict: READY_TO_DEPLOY

  - id: column-level-security
    difficulty: hard
    prompt_file: prompts/column-level-security.md
    baseline_file: baselines/column-level-security.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-data-lake-admin
    difficulty: hard
    prompt_file: prompts/missing-data-lake-admin.md
    baseline_file: baselines/missing-data-lake-admin.md
    expected_verdict: PREREQUISITES_MISSING

  - id: resource-link-cross-database
    difficulty: hard
    prompt_file: prompts/resource-link-cross-database.md
    baseline_file: baselines/resource-link-cross-database.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-lf-tag-on-resource
    difficulty: medium
    prompt_file: prompts/missing-lf-tag-on-resource.md
    baseline_file: baselines/missing-lf-tag-on-resource.md
    expected_verdict: PREREQUISITES_MISSING
