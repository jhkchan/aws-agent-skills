# Eval configuration for rds-bluegreen-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: rds-bluegreen-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: aurora-mysql-major-version-upgrade
    difficulty: hard
    prompt_file: prompts/aurora-mysql-major-version-upgrade.md
    baseline_file: baselines/aurora-mysql-major-version-upgrade.md
    expected_verdict: READY_TO_DEPLOY

  - id: rds-postgres-parameter-change
    difficulty: hard
    prompt_file: prompts/rds-postgres-parameter-change.md
    baseline_file: baselines/rds-postgres-parameter-change.md
    expected_verdict: READY_TO_DEPLOY

  - id: switchover-with-validation
    difficulty: medium
    prompt_file: prompts/switchover-with-validation.md
    baseline_file: baselines/switchover-with-validation.md
    expected_verdict: READY_TO_DEPLOY

  - id: schema-change-in-green
    difficulty: medium
    prompt_file: prompts/schema-change-in-green.md
    baseline_file: baselines/schema-change-in-green.md
    expected_verdict: READY_TO_DEPLOY

  - id: unsupported-engine-sqlserver
    difficulty: easy
    prompt_file: prompts/unsupported-engine-sqlserver.md
    baseline_file: baselines/unsupported-engine-sqlserver.md
    expected_verdict: PREREQUISITES_MISSING
