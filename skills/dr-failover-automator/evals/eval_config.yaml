# Eval configuration for dr-failover-automator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: dr-failover-automator
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: pilot-light-aurora-global
    difficulty: hard
    prompt_file: prompts/pilot-light-aurora-global.md
    baseline_file: baselines/pilot-light-aurora-global.md
    expected_verdict: AUTOMATED
  - id: warm-standby-route53
    difficulty: hard
    prompt_file: prompts/warm-standby-route53.md
    baseline_file: baselines/warm-standby-route53.md
    expected_verdict: AUTOMATED
  - id: drs-ec2-recovery
    difficulty: medium
    prompt_file: prompts/drs-ec2-recovery.md
    baseline_file: baselines/drs-ec2-recovery.md
    expected_verdict: AUTOMATED
  - id: no-verification-split-brain
    difficulty: hard
    prompt_file: prompts/no-verification-split-brain.md
    baseline_file: baselines/no-verification-split-brain.md
    expected_verdict: MANUAL_STEP_REQUIRED
  - id: aurora-unplanned-failover
    difficulty: hard
    prompt_file: prompts/aurora-unplanned-failover.md
    baseline_file: baselines/aurora-unplanned-failover.md
    expected_verdict: AUTOMATED
