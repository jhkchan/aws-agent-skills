# Eval configuration for keyspaces-keyspace-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: keyspaces-keyspace-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: on-demand-keyspace-table-pitr
    difficulty: hard
    prompt_file: prompts/on-demand-keyspace-table-pitr.md
    baseline_file: baselines/on-demand-keyspace-table-pitr.md
    expected_verdict: READY_TO_DEPLOY

  - id: provisioned-autoscaling
    difficulty: hard
    prompt_file: prompts/provisioned-autoscaling.md
    baseline_file: baselines/provisioned-autoscaling.md
    expected_verdict: READY_TO_DEPLOY

  - id: clustering-key-sort-order
    difficulty: medium
    prompt_file: prompts/clustering-key-sort-order.md
    baseline_file: baselines/clustering-key-sort-order.md
    expected_verdict: READY_TO_DEPLOY

  - id: client-side-encryption-kms
    difficulty: medium
    prompt_file: prompts/client-side-encryption-kms.md
    baseline_file: baselines/client-side-encryption-kms.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-kms-key
    difficulty: easy
    prompt_file: prompts/missing-kms-key.md
    baseline_file: baselines/missing-kms-key.md
    expected_verdict: PREREQUISITES_MISSING
