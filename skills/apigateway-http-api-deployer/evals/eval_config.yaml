# Eval configuration for apigateway-http-api-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: apigateway-http-api-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: lambda-proxy-jwt-cors
    difficulty: easy
    prompt_file: prompts/lambda-proxy-jwt-cors.md
    baseline_file: baselines/lambda-proxy-jwt-cors.md
    expected_verdict: READY_TO_DEPLOY
  - id: step-functions-integration
    difficulty: hard
    prompt_file: prompts/step-functions-integration.md
    baseline_file: baselines/step-functions-integration.md
    expected_verdict: READY_TO_DEPLOY
  - id: vpc-link-private-integration
    difficulty: hard
    prompt_file: prompts/vpc-link-private-integration.md
    baseline_file: baselines/vpc-link-private-integration.md
    expected_verdict: READY_TO_DEPLOY
  - id: missing-jwt-issuer
    difficulty: medium
    prompt_file: prompts/missing-jwt-issuer.md
    baseline_file: baselines/missing-jwt-issuer.md
    expected_verdict: PREREQUISITES_MISSING
  - id: missing-integration-target
    difficulty: easy
    prompt_file: prompts/missing-integration-target.md
    baseline_file: baselines/missing-integration-target.md
    expected_verdict: PREREQUISITES_MISSING
