# Eval test cases for sns-topic-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the READY_TO_DEPLOY / PREREQUISITES_MISSING
# classification across topic types (Standard, FIFO) and prerequisite failure
# branches (AWS-managed key with cross-account, FIFO with Lambda subscriber).
skill: sns-topic-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: standard-topic-with-subscriptions
    description: >-
      Deploy a Standard SNS topic with SSE-KMS (AWS-managed), S3 notification
      access policy, SQS + Lambda subscriptions, filter policy, and delivery
      status logging. Expects READY_TO_DEPLOY.
    input: |
      Deploy a production SNS topic named "order-events" in us-east-1.
      It receives messages from S3 bucket "order-uploads" via S3 Event
      Notification. Two subscribers: SQS queue "order-queue" (filter on
      event_type=["order_created"]) and Lambda function "order-handler".
      Enable SSE-KMS with AWS-managed key. Enable SQS delivery status
      logging. Account: 111111111111.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "order-events"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
        - "SSE-KMS"
        - "delivery"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: fifo-topic-lambda-subscriber
    description: >-
      Deploy a FIFO topic with a Lambda subscriber. Expects
      PREREQUISITES_MISSING because FIFO topics only support SQS FIFO
      subscribers.
    input: |
      Deploy a FIFO SNS topic named "payment-events.fifo" in us-east-1.
      ContentBasedDeduplication=true. Subscriber: Lambda function
      "payment-handler". SSE-KMS with AWS-managed key. Account:
      111111111111.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "payment-events.fifo"
        - "VERDICT"
        - "CHECKLIST"
        - "FIFO"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"

  - id: cross-account-aws-managed-key
    description: >-
      Deploy an SNS topic with AWS-managed key but a cross-account SQS
      subscriber. Expects PREREQUISITES_MISSING because AWS-managed key
      blocks cross-account decryption.
    input: |
      Deploy a production SNS topic named "shared-events" in us-east-1.
      SSE-KMS with AWS-managed key (alias/aws/sns). Subscriber: SQS queue
      in account 222222222222 ("arn:aws:sqs:us-east-1:222222222222:partner-
      queue"). Enable delivery status logging. Account: 111111111111.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "shared-events"
        - "VERDICT"
        - "CHECKLIST"
        - "customer-managed"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"

  - id: http-subscription-no-logging
    description: >-
      Deploy a Standard topic with an HTTPS subscription but no delivery
      status logging. Expects PREREQUISITES_MISSING because HTTP
      subscriptions MUST have failure logging (SNS drops silently after
      4 hours of retries).
    input: |
      Deploy a production SNS topic named "webhook-delivery" in us-east-1.
      Subscriber: HTTPS endpoint https://api.partner.com/webhook. SSE-KMS
      with AWS-managed key. No delivery status logging configured. Account:
      111111111111.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "webhook-delivery"
        - "VERDICT"
        - "CHECKLIST"
        - "delivery"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"

  - id: fifo-topic-with-sqs-fifo
    description: >-
      Deploy a FIFO topic with SSE-KMS, a correct SQS FIFO subscriber,
      ContentBasedDeduplication, and delivery logging. Expects
      READY_TO_DEPLOY.
    input: |
      Deploy a production FIFO SNS topic named "transaction-events.fifo"
      in us-east-1. ContentBasedDeduplication=true. Subscriber: SQS FIFO
      queue "transaction-queue.fifo" (same account). Enable SSE-KMS with
      AWS-managed key. Enable SQS delivery status logging. maxReceiveCount
      on the SQS queue is 10. Account: 111111111111.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "transaction-events.fifo"
        - "VERDICT"
        - "CHECKLIST"
        - "FIFO"
        - "VERIFICATION_COMMANDS"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"
