# Eval configuration for sns-topic-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob).
skill_name: sns-topic-deployer
snapshot_date: "2026-08-09"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: standard-topic-with-subscriptions
    difficulty: medium
    prompt_file: prompts/standard-topic-with-subscriptions.md
    baseline_file: baselines/standard-topic-with-subscriptions.md
    expected_verdict: READY_TO_DEPLOY

  - id: fifo-topic-lambda-subscriber
    difficulty: hard
    prompt_file: prompts/fifo-topic-lambda-subscriber.md
    baseline_file: baselines/fifo-topic-lambda-subscriber.md
    expected_verdict: PREREQUISITES_MISSING

  - id: cross-account-aws-managed-key
    difficulty: hard
    prompt_file: prompts/cross-account-aws-managed-key.md
    baseline_file: baselines/cross-account-aws-managed-key.md
    expected_verdict: PREREQUISITES_MISSING

  - id: http-subscription-no-logging
    difficulty: medium
    prompt_file: prompts/http-subscription-no-logging.md
    baseline_file: baselines/http-subscription-no-logging.md
    expected_verdict: PREREQUISITES_MISSING

  - id: fifo-topic-with-sqs-fifo
    difficulty: hard
    prompt_file: prompts/fifo-topic-with-sqs-fifo.md
    baseline_file: baselines/fifo-topic-with-sqs-fifo.md
    expected_verdict: READY_TO_DEPLOY
