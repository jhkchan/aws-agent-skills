# Eval configuration for lambda-layer-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: lambda-layer-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: python-powertools-layer
    difficulty: hard
    prompt_file: prompts/python-powertools-layer.md
    baseline_file: baselines/python-powertools-layer.md
    expected_verdict: READY_TO_DEPLOY

  - id: nodejs-sdk-layer
    difficulty: hard
    prompt_file: prompts/nodejs-sdk-layer.md
    baseline_file: baselines/nodejs-sdk-layer.md
    expected_verdict: READY_TO_DEPLOY

  - id: arm64-graviton-layer
    difficulty: medium
    prompt_file: prompts/arm64-graviton-layer.md
    baseline_file: baselines/arm64-graviton-layer.md
    expected_verdict: READY_TO_DEPLOY

  - id: cross-account-sharing
    difficulty: medium
    prompt_file: prompts/cross-account-sharing.md
    baseline_file: baselines/cross-account-sharing.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-runtime-arch
    difficulty: easy
    prompt_file: prompts/missing-runtime-arch.md
    baseline_file: baselines/missing-runtime-arch.md
    expected_verdict: PREREQUISITES_MISSING
