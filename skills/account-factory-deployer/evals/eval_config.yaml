# Eval configuration for account-factory-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: account-factory-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: standard-account-vending
    difficulty: hard
    prompt_file: prompts/standard-account-vending.md
    baseline_file: baselines/standard-account-vending.md
    expected_verdict: READY_TO_DEPLOY

  - id: custom-baseline-stacksets
    difficulty: hard
    prompt_file: prompts/custom-baseline-stacksets.md
    baseline_file: baselines/custom-baseline-stacksets.md
    expected_verdict: READY_TO_DEPLOY

  - id: group-sso-auto-assignment
    difficulty: medium
    prompt_file: prompts/group-sso-auto-assignment.md
    baseline_file: baselines/group-sso-auto-assignment.md
    expected_verdict: READY_TO_DEPLOY

  - id: account-termination
    difficulty: medium
    prompt_file: prompts/account-termination.md
    baseline_file: baselines/account-termination.md
    expected_verdict: READY_TO_DEPLOY

  - id: unregistered-ou-prerequisite
    difficulty: easy
    prompt_file: prompts/unregistered-ou-prerequisite.md
    baseline_file: baselines/unregistered-ou-prerequisite.md
    expected_verdict: PREREQUISITES_MISSING
