# Eval configuration for ec2-spot-fleet-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: ec2-spot-fleet-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: maintain-price-capacity-optimized
    difficulty: hard
    prompt_file: prompts/maintain-price-capacity-optimized.md
    baseline_file: baselines/maintain-price-capacity-optimized.md
    expected_verdict: READY_TO_DEPLOY

  - id: request-lowest-price-burst
    difficulty: hard
    prompt_file: prompts/request-lowest-price-burst.md
    baseline_file: baselines/request-lowest-price-burst.md
    expected_verdict: READY_TO_DEPLOY

  - id: capacity-rebalance-enabled
    difficulty: hard
    prompt_file: prompts/capacity-rebalance-enabled.md
    baseline_file: baselines/capacity-rebalance-enabled.md
    expected_verdict: READY_TO_DEPLOY

  - id: spot-placement-score
    difficulty: hard
    prompt_file: prompts/spot-placement-score.md
    baseline_file: baselines/spot-placement-score.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-iam-role
    difficulty: easy
    prompt_file: prompts/missing-iam-role.md
    baseline_file: baselines/missing-iam-role.md
    expected_verdict: PREREQUISITES_MISSING
