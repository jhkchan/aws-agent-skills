# Eval configuration for fis-experiment-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: fis-experiment-deployer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: ec2-stop-canary-with-alarm
    difficulty: hard
    prompt_file: prompts/ec2-stop-canary-with-alarm.md
    baseline_file: baselines/ec2-stop-canary-with-alarm.md
    expected_verdict: READY_TO_DEPLOY

  - id: permissive-target-tag-rejected
    difficulty: hard
    prompt_file: prompts/permissive-target-tag-rejected.md
    baseline_file: baselines/permissive-target-tag-rejected.md
    expected_verdict: PREREQUISITES_MISSING

  - id: aurora-failover-dr-drill
    difficulty: hard
    prompt_file: prompts/aurora-failover-dr-drill.md
    baseline_file: baselines/aurora-failover-dr-drill.md
    expected_verdict: READY_TO_DEPLOY

  - id: network-blackhole-with-ssm
    difficulty: hard
    prompt_file: prompts/network-blackhole-with-ssm.md
    baseline_file: baselines/network-blackhole-with-ssm.md
    expected_verdict: READY_TO_DEPLOY

  - id: eks-pod-disruption
    difficulty: hard
    prompt_file: prompts/eks-pod-disruption.md
    baseline_file: baselines/eks-pod-disruption.md
    expected_verdict: READY_TO_DEPLOY
