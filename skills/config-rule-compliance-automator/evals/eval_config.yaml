# Eval configuration for config-rule-compliance-automator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: config-rule-compliance-automator
snapshot_date: "2026-08-07"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: managed-rule-s3-encryption
    difficulty: easy
    prompt_file: prompts/managed-rule-s3-encryption.md
    baseline_file: baselines/managed-rule-s3-encryption.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: custom-lambda-remediation
    difficulty: medium
    prompt_file: prompts/custom-lambda-remediation.md
    baseline_file: baselines/custom-lambda-remediation.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: conformance-pack-cis-stacksets
    difficulty: hard
    prompt_file: prompts/conformance-pack-cis-stacksets.md
    baseline_file: baselines/conformance-pack-cis-stacksets.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: aggregator-missing-review
    difficulty: hard
    prompt_file: prompts/aggregator-missing-review.md
    baseline_file: baselines/aggregator-missing-review.md
    expected_verdict: REVIEW_REQUIRED
  - id: organizational-config-rule
    difficulty: medium
    prompt_file: prompts/organizational-config-rule.md
    baseline_file: baselines/organizational-config-rule.md
    expected_verdict: AUTOMATION_DEPLOYED
