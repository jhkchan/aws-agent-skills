# Eval configuration for s3-storage-class-optimizer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: s3-storage-class-optimizer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: lifecycle-policy-gap
    difficulty: medium
    prompt_file: prompts/lifecycle-policy-gap.md
    baseline_file: baselines/lifecycle-policy-gap.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
  - id: intelligent-tiering-candidate
    difficulty: medium
    prompt_file: prompts/intelligent-tiering-candidate.md
    baseline_file: baselines/intelligent-tiering-candidate.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
  - id: versioning-bloat
    difficulty: hard
    prompt_file: prompts/versioning-bloat.md
    baseline_file: baselines/versioning-bloat.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
  - id: already-optimal-bucket
    difficulty: easy
    prompt_file: prompts/already-optimal-bucket.md
    baseline_file: baselines/already-optimal-bucket.md
    expected_verdict: ALREADY_OPTIMAL
  - id: glacier-retrieval-mismatch
    difficulty: hard
    prompt_file: prompts/glacier-retrieval-mismatch.md
    baseline_file: baselines/glacier-retrieval-mismatch.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
