# Eval configuration for backup-vault-operator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: backup-vault-operator
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: create-vault-ready
    difficulty: easy
    prompt_file: prompts/create-vault-ready.md
    baseline_file: baselines/create-vault-ready.md
    expected_verdict: READY
    expected_risk: LOW
  - id: compliance-lock-ready
    difficulty: hard
    prompt_file: prompts/compliance-lock-ready.md
    baseline_file: baselines/compliance-lock-ready.md
    expected_verdict: READY
    expected_risk: MODERATE
  - id: cross-region-plan-ready
    difficulty: medium
    prompt_file: prompts/cross-region-plan-ready.md
    baseline_file: baselines/cross-region-plan-ready.md
    expected_verdict: READY
    expected_risk: MODERATE
  - id: governance-mode-misuse-blocked
    difficulty: hard
    prompt_file: prompts/governance-mode-misuse-blocked.md
    baseline_file: baselines/governance-mode-misuse-blocked.md
    expected_verdict: BLOCKED
    expected_risk: HIGH
  - id: pitr-restore-completed
    difficulty: medium
    prompt_file: prompts/pitr-restore-completed.md
    baseline_file: baselines/pitr-restore-completed.md
    expected_verdict: COMPLETED
    expected_risk: LOW
