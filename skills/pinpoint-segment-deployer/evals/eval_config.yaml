# Eval configuration for pinpoint-segment-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: pinpoint-segment-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: dynamic-segment-recompute
    difficulty: hard
    prompt_file: prompts/dynamic-segment-recompute.md
    baseline_file: baselines/dynamic-segment-recompute.md
    expected_verdict: READY_TO_DEPLOY

  - id: journey-event-conditional-branch
    difficulty: hard
    prompt_file: prompts/journey-event-conditional-branch.md
    baseline_file: baselines/journey-event-conditional-branch.md
    expected_verdict: READY_TO_DEPLOY

  - id: ab-test-sample-size
    difficulty: medium
    prompt_file: prompts/ab-test-sample-size.md
    baseline_file: baselines/ab-test-sample-size.md
    expected_verdict: READY_TO_DEPLOY

  - id: sms-sender-id-and-long-code
    difficulty: medium
    prompt_file: prompts/sms-sender-id-and-long-code.md
    baseline_file: baselines/sms-sender-id-and-long-code.md
    expected_verdict: READY_TO_DEPLOY

  - id: segment-zero-endpoints-prereq
    difficulty: easy
    prompt_file: prompts/segment-zero-endpoints-prereq.md
    baseline_file: baselines/segment-zero-endpoints-prereq.md
    expected_verdict: PREREQUISITES_MISSING
