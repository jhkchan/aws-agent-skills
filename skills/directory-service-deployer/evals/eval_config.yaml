# Eval configuration for directory-service-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: directory-service-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: managed-ad-enterprise-trust-ldaps
    difficulty: hard
    prompt_file: prompts/managed-ad-enterprise-trust-ldaps.md
    baseline_file: baselines/managed-ad-enterprise-trust-ldaps.md
    expected_verdict: READY_TO_DEPLOY

  - id: ad-connector-onprem-dns
    difficulty: hard
    prompt_file: prompts/ad-connector-onprem-dns.md
    baseline_file: baselines/ad-connector-onprem-dns.md
    expected_verdict: READY_TO_DEPLOY

  - id: simple-ad-basic
    difficulty: medium
    prompt_file: prompts/simple-ad-basic.md
    baseline_file: baselines/simple-ad-basic.md
    expected_verdict: READY_TO_DEPLOY

  - id: cross-account-directory-sharing
    difficulty: medium
    prompt_file: prompts/cross-account-directory-sharing.md
    baseline_file: baselines/cross-account-directory-sharing.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-vpc-dns-support
    difficulty: easy
    prompt_file: prompts/missing-vpc-dns-support.md
    baseline_file: baselines/missing-vpc-dns-support.md
    expected_verdict: PREREQUISITES_MISSING
