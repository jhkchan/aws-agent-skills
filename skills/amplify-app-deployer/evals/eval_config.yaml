# Eval configuration for amplify-app-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: amplify-app-deployer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: nextjs-ssr-gen2-backend
    difficulty: hard
    prompt_file: prompts/nextjs-ssr-gen2-backend.md
    baseline_file: baselines/nextjs-ssr-gen2-backend.md
    expected_verdict: READY_TO_DEPLOY

  - id: react-spa-static-no-backend
    difficulty: medium
    prompt_file: prompts/react-spa-static-no-backend.md
    baseline_file: baselines/react-spa-static-no-backend.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-git-provider-and-amplify-yml
    difficulty: easy
    prompt_file: prompts/missing-git-provider-and-amplify-yml.md
    baseline_file: baselines/missing-git-provider-and-amplify-yml.md
    expected_verdict: PREREQUISITES_MISSING

  - id: gen2-backend-ampx-pipeline-deploy
    difficulty: hard
    prompt_file: prompts/gen2-backend-ampx-pipeline-deploy.md
    baseline_file: baselines/gen2-backend-ampx-pipeline-deploy.md
    expected_verdict: READY_TO_DEPLOY

  - id: custom-domain-third-party-dns
    difficulty: medium
    prompt_file: prompts/custom-domain-third-party-dns.md
    baseline_file: baselines/custom-domain-third-party-dns.md
    expected_verdict: READY_TO_DEPLOY
