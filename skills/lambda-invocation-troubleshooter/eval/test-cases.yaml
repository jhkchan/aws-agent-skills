# Eval test cases for lambda-invocation-troubleshooter
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five deterministic cases — one per root-cause layer family. Each case's
# TARGET embeds the test-case id so the model naturally echoes it (avoids
# assertion-token mismatch). The diagnostic ordering in SKILL.md produces
# exactly the expected verdicts below.
skill: lambda-invocation-troubleshooter
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: timeout-downstream-dynamodb-throttled
    description: >-
      Node.js Lambda with 30s timeout. 30% of invocations hit
      TaskTimeoutException at exactly 30s; 70% succeed in 1-3s.
      Last log line before each kill is "Putting item to orders-table".
      DynamoDB table is provisioned at 100 WCU while sustaining 5000+
      WCU of demand. Pattern indicates downstream throttling, not a
      config timeout. Expected layer: TIMEOUT_DOWNSTREAM.
    input: |
      Symptom: application invokes fn-timeout-downstream-dynamodb
      synchronously via API Gateway. About 30% of invocations return
      TaskTimeoutException after exactly 30 seconds. The remaining 70%
      succeed in 1-3 seconds. Errors metric shows 47 timeouts in the
      last hour.

      FunctionName: fn-timeout-downstream-dynamodb
      Qualifier: prod (version 42)
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 512
      Handler: index.handler
      PackageType: Zip
      VpcConfig: (none — function is not VPC-attached)
      LastUpdateStatus: Successful (last update 2 days ago)

      Recent log pattern (last 10 timeouts):
        INFO  Putting item to orders-table (id=...)
        (no further log line)
        END RequestId: ... Duration: 30000.00 ms
          Memory Size: 512 MB Max Memory Used: 78 MB
        Task timed out after 30.00 seconds

      CloudWatch metrics (last hour):
        - Duration p50: 1.2s, p99: 30s, Maximum: 30s
        - MemoryUtilization Maximum: 15%
        - Errors: 47

      DynamoDB context:
        - Table orders-table
        - BillingModeSummary: PROVISIONED
        - WriteCapacityUnits: 100
        - WriteThrottleEvents (last hour): sustained

      Emit the standard diagnostic block (TARGET, VERDICT, REASON, LAYER,
      EVIDENCE, REMEDIATION).
    expected_verdict: ROOT_CAUSE_FOUND
    assertions:
      must_contain:
        - "ROOT_CAUSE_FOUND"
        - "timeout-downstream-dynamodb"
        - "TIMEOUT_DOWNSTREAM"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: NEED_MORE_INFO"
        - "VERDICT: ESCALATE"
        - "LAYER: TIMEOUT_CONFIG"

  - id: oom-memory-too-low
    description: >-
      Image-resize Lambda with 256 MB MemorySize. Runtime.ExitError
      OutOfMemory on payloads > 4 MB. CloudWatch MemoryUtilization
      Maximum: 100%. Expected layer: MEMORY_CONFIG.
    input: |
      Symptom: fn-oom-memory-too-low fails on image payloads larger
      than 4 MB. Logs show "Runtime.ExitError: ErrorType:
      OutOfMemory" on the same invocations. Smaller payloads succeed
      in under 2 seconds.

      FunctionName: fn-oom-memory-too-low
      Qualifier: prod (version 7)
      Runtime: nodejs20.x
      Timeout: 60
      MemorySize: 256
      Handler: index.handler
      PackageType: Zip
      VpcConfig: (none)

      Recent log pattern:
        INFO  Processing image of size 6.2 MB
        FATAL ERROR: CALL_AND_RETRY_LAST Allocation failed - JavaScript
          heap out of memory
        Runtime.ExitError: ErrorType: OutOfMemory

      CloudWatch metrics (last hour):
        - Duration p99: 1.2s
        - MemoryUtilization Maximum: 100
        - Errors: 12 (all on payloads > 4 MB)

      Emit the standard diagnostic block (TARGET, VERDICT, REASON, LAYER,
      EVIDENCE, REMEDIATION).
    expected_verdict: ROOT_CAUSE_FOUND
    assertions:
      must_contain:
        - "ROOT_CAUSE_FOUND"
        - "oom-memory-too-low"
        - "MEMORY_CONFIG"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: NEED_MORE_INFO"
        - "LAYER: TIMEOUT_CONFIG"

  - id: vpc-no-nat-no-internet
    description: >-
      Lambda function VPC-attached in a public subnet (route to IGW,
      no NAT Gateway). Cannot reach external API; connect ETIMEDOUT.
      Lambda functions have no public IP — IGW is not a valid internet
      path. Expected layer: VPC_CONNECTIVITY.
    input: |
      Symptom: fn-vpc-no-nat-no-internet cannot reach
      https://api.stripe.com/charge. Logs show "connect ETIMEDOUT
      3.18.12.63:443" on every invocation. The function was VPC-
      attached last week to reach an RDS instance; the RDS path
      works, but the external API call started failing at the same
      time.

      FunctionName: fn-vpc-no-nat-no-internet
      Qualifier: prod (version 15)
      Runtime: python3.12
      Timeout: 10
      MemorySize: 512
      Handler: app.handler
      VpcConfig:
        SubnetIds: [subnet-public-a, subnet-public-b]
        SecurityGroupIds: [sg-app]
      Execution role: AWSLambdaVPCAccessExecutionRole attached

      Subnet context:
        - subnet-public-a: CIDR 10.0.1.0/24, route table route to
          igw-aaa (internet gateway), no NAT route
        - subnet-public-b: CIDR 10.0.2.0/24, route table route to
          igw-aaa, no NAT route

      SG sg-app egress: 0.0.0.0/0 all ports (allow all egress)

      Recent log pattern:
        https://api.stripe.com/charge ...
        connect ETIMEDOUT 3.18.12.63:443
        Task timed out after 10.00 seconds

      Emit the standard diagnostic block (TARGET, VERDICT, REASON, LAYER,
      EVIDENCE, REMEDIATION).
    expected_verdict: ROOT_CAUSE_FOUND
    assertions:
      must_contain:
        - "ROOT_CAUSE_FOUND"
        - "vpc-no-nat-no-internet"
        - "VPC_CONNECTIVITY"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: NEED_MORE_INFO"
        - "LAYER: TIMEOUT_CONFIG"

  - id: kms-decrypt-cmk-role-missing
    description: >-
      Lambda function migrated to customer-managed CMK for env vars.
      Execution role was not granted kms:Decrypt on the new key.
      Every invocation fails at startup with "Could not decrypt KMS".
      Expected layer: ENV_VAR_KMS.
    input: |
      Symptom: fn-kms-decrypt-cmk-role-missing fails to start after
      the last deploy. Logs show "Could not decrypt KMS" on every
      invocation. The deploy migrated environment variables from the
      default aws/lambda key to a customer-managed CMK
      (arn:aws:kms:us-east-1:111111111111:key/abc-123) per a security
      team mandate.

      FunctionName: fn-kms-decrypt-cmk-role-missing
      Qualifier: prod (version 23)
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 512
      Handler: index.handler
      KMSKeyArn: arn:aws:kms:us-east-1:111111111111:key/abc-123
      Environment:
        Variables:
          DB_PASSWORD: <encrypted-blob>
          API_TOKEN: <encrypted-blob>
      Execution role: arn:aws:iam::111111111111:role/fn-role
      Execution role policies (attached):
        - AWSLambdaBasicExecutionRole
        - AmazonS3ReadOnlyAccess
        - inline: { db-access: { Effect: Allow, Action:
            [dynamodb:*], Resource: "*" } }
      Execution role kms:Decrypt permission: NOT PRESENT

      KMS key state: Enabled, KeyManager: CUSTOMER, Origin: AWS_KMS

      Recent log pattern:
        Could not decrypt KMS: arn:aws:kms:us-east-1:111111111111:key/abc-123
        Runtime.ExitError

      Emit the standard diagnostic block (TARGET, VERDICT, REASON, LAYER,
      EVIDENCE, REMEDIATION).
    expected_verdict: ROOT_CAUSE_FOUND
    assertions:
      must_contain:
        - "ROOT_CAUSE_FOUND"
        - "kms-decrypt-cmk-role-missing"
        - "ENV_VAR_KMS"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: NEED_MORE_INFO"
        - "LAYER: ENV_VAR_MISSING"

  - id: ecr-image-cross-account-policy
    description: >-
      Cross-account container Lambda in account 222222222222 cannot
      pull image from ECR repo in account 111111111111. ECR repo
      policy is missing the cross-account grant. Every cold start
      fails with ImagePullFailure. Expected layer: ECR_POLICY.
    input: |
      Symptom: fn-ecr-image-cross-account-policy fails to initialise
      on every cold start. Logs show "ImagePullFailure: Image
      111111111111.dkr.ecr.us-east-1.amazonaws.com/fn-images:latest
      not found" — but the image EXISTS in the source account. The
      function is in account 222222222222; the ECR repo is in account
      111111111111.

      FunctionName: fn-ecr-image-cross-account-policy
      Qualifier: prod (version 3)
      PackageType: Image
      Code:
        ImageUri: 111111111111.dkr.ecr.us-east-1.amazonaws.com/fn-images:latest
      ImageConfig:
        Command: [app.handler]
      Timeout: 30
      MemorySize: 1024
      Execution role: includes AWSLambdaBasicExecutionRole and a
        cross-account assume-role permission
      LastUpdateStatus: Successful (image-config update applied 1
        hour ago)

      ECR context:
        - Repository: 111111111111.dkr.ecr.us-east-1.amazonaws.com/fn-images
        - Image tag latest exists, image size 450 MB compressed
        - Repository policy:
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "SameAccountLambda",
                  "Effect": "Allow",
                  "Principal": {"Service": "lambda.amazonaws.com"},
                  "Action": ["ecr:BatchGetImage",
                             "ecr:GetDownloadUrlForLayer"]
                }
              ]
            }
        - Note: Principal is the Lambda service principal without
          an account condition; cross-account pulls fail.

      Recent log pattern (each cold start):
        ImagePullFailure: Image
          111111111111.dkr.ecr.us-east-1.amazonaws.com/fn-images:latest
          not found
        Runtime.ExitError

      Emit the standard diagnostic block (TARGET, VERDICT, REASON, LAYER,
      EVIDENCE, REMEDIATION).
    expected_verdict: ROOT_CAUSE_FOUND
    assertions:
      must_contain:
        - "ROOT_CAUSE_FOUND"
        - "ecr-image-cross-account-policy"
        - "ECR_POLICY"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: NEED_MORE_INFO"
        - "LAYER: ECR_IMAGE"
