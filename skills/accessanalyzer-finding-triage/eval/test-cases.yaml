# Eval test cases for accessanalyzer-finding-triage
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
skill: accessanalyzer-finding-triage
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: kms-external-public
    description: KMS key with public principal and no condition — CRITICAL external access
    input: |
      Triage the following IAM Access Analyzer finding.

      Finding ID: kms-external-public
      Finding type: ExternalAccess
      Resource: arn:aws:kms:us-east-1:123456789012:key/abc123def456
      Resource type: AWS::KMS::Key
      Resource owner account: 123456789012
      Principal: "*"
      isPublic: true
      Actions: ["kms:Decrypt", "kms:Encrypt", "kms:ReEncrypt*", "kms:GenerateDataKey*"]
      Condition: {}
      Status: ACTIVE
      Created at: 2024-06-15T10:00:00Z
      Analyzed at: 2025-01-20T08:00:00Z
    expected_verdict: EXTERNAL_ACCESS
    assertions:
      must_contain:
        - "EXTERNAL_ACCESS"
        - "kms-external-public"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
        - "CRITICAL"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: SAFE"
        - "VERDICT: EXPECTED"

  - id: s3-source-arn-bounded
    description: S3 bucket with external principal bounded by aws:SourceArn — SAFE
    input: |
      Triage the following IAM Access Analyzer finding.

      Finding ID: s3-source-arn-bounded
      Finding type: ExternalAccess
      Resource: arn:aws:s3:::org-cloudtrail-logs
      Resource type: AWS::S3::Bucket
      Resource owner account: 123456789012
      Principal: arn:aws:iam::999999999999:root
      isPublic: false
      Actions: ["s3:GetBucketAcl", "s3:PutObject"]
      Condition: {"aws:SourceArn": "arn:aws:cloudtrail:us-east-1:999999999999:trail/organization-trail"}
      Status: ACTIVE
      Created at: 2024-06-01T10:00:00Z
      Analyzed at: 2025-01-20T08:00:00Z
    expected_verdict: SAFE
    assertions:
      must_contain:
        - "SAFE"
        - "s3-source-arn-bounded"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: EXTERNAL_ACCESS"

  - id: unused-role-legacy-etl
    description: IAM role unused for 95 days — UNUSED_ACCESS
    input: |
      Triage the following IAM Access Analyzer finding.

      Finding ID: unused-role-legacy-etl
      Finding type: UnusedIAMRole
      Resource: arn:aws:iam::123456789012:role/legacy-etl-role
      Resource type: AWS::IAM::Role
      Principal: arn:aws:iam::123456789012:role/legacy-etl-role
      Last accessed: 2024-10-15T00:00:00Z
      Analysis period: 90 days
      Status: ACTIVE
      Analyzed at: 2025-01-20T08:00:00Z

      Context: This role has s3:GetObject and s3:PutObject on production data buckets attached via an inline policy.
    expected_verdict: UNUSED_ACCESS
    assertions:
      must_contain:
        - "UNUSED_ACCESS"
        - "unused-role-legacy-etl"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: SAFE"
        - "VERDICT: EXPECTED"

  - id: unused-access-key-ci-deployer
    description: Unused IAM user access key for 120 days — UNUSED_ACCESS / HIGH
    input: |
      Triage the following IAM Access Analyzer finding.

      Finding ID: unused-access-key-ci-deployer
      Finding type: UnusedIAMUserAccessKey
      Resource: arn:aws:iam::123456789012:user/ci-deployer
      Resource type: AWS::IAM::User
      Principal: arn:aws:iam::123456789012:user/ci-deployer
      Access key ID: AKIAIOSFODNN7EXAMPLE
      Last accessed: 2024-09-20T00:00:00Z
      Analysis period: 90 days
      Status: ACTIVE
      Analyzed at: 2025-01-20T08:00:00Z

      Context: The ci-deployer user has been replaced by an OIDC federation role. The access key is no longer needed.
    expected_verdict: UNUSED_ACCESS
    assertions:
      must_contain:
        - "UNUSED_ACCESS"
        - "unused-access-key-ci-deployer"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
        - "HIGH"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: SAFE"
        - "VERDICT: EXPECTED"

  - id: sqs-external-write-public
    description: SQS queue with public write access and no condition — EXTERNAL_ACCESS
    input: |
      Triage the following IAM Access Analyzer finding.

      Finding ID: sqs-external-write-public
      Finding type: ExternalAccess
      Resource: arn:aws:sqs:us-east-1:123456789012:ingestion-queue
      Resource type: AWS::SQS::Queue
      Resource owner account: 123456789012
      Principal: "*"
      isPublic: true
      Actions: ["sqs:SendMessage", "sqs:ReceiveMessage"]
      Condition: {}
      Status: ACTIVE
      Created at: 2024-08-10T10:00:00Z
      Analyzed at: 2025-01-20T08:00:00Z
    expected_verdict: EXTERNAL_ACCESS
    assertions:
      must_contain:
        - "EXTERNAL_ACCESS"
        - "sqs-external-write-public"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: SAFE"
        - "VERDICT: EXPECTED"

  - id: iam-role-trust-lambda-execution
    description: IAM role trust policy with Lambda service principal — EXPECTED
    input: |
      Triage the following IAM Access Analyzer finding.

      Finding ID: iam-role-trust-lambda-execution
      Finding type: ExternalAccess
      Resource: arn:aws:iam::123456789012:role/lambda-report-generator
      Resource type: AWS::IAM::Role
      Resource owner account: 123456789012
      Principal: {"Service": "lambda.amazonaws.com"}
      isPublic: false
      Actions: ["sts:AssumeRole"]
      Condition: {}
      Status: ACTIVE
      Created at: 2024-06-01T10:00:00Z
      Analyzed at: 2025-01-20T08:00:00Z
    expected_verdict: EXPECTED
    assertions:
      must_contain:
        - "EXPECTED"
        - "iam-role-trust-lambda-execution"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: EXTERNAL_ACCESS"
        - "VERDICT: SAFE"
