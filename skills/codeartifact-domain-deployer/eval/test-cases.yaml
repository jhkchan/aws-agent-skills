# Eval test cases for codeartifact-domain-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the READY_TO_DEPLOY /
# PREREQUISITES_MISSING classification across domain topologies
# (npm domain with external connection and upstream cascade,
# cross-account repository policy for sharing, VPC endpoint for
# private access, KMS CMK encryption, missing parent domain
# prerequisite failure).
skill: codeartifact-domain-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: npm-domain-with-external-connection
    description: >-
      Provision a CodeArtifact domain with an npm repository, an
      internal upstream repository, and an external connection to
      npmjs.com. Expects READY_TO_DEPLOY with the upstream cascade
      configured (internal first, external last) and the 12-hour auth
      token expiry noted.
    input: |
      Create a CodeArtifact domain called my-domain in us-east-1,
      account 123456789012. Create an npm repository my-team-packages
      within it. Add an upstream to shared-team-packages (internal)
      and an external connection to npmjs.com. The cascade order must
      put the internal repo before the public registry. Tags:
      Environment=production, Team=platform.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "my-domain"
        - "my-team-packages"
        - "npmjs"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
        - "upstream cascade"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: cross-account-repository-policy
    description: >-
      Provision a CodeArtifact domain and grant cross-account read
      access to a consumer account via repository policy. Expects
      READY_TO_DEPLOY with the repository policy granting
      codeartifact:ReadFromRepository to the consumer account, and
      the consumer's login command using the domain owner account ID.
    input: |
      Create a CodeArtifact domain shared-artifacts in us-east-1,
      owner account 123456789012. Create a pip repository
      data-science-pkgs. Grant read access to consumer account
      999999999999 via repository policy. The consumer should use
      aws codeartifact login with the domain owner account ID.
      Tags: Environment=production.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "shared-artifacts"
        - "999999999999"
        - "123456789012"
        - "repository policy"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: vpc-endpoint-private-access
    description: >-
      Provision a VPC interface endpoint for private CodeArtifact
      access. Expects READY_TO_DEPLOY with both the API and
      repositories endpoints created, private DNS enabled, and the
      requirement for both endpoints noted.
    input: |
      Create a CodeArtifact domain internal-registry in us-east-1,
      account 123456789012. Create a maven repository java-artifacts.
      Set up VPC interface endpoints for private access in VPC
      vpc-aaa11122, subnets subnet-aaa111 and subnet-bbb222, security
      group sg-priv-1. Tags: Environment=production, Network=private.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "internal-registry"
        - "private-dns-enabled"
        - "codeartifact.api"
        - "codeartifact.repositories"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: kms-encryption-custom-key
    description: >-
      Provision a CodeArtifact domain with a customer-managed KMS key
      for encryption. Expects READY_TO_DEPLOY with the CMK ARN cited
      and the immutability of the encryption key noted (cannot change
      after domain creation).
    input: |
      Create a CodeArtifact domain secure-domain in us-east-1,
      account 123456789012. Use a customer-managed KMS key
      arn:aws:kms:us-east-1:123456789012:key/abcd1234-ef56-7890-abcd-ef1234567890
      for encryption. Create a nuget repository dotnet-packages.
      Tags: Environment=production, Compliance=required.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "secure-domain"
        - "CMK"
        - "immutable"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: missing-domain-prerequisite
    description: >-
      Operator requests a CodeArtifact repository but no domain exists
      yet. This is a prerequisite failure. Expects
      PREREQUISITES_MISSING with the missing parent domain cited.
    input: |
      Create a CodeArtifact repository my-packages in us-east-1,
      account 123456789012, under domain my-domain. The domain
      my-domain does not exist yet.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "domain"
        - "VERDICT"
        - "CHECKLIST"
        - "my-domain"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"
