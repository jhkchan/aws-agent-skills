# Eval configuration for codeartifact-domain-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: codeartifact-domain-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: npm-domain-with-external-connection
    difficulty: hard
    prompt_file: prompts/npm-domain-with-external-connection.md
    baseline_file: baselines/npm-domain-with-external-connection.md
    expected_verdict: READY_TO_DEPLOY

  - id: cross-account-repository-policy
    difficulty: hard
    prompt_file: prompts/cross-account-repository-policy.md
    baseline_file: baselines/cross-account-repository-policy.md
    expected_verdict: READY_TO_DEPLOY

  - id: vpc-endpoint-private-access
    difficulty: medium
    prompt_file: prompts/vpc-endpoint-private-access.md
    baseline_file: baselines/vpc-endpoint-private-access.md
    expected_verdict: READY_TO_DEPLOY

  - id: kms-encryption-custom-key
    difficulty: medium
    prompt_file: prompts/kms-encryption-custom-key.md
    baseline_file: baselines/kms-encryption-custom-key.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-domain-prerequisite
    difficulty: easy
    prompt_file: prompts/missing-domain-prerequisite.md
    baseline_file: baselines/missing-domain-prerequisite.md
    expected_verdict: PREREQUISITES_MISSING
