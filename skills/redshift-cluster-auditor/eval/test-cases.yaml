          IpRanges: [{CidrIp: "10.0.0.0/16"}]
      Emit the standard VERDICT block (CLUSTER, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: NO_SSL
    assertions:
      must_contain:
        - "NO_SSL"
        - "no-ssl-default-param-group"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: PUBLIC"
        - "VERDICT: NO_ENCRYPTION"
        - "VERDICT: NO_AUDIT_LOG"

