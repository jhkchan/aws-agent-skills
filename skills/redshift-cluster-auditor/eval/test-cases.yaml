# Eval test cases for redshift-cluster-auditor
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Each case embeds the test-case identifier in the ClusterIdentifier so the
# assertion layer can confirm the skill classified the RIGHT cluster, and uses
# CONCEPT tokens (verdict shape + structural fields) in must_contain — never
# API field names unique to a single case.
skill: redshift-cluster-auditor
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: public-cluster-no-encryption
    description: >-
      Internet-exposed Redshift cluster with encryption disabled, require_ssl
      off, audit logging off, and enhanced VPC routing off — every dimension
      fails; PUBLIC wins as the worst verdict (Step 1).
    input: |
      Cluster identifier: public-cluster-no-encryption
      Cluster ARN: arn:aws:redshift:us-east-1:111111111111:cluster:public-cluster-no-encryption
      Cluster metadata (describe-clusters):
        ClusterStatus: available
        NumberOfNodes: 2
        NodeType: ra3.4xlarge
        PubliclyAccessible: true
        Encrypted: false
        KmsKeyId: (none)
        EnhancedVPCRouting: false
        ClusterParameterGroupName: default.redshift-1.0
        ClusterParameterGroupStatus: in-sync
        AutomatedSnapshotRetentionPeriod: 1
        VpcSecurityGroups:
          - VpcSecurityGroupId: sg-0aaa11112222
            Status: active
      Parameter group parameters (default.redshift-1.0):
        - ParameterName: require_ssl
          ParameterValue: false
          Source: engine-default
        - ParameterName: enable_user_activity_logging
          ParameterValue: false
          Source: engine-default
      Logging status (describe-logging-status):
        LoggingEnabled: false
      Security group sg-0aaa11112222 ingress rules (describe-security-groups):
        - IpProtocol: tcp, FromPort: 5439, ToPort: 5439,
          IpRanges: [{CidrIp: "0.0.0.0/0"}]
      Emit the standard VERDICT block (CLUSTER, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: PUBLIC
    assertions:
      must_contain:
        - "PUBLIC"
        - "public-cluster-no-encryption"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
        - "PubliclyAccessible"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: NO_ENCRYPTION"
        - "VERDICT: NO_SSL"
        - "VERDICT: NO_AUDIT_LOG"
        - "VERDICT: CONFIG_GAP"

  - id: private-unencrypted
    description: >-
      Private cluster (PubliclyAccessible false) with encryption disabled —
      encryption is immutable post-creation; the only remediation path is a
      fresh encrypted cluster plus UNLOAD/LOAD migration. NO_ENCRYPTION wins.
    input: |
      Cluster identifier: private-unencrypted
      Cluster ARN: arn:aws:redshift:us-east-1:111111111111:cluster:private-unencrypted
      Cluster metadata (describe-clusters):
        ClusterStatus: available
        NumberOfNodes: 2
        NodeType: ra3.xlplus
        PubliclyAccessible: false
        Encrypted: false
        KmsKeyId: (none)
        EnhancedVPCRouting: true
        ClusterParameterGroupName: analytics-pg
        ClusterParameterGroupStatus: in-sync
        AutomatedSnapshotRetentionPeriod: 7
        VpcSecurityGroups:
          - VpcSecurityGroupId: sg-0bbb33334444
            Status: active
      Parameter group parameters (analytics-pg):
        - ParameterName: require_ssl
          ParameterValue: true
          Source: user
        - ParameterName: enable_user_activity_logging
          ParameterValue: true
          Source: user
      Logging status (describe-logging-status):
        LoggingEnabled: true
        BucketName: audit-logs-111111111111
        S3KeyPrefix: redshift/private-unencrypted/
      Security group sg-0bbb33334444 ingress rules (describe-security-groups):
        - IpProtocol: tcp, FromPort: 5439, ToPort: 5439,
          IpRanges: [{CidrIp: "10.0.0.0/16"}]
      Emit the standard VERDICT block (CLUSTER, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: NO_ENCRYPTION
    assertions:
      must_contain:
        - "NO_ENCRYPTION"
        - "private-unencrypted"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: PUBLIC"
        - "VERDICT: CONFIG_GAP"

  - id: no-ssl-default-param-group
    description: >-
      Private encrypted cluster using the default parameter group where
      require_ssl is engine-default false — clients may connect over plaintext.
      Custom audit-logging PG is not enough; NO_SSL wins (Step 3).
