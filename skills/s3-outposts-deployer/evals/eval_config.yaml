# Eval configuration for s3-outposts-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: s3-outposts-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: outpost-bucket-with-endpoint-replication
    difficulty: hard
    prompt_file: prompts/outpost-bucket-with-endpoint-replication.md
    baseline_file: baselines/outpost-bucket-with-endpoint-replication.md
    expected_verdict: READY_TO_DEPLOY

  - id: object-lock-worm-creation
    difficulty: hard
    prompt_file: prompts/object-lock-worm-creation.md
    baseline_file: baselines/object-lock-worm-creation.md
    expected_verdict: READY_TO_DEPLOY

  - id: access-point-and-lifecycle
    difficulty: medium
    prompt_file: prompts/access-point-and-lifecycle.md
    baseline_file: baselines/access-point-and-lifecycle.md
    expected_verdict: READY_TO_DEPLOY

  - id: capacity-monitoring-setup
    difficulty: medium
    prompt_file: prompts/capacity-monitoring-setup.md
    baseline_file: baselines/capacity-monitoring-setup.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-endpoint
    difficulty: easy
    prompt_file: prompts/missing-endpoint.md
    baseline_file: baselines/missing-endpoint.md
    expected_verdict: PREREQUISITES_MISSING
