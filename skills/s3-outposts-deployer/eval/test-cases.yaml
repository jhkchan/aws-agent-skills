# Eval test cases for s3-outposts-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the READY_TO_DEPLOY /
# PREREQUISITES_MISSING classification across S3 on Outposts topologies
# (outpost bucket with endpoint and replication, object lock WORM at
# creation, access point configuration, capacity monitoring, missing
# endpoint prerequisite failure).
skill: s3-outposts-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: outpost-bucket-with-endpoint-replication
    description: >-
      Provision an S3 on Outposts bucket with a VPC endpoint, access
      point, and one-way replication to a cloud DR bucket. Expects
      READY_TO_DEPLOY with endpoint cited, SSE-S3 noted, and
      replication direction (Outpost to cloud) specified.
    input: |
      Create an S3 bucket on Outpost op-0abc123def456. Bucket name:
      my-outpost-bucket. I need a VPC endpoint in subnet subnet-abc123
      with security group sg-outpost-s3. Access point my-ap in VPC
      vpc-abc123. Replicate to cloud bucket s3://cloud-dr-bucket for
      DR. Versioning enabled. Account: 123456789012. Region us-east-1.
      Tags: Environment=onprem, Application=data-lake.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "endpoint"
        - "STANDARD"
        - "SSE-S3"
        - "replication"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: object-lock-worm-creation
    description: >-
      Provision an S3 on Outposts bucket with object lock (WORM) enabled
      at creation in COMPLIANCE mode. Expects READY_TO_DEPLOY with
      object lock mode cited and the at-creation requirement noted.
    input: |
      Create an S3 bucket on Outpost op-0xyz789abc with object lock
      enabled in COMPLIANCE mode. Bucket name: worm-outpost-bucket.
      I need the endpoint in subnet subnet-xyz789 with SG sg-worm-s3.
      Default retention 365 days. Account: 123456789012. Region
      us-east-1. Tags: Compliance=SEC17.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "object lock"
        - "COMPLIANCE"
        - "endpoint"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: access-point-and-lifecycle
    description: >-
      Provision an S3 on Outposts bucket with an access point and
      lifecycle expiration rule. Expects READY_TO_DEPLOY with access
      point cited and lifecycle expiration (not Glacier transition)
      noted.
    input: |
      Create an S3 bucket on Outpost op-0def456ghi. Bucket name:
      lifecycle-bucket. Access point lifecycle-ap in VPC vpc-def456.
      Endpoint in subnet subnet-def456 with SG sg-lifecycle-s3. I
      need a lifecycle rule to expire objects after 90 days. Versioning
      enabled. Account: 123456789012. Region us-east-1.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "access point"
        - "lifecycle"
        - "expire"
        - "STANDARD"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: capacity-monitoring-setup
    description: >-
      Provision an S3 on Outposts bucket with CloudWatch capacity
      monitoring and alerting. Expects READY_TO_DEPLOY with capacity
      alarm cited and the finite-storage constraint noted.
    input: |
      Create an S3 bucket on Outpost op-0cap123mon. Bucket name:
      monitored-bucket. Endpoint in subnet subnet-cap123 with SG
      sg-cap-s3. I need CloudWatch capacity monitoring with an alarm
      at 80 percent of 1TB. SNS topic arn:aws:sns:us-east-1:123456789012:outpost-alerts.
      Versioning enabled. Account: 123456789012. Region us-east-1.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "capacity"
        - "CloudWatch"
        - "alarm"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: missing-endpoint
    description: >-
      Operator requests an S3 on Outposts bucket but has no VPC endpoint
      and no subnet on the Outpost. This is a prerequisite failure —
      endpoint is mandatory for access.
    input: |
      Create an S3 bucket on Outpost op-0noendpoint. Bucket name:
      inaccessible-bucket. I do not have a VPC endpoint or a subnet on
      the Outpost yet. Just create the bucket for now.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "endpoint"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"
