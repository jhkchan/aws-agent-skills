# Eval configuration for qldb-ledger-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: qldb-ledger-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: standard-ledger-verification
    difficulty: hard
    prompt_file: prompts/standard-ledger-verification.md
    baseline_file: baselines/standard-ledger-verification.md
    expected_verdict: READY_TO_DEPLOY

  - id: cryptographic-verification
    difficulty: hard
    prompt_file: prompts/cryptographic-verification.md
    baseline_file: baselines/cryptographic-verification.md
    expected_verdict: READY_TO_DEPLOY

  - id: stream-kinesis-cdc
    difficulty: medium
    prompt_file: prompts/stream-kinesis-cdc.md
    baseline_file: baselines/stream-kinesis-cdc.md
    expected_verdict: READY_TO_DEPLOY

  - id: export-s3-compliance
    difficulty: medium
    prompt_file: prompts/export-s3-compliance.md
    baseline_file: baselines/export-s3-compliance.md
    expected_verdict: READY_TO_DEPLOY

  - id: allow-all-insecure
    difficulty: easy
    prompt_file: prompts/allow-all-insecure.md
    baseline_file: baselines/allow-all-insecure.md
    expected_verdict: PREREQUISITES_MISSING
