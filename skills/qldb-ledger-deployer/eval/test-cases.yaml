# Eval test cases for qldb-ledger-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the READY_TO_DEPLOY /
# PREREQUISITES_MISSING classification across QLDB topologies
# (standard ledger with deletion protection, cryptographic verification
# via digest + proof, stream to Kinesis for real-time CDC, journal export
# to S3 for compliance, ALLOW_ALL permissions mode prerequisite failure).
skill: qldb-ledger-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: standard-ledger-verification
    description: >-
      Provision a production QLDB ledger with STANDARD permissions mode,
      deletion protection, KMS encryption, tables, and indexes. Expects
      READY_TO_DEPLOY with STANDARD mode enforced, deletion protection
      enabled, and cryptographic verification workflow documented.
    input: |
      Create a QLDB ledger named audit-ledger in us-east-1. Permissions
      mode STANDARD. Enable deletion protection. KMS key
      arn:aws:kms:us-east-1:123456789012:key/abc123. Tables: transactions,
      accounts, audit_log. Indexes on transactions(transactionId,
      fromAccount) and accounts(accountId). Tags: Environment=production,
      Application=audit, Compliance=SOX.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "audit-ledger"
        - "STANDARD"
        - "deletion protection"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
        - "hash chain"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: cryptographic-verification
    description: >-
      Provision a QLDB ledger with the cryptographic verification
      workflow (digest + proof hash chain) documented. Expects
      READY_TO_DEPLOY with the digest/proof verification process detailed.
    input: |
      Create a QLDB ledger named compliance-ledger in us-east-1 for
      regulatory compliance with cryptographic verification. Permissions
      mode STANDARD. Deletion protection enabled. KMS key
      arn:aws:kms:us-east-1:123456789012:key/verify123. I need the
      full digest and proof verification workflow documented. Tables:
      compliance_records. Indexes on compliance_records(recordId).
      Tags: Environment=production, Compliance=HIPAA.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "compliance-ledger"
        - "digest"
        - "proof"
        - "VERDICT"
        - "CHECKLIST"
        - "hash chain"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: stream-kinesis-cdc
    description: >-
      Provision a QLDB ledger with streaming to Kinesis Data Streams for
      real-time change data capture. Expects READY_TO_DEPLOY with the
      Kinesis stream, IAM role, and stream configuration documented.
    input: |
      Create a QLDB ledger named realtime-events in us-east-1 with
      streaming to Kinesis for real-time CDC. Permissions mode STANDARD.
      Deletion protection. KMS key
      arn:aws:kms:us-east-1:123456789012:key/stream456. Kinesis stream
      qldb-events-stream. IAM role QLDBStreamRole. Stream start time
      2026-08-05T00:00:00Z. Tags: Environment=production, Pipeline=CDC.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "realtime-events"
        - "Kinesis"
        - "CDC"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: export-s3-compliance
    description: >-
      Provision a QLDB ledger with journal export to S3 for compliance
      audit. Expects READY_TO_DEPLOY with the S3 bucket, IAM role, and
      export configuration documented.
    input: |
      Create a QLDB ledger named regulatory-ledger in us-east-1 with
      journal export to S3 for compliance audit. Permissions mode
      STANDARD. Deletion protection. KMS key
      arn:aws:kms:us-east-1:123456789012:key/export789. S3 bucket
      qldb-regulatory-export. IAM role QLDBExportRole. Export time range
      2026-01-01 to 2026-12-31. Tags: Environment=production,
      Compliance=GDPR.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "regulatory-ledger"
        - "S3"
        - "export"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: allow-all-insecure
    description: >-
      Operator requests a QLDB ledger with ALLOW_ALL permissions mode and
      no deletion protection. This is a prerequisite failure for a
      production ledger. Expects PREREQUISITES_MISSING with ALLOW_ALL
      and missing deletion protection cited.
    input: |
      Create a QLDB ledger named prod-ledger in us-east-1. Permissions
      mode ALLOW_ALL. No deletion protection. KMS key
      arn:aws:kms:us-east-1:123456789012:key/abc123. Tags:
      Environment=production.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "ALLOW_ALL"
        - "deletion protection"
        - "VERDICT"
        - "CHECKLIST"
        - "STANDARD"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"
