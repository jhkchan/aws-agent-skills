# Eval configuration for lightsail-container-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: lightsail-container-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: public-image-managed-tls
    difficulty: hard
    prompt_file: prompts/public-image-managed-tls.md
    baseline_file: baselines/public-image-managed-tls.md
    expected_verdict: READY_TO_DEPLOY

  - id: ecr-private-with-auth
    difficulty: hard
    prompt_file: prompts/ecr-private-with-auth.md
    baseline_file: baselines/ecr-private-with-auth.md
    expected_verdict: READY_TO_DEPLOY

  - id: scale-power-tradeoff
    difficulty: medium
    prompt_file: prompts/scale-power-tradeoff.md
    baseline_file: baselines/scale-power-tradeoff.md
    expected_verdict: READY_TO_DEPLOY

  - id: custom-domain-deployment
    difficulty: medium
    prompt_file: prompts/custom-domain-deployment.md
    baseline_file: baselines/custom-domain-deployment.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-ecr-credentials
    difficulty: easy
    prompt_file: prompts/missing-ecr-credentials.md
    baseline_file: baselines/missing-ecr-credentials.md
    expected_verdict: PREREQUISITES_MISSING
