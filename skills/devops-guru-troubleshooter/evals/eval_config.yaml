# Eval configuration for devops-guru-troubleshooter.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: devops-guru-troubleshooter
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: proactive-alb-latency-from-deployment
    difficulty: hard
    prompt_file: prompts/proactive-alb-latency-from-deployment.md
    baseline_file: baselines/proactive-alb-latency-from-deployment.md
    expected_verdict: ROOT_CAUSE_FOUND
    expected_root_cause_category: PERFORMANCE

  - id: reactive-rds-failover-investigation
    difficulty: hard
    prompt_file: prompts/reactive-rds-failover-investigation.md
    baseline_file: baselines/reactive-rds-failover-investigation.md
    expected_verdict: ROOT_CAUSE_FOUND
    expected_root_cause_category: AVAILABILITY

  - id: false-positive-suppression-known-marketing-event
    difficulty: hard
    prompt_file: prompts/false-positive-suppression-known-marketing-event.md
    baseline_file: baselines/false-positive-suppression-known-marketing-event.md
    expected_verdict: ROOT_CAUSE_FOUND
    expected_root_cause_category: PERFORMANCE

  - id: missing-cloudtrail-coverage-need-more-info
    difficulty: medium
    prompt_file: prompts/missing-cloudtrail-coverage-need-more-info.md
    baseline_file: baselines/missing-cloudtrail-coverage-need-more-info.md
    expected_verdict: NEED_MORE_INFO

  - id: sse-config-insight-suppress-or-implement
    difficulty: medium
    prompt_file: prompts/sse-config-insight-suppress-or-implement.md
    baseline_file: baselines/sse-config-insight-suppress-or-implement.md
    expected_verdict: ROOT_CAUSE_FOUND
    expected_root_cause_category: CONFIGURATION
