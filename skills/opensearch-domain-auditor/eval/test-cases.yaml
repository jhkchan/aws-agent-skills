# Eval test cases for opensearch-domain-auditor
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# CONVENTION: must_contain uses CONCEPT tokens (verdict names, structural
# field labels) — not test-case IDs or API field names. The test-case id is
# embedded only in the resource name (domain name) so the model echoes it in
# the DOMAIN line for traceability without coupling assertions to identifiers.
skill: opensearch-domain-auditor
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: no-encryption-at-rest
    description: >-
      Internet-facing OpenSearch domain with encryption-at-rest disabled (no
      KMS). All other dimensions OK (NTN on, FGAC on, scoped policy, sized
      masters, slow logs published). Verdict driver is the at-rest gap.
    input: |
      Domain name: no-encryption-at-rest
      Domain ARN: arn:aws:es:us-east-1:111111111111:domain/no-encryption-at-rest
      Domain configuration (describe-domain-config):
        EngineVersion: OpenSearch_2.11
        ClusterConfig:
          DedicatedMasterEnabled: true
          DedicatedMasterType: m5.large.search
          DedicatedMasterCount: 3
          InstanceType: m5.large.search
          InstanceCount: 3
          ZoneAwarenessEnabled: true
        EncryptionAtRestOptions:
          Enabled: false
        NodeToNodeEncryptionOptions:
          Enabled: true
        DomainEndpointOptions:
          EnforceHTTPS: true
        AdvancedSecurityOptions:
          Enabled: true
          InternalUserDatabaseEnabled: false
        LogPublishingOptions:
          SEARCH_SLOW_LOGS:
            Enabled: true
            CloudWatchLogsLogGroupArn: arn:aws:logs:us-east-1:111111111111:log-group:/aws/opensearch/no-encryption-at-rest/search-slow
          INDEX_SLOW_LOGS:
            Enabled: true
            CloudWatchLogsLogGroupArn: arn:aws:logs:us-east-1:111111111111:log-group:/aws/opensearch/no-encryption-at-rest/index-slow
      Access policy (describe-domain-access-policy):
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "RootAccess",
              "Effect": "Allow",
              "Principal": {"AWS": "arn:aws:iam::111111111111:root"},
              "Action": "es:*",
              "Resource": "arn:aws:es:us-east-1:111111111111:domain/no-encryption-at-rest/*"
            },
            {
              "Sid": "AppRead",
              "Effect": "Allow",
              "Principal": {"AWS": "arn:aws:iam::111111111111:role/app-reader"},
              "Action": ["es:ESHttpGet", "es:ESHttpHead"],
              "Resource": "arn:aws:es:us-east-1:111111111111:domain/no-encryption-at-rest/*"
            }
          ]
        }
      Emit the standard VERDICT block (DOMAIN, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: NO_ENCRYPTION
    assertions:
      must_contain:
        - "NO_ENCRYPTION"
        - "VERDICT"
        - "REASON"
        - "FINDINGS"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: PUBLIC_ACCESS"
        - "VERDICT: NO_FGAC"
        - "VERDICT: CONFIG_GAP"

  - id: public-access-wildcard-http
    description: >-
      Internet-facing OpenSearch domain with a wildcard Principal granting
      es:ESHttp* and no restrictive condition — any AWS account holder can
      read/write every document. Encryption and FGAC are off (compounding) but
      the verdict driver is the public data-plane exposure.
    input: |
      Domain name: public-access-wildcard-http
      Domain ARN: arn:aws:es:us-east-1:111111111111:domain/public-access-wildcard-http
      Domain configuration (describe-domain-config):
        EngineVersion: OpenSearch_2.11
        ClusterConfig:
          DedicatedMasterEnabled: true
          DedicatedMasterType: m5.large.search
          DedicatedMasterCount: 3
          InstanceType: m5.large.search
          InstanceCount: 3
          ZoneAwarenessEnabled: true
        EncryptionAtRestOptions:
          Enabled: true
          KmsKeyId: arn:aws:kms:us-east-1:111111111111:key/customer-cmk-12345
        NodeToNodeEncryptionOptions:
          Enabled: true
        DomainEndpointOptions:
          EnforceHTTPS: true
        AdvancedSecurityOptions:
          Enabled: false
        LogPublishingOptions:
          SEARCH_SLOW_LOGS:
            Enabled: true
            CloudWatchLogsLogGroupArn: arn:aws:logs:us-east-1:111111111111:log-group:/aws/opensearch/public-access-wildcard-http/search-slow
          INDEX_SLOW_LOGS:
            Enabled: true
            CloudWatchLogsLogGroupArn: arn:aws:logs:us-east-1:111111111111:log-group:/aws/opensearch/public-access-wildcard-http/index-slow
      Access policy (describe-domain-access-policy):
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "OpenAccess",
              "Effect": "Allow",
              "Principal": "*",
              "Action": "es:ESHttp*",
              "Resource": "arn:aws:es:us-east-1:111111111111:domain/public-access-wildcard-http/*"
            }
          ]
        }
      Emit the standard VERDICT block (DOMAIN, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: PUBLIC_ACCESS
    assertions:
      must_contain:
        - "PUBLIC_ACCESS"
        - "VERDICT"
        - "REASON"
        - "FINDINGS"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: NO_ENCRYPTION"
        - "VERDICT: NO_FGAC"
        - "VERDICT: CONFIG_GAP"

  - id: no-fgac-internet-exposed
    description: >-
      Internet-facing OpenSearch domain with customer-managed CMK at-rest,
      NTN on, access policy scoped to a same-account role (NOT a wildcard
      principal) but FGAC is disabled — anyone assuming the role has
      unrestricted access to every index (no per-index enforcement). The
      lack of FGAC is the verdict driver on an internet-facing domain.
    input: |
      Domain name: no-fgac-internet-exposed
      Domain ARN: arn:aws:es:us-east-1:111111111111:domain/no-fgac-internet-exposed
      Domain configuration (describe-domain-config):
        EngineVersion: OpenSearch_2.11
        ClusterConfig:
          DedicatedMasterEnabled: true
          DedicatedMasterType: m5.large.search
          DedicatedMasterCount: 3
          InstanceType: m5.large.search
          InstanceCount: 3
          ZoneAwarenessEnabled: true
        EncryptionAtRestOptions:
          Enabled: true
          KmsKeyId: arn:aws:kms:us-east-1:111111111111:key/customer-cmk-12345
        NodeToNodeEncryptionOptions:
          Enabled: true
        DomainEndpointOptions:
          EnforceHTTPS: true
        AdvancedSecurityOptions:
          Enabled: false
        LogPublishingOptions:
          SEARCH_SLOW_LOGS:
            Enabled: true
            CloudWatchLogsLogGroupArn: arn:aws:logs:us-east-1:111111111111:log-group:/aws/opensearch/no-fgac-internet-exposed/search-slow
          INDEX_SLOW_LOGS:
            Enabled: true
            CloudWatchLogsLogGroupArn: arn:aws:logs:us-east-1:111111111111:log-group:/aws/opensearch/no-fgac-internet-exposed/index-slow
      Access policy (describe-domain-access-policy):
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "RootAccess",
              "Effect": "Allow",
              "Principal": {"AWS": "arn:aws:iam::111111111111:root"},
              "Action": "es:*",
              "Resource": "arn:aws:es:us-east-1:111111111111:domain/no-fgac-internet-exposed/*"
            },
            {
              "Sid": "AppHttp",
              "Effect": "Allow",
              "Principal": {"AWS": "arn:aws:iam::111111111111:role/app-search-role"},
              "Action": "es:ESHttp*",
              "Resource": "arn:aws:es:us-east-1:111111111111:domain/no-fgac-internet-exposed/*"
            }
          ]
        }
      Emit the standard VERDICT block (DOMAIN, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: NO_FGAC
    assertions:
      must_contain:
        - "NO_FGAC"
        - "VERDICT"
        - "REASON"
        - "FINDINGS"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: NO_ENCRYPTION"
        - "VERDICT: PUBLIC_ACCESS"
        - "VERDICT: CONFIG_GAP"

  - id: config-gap-no-ntn-weak-master-no-slowlogs
    description: >-
      OpenSearch domain with CMK at-rest encryption, FGAC on, scoped access
      policy. Multiple CONFIG_GAP dimensions: NTN off (immutable — domain
      recreation required), dedicated master below m5 recommendation, single-AZ
      deployment, no slow log publishing. No NO_ENCRYPTION / PUBLIC_ACCESS /
      NO_FGAC trigger fires; the verdict aggregates the config gaps.
    input: |
      Domain name: config-gap-no-ntn-weak-master-no-slowlogs
      Domain ARN: arn:aws:es:us-east-1:111111111111:domain/config-gap-no-ntn-weak-master-no-slowlogs
      Domain configuration (describe-domain-config):
        EngineVersion: OpenSearch_2.11
        ClusterConfig:
          DedicatedMasterEnabled: true
          DedicatedMasterType: t3.small.search
          DedicatedMasterCount: 3
          InstanceType: m5.large.search
          InstanceCount: 3
          ZoneAwarenessEnabled: false
        EncryptionAtRestOptions:
          Enabled: true
          KmsKeyId: arn:aws:kms:us-east-1:111111111111:key/customer-cmk-12345
        NodeToNodeEncryptionOptions:
          Enabled: false
        DomainEndpointOptions:
          EnforceHTTPS: false
        AdvancedSecurityOptions:
          Enabled: true
          InternalUserDatabaseEnabled: false
        LogPublishingOptions: {}
      Access policy (describe-domain-access-policy):
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "RootAccess",
              "Effect": "Allow",
              "Principal": {"AWS": "arn:aws:iam::111111111111:root"},
              "Action": "es:*",
              "Resource": "arn:aws:es:us-east-1:111111111111:domain/config-gap-no-ntn-weak-master-no-slowlogs/*"
            }
          ]
        }
      Emit the standard VERDICT block (DOMAIN, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: CONFIG_GAP
    assertions:
      must_contain:
        - "CONFIG_GAP"
        - "VERDICT"
        - "REASON"
        - "FINDINGS"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: NO_ENCRYPTION"
        - "VERDICT: PUBLIC_ACCESS"
        - "VERDICT: NO_FGAC"

  - id: ok-clean-production
    description: >-
      Fully hardened production OpenSearch domain — VPC-backed (no public
      endpoint), customer-managed CMK at-rest, NTN on, FGAC on with IAM master,
      three m5.large.search dedicated masters across three AZs, slow logs
      published, scoped access policy. All dimensions pass. Verdict: OK.
    input: |
      Domain name: ok-clean-production
      Domain ARN: arn:aws:es:us-east-1:111111111111:domain/ok-clean-production
      Domain configuration (describe-domain-config):
        EngineVersion: OpenSearch_2.11
        ClusterConfig:
          DedicatedMasterEnabled: true
          DedicatedMasterType: m5.large.search
          DedicatedMasterCount: 3
          InstanceType: m5.large.search
          InstanceCount: 3
          ZoneAwarenessEnabled: true
          ZoneAwarenessConfig:
            AvailabilityZoneCount: 3
        EncryptionAtRestOptions:
          Enabled: true
          KmsKeyId: arn:aws:kms:us-east-1:111111111111:key/prod-cmk-67890
        NodeToNodeEncryptionOptions:
          Enabled: true
        DomainEndpointOptions:
          EnforceHTTPS: true
        AdvancedSecurityOptions:
          Enabled: true
          InternalUserDatabaseEnabled: false
        VPCOptions:
          SubnetIds: ["subnet-abc", "subnet-def", "subnet-ghi"]
          SecurityGroupIds: ["sg-private"]
        LogPublishingOptions:
          SEARCH_SLOW_LOGS:
            Enabled: true
            CloudWatchLogsLogGroupArn: arn:aws:logs:us-east-1:111111111111:log-group:/aws/opensearch/ok-clean-production/search-slow
          INDEX_SLOW_LOGS:
            Enabled: true
            CloudWatchLogsLogGroupArn: arn:aws:logs:us-east-1:111111111111:log-group:/aws/opensearch/ok-clean-production/index-slow
      Access policy (describe-domain-access-policy):
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "RootAccess",
              "Effect": "Allow",
              "Principal": {"AWS": "arn:aws:iam::111111111111:root"},
              "Action": "es:*",
              "Resource": "arn:aws:es:us-east-1:111111111111:domain/ok-clean-production/*"
            },
            {
              "Sid": "AppHttp",
              "Effect": "Allow",
              "Principal": {"AWS": "arn:aws:iam::111111111111:role/app-search-role"},
              "Action": ["es:ESHttpGet", "es:ESHttpHead", "es:ESHttpPost"],
              "Resource": "arn:aws:es:us-east-1:111111111111:domain/ok-clean-production/*"
            }
          ]
        }
      Emit the standard VERDICT block (DOMAIN, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: OK
    assertions:
      must_contain:
        - "OK"
        - "VERDICT"
        - "REASON"
        - "FINDINGS"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: NO_ENCRYPTION"
        - "VERDICT: PUBLIC_ACCESS"
        - "VERDICT: NO_FGAC"
        - "VERDICT: CONFIG_GAP"

  - id: no-encryption-and-public-worst-first
    description: >-
      Internet-facing OpenSearch domain with BOTH encryption-at-rest disabled
      AND a Principal "*" + es:ESHttp* grant with no condition. Tests worst-
      first verdict aggregation: NO_ENCRYPTION outranks PUBLIC_ACCESS per the
      precedence order, with PUBLIC_ACCESS retained as an additional finding.
      Verdict: NO_ENCRYPTION.
    input: |
      Domain name: no-encryption-and-public-worst-first
      Domain ARN: arn:aws:es:us-east-1:111111111111:domain/no-encryption-and-public-worst-first
      Domain configuration (describe-domain-config):
        EngineVersion: OpenSearch_2.11
        ClusterConfig:
          DedicatedMasterEnabled: true
          DedicatedMasterType: m5.large.search
          DedicatedMasterCount: 3
          InstanceType: m5.large.search
          InstanceCount: 3
          ZoneAwarenessEnabled: true
        EncryptionAtRestOptions:
          Enabled: false
        NodeToNodeEncryptionOptions:
          Enabled: false
        DomainEndpointOptions:
          EnforceHTTPS: false
        AdvancedSecurityOptions:
          Enabled: false
        LogPublishingOptions: {}
      Access policy (describe-domain-access-policy):
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "OpenAccess",
              "Effect": "Allow",
              "Principal": "*",
              "Action": "es:ESHttp*",
              "Resource": "arn:aws:es:us-east-1:111111111111:domain/no-encryption-and-public-worst-first/*"
            }
          ]
        }
      Emit the standard VERDICT block (DOMAIN, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: NO_ENCRYPTION
    assertions:
      must_contain:
        - "NO_ENCRYPTION"
        - "VERDICT"
        - "REASON"
        - "FINDINGS"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: PUBLIC_ACCESS"
        - "VERDICT: NO_FGAC"
        - "VERDICT: CONFIG_GAP"
