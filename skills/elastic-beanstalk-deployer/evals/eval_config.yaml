# Eval configuration for elastic-beanstalk-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: elastic-beanstalk-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: web-server-nodejs-alb
    difficulty: hard
    prompt_file: prompts/web-server-nodejs-alb.md
    baseline_file: baselines/web-server-nodejs-alb.md
    expected_verdict: READY_TO_DEPLOY

  - id: worker-tier-sqs
    difficulty: hard
    prompt_file: prompts/worker-tier-sqs.md
    baseline_file: baselines/worker-tier-sqs.md
    expected_verdict: READY_TO_DEPLOY

  - id: blue-green-cname-swap
    difficulty: hard
    prompt_file: prompts/blue-green-cname-swap.md
    baseline_file: baselines/blue-green-cname-swap.md
    expected_verdict: READY_TO_DEPLOY

  - id: ebextensions-rds-config
    difficulty: medium
    prompt_file: prompts/ebextensions-rds-config.md
    baseline_file: baselines/ebextensions-rds-config.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-service-role
    difficulty: easy
    prompt_file: prompts/missing-service-role.md
    baseline_file: baselines/missing-service-role.md
    expected_verdict: PREREQUISITES_MISSING
