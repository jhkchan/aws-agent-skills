          SubnetId: subnet-aaa333
          EniId: eni-020
          State: ACTIVE
        - HsmId: hsm-021
          AvailabilityZone: us-east-1b
          SubnetId: subnet-bbb333
          EniId: eni-021
          State: ACTIVE
        - HsmId: hsm-022
          AvailabilityZone: us-east-1c
          SubnetId: subnet-ccc333
          EniId: eni-022
          State: ACTIVE
      Backups: []
      PKCS#11 management:
        co_password_changed: true
