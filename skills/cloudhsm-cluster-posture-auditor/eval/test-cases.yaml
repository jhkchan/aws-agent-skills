# Eval test cases for cloudhsm-cluster-posture-auditor
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
skill: cloudhsm-cluster-posture-auditor
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: single-az-single-hsm
    description: >-
      CloudHSM cluster with a single HSM in a single AZ and backup retention
      disabled — no AZ-level redundancy and no recovery path.
    input: |
      Cluster id: cluster-single-az-single-hsm
      Cluster metadata:
        State: INITIALIZED
        HsmType: hsm1m.medium
        VpcId: vpc-0abc123
        CreateDate: 2026-06-01T10:00:00Z
        BackupRetentionPolicy:
          Type: DAYS
          Value: "0"
        SubnetMapping:
          us-east-1a: subnet-aaa111
        SecurityGroup:
          - sg-hsm001
      HSMs:
        - HsmId: hsm-001
          AvailabilityZone: us-east-1a
          SubnetId: subnet-aaa111
          EniId: eni-001
          State: ACTIVE
      Backups: []
      PKCS#11 management:
        co_password_changed: true
      Security group rules (sg-hsm001):
        inbound:
          - source: 10.0.1.0/24
            ports: 2223-2225
      Emit the standard VERDICT block (CLUSTER, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: SINGLE_AZ
    assertions:
      must_contain:
        - "SINGLE_AZ"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: NO_BACKUP"
        - "VERDICT: CONFIG_GAP"

  - id: same-az-three-hsm
    description: >-
      CloudHSM cluster with three HSMs all co-located in the same AZ — HSM-level
      redundancy but zero AZ-level redundancy despite the HSM count.
