          us-east-1a: subnet-aaa222
        SecurityGroup:
          - sg-hsm002
      HSMs:
        - HsmId: hsm-010
          AvailabilityZone: us-east-1a
          SubnetId: subnet-aaa222
          EniId: eni-010
          State: ACTIVE
        - HsmId: hsm-011
          AvailabilityZone: us-east-1a
          SubnetId: subnet-aaa222
          EniId: eni-011
          State: ACTIVE
        - HsmId: hsm-012
          AvailabilityZone: us-east-1a
          SubnetId: subnet-aaa222
          EniId: eni-012
          State: ACTIVE
      Backups:
        - BackupId: backup-101
          CreateDate: 2026-08-04T12:00:00Z
          State: READY
        - BackupId: backup-102
          CreateDate: 2026-08-03T12:00:00Z
          State: READY
      PKCS#11 management:
        co_password_changed: true
      Security group rules (sg-hsm002):
        inbound:
          - source: 10.0.2.0/24
            ports: 2223-2225
      Emit the standard VERDICT block (CLUSTER, VERDICT, REASON, FINDINGS, REMEDIATION).
    expected_verdict: SINGLE_AZ
    assertions:
      must_contain:
        - "SINGLE_AZ"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
