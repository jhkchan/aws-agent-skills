# Eval configuration for cloudformation-stackset-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: cloudformation-stackset-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: service-managed-ou-deployment
    difficulty: hard
    prompt_file: prompts/service-managed-ou-deployment.md
    baseline_file: baselines/service-managed-ou-deployment.md
    expected_verdict: READY_TO_DEPLOY

  - id: self-managed-account-list
    difficulty: hard
    prompt_file: prompts/self-managed-account-list.md
    baseline_file: baselines/self-managed-account-list.md
    expected_verdict: READY_TO_DEPLOY

  - id: drift-detection-managed-execution
    difficulty: medium
    prompt_file: prompts/drift-detection-managed-execution.md
    baseline_file: baselines/drift-detection-managed-execution.md
    expected_verdict: READY_TO_DEPLOY

  - id: operation-preferences-tuning
    difficulty: medium
    prompt_file: prompts/operation-preferences-tuning.md
    baseline_file: baselines/operation-preferences-tuning.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-trusted-access
    difficulty: easy
    prompt_file: prompts/missing-trusted-access.md
    baseline_file: baselines/missing-trusted-access.md
    expected_verdict: PREREQUISITES_MISSING
