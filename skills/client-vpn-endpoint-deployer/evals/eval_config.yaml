# Eval configuration for client-vpn-endpoint-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: client-vpn-endpoint-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: mutual-tls-split-tunnel
    difficulty: hard
    prompt_file: prompts/mutual-tls-split-tunnel.md
    baseline_file: baselines/mutual-tls-split-tunnel.md
    expected_verdict: READY_TO_DEPLOY

  - id: saml-federation-self-service-portal
    difficulty: hard
    prompt_file: prompts/saml-federation-self-service-portal.md
    baseline_file: baselines/saml-federation-self-service-portal.md
    expected_verdict: READY_TO_DEPLOY

  - id: active-directory-full-tunnel
    difficulty: medium
    prompt_file: prompts/active-directory-full-tunnel.md
    baseline_file: baselines/active-directory-full-tunnel.md
    expected_verdict: READY_TO_DEPLOY

  - id: authorization-rule-ordering
    difficulty: medium
    prompt_file: prompts/authorization-rule-ordering.md
    baseline_file: baselines/authorization-rule-ordering.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-server-certificate
    difficulty: easy
    prompt_file: prompts/missing-server-certificate.md
    baseline_file: baselines/missing-server-certificate.md
    expected_verdict: PREREQUISITES_MISSING
