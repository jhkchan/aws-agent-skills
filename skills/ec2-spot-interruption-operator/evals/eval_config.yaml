# Eval configuration for ec2-spot-interruption-operator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob).
skill_name: ec2-spot-interruption-operator
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: handle-interruption-graceful-shutdown-completed
    difficulty: hard
    prompt_file: prompts/handle-interruption-graceful-shutdown-completed.md
    baseline_file: baselines/handle-interruption-graceful-shutdown-completed.md
    expected_verdict: OPERATION_COMPLETED
    expected_risk: MODERATE
  - id: tune-strategy-lowest-price-review-required
    difficulty: hard
    prompt_file: prompts/tune-strategy-lowest-price-review-required.md
    baseline_file: baselines/tune-strategy-lowest-price-review-required.md
    expected_verdict: REVIEW_REQUIRED
    expected_risk: HIGH
  - id: lambda-reserved-concurrency-zero-review-required
    difficulty: hard
    prompt_file: prompts/lambda-reserved-concurrency-zero-review-required.md
    baseline_file: baselines/lambda-reserved-concurrency-zero-review-required.md
    expected_verdict: REVIEW_REQUIRED
    expected_risk: HIGH
  - id: audit-diversification-single-pool-review-required
    difficulty: medium
    prompt_file: prompts/audit-diversification-single-pool-review-required.md
    baseline_file: baselines/audit-diversification-single-pool-review-required.md
    expected_verdict: REVIEW_REQUIRED
    expected_risk: HIGH
  - id: validate-placement-score-good-completed
    difficulty: medium
    prompt_file: prompts/validate-placement-score-good-completed.md
    baseline_file: baselines/validate-placement-score-good-completed.md
    expected_verdict: OPERATION_COMPLETED
    expected_risk: LOW
