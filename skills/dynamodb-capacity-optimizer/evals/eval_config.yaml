# Eval configuration for dynamodb-capacity-optimizer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: dynamodb-capacity-optimizer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: provisioned-to-ondemand-crossover
    difficulty: medium
    prompt_file: prompts/provisioned-to-ondemand-crossover.md
    baseline_file: baselines/provisioned-to-ondemand-crossover.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
  - id: autoscaling-target-tuning
    difficulty: hard
    prompt_file: prompts/autoscaling-target-tuning.md
    baseline_file: baselines/autoscaling-target-tuning.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
  - id: gsi-projection-bloat
    difficulty: hard
    prompt_file: prompts/gsi-projection-bloat.md
    baseline_file: baselines/gsi-projection-bloat.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
  - id: already-optimal-table
    difficulty: easy
    prompt_file: prompts/already-optimal-table.md
    baseline_file: baselines/already-optimal-table.md
    expected_verdict: ALREADY_OPTIMAL
  - id: hot-partition-skew
    difficulty: hard
    prompt_file: prompts/hot-partition-skew.md
    baseline_file: baselines/hot-partition-skew.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
