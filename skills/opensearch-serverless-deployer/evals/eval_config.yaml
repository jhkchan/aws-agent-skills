# Eval configuration for opensearch-serverless-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: opensearch-serverless-deployer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: vectorsearch-full-security
    difficulty: easy
    prompt_file: prompts/vectorsearch-full-security.md
    baseline_file: baselines/vectorsearch-full-security.md
    expected_verdict: READY_TO_DEPLOY
  - id: timeseries-lifecycle-deploy
    difficulty: medium
    prompt_file: prompts/timeseries-lifecycle-deploy.md
    baseline_file: baselines/timeseries-lifecycle-deploy.md
    expected_verdict: READY_TO_DEPLOY
  - id: kms-asymmetric-key-blocker
    difficulty: medium
    prompt_file: prompts/kms-asymmetric-key-blocker.md
    baseline_file: baselines/kms-asymmetric-key-blocker.md
    expected_verdict: PREREQUISITES_MISSING
  - id: missing-encryption-policy
    difficulty: hard
    prompt_file: prompts/missing-encryption-policy.md
    baseline_file: baselines/missing-encryption-policy.md
    expected_verdict: PREREQUISITES_MISSING
  - id: missing-required-fields
    difficulty: easy
    prompt_file: prompts/missing-required-fields.md
    baseline_file: baselines/missing-required-fields.md
    expected_verdict: PREREQUISITES_MISSING
