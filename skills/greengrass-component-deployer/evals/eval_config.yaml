# Eval configuration for greengrass-component-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: greengrass-component-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: basic-component-deploy
    difficulty: hard
    prompt_file: prompts/basic-component-deploy.md
    baseline_file: baselines/basic-component-deploy.md
    expected_verdict: READY_TO_DEPLOY

  - id: docker-component
    difficulty: hard
    prompt_file: prompts/docker-component.md
    baseline_file: baselines/docker-component.md
    expected_verdict: READY_TO_DEPLOY

  - id: lambda-component
    difficulty: medium
    prompt_file: prompts/lambda-component.md
    baseline_file: baselines/lambda-component.md
    expected_verdict: READY_TO_DEPLOY

  - id: dependency-chain
    difficulty: medium
    prompt_file: prompts/dependency-chain.md
    baseline_file: baselines/dependency-chain.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-recipe-lifecycle
    difficulty: easy
    prompt_file: prompts/missing-recipe-lifecycle.md
    baseline_file: baselines/missing-recipe-lifecycle.md
    expected_verdict: PREREQUISITES_MISSING
