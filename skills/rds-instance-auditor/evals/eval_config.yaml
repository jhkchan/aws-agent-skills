# Eval configuration for rds-instance-auditor.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: rds-instance-auditor
snapshot_date: "2026-08-05"
baseline_model: amazon.nova-pro-v1:0
judge_model: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: public-and-unencrypted
    difficulty: medium
    prompt_file: prompts/public-and-unencrypted.md
    baseline_file: baselines/public-and-unencrypted.md
    expected_verdict: PUBLIC
    expected_risk: CRITICAL
  - id: unencrypted-internal-db
    difficulty: medium
    prompt_file: prompts/unencrypted-internal-db.md
    baseline_file: baselines/unencrypted-internal-db.md
    expected_verdict: UNENCRYPTED
    expected_risk: HIGH
  - id: no-deletion-protection-prod
    difficulty: easy
    prompt_file: prompts/no-deletion-protection-prod.md
    baseline_file: baselines/no-deletion-protection-prod.md
    expected_verdict: NO_DELETION_PROTECTION
    expected_risk: HIGH
  - id: single-az-dev
    difficulty: easy
    prompt_file: prompts/single-az-dev.md
    baseline_file: baselines/single-az-dev.md
    expected_verdict: SINGLE_AZ
    expected_risk: MEDIUM
  - id: config-gap-stale
    difficulty: hard
    prompt_file: prompts/config-gap-stale.md
    baseline_file: baselines/config-gap-stale.md
    expected_verdict: CONFIG_GAP
    expected_risk: MEDIUM
  - id: hardened-multi-az-prod
    difficulty: easy
    prompt_file: prompts/hardened-multi-az-prod.md
    baseline_file: baselines/hardened-multi-az-prod.md
    expected_verdict: OK
    expected_risk: LOW
