# Eval configuration for cloudfront-keyvaluestore-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: cloudfront-keyvaluestore-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: ab-testing-kvs-function
    difficulty: hard
    prompt_file: prompts/ab-testing-kvs-function.md
    baseline_file: baselines/ab-testing-kvs-function.md
    expected_verdict: READY_TO_DEPLOY

  - id: feature-flags-kvs
    difficulty: hard
    prompt_file: prompts/feature-flags-kvs.md
    baseline_file: baselines/feature-flags-kvs.md
    expected_verdict: READY_TO_DEPLOY

  - id: ip-allowlist-kvs
    difficulty: medium
    prompt_file: prompts/ip-allowlist-kvs.md
    baseline_file: baselines/ip-allowlist-kvs.md
    expected_verdict: READY_TO_DEPLOY

  - id: wrong-runtime-js-1
    difficulty: easy
    prompt_file: prompts/wrong-runtime-js-1.md
    baseline_file: baselines/wrong-runtime-js-1.md
    expected_verdict: PREREQUISITES_MISSING

  - id: kvs-size-limit-exceeded
    difficulty: easy
    prompt_file: prompts/kvs-size-limit-exceeded.md
    baseline_file: baselines/kvs-size-limit-exceeded.md
    expected_verdict: PREREQUISITES_MISSING
