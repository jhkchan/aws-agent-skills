# Eval configuration for cloud9-environment-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: cloud9-environment-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: ssm-no-ingress-ubuntu
    difficulty: hard
    prompt_file: prompts/ssm-no-ingress-ubuntu.md
    baseline_file: baselines/ssm-no-ingress-ubuntu.md
    expected_verdict: READY_TO_DEPLOY

  - id: ssh-connection-amazon-linux
    difficulty: hard
    prompt_file: prompts/ssh-connection-amazon-linux.md
    baseline_file: baselines/ssh-connection-amazon-linux.md
    expected_verdict: READY_TO_DEPLOY

  - id: team-sharing-write
    difficulty: medium
    prompt_file: prompts/team-sharing-write.md
    baseline_file: baselines/team-sharing-write.md
    expected_verdict: READY_TO_DEPLOY

  - id: cost-optimization-hibernate
    difficulty: medium
    prompt_file: prompts/cost-optimization-hibernate.md
    baseline_file: baselines/cost-optimization-hibernate.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-instance-profile
    difficulty: easy
    prompt_file: prompts/missing-instance-profile.md
    baseline_file: baselines/missing-instance-profile.md
    expected_verdict: PREREQUISITES_MISSING
