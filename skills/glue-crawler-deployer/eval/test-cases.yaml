# Eval test cases for glue-crawler-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the READY_TO_DEPLOY /
# PREREQUISITES_MISSING classification across Glue Crawler scenarios
# (S3 crawler with custom JSON classifier and partition projection,
# DynamoDB export crawl, JDBC crawler with connection, event-driven
# crawl with Lake Formation, missing IAM role prerequisite failure).
skill: glue-crawler-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: s3-crawler-classifier-projection
    description: >-
      Provision an S3 Glue Crawler with a custom JSON classifier,
      partition projection for year/month/day, incremental crawl,
      and daily cron schedule. Expects READY_TO_DEPLOY with classifier
      ordering noted, partition projection configured, and incremental
      crawl enabled.
    input: |
      Create a Glue Crawler for S3 data at
      s3://my-data-lake/events/year=2026/. Data is JSON files with
      nested event_id, timestamp, event_type, and payload fields.
      Create a custom JSON classifier named EventsJsonClassifier.
      Use partition projection for year, month, and day columns.
      Database analytics_db. Incremental crawl. Daily schedule at
      2 AM UTC. Table prefix raw_. Tags: Environment=production,
      DataSource=s3-events.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "EventsJsonClassifier"
        - "partition"
        - "incremental"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: dynamodb-export-crawl
    description: >-
      Provision a Glue Crawler for DynamoDB export data in S3.
      Expects READY_TO_DEPLOY with DynamoDB export path noted,
      DYNAMODB_JSON format referenced, and correct S3 path.
    input: |
      Create a Glue Crawler for a DynamoDB table exported to S3.
      The table UserEvents was exported to
      s3://my-ddb-exports/dynamodb/UserEvents/ in DYNAMODB_JSON
      format. Database dynamo_db. Full crawl. Weekly schedule.
      Tags: Environment=production, Source=dynamodb.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "DYNAMODB_JSON"
        - "s3://my-ddb-exports"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: jdbc-crawler-connection
    description: >-
      Provision a Glue Crawler for a JDBC data source (PostgreSQL).
      Expects READY_TO_DEPLOY with Glue Connection noted, JDBC targets
      configured, and connection network requirements flagged.
    input: |
      Create a Glue Crawler for a PostgreSQL database. Glue Connection
      name pg-connection. Crawl the public schema. Database jdbc_db.
      Full crawl. On-demand schedule initially. IAM role
      GlueJdbcCrawlerRole. Tags: Environment=production,
      Source=postgresql.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "pg-connection"
        - "jdbc"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: lake-formation-event-driven
    description: >-
      Provision a Glue Crawler with Lake Formation integration and
      event-driven crawl via S3 Event Notifications. Expects
      READY_TO_DEPLOY with LF permissions noted, event-driven schedule
      configured, and MergeNewColumns schema policy.
    input: |
      Create a Glue Crawler for S3 data at s3://my-data-lake/logs/.
      The database lf_analytics_db is Lake Formation-enabled. Crawler
      role GlueLFCrawlerRole needs LF permissions. Event-driven crawl
      triggered by S3 ObjectCreated events on the logs/ prefix.
      Custom Grok classifier AppLogClassifier for log parsing.
      MergeNewColumns schema policy. Tags: Environment=production,
      Governance=lake-formation.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "Lake Formation"
        - "event-driven"
        - "AppLogClassifier"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: missing-iam-role
    description: >-
      Operator requests a Glue Crawler but does not provide an IAM
      role or S3 data source path. This is a prerequisite failure.
      Expects PREREQUISITES_MISSING with the IAM role and data source
      gaps cited.
    input: |
      Create a Glue Crawler for my S3 data. I need it to discover
      schema and create tables. Daily schedule. Use incremental crawl.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "IAM"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"
