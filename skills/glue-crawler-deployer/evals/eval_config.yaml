# Eval configuration for glue-crawler-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: glue-crawler-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: s3-crawler-classifier-projection
    difficulty: hard
    prompt_file: prompts/s3-crawler-classifier-projection.md
    baseline_file: baselines/s3-crawler-classifier-projection.md
    expected_verdict: READY_TO_DEPLOY

  - id: dynamodb-export-crawl
    difficulty: medium
    prompt_file: prompts/dynamodb-export-crawl.md
    baseline_file: baselines/dynamodb-export-crawl.md
    expected_verdict: READY_TO_DEPLOY

  - id: jdbc-crawler-connection
    difficulty: medium
    prompt_file: prompts/jdbc-crawler-connection.md
    baseline_file: baselines/jdbc-crawler-connection.md
    expected_verdict: READY_TO_DEPLOY

  - id: lake-formation-event-driven
    difficulty: hard
    prompt_file: prompts/lake-formation-event-driven.md
    baseline_file: baselines/lake-formation-event-driven.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-iam-role
    difficulty: easy
    prompt_file: prompts/missing-iam-role.md
    baseline_file: baselines/missing-iam-role.md
    expected_verdict: PREREQUISITES_MISSING
