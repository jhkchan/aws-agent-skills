# Eval configuration for eventbridge-scheduler-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: eventbridge-scheduler-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: lambda-rate-schedule
    difficulty: hard
    prompt_file: prompts/lambda-rate-schedule.md
    baseline_file: baselines/lambda-rate-schedule.md
    expected_verdict: READY_TO_DEPLOY

  - id: stepfunctions-cron-schedule
    difficulty: hard
    prompt_file: prompts/stepfunctions-cron-schedule.md
    baseline_file: baselines/stepfunctions-cron-schedule.md
    expected_verdict: READY_TO_DEPLOY

  - id: sns-one-time-schedule
    difficulty: medium
    prompt_file: prompts/sns-one-time-schedule.md
    baseline_file: baselines/sns-one-time-schedule.md
    expected_verdict: READY_TO_DEPLOY

  - id: group-bulk-operations
    difficulty: medium
    prompt_file: prompts/group-bulk-operations.md
    baseline_file: baselines/group-bulk-operations.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-target-iam-role
    difficulty: easy
    prompt_file: prompts/missing-target-iam-role.md
    baseline_file: baselines/missing-target-iam-role.md
    expected_verdict: PREREQUISITES_MISSING
