# Eval configuration for lambda-function-url-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: lambda-function-url-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: buffered-iam-cors
    difficulty: hard
    prompt_file: prompts/buffered-iam-cors.md
    baseline_file: baselines/buffered-iam-cors.md
    expected_verdict: READY_TO_DEPLOY

  - id: response-stream-none
    difficulty: hard
    prompt_file: prompts/response-stream-none.md
    baseline_file: baselines/response-stream-none.md
    expected_verdict: READY_TO_DEPLOY

  - id: cloudfront-custom-domain
    difficulty: medium
    prompt_file: prompts/cloudfront-custom-domain.md
    baseline_file: baselines/cloudfront-custom-domain.md
    expected_verdict: READY_TO_DEPLOY

  - id: cors-update-existing
    difficulty: medium
    prompt_file: prompts/cors-update-existing.md
    baseline_file: baselines/cors-update-existing.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-function-exists
    difficulty: easy
    prompt_file: prompts/missing-function-exists.md
    baseline_file: baselines/missing-function-exists.md
    expected_verdict: PREREQUISITES_MISSING
