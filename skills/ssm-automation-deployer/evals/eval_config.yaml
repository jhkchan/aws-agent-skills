# Eval configuration for ssm-automation-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: ssm-automation-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: remediation-execute-api-lambda
    difficulty: hard
    prompt_file: prompts/remediation-execute-api-lambda.md
    baseline_file: baselines/remediation-execute-api-lambda.md
    expected_verdict: READY_TO_DEPLOY

  - id: nested-runbook-branch-targets
    difficulty: hard
    prompt_file: prompts/nested-runbook-branch-targets.md
    baseline_file: baselines/nested-runbook-branch-targets.md
    expected_verdict: READY_TO_DEPLOY

  - id: eventbridge-scheduled-sns-rate-control
    difficulty: medium
    prompt_file: prompts/eventbridge-scheduled-sns-rate-control.md
    baseline_file: baselines/eventbridge-scheduled-sns-rate-control.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-execution-role-trust
    difficulty: easy
    prompt_file: prompts/missing-execution-role-trust.md
    baseline_file: baselines/missing-execution-role-trust.md
    expected_verdict: PREREQUISITES_MISSING

  - id: missing-parameter-binding
    difficulty: easy
    prompt_file: prompts/missing-parameter-binding.md
    baseline_file: baselines/missing-parameter-binding.md
    expected_verdict: PREREQUISITES_MISSING
