# Eval test cases for ssm-automation-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the READY_TO_DEPLOY /
# PREREQUISITES_MISSING classification across SSM Automation runbook
# scenarios (remediation with aws:executeAwsApi, nested runbook with
# aws:branch, EventBridge scheduled automation, missing execution
# role trust policy, missing parameter binding).
skill: ssm-automation-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: remediation-execute-api-lambda
    description: >-
      Create an SSM Automation runbook that remediates EC2 instances
      using aws:executeAwsApi to describe instances and
      aws:invokeLambdaFunction to invoke a remediation handler.
      Expects READY_TO_DEPLOY with execution role, rate control, and
      SNS notifications captured.
    input: |
      Create an SSM Automation document "RemediateEC2" that:
      1) Uses aws:executeAwsApi to call ec2:DescribeInstances for a
      given InstanceId parameter. 2) Uses aws:changeInstanceState to
      stop the instance if running. 3) Uses aws:invokeLambdaFunction
      to invoke "remediation-handler" with the instance ID. Targets
      via resource group "rg-prod-ec2". Rate control: MaxConcurrency
      10, MaxErrors 3. Execution role: SSMAutomationRole (trust
      ssm.amazonaws.com). SNS notification on Success and Failed to
      arn:aws:sns:us-east-1:123456789012:ssm-alerts. Schema version
      0.3. Region us-east-1.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "RemediateEC2"
        - "aws:executeAwsApi"
        - "aws:invokeLambdaFunction"
        - "SSMAutomationRole"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: nested-runbook-branch-targets
    description: >-
      Create an SSM Automation runbook with aws:branch conditional
      routing and nested runbook invocation via aws:executeAutomation.
      Targets via tag-based query. Expects READY_TO_DEPLOY with branch
      steps, nested runbook, and tag-based targets.
    input: |
      Create an SSM Automation document "AutoRemediateByState" that:
      1) Uses aws:executeAwsApi to check instance state. 2) Uses
      aws:branch to route: if running → StopStep, if stopped →
      StartStep, default → NoOpStep. 3) StopStep and StartStep use
      aws:changeInstanceState. 4) NoOpStep uses aws:executeAutomation
      to invoke child runbook "ChildHealthCheck" with the instance ID.
      Targets via tag Environment=production. Rate control:
      MaxConcurrency 5, MaxErrors 1. Execution role: SSMAutomationRole.
      Schema version 0.3. Region us-east-1.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "aws:branch"
        - "aws:executeAutomation"
        - "MaxConcurrency"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: eventbridge-scheduled-sns-rate-control
    description: >-
      Create an SSM Automation runbook with EventBridge scheduled
      execution, SNS notifications, and rate control. Expects
      READY_TO_DEPLOY with EventBridge schedule, SNS topic, and rate
      control parameters.
    input: |
      Create an SSM Automation document "NightlyPatchCheck" that:
      1) Uses aws:executeAwsApi to call ssm:DescribeInstancePatches.
      2) Uses aws:sleep for 60 seconds between checks. 3) EventBridge
      rule "NightlyPatchSchedule" with cron(0 2 ? * SUN *). 4) SNS
      notification on Success and Failed to
      arn:aws:sns:us-east-1:123456789012:patch-alerts. 5) Targets
      via tag PatchGroup=weekly. Rate control: MaxConcurrency 10,
      MaxErrors 3. Execution role: SSMAutomationRole. Schema 0.3.
      Region us-east-1.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "EventBridge"
        - "SNS"
        - "MaxConcurrency"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: missing-execution-role-trust
    description: >-
      Operator requests an SSM Automation runbook but the execution
      role does not have a trust policy allowing ssm.amazonaws.com.
      This is a prerequisite failure.
    input: |
      Create an SSM Automation document "RemediateEC2" with steps
      using aws:executeAwsApi and aws:changeInstanceState. Execution
      role: MyEC2Role (this is an EC2 instance profile role, NOT an
      automation assume role — it does not have ssm.amazonaws.com in
      its trust policy). Targets via resource group rg-prod-ec2.
      Schema 0.3. Region us-east-1.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "trust"
        - "ssm.amazonaws.com"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"

  - id: missing-parameter-binding
    description: >-
      Operator requests an SSM Automation runbook but a step references
      a parameter that is not defined in the document. This is a
      prerequisite failure.
    input: |
      Create an SSM Automation document "BadRunbook" that: 1) Uses
      aws:executeAwsApi to call ec2:DescribeInstances with parameter
      {{ UndefinedParam }}. The parameter UndefinedParam is not
      declared in the parameters section. 2) Uses aws:changeInstanceState.
      Execution role: SSMAutomationRole. Schema 0.3. Region us-east-1.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "parameter"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"
