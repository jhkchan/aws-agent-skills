# Eval configuration for route53-application-recovery-controller-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: route53-application-recovery-controller-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: active-standby-with-safety-rule
    difficulty: hard
    prompt_file: prompts/active-standby-with-safety-rule.md
    baseline_file: baselines/active-standby-with-safety-rule.md
    expected_verdict: READY_TO_DEPLOY

  - id: active-active-cross-region-readiness
    difficulty: hard
    prompt_file: prompts/active-active-cross-region-readiness.md
    baseline_file: baselines/active-active-cross-region-readiness.md
    expected_verdict: READY_TO_DEPLOY

  - id: resource-set-type-mapping
    difficulty: medium
    prompt_file: prompts/resource-set-type-mapping.md
    baseline_file: baselines/resource-set-type-mapping.md
    expected_verdict: READY_TO_DEPLOY

  - id: safety-rule-design-and-or
    difficulty: hard
    prompt_file: prompts/safety-rule-design-and-or.md
    baseline_file: baselines/safety-rule-design-and-or.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-safety-rule
    difficulty: easy
    prompt_file: prompts/missing-safety-rule.md
    baseline_file: baselines/missing-safety-rule.md
    expected_verdict: PREREQUISITES_MISSING
