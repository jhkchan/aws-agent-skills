# Eval test cases for securityhub-finding-troubleshooter
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five deterministic cases — one per control-family verdict arc. Each
# case's FINDING line embeds the test-case id so the model naturally
# echoes it (avoids assertion-token mismatch). The standard-driven
# ordering in SKILL.md produces exactly the expected verdicts below.
skill: securityhub-finding-troubleshooter
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: s3-bpa-failed-true-positive
    description: >-
      FSBP S3.1 finding on bucket customer-data-prod.
      Account-level BPA has RestrictPublicBuckets=false; bucket ACL
      grants AllUsers READ. Bucket is NOT a documented public website
      (no CloudFront distribution). Expected layer: S3_BPA.
    input: |
      Symptom: Security Hub finding
      arn:aws:securityhub:us-east-1:111111111111:finding/abc123def
      in account 111111111111 (us-east-1). Control S3.1, severity HIGH,
      Compliance.Status=FAILED.

      aws securityhub get-findings:
        GeneratorId: "arn:aws:securityhub:us-east-1::standards/aws-foundational-security-best-practices/v/1.0.0/S3.1"
        Product.Arn: arn:aws:securityhub:us-east-1::product/aws/securityhub
        Resources[0].Id: arn:aws:s3:::customer-data-prod
        Resources[0].Type: AwsS3Bucket
        Severity.Label: HIGH
        Compliance.Status: FAILED
        Workflow.Status: NEW

      aws s3control get-public-access-block --account-id 111111111111:
        BlockPublicAcls: true
        IgnorePublicAcls: false
        BlockPublicPolicy: true
        RestrictPublicBuckets: false

      aws s3api get-bucket-acl --bucket customer-data-prod:
        Grants: [{ Grantee: { Type: Group, URI: AllUsers },
                   Permission: READ }]

      aws s3api get-bucket-policy customer-data-prod (parsed):
        no Principal: "*" grant

      CloudFront distributions in account 111111111111:
        (none — customer-data-prod is not a CloudFront origin)

      S3 access logs for customer-data-prod (last 7 days):
        all source IPs are corporate CIDR 198.18.0.0/15 — no public
        consumer pattern

      Application code review: bucket is referenced by the internal
        reporting tool only; no signed-URL distribution pattern.

      Emit the standard diagnostic block (FINDING, VERDICT, REASON,
      LAYER, SEVERITY, STANDARD, EVIDENCE, SUPPRESSION, REMEDIATION).
    expected_verdict: ROOT_CAUSE_FOUND
    assertions:
      must_contain:
        - "ROOT_CAUSE_FOUND"
        - "s3-bpa-failed-true-positive"
        - "S3_BPA"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: NEED_MORE_INFO"
        - "VERDICT: ESCALATE"
        - "LAYER: FALSE_POSITIVE"

  - id: cis-1-3-not-available-config-rule-error
    description: >-
      CIS.1.3 finding is NOT_AVAILABLE because the Config rule Lambda
      errored on missing iam:GetCredentialReport permission. The access
      keys themselves are compliant (all rotated within 60 days).
      Expected layer: AWS_SIDE.
    input: |
      Symptom: Security Hub finding
      arn:aws:securityhub:us-east-1:111111111111:finding/def456ghi
      in account 111111111111 (us-east-1). Control CIS.1.3, severity
      MEDIUM, Compliance.Status=NOT_AVAILABLE.

      aws securityhub get-findings:
        GeneratorId: "arn:aws:securityhub:us-east-1::standards/cis-aws-foundations-benchmark/v/1.4.0/CIS.1.3"
        Severity.Label: MEDIUM
        Compliance.Status: NOT_AVAILABLE
        Compliance.StatusReasons:
          - ReasonCode: CONFIG_EVALUATION_ERROR
            Description: "Config rule Lambda invocation failed; see
              CloudWatch Logs for arn:aws:lambda:us-east-1:111111111111:function:securityhub-cis-1-3"

      aws configservice describe-config-rules:
        ConfigRuleName: securityhub-cis-1-3
        Source: CustomPolicy
        LastEvaluationTime: 26 hours ago  (stale)

      aws logs filter-log-events (Lambda log group, last invocation):
        ERROR: AccessDenied
        Message: "User: arn:aws:sts::111111111111:assumed-role/securityhub-config-rule-role/securityhub-cis-1-3 is not authorized to perform: iam:GetCredentialReport"

      aws iam get-credential-report (latest, generated by operator):
        All active access keys rotated within the last 60 days.
        No key older than the 90-day CIS limit.

      Config rule role policy (securityhub-config-rule-role):
        Attached policies do not include iam:GetCredentialReport.

      Emit the standard diagnostic block (FINDING, VERDICT, REASON,
      LAYER, SEVERITY, STANDARD, EVIDENCE, SUPPRESSION, REMEDIATION).
    expected_verdict: ROOT_CAUSE_FOUND
    assertions:
      must_contain:
        - "ROOT_CAUSE_FOUND"
        - "cis-1-3-not-available-config-rule-error"
        - "AWS_SIDE"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "LAYER: IAM_PASSWORD_POLICY"
        - "LAYER: FALSE_POSITIVE"

  - id: ec2-imdsv2-resolved-stale-cache
    description: >-
      EC2.8 IMDSv2 finding marked RESOLVED but appearing in the
      console. The instance's MetadataOptions shows HttpTokens=required
      (the fix). Config resource history shows the fix was applied 8
      minutes ago. Finding is in the 3-5 day archive window. Expected
      layer: FALSE_POSITIVE.
    input: |
      Symptom: Security Hub finding
      arn:aws:securityhub:us-east-1:111111111111:finding/jkl789mno
      in account 111111111111 (us-east-1). Control EC2.8, severity
      MEDIUM, Compliance.Status=PASSED, Workflow.Status=RESOLVED. SOC
      is confused because the finding is still appearing in the
      console even though it shows RESOLVED.

      aws securityhub get-findings:
        GeneratorId: "...standards/aws-foundational-security-best-practices/v/1.0.0/EC2.8"
        Resources[0].Id: arn:aws:ec2:us-east-1:111111111111:instance/i-app-1
        Severity.Label: MEDIUM
        Compliance.Status: PASSED
        Workflow.Status: RESOLVED
        UpdatedAt: 2026-08-10T14:32:11Z (8 minutes ago)

      aws ec2 describe-instances --instance-ids i-app-1:
        MetadataOptions:
          HttpTokens: required  (the fix is in place)
          HttpPutResponseHopLimit: 1
          HttpEndpoint: enabled

      aws configservice get-resource-config-history
        --resource-type AwsEc2Instance --resource-id i-app-1:
        Latest configuration: HttpTokens=required
        Previous configuration: HttpTokens=optional
        Change time: 2026-08-10T14:31:55Z  (8 min ago)

      aws configservice describe-config-rules:
        ConfigRuleName: securityhub-ec2-8
        LastEvaluationTime: 2026-08-10T14:33:00Z
        Latest evaluation result for i-app-1: COMPLIANT

      SOC ticket notes: instance was remediated at 14:32 UTC;
        SOC expects the finding to disappear immediately.

      Emit the standard diagnostic block (FINDING, VERDICT, REASON,
      LAYER, SEVERITY, STANDARD, EVIDENCE, SUPPRESSION, REMEDIATION).
    expected_verdict: ROOT_CAUSE_FOUND
    assertions:
      must_contain:
        - "ROOT_CAUSE_FOUND"
        - "ec2-imdsv2-resolved-stale-cache"
        - "FALSE_POSITIVE"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "LAYER: EC2_IMDSV2"
        - "LAYER: AWS_SIDE"

  - id: kms-rotation-true-failure
    description: >-
      KMS.3 finding on customer-managed CMK billing-prod-key.
      EnableKeyRotation=false. Key is customer-managed (not AWS-managed
      which is exempt). Expected layer: KMS_ROTATION.
    input: |
      Symptom: Security Hub finding
      arn:aws:securityhub:us-east-1:111111111111:finding/pqr012stu
      in account 111111111111 (us-east-1). Control KMS.3, severity
      MEDIUM, Compliance.Status=FAILED.

      aws securityhub get-findings:
        GeneratorId: "...standards/aws-foundational-security-best-practices/v/1.0.0/KMS.3"
        Resources[0].Id: arn:aws:kms:us-east-1:111111111111:key/billing-prod-key
        Resources[0].Type: AwsKmsKey
        Severity.Label: MEDIUM
        Compliance.Status: FAILED

      aws kms describe-keys --key-ids billing-prod-key:
        KeyMetadata:
          KeyId: billing-prod-key
          KeyState: Enabled
          KeyManager: CUSTOMER  (NOT AWS — customer-managed, KMS.3 applies)
          EnableKeyRotation: false  (the failure)
          KeyUsage: ENCRYPT_DECRYPT
          Origin: AWS_KMS
          CreationDate: 2024-01-15  (key is ~18 months old)

      aws kms get-key-policy --key-id billing-prod-key:
        Policy allows kms:EnableKeyRotation for the security-admin role
        (operator has the right permission to remediate)

      KMS key aliases: alias/billing-prod — used by DynamoDB and
        S3 Bucket Keys for the billing workload.

      No documented exception in the security team's runbook for
        skipping key rotation on billing-prod-key.

      Emit the standard diagnostic block (FINDING, VERDICT, REASON,
      LAYER, SEVERITY, STANDARD, EVIDENCE, SUPPRESSION, REMEDIATION).
    expected_verdict: ROOT_CAUSE_FOUND
    assertions:
      must_contain:
        - "ROOT_CAUSE_FOUND"
        - "kms-rotation-true-failure"
        - "KMS_ROTATION"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: NEED_MORE_INFO"
        - "LAYER: FALSE_POSITIVE"

  - id: aggregator-missing-member-account
    description: >-
      High-severity findings on member account 222222222222 are not
      appearing in the aggregator account 111111111111. Aggregator
      exists but list-members does not include 222222222222 — the
      member invitation expired before acceptance. Expected verdict:
      NEED_MORE_INFO.
    input: |
      Symptom: SOC for the aggregator account 111111111111 (us-east-1)
      cannot see findings from member account 222222222222 even though
      both accounts are in the same AWS Organization. Member account
      administrator confirmed High-severity findings exist locally
      but the aggregator view is empty.

      aws securityhub get-finding-aggregator (from account 111111111111):
        FindingAggregatorArn: arn:aws:securityhub:us-east-1:111111111111:finding-aggregator/default
        RegionLinkingMode: ALL_REGIONS

      aws securityhub list-members (from account 111111111111):
        Member accounts: [333333333333, 444444444444]
        NOTE: 222222222222 is NOT listed.

      aws securityhub get-administrator-account (from 222222222222):
        AdministratorAccount: (empty — no administrator set)
        (the member was never successfully associated)

      aws organizations describe-organization:
        OrganizationId: o-abc123def
        ManagementAccount: 555555555555
        Both 111111111111 (aggregator) and 222222222222 (target
        member) are member accounts in the org.

      aws securityhub list-organization-admin-accounts:
        AdminAccountId: 111111111111 (the aggregator IS delegated)

      Member account 222222222222 operator: "We received an invitation
        last quarter but it expired before we could accept. Can we
        re-invite?"

      Note: The operator in 111111111111 cannot assume a role in
        222222222222 to verify the local Security Hub state directly.
        They can only see the aggregator-side view.

      Emit the standard diagnostic block (FINDING, VERDICT, REASON,
      LAYER, SEVERITY, STANDARD, EVIDENCE, SUPPRESSION, REMEDIATION).
    expected_verdict: NEED_MORE_INFO
    assertions:
      must_contain:
        - "NEED_MORE_INFO"
        - "aggregator-missing-member-account"
        - "AGGREGATOR_GAP"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: ROOT_CAUSE_FOUND"
        - "VERDICT: ESCALATE"
        - "LAYER: FALSE_POSITIVE"
