skill: auditmanager-assessment-auditor
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0
test_cases:
- id: stopped-assessment-incomplete
  description: "Assessment status INACTIVE (stopped) with NOT_ASSESSED 42% \u2014 evidence collection is halted AND the data-source\
    \ break accumulated before stop. Highest-priority INCOMPLETE_EVIDENCE (Steps 1a + 1b)."
  input: "Audit Manager assessment snapshot \u2014 emit the standard VERDICT block\n(ASSESSMENT, FRAMEWORK, VERDICT, REASON,\
    \ CONTROL BREAKDOWN, FINDINGS, REMEDIATION).\n\nAssessment name: SOC2-Q1-2026-stopped-assessment-incomplete\nAssessment\
    \ id: arn:aws:auditmanager:us-east-1:111111111111:assessment/a-stopped-assessment-incomplete\nFramework: SOC 2\nStatus:\
    \ INACTIVE\nCreation time: 2025-10-01\nLast updated: 2026-02-14\nScope:\n  awsAccounts: [111111111111, 222222222222]\n\
    \  awsServices: [ec2, s3, iam, kms, rds, lambda, cloudtrail, config]\n\nControl statistics (across all control sets):\n\
    \  total: 312\n  PASS: 98\n  FAIL: 41\n  NOT_ASSESSED: 131\n  MANUAL: 30\n  UNDER_REVIEW: 12\n\nSettings:\n  kmsKey: arn:aws:kms:us-east-1:111111111111:key/audit-encryption\n\
    \  snsTopic: arn:aws:sns:us-east-1:111111111111:audit-notify\n  defaultAssessmentReportsDestination: s3://audit-reports/soc2/\n\
    \  defaultProcessOwners: [arn:aws:iam::111111111111:role/audit-reviewer]\n\nData sources (at last collection):\n  AWS\
    \ Config recorder: ON (account 111111111111), OFF (account 222222222222)\n  CloudTrail management events: logging\n"
  expected_verdict: INCOMPLETE_EVIDENCE
  assertions:
    must_contain:
    - INCOMPLETE_EVIDENCE
    - '312'
    - INACTIVE
    must_not_contain:
    - 'Error:'
    - I cannot help
    - I'm unable to help
    - 'VERDICT: OK'
    - 'VERDICT: LOW_COMPLIANCE'
    - 'VERDICT: CONFIG_GAP'
- id: config-recording-off-incomplete
  description: "Assessment ACTIVE but AWS Config recorder OFF in an in-scope account \u2014 NOT_ASSESSED 45% on an assessment\
    \ old enough to have collected. Classic silent data-source break (Step 1b)."
  input: "Audit Manager assessment snapshot \u2014 emit the standard VERDICT block\n(ASSESSMENT, FRAMEWORK, VERDICT, REASON,\
    \ CONTROL BREAKDOWN, FINDINGS, REMEDIATION).\n\nAssessment name: PCI-DSS-annual-config-recording-off-incomplete\nAssessment\
    \ id: arn:aws:auditmanager:us-east-1:111111111111:assessment/a-config-recording-off-incomplete\nFramework: PCI DSS\nStatus:\
    \ ACTIVE\nCreation time: 2026-01-01\nLast updated: 2026-08-04\nScope:\n  awsAccounts: [111111111111, 222222222222, 333333333333]\n\
    \  awsServices: [ec2, s3, iam, kms, rds, vpc, config]\n\nControl statistics:\n  total: 220\n  PASS: 80\n  FAIL: 22\n \
    \ NOT_ASSESSED: 99\n  MANUAL: 12\n  UNDER_REVIEW: 7\n\nSettings:\n  kmsKey: arn:aws:kms:us-east-1:111111111111:key/pci-audit-key\n\
    \  snsTopic: arn:aws:sns:us-east-1:111111111111:pci-audit-notify\n  defaultAssessmentReportsDestination: s3://pci-audit-reports/2026/\n\
    \  defaultProcessOwners: [arn:aws:iam::111111111111:role/pci-reviewer]\n\nData sources:\n  AWS Config recorder: OFF in\
    \ account 222222222222 (recording: false), ON in others\n  CloudTrail management events: logging in all in-scope accounts\n\
    \nDelegations: all COMPLETE\n"
  expected_verdict: INCOMPLETE_EVIDENCE
  assertions:
    must_contain:
    - INCOMPLETE_EVIDENCE
    - '220'
    - NOT_ASSESSED
    must_not_contain:
    - 'Error:'
    - I cannot help
    - I'm unable to help
    - 'VERDICT: OK'
    - 'VERDICT: LOW_COMPLIANCE'
    - 'VERDICT: CONFIG_GAP'
- id: low-compliance-failures
  description: "Assessment ACTIVE with evidence complete (NOT_ASSESSED 8%) but PASS 48% and FAIL 44% \u2014 real control failures,\
    \ not a data-source problem. Steps 2a + 2b both fire."
  input: "Audit Manager assessment snapshot \u2014 emit the standard VERDICT block\n(ASSESSMENT, FRAMEWORK, VERDICT, REASON,\
    \ CONTROL BREAKDOWN, FINDINGS, REMEDIATION).\n\nAssessment name: HIPAA-security-low-compliance-failures\nAssessment id:\
    \ arn:aws:auditmanager:us-east-1:111111111111:assessment/a-low-compliance-failures\nFramework: HIPAA\nStatus: ACTIVE\n\
    Creation time: 2026-03-01\nLast updated: 2026-08-04\nScope:\n  awsAccounts: [111111111111, 222222222222]\n  awsServices:\
    \ [ec2, s3, iam, kms, rds, lambda]\n\nControl statistics:\n  total: 180\n  PASS: 86\n  FAIL: 79\n  NOT_ASSESSED: 15\n\
    \  MANUAL: 0\n  UNDER_REVIEW: 0\n\nSettings:\n  kmsKey: arn:aws:kms:us-east-1:111111111111:key/hipaa-key\n  snsTopic:\
    \ arn:aws:sns:us-east-1:111111111111:hipaa-notify\n  defaultAssessmentReportsDestination: s3://hipaa-reports/2026/\n \
    \ defaultProcessOwners: [arn:aws:iam::111111111111:role/hipaa-reviewer]\n\nData sources:\n  AWS Config recorder: ON in\
    \ all in-scope accounts\n  CloudTrail management events: logging in all in-scope accounts\n\nDelegations: all COMPLETE\n"
  expected_verdict: LOW_COMPLIANCE
  assertions:
    must_contain:
    - LOW_COMPLIANCE
    - '180'
    - FAIL
    must_not_contain:
    - 'Error:'
    - I cannot help
    - I'm unable to help
    - 'VERDICT: OK'
    - 'VERDICT: INCOMPLETE_EVIDENCE'
    - 'VERDICT: CONFIG_GAP'
