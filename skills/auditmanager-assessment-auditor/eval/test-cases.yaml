# Eval test cases for auditmanager-assessment-auditor
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# CRITICAL: the classification logic in SKILL.md (Steps 1-4) MUST match
# these test cases exactly. Each test-case id slug is embedded in the
# assessment name and id so the model naturally echoes it.
skill: auditmanager-assessment-auditor
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: stopped-assessment-incomplete
    description: >-
      Assessment status INACTIVE (stopped) with NOT_ASSESSED 42% — evidence
      collection is halted AND the data-source break accumulated before stop.
      Highest-priority INCOMPLETE_EVIDENCE (Steps 1a + 1b).
    input: |
      Audit Manager assessment snapshot — emit the standard VERDICT block
      (ASSESSMENT, FRAMEWORK, VERDICT, REASON, CONTROL BREAKDOWN, FINDINGS, REMEDIATION).

      Assessment name: SOC2-Q1-2026-stopped-assessment-incomplete
      Assessment id: arn:aws:auditmanager:us-east-1:111111111111:assessment/a-stopped-assessment-incomplete
      Framework: SOC 2
      Status: INACTIVE
      Creation time: 2025-10-01
      Last updated: 2026-02-14
      Scope:
        awsAccounts: [111111111111, 222222222222]
        awsServices: [ec2, s3, iam, kms, rds, lambda, cloudtrail, config]

      Control statistics (across all control sets):
        total: 312
        PASS: 98
        FAIL: 41
        NOT_ASSESSED: 131
        MANUAL: 30
        UNDER_REVIEW: 12

      Settings:
        kmsKey: arn:aws:kms:us-east-1:111111111111:key/audit-encryption
        snsTopic: arn:aws:sns:us-east-1:111111111111:audit-notify
        defaultAssessmentReportsDestination: s3://audit-reports/soc2/
        defaultProcessOwners: [arn:aws:iam::111111111111:role/audit-reviewer]

      Data sources (at last collection):
        AWS Config recorder: ON (account 111111111111), OFF (account 222222222222)
        CloudTrail management events: logging
    expected_verdict: INCOMPLETE_EVIDENCE
    assertions:
      must_contain:
        - "INCOMPLETE_EVIDENCE"
        - "stopped-assessment-incomplete"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
        - "INACTIVE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: LOW_COMPLIANCE"
        - "VERDICT: CONFIG_GAP"

  - id: config-recording-off-incomplete
    description: >-
      Assessment ACTIVE but AWS Config recorder OFF in an in-scope account —
      NOT_ASSESSED 45% on an assessment old enough to have collected. Classic
      silent data-source break (Step 1b).
    input: |
      Audit Manager assessment snapshot — emit the standard VERDICT block
      (ASSESSMENT, FRAMEWORK, VERDICT, REASON, CONTROL BREAKDOWN, FINDINGS, REMEDIATION).

      Assessment name: PCI-DSS-annual-config-recording-off-incomplete
      Assessment id: arn:aws:auditmanager:us-east-1:111111111111:assessment/a-config-recording-off-incomplete
      Framework: PCI DSS
      Status: ACTIVE
      Creation time: 2026-01-01
      Last updated: 2026-08-04
      Scope:
        awsAccounts: [111111111111, 222222222222, 333333333333]
        awsServices: [ec2, s3, iam, kms, rds, vpc, config]

      Control statistics:
        total: 220
        PASS: 80
        FAIL: 22
        NOT_ASSESSED: 99
        MANUAL: 12
        UNDER_REVIEW: 7

      Settings:
        kmsKey: arn:aws:kms:us-east-1:111111111111:key/pci-audit-key
        snsTopic: arn:aws:sns:us-east-1:111111111111:pci-audit-notify
        defaultAssessmentReportsDestination: s3://pci-audit-reports/2026/
        defaultProcessOwners: [arn:aws:iam::111111111111:role/pci-reviewer]

      Data sources:
        AWS Config recorder: OFF in account 222222222222 (recording: false), ON in others
        CloudTrail management events: logging in all in-scope accounts

      Delegations: all COMPLETE
    expected_verdict: INCOMPLETE_EVIDENCE
    assertions:
      must_contain:
        - "INCOMPLETE_EVIDENCE"
        - "config-recording-off-incomplete"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
        - "NOT_ASSESSED"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: LOW_COMPLIANCE"
        - "VERDICT: CONFIG_GAP"

  - id: low-compliance-failures
    description: >-
