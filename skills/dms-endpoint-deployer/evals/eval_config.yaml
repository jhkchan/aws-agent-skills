# Eval configuration for dms-endpoint-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: dms-endpoint-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: postgresql-source-cdc-secrets-manager
    difficulty: hard
    prompt_file: prompts/postgresql-source-cdc-secrets-manager.md
    baseline_file: baselines/postgresql-source-cdc-secrets-manager.md
    expected_verdict: READY_TO_DEPLOY

  - id: oracle-source-binary-reader-ssl
    difficulty: hard
    prompt_file: prompts/oracle-source-binary-reader-ssl.md
    baseline_file: baselines/oracle-source-binary-reader-ssl.md
    expected_verdict: READY_TO_DEPLOY

  - id: s3-target-parquet-format
    difficulty: medium
    prompt_file: prompts/s3-target-parquet-format.md
    baseline_file: baselines/s3-target-parquet-format.md
    expected_verdict: READY_TO_DEPLOY

  - id: mongodb-source-replica-set-cdc
    difficulty: medium
    prompt_file: prompts/mongodb-source-replica-set-cdc.md
    baseline_file: baselines/mongodb-source-replica-set-cdc.md
    expected_verdict: READY_TO_DEPLOY

  - id: postgresql-cdc-wal-level-prerequisite-fail
    difficulty: easy
    prompt_file: prompts/postgresql-cdc-wal-level-prerequisite-fail.md
    baseline_file: baselines/postgresql-cdc-wal-level-prerequisite-fail.md
    expected_verdict: PREREQUISITES_MISSING
