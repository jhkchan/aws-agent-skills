# Eval configuration for health-event-automator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: health-event-automator
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: org-view-issue-scheduledchange
    difficulty: hard
    prompt_file: prompts/org-view-issue-scheduledchange.md
    baseline_file: baselines/org-view-issue-scheduledchange.md
    expected_verdict: AUTOMATED
  - id: scheduled-change-leadtime
    difficulty: hard
    prompt_file: prompts/scheduled-change-leadtime.md
    baseline_file: baselines/scheduled-change-leadtime.md
    expected_verdict: AUTOMATED
  - id: user-notifications-chat
    difficulty: medium
    prompt_file: prompts/user-notifications-chat.md
    baseline_file: baselines/user-notifications-chat.md
    expected_verdict: AUTOMATED
  - id: no-dlq-no-impact-gate
    difficulty: hard
    prompt_file: prompts/no-dlq-no-impact-gate.md
    baseline_file: baselines/no-dlq-no-impact-gate.md
    expected_verdict: MANUAL_STEP_REQUIRED
  - id: org-view-missing
    difficulty: hard
    prompt_file: prompts/org-view-missing.md
    baseline_file: baselines/org-view-missing.md
    expected_verdict: MANUAL_STEP_REQUIRED
