# Eval configuration for eks-hybrid-node-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: eks-hybrid-node-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: hybrid-node-basic-registration
    difficulty: hard
    prompt_file: prompts/hybrid-node-basic-registration.md
    baseline_file: baselines/hybrid-node-basic-registration.md
    expected_verdict: READY_TO_DEPLOY

  - id: direct-connect-networking
    difficulty: hard
    prompt_file: prompts/direct-connect-networking.md
    baseline_file: baselines/direct-connect-networking.md
    expected_verdict: READY_TO_DEPLOY

  - id: pod-identity-hybrid-workloads
    difficulty: hard
    prompt_file: prompts/pod-identity-hybrid-workloads.md
    baseline_file: baselines/pod-identity-hybrid-workloads.md
    expected_verdict: READY_TO_DEPLOY

  - id: ssm-session-manager-cloudwatch
    difficulty: medium
    prompt_file: prompts/ssm-session-manager-cloudwatch.md
    baseline_file: baselines/ssm-session-manager-cloudwatch.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-network-path
    difficulty: easy
    prompt_file: prompts/missing-network-path.md
    baseline_file: baselines/missing-network-path.md
    expected_verdict: PREREQUISITES_MISSING
