# Eval configuration for eks-add-on-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: eks-add-on-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: core-addons-new-cluster
    difficulty: hard
    prompt_file: prompts/core-addons-new-cluster.md
    baseline_file: baselines/core-addons-new-cluster.md
    expected_verdict: READY_TO_DEPLOY

  - id: ebs-csi-irsa
    difficulty: hard
    prompt_file: prompts/ebs-csi-irsa.md
    baseline_file: baselines/ebs-csi-irsa.md
    expected_verdict: READY_TO_DEPLOY

  - id: pod-identity-adot
    difficulty: medium
    prompt_file: prompts/pod-identity-adot.md
    baseline_file: baselines/pod-identity-adot.md
    expected_verdict: READY_TO_DEPLOY

  - id: auto-mode-manual-override
    difficulty: easy
    prompt_file: prompts/auto-mode-manual-override.md
    baseline_file: baselines/auto-mode-manual-override.md
    expected_verdict: PREREQUISITES_MISSING

  - id: version-conflict-resolution
    difficulty: hard
    prompt_file: prompts/version-conflict-resolution.md
    baseline_file: baselines/version-conflict-resolution.md
    expected_verdict: READY_TO_DEPLOY
