# Eval configuration for fargate-cost-optimizer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: fargate-cost-optimizer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: rightsizing-overprovisioned-cpu-memory
    difficulty: medium
    prompt_file: prompts/rightsizing-overprovisioned-cpu-memory.md
    baseline_file: baselines/rightsizing-overprovisioned-cpu-memory.md
    expected_verdict: OPPORTUNITY_FOUND
    expected_root_cause_category: RIGHT_SIZE
  - id: fargate-spot-fault-tolerant
    difficulty: medium
    prompt_file: prompts/fargate-spot-fault-tolerant.md
    baseline_file: baselines/fargate-spot-fault-tolerant.md
    expected_verdict: OPPORTUNITY_FOUND
    expected_root_cause_category: SPOT
  - id: graviton-arm64-migration
    difficulty: hard
    prompt_file: prompts/graviton-arm64-migration.md
    baseline_file: baselines/graviton-arm64-migration.md
    expected_verdict: OPPORTUNITY_FOUND
    expected_root_cause_category: ARM64
  - id: already-optimal-workload
    difficulty: easy
    prompt_file: prompts/already-optimal-workload.md
    baseline_file: baselines/already-optimal-workload.md
    expected_verdict: ALREADY_OPTIMAL
  - id: savings-plans-steady-state
    difficulty: medium
    prompt_file: prompts/savings-plans-steady-state.md
    baseline_file: baselines/savings-plans-steady-state.md
    expected_verdict: OPPORTUNITY_FOUND
    expected_root_cause_category: SAVINGS_PLANS
