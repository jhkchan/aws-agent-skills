# Eval configuration for dynamodb-autoscaling-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: dynamodb-autoscaling-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: table-target-tracking
    difficulty: hard
    prompt_file: prompts/table-target-tracking.md
    baseline_file: baselines/table-target-tracking.md
    expected_verdict: READY_TO_DEPLOY

  - id: gsi-autoscaling
    difficulty: hard
    prompt_file: prompts/gsi-autoscaling.md
    baseline_file: baselines/gsi-autoscaling.md
    expected_verdict: READY_TO_DEPLOY

  - id: custom-cooldown-tuning
    difficulty: medium
    prompt_file: prompts/custom-cooldown-tuning.md
    baseline_file: baselines/custom-cooldown-tuning.md
    expected_verdict: READY_TO_DEPLOY

  - id: on-demand-vs-provisioned
    difficulty: medium
    prompt_file: prompts/on-demand-vs-provisioned.md
    baseline_file: baselines/on-demand-vs-provisioned.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-prerequisites
    difficulty: easy
    prompt_file: prompts/missing-prerequisites.md
    baseline_file: baselines/missing-prerequisites.md
    expected_verdict: PREREQUISITES_MISSING
