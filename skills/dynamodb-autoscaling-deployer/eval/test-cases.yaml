# Eval test cases for dynamodb-autoscaling-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the READY_TO_DEPLOY /
# PREREQUISITES_MISSING classification across DynamoDB auto-scaling
# scenarios (table RCU/WCU target tracking, GSI auto-scaling,
# custom role + cooldown tuning, on-demand vs provisioned decision,
# missing prerequisites).
skill: dynamodb-autoscaling-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: table-target-tracking
    description: >-
      Provision target tracking auto-scaling for a DynamoDB table's
      read and write capacity. Expects READY_TO_DEPLOY with scalable
      targets, policies, target utilization, and the application-
      autoscaling SLR cited.
    input: |
      Configure DynamoDB auto-scaling for table orders-table (arn:
      aws:dynamodb:us-east-1:111111111111:table/orders-table). The
      table is in PROVISIONED mode. Set up target tracking for both
      read and write capacity at 70% utilization. MinCapacity=10,
      MaxCapacity=40000 for both RCU and WCU. ScaleOutCooldown=60,
      ScaleInCooldown=60. Application auto-scaling service-linked
      role is available. Account ID: 111111111111.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "target tracking"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
        - "PROVISIONED"
        - "70"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: gsi-autoscaling
    description: >-
      Provision target tracking auto-scaling for a DynamoDB GSI's
      read and write capacity. Expects READY_TO_DEPLOY with GSI
      resource-id format (table/<name>/index/<gsi>) and dynamodb:index
      scalable dimensions.
    input: |
      Configure DynamoDB auto-scaling for the GSI status-index on
      table orders-table (arn:aws:dynamodb:us-east-1:111111111111:
      table/orders-table). The table is in PROVISIONED mode. The
      table already has auto-scaling configured; I need GSI
      auto-scaling for status-index. Target utilization 70%.
      MinCapacity=5, MaxCapacity=20000 for both RCU and WCU.
      Cooldowns 60s each. Account ID: 111111111111.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "VERDICT"
        - "CHECKLIST"
        - "status-index"
        - "dynamodb:index"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: custom-cooldown-tuning
    description: >-
      Provision auto-scaling with custom target utilization and
      cooldowns for a spiky workload. Expects READY_TO_DEPLOY with
      TargetValue=50, conservative cooldowns, and throttle alarm.
    input: |
      Configure DynamoDB auto-scaling for table events-table (arn:
      aws:dynamodb:us-east-1:111111111111:table/events-table). The
      table is PROVISIONED mode. This is a spiky workload — use
      target utilization 50% for both read and write. MinCapacity=20,
      MaxCapacity=30000. ScaleOutCooldown=0 (aggressive scale-out),
      ScaleInCooldown=300 (conservative scale-in to prevent flapping).
      Also create a CloudWatch throttle alarm on ThrottledRequests > 0
      sending to SNS arn:aws:sns:us-east-1:111111111111:alerts.
      Account ID: 111111111111.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "VERDICT"
        - "CHECKLIST"
        - "ThrottledRequests"
        - "50"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: on-demand-vs-provisioned
    description: >-
      Operator has an on-demand table and wants auto-scaling. The
      skill must advise switching to PROVISIONED mode first, then
      configure auto-scaling. Expects READY_TO_DEPLOY with the mode
      switch step cited.
    input: |
      I want to set up DynamoDB auto-scaling on table users-table
      (arn:aws:dynamodb:us-east-1:111111111111:table/users-table).
      The table is currently ON-DEMAND. Target utilization 70%,
      MinCapacity=5, MaxCapacity=10000 for both RCU and WCU.
      Cooldowns 60s. Account ID: 111111111111.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "PROVISIONED"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: missing-prerequisites
    description: >-
      Operator requests auto-scaling but the table does not exist
      and the application auto-scaling SLR is not confirmed.
      Expects PREREQUISITES_MISSING with the table existence gap
      cited.
    input: |
      Configure DynamoDB auto-scaling for table non-existent-table.
      Target 70%, Min=5, Max=10000. I'm not sure if the table
      exists or what mode it's in. Just set up the scaling.
      Account ID: 111111111111.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"
