# Eval configuration for redshift-serverless-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob).
skill_name: redshift-serverless-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: production-namespace-workgroup
    difficulty: hard
    prompt_file: prompts/production-namespace-workgroup.md
    baseline_file: baselines/production-namespace-workgroup.md
    expected_verdict: READY_TO_DEPLOY

  - id: cross-region-snapshots-dr
    difficulty: hard
    prompt_file: prompts/cross-region-snapshots-dr.md
    baseline_file: baselines/cross-region-snapshots-dr.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-security-group
    difficulty: hard
    prompt_file: prompts/missing-security-group.md
    baseline_file: baselines/missing-security-group.md
    expected_verdict: PREREQUISITES_MISSING

  - id: cost-controls-usage-limits
    difficulty: hard
    prompt_file: prompts/cost-controls-usage-limits.md
    baseline_file: baselines/cost-controls-usage-limits.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-kms-key
    difficulty: medium
    prompt_file: prompts/missing-kms-key.md
    baseline_file: baselines/missing-kms-key.md
    expected_verdict: PREREQUISITES_MISSING
