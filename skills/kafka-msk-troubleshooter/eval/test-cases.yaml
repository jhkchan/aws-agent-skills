# Eval test cases for kafka-msk-troubleshooter
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five deterministic cases — one per failure pattern. Each case's cluster
# name embeds the test-case id so the model naturally echoes it.
skill: kafka-msk-troubleshooter
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: urp-isr-flapping-replica-lag
    description: >-
      MSK provisioned cluster with UnderReplicatedPartitions spiking during
      produce bursts. ISR drops and recovers. replica.lag.time.max.ms is at
      the default 30000ms. Expected verdict: ROOT_CAUSE_FOUND, TOPIC_ISSUE,
      catalog #3.
    input: |
      Scenario: An Amazon MSK provisioned cluster
      "prod-msk-urp-isr-flapping-replica-lag" in us-east-1 has
      UnderReplicatedPartitions spiking to 28 during 09:00-10:00 and
      14:00-15:00, then dropping to 0 within 15 minutes.

      aws kafka describe-cluster shows State=ACTIVE, StateInfo empty.
      kafka-topics --describe --under-replicated-partitions shows 28
      partitions across orders, payments, inventory topics. Isr is
      missing broker 2 and 3 during the bursts.

      CloudWatch AWS/Kafka metrics during burst windows:
        - UnderReplicatedPartitions: Average=12, Maximum=28
        - BytesInPerSec: spikes to 85 MB/s (baseline: 12 MB/s)
        - CpuUser (all brokers): 40-55% (normal range)

      aws kafka describe-configuration shows:
        replica.lag.time.max.ms=30000 (default, unchanged)

      No broker failures detected. All brokers HEALTHY.

      Emit the standard diagnostic block (INCIDENT, VERDICT, ROOT_CAUSE,
      EVIDENCE, ROOT_CAUSE_CATALOG, REMEDIATION).
    expected_verdict: ROOT_CAUSE_FOUND
    assertions:
      must_contain:
        - "ROOT_CAUSE_FOUND"
        - "TOPIC_ISSUE"
        - "replica.lag.time.max.ms"
        - "VERDICT"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: NEED_MORE_INFO"
        - "delete the topic"

  - id: connectivity-sg-blocking-port-9094
    description: >-
      MSK provisioned cluster where producer and consumer cannot connect.
      TimeoutException to TLS bootstrap brokers. Security group on brokers
      allows port 9092 but not 9094. Expected verdict: ROOT_CAUSE_FOUND,
      CONNECTIVITY, catalog #5.
    input: |
      Scenario: An Amazon MSK provisioned cluster
      "prod-msk-connectivity-sg-blocking-port-9094" in us-east-1.
      Producers and consumers report TimeoutException connecting to
      bootstrap brokers.

      aws kafka get-bootstrap-brokers returns:
        BootstrapBrokerStringTls: b-1.xxx.kafka.us-east-1.amazonaws.com:9094,...

      Client uses security.protocol=SSL on port 9094.
      Client security group: sg-aaa.
      Broker security group: sg-bbb.

      aws ec2 describe-security-groups --group-ids sg-bbb shows:
        Inbound rules: port 9092 (PLAINTEXT) allowed from sg-aaa.
        No inbound rule for port 9094.

      telnet b-1.xxx.kafka.us-east-1.amazonaws.com 9094 times out.
      telnet b-1.xxx.kafka.us-east-1.amazonaws.com 9092 succeeds.

      aws kafka describe-cluster shows State=ACTIVE, all brokers HEALTHY.
      kafka-topics --describe --under-replicated-partitions returns empty.

      Emit the standard diagnostic block.
    expected_verdict: ROOT_CAUSE_FOUND
    assertions:
      must_contain:
        - "ROOT_CAUSE_FOUND"
        - "CONNECTIVITY"
        - "9094"
        - "security group"
        - "VERDICT"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: NEED_MORE_INFO"
        - "BROKER_FAILURE"

  - id: storage-disk-full-infinite-retention
    description: >-
      MSK provisioned cluster with DiskUsage at 95%. Brokers entering
      read-only mode. log.retention.hours=-1 (infinite). Expected verdict:
      ROOT_CAUSE_FOUND, STORAGE, catalog #11.
    input: |
      Scenario: An Amazon MSK provisioned cluster
      "prod-msk-storage-disk-full-infinite-retention" in us-east-1.
      DiskUsage at 95% on all brokers. Brokers intermittently entering
      read-only mode. Producers getting NOT_ENOUGH_REPLICAS errors.

      CloudWatch AWS/Kafka DiskUsage: all brokers at 90-95%, climbing.
      Broker volume size: 100 GB each.

      aws kafka describe-configuration shows:
        log.retention.hours=-1 (infinite)
        log.retention.bytes=-1 (not set / infinite)

      kafka-log-dirs --describe shows each broker has ~95 GB of data.
      Topics have been accumulating data for 6 months with no cleanup.

      aws kafka describe-cluster shows State=HEALTH_ISSUE.
      kafka-topics --describe --under-replicated-partitions shows 5 URP
      (secondary to disk pressure).

      Emit the standard diagnostic block.
    expected_verdict: ROOT_CAUSE_FOUND
    assertions:
      must_contain:
        - "ROOT_CAUSE_FOUND"
        - "STORAGE"
        - "log.retention"
        - "VERDICT"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: NEED_MORE_INFO"

  - id: connectivity-scram-secret-not-associated
    description: >-
      MSK provisioned cluster with SCRAM enabled. Producer gets
      SASL_AUTHENTICATION_FAILED. SCRAM secret exists in Secrets Manager but
      is not associated with the cluster. Expected verdict: ROOT_CAUSE_FOUND,
      CONNECTIVITY, catalog #7.
    input: |
      Scenario: An Amazon MSK provisioned cluster
      "prod-msk-connectivity-scram-secret-not-associated" in us-east-1.
      Producer gets SASL_AUTHENTICATION_FAILED using
      sasl.mechanism=SCRAM-SHA-512.

      aws kafka describe-cluster shows:
        ClientAuthentication.Sasl.Scram.Enabled: true

      aws kafka list-scram-secrets --cluster-arn <arn> returns empty.

      aws secretsmanager list-secrets --filter Key=name,Values=AmazonMSK_
      returns: AmazonMSK_prod_credentials (secret exists but not linked).

      Broker security groups allow port 9096 (SCRAM) from client SG.
      openssl s_client to broker:9096 succeeds (TLS handshake OK).

      Cluster State=ACTIVE, all brokers HEALTHY, no URP.

      Emit the standard diagnostic block.
    expected_verdict: ROOT_CAUSE_FOUND
    assertions:
      must_contain:
        - "ROOT_CAUSE_FOUND"
        - "CONNECTIVITY"
        - "SCRAM"
        - "secret"
        - "VERDICT"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: NEED_MORE_INFO"

  - id: insufficient-context-need-cluster-arn
    description: >-
      Vague report of MSK issues without cluster ARN, name, or specific
      symptom. Expected verdict: NEED_MORE_INFO.
    input: |
      Scenario: A user reports "our Kafka on AWS is having problems".
      They mention the region is us-east-1 but do not provide a cluster
      ARN, cluster name, cluster type (provisioned/serverless), observed
      state, error messages, or any kafka-topics / describe-cluster output.
    expected_verdict: NEED_MORE_INFO
    assertions:
      must_contain:
        - "NEED_MORE_INFO"
        - "VERDICT"
        - "list-clusters"
      must_not_contain:
        - "ROOT_CAUSE_FOUND"
        - "ESCALATE"
        - "Error:"
        - "I cannot"
