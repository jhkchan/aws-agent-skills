# Eval configuration for kinesis-analytics-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob).
skill_name: kinesis-analytics-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: flink-production-streaming
    difficulty: hard
    prompt_file: prompts/flink-production-streaming.md
    baseline_file: baselines/flink-production-streaming.md
    expected_verdict: READY_TO_DEPLOY

  - id: sql-session-windows
    difficulty: hard
    prompt_file: prompts/sql-session-windows.md
    baseline_file: baselines/sql-session-windows.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-execution-role
    difficulty: hard
    prompt_file: prompts/missing-execution-role.md
    baseline_file: baselines/missing-execution-role.md
    expected_verdict: PREREQUISITES_MISSING

  - id: studio-notebook-zeppelin
    difficulty: hard
    prompt_file: prompts/studio-notebook-zeppelin.md
    baseline_file: baselines/studio-notebook-zeppelin.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-source-stream
    difficulty: medium
    prompt_file: prompts/missing-source-stream.md
    baseline_file: baselines/missing-source-stream.md
    expected_verdict: PREREQUISITES_MISSING
