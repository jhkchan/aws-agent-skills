# Eval test cases for s3-performance-optimizer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five deterministic cases — one per optimisation layer family. Each
# case's TARGET embeds the test-case id so the model naturally echoes
# it (avoids assertion-token mismatch).
skill: s3-performance-optimizer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: multipart-upload-large-put-single-stream
    description: >-
      S3 bucket receives daily 5 GB CSV upload as a single PUT.
      Transfer takes ~80 seconds on a 500 Mbps link. Multipart upload
      with 10 parallel parts at 500 MB each would finish in ~8-10 s.
      Expected layer: MULTIPART_UPLOAD.
    input: |
      Symptom: We upload a daily 5 GB CSV file to a single S3 bucket
      from an on-prem server over a 500 Mbps Direct Connect. The
      upload takes ~80 seconds; we want it under 15 seconds. Average
      object size is 5 GB; upload is one PUT per day.

      Bucket: multipart-upload-large-put-single-stream-prod
      Region: us-east-1
      Workload: write-once daily bulk upload
      ObjectSize: 5 GB
      ClientGeography: on-prem over Direct Connect (us-east-1)
      TargetLatency: complete upload in <15 s

      Current upload command:
        aws s3api put-object --bucket \
          multipart-upload-large-put-single-stream-prod \
          --key daily_export.csv --body daily_export.csv

      CloudWatch metrics (last 7 days, last upload):
        - BytesUploaded: 5 GB over 81 seconds (~500 Mbps)
        - FirstByteLatency p99: 45 ms
        - 4xxErrors: 0
        - 5xxErrors: 0

      Transfer Acceleration: not enabled
      Multipart upload: NOT in use (single PUT)

      Emit the standard optimisation block (TARGET, VERDICT, REASON,
      LAYER, EVIDENCE, REMEDIATION).
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
    assertions:
      must_contain:
        - "FURTHER_OPTIMIZATION_AVAILABLE"
        - "multipart-upload-large-put-single-stream"
        - "MULTIPART_UPLOAD"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OPTIMIZED"
        - "LAYER: TRANSFER_ACCELERATION"

  - id: byte-range-fetch-tail-read-log-trailer
    description: >-
      S3 bucket stores 5 GB log files. Application reads only the last
      1 KB to find the trailer/index offset. Current code uses full
      GET (5 GB); each read takes ~40 s. Byte-range fetch would return
      in single-digit ms. Expected layer: BYTE_RANGE_FETCH.
    input: |
      Symptom: We have an analytics service that reads only the last
      1 KB of large S3 log files to extract the trailer offset. Each
      log file is ~5 GB. The current client code uses GET object
      (full download) and parses the trailer locally. Reads take ~40
      seconds; we want them under 100 ms.

      Bucket: byte-range-fetch-tail-read-log-trailer-archive
      Region: us-east-1
      Workload: read-tail-of-large-object
      ObjectSize: 5 GB
      AccessPattern: read last 1 KB only (trailer offset lookup)
      ClientGeography: us-east-1 EC2
      TargetLatency: <100 ms per read

      Current read code:
        response = s3.get_object(
            Bucket='byte-range-fetch-tail-read-log-trailer-archive',
            Key='logs/2026/08/10/app.log')
        body = response['Body'].read()  # downloads all 5 GB
        trailer = body[-1024:]

      CloudWatch metrics:
        - FirstByteLatency p99: 45 ms (per-request)
        - BytesDownloaded per request: ~5 GB
        - TotalRequestLatency p99: 40 s (driven by full-body download)

      Emit the standard optimisation block (TARGET, VERDICT, REASON,
      LAYER, EVIDENCE, REMEDIATION).
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
    assertions:
      must_contain:
        - "FURTHER_OPTIMIZATION_AVAILABLE"
        - "byte-range-fetch-tail-read-log-trailer"
        - "BYTE_RANGE_FETCH"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OPTIMIZED"
        - "LAYER: MULTIPART_UPLOAD"

  - id: s3-select-csv-filter-pushdown
    description: >-
      S3 bucket stores 100 GB of daily CSV exports. Analytics pipeline
      downloads the full file and filters client-side for records
      matching amount > 1000 (~5% selectivity). Full download takes
      hours. S3 Select pushdown would reduce transfer 10-20x. Expected
      layer: S3_SELECT.
    input: |
      Symptom: We have a daily analytics job that processes 100 GB of
      CSV exports. The job downloads the full CSV from S3 and filters
      client-side for records where amount > 1000 (about 5% of
      records match). The job takes ~3 hours; the network transfer
      dominates. We want it under 30 minutes.

      Bucket: s3-select-csv-filter-pushdown-warehouse
      Region: us-east-1
      Workload: full-scan CSV with filter predicate
      ObjectSize: 100 GB per file
      Selectivity: ~5% of records match the filter
      ClientGeography: us-east-1 EC2 (c5.2xlarge)
      TargetThroughput: complete job in <30 min

      Current pipeline (Python + boto3):
        obj = s3.get_object(
            Bucket='s3-select-csv-filter-pushdown-warehouse',
            Key='exports/2026-08-10.csv')
        reader = csv.reader(obj['Body'].iter_lines())
        matches = [r for r in reader if float(r[2]) > 1000]

      CloudWatch metrics:
        - BytesDownloaded per job: ~100 GB
        - GET count per job: 1
        - TotalRequestLatency: ~3 hours (transfer-bound)

      Emit the standard optimisation block (TARGET, VERDICT, REASON,
      LAYER, EVIDENCE, REMEDIATION).
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
    assertions:
      must_contain:
        - "FURTHER_OPTIMIZATION_AVAILABLE"
        - "s3-select-csv-filter-pushdown"
        - "S3_SELECT"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OPTIMIZED"
        - "LAYER: MULTIPART_UPLOAD"

  - id: express-one-zone-ml-model-serving-latency
    description: >-
      ML inference service reads model weights (200 MB) from standard
      S3 on each cold start. p99 FirstByteLatency is 80 ms; service
      target is <10 ms. S3 Express One Zone would deliver single-digit
      ms latency. Expected layer: EXPRESS_ONE_ZONE.
    input: |
      Symptom: We have an ML inference service that loads model
      weights from S3 on each cold start. The model file is ~200 MB.
      p99 FirstByteLatency on standard S3 is ~80 ms; our service
      target is <10 ms p99. Cold-start latency is dominated by the
      S3 GET.

      Bucket: express-one-zone-ml-model-serving-latency-models
      Region: us-east-1
      Workload: low-latency model-weight read
      ObjectSize: 200 MB
      AccessPattern: 1 GET per cold start (~100 cold starts per minute)
      ClientGeography: us-east-1 EC2 (inf1.xlarge)
      TargetLatency: <10 ms p99 FirstByteLatency
      AvailabilityTolerance: can tolerate single-AZ risk if paired
        with cross-region replication

      Current bucket: standard S3 (us-east-1, multi-AZ)

      CloudWatch metrics:
        - FirstByteLatency p99: 80 ms
        - TotalRequestLatency p99: 95 ms
        - 4xxErrors: 0
        - 5xxErrors: 0

      Emit the standard optimisation block (TARGET, VERDICT, REASON,
      LAYER, EVIDENCE, REMEDIATION).
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
    assertions:
      must_contain:
        - "FURTHER_OPTIMIZATION_AVAILABLE"
        - "express-one-zone-ml-model-serving-latency"
        - "EXPRESS_ONE_ZONE"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OPTIMIZED"
        - "LAYER: MULTIPART_UPLOAD"

  - id: prefix-distribution-hot-shard-503-throttling
    description: >-
      S3 bucket receives 15,000 PUT/sec to a single date-based prefix
      (yyyy/MM/dd/). CloudWatch shows sustained 503 throttling. The
      July 2023 cap removal covers most workloads, but >10,000 RPS on
      a single prefix can still benefit from sharding. Expected layer:
      PREFIX_DISTRIBUTION.
    input: |
      Symptom: S3 bucket prod-telemetry-ingest receives ~15,000 PUT/sec
      from a fleet of ingest workers. All keys are written under a
      single date-based prefix (yyyy/MM/dd/). CloudWatch shows
      sustained 503 errors during peak; application logs show "SlowDown"
      exceptions.

      Bucket: prefix-distribution-hot-shard-503-throttling-prod
      Region: us-east-1
      Workload: write-heavy telemetry ingest
      RequestRate: 15,000 PUT/sec (peak)
      AvgObjectSize: 12 KB
      KeyPattern: telemetry/2026/08/10/<uuid>.json
        (all keys under one yyyy/MM/dd prefix)
      ClientGeography: us-east-1 EC2 (fleet of 200 instances)
      TargetLatency: 0 throttling at peak

      CloudWatch metrics (last hour, peak window):
        - 5xxErrors Sum: 2,400 (SlowDown responses)
        - 4xxErrors Sum: 0
        - PutRequests Sum: 54M (~15,000/sec sustained)
        - BytesUploaded: ~650 GB

      Current prefix layout: single date-based prefix; no hash
      distribution. Request rate per single prefix exceeds the
      ~10,000/sec threshold where sharding still helps in 2026.

      Emit the standard optimisation block (TARGET, VERDICT, REASON,
      LAYER, EVIDENCE, REMEDIATION).
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
    assertions:
      must_contain:
        - "FURTHER_OPTIMIZATION_AVAILABLE"
        - "prefix-distribution-hot-shard-503-throttling"
        - "PREFIX_DISTRIBUTION"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OPTIMIZED"
        - "LAYER: MULTIPART_UPLOAD"
