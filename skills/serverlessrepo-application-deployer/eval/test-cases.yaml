# Eval test cases for serverlessrepo-application-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the READY_TO_DEPLOY /
# PREREQUISITES_MISSING classification across SAR publishing
# topologies (private app with SAM template and cross-account
# policy, public app with LICENSE and sharing, nested application
# composition with CAPABILITY_AUTO_EXPAND, semantic version update,
# missing README/LICENSE prerequisite failure).
skill: serverlessrepo-application-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: private-app-sam-deploy
    description: >-
      Publish a private SAR application with a SAM template
      (Transform: AWS::Serverless-2016-10-31), README, LICENSE,
      semantic version 1.0.0, and grant a consumer account via
      application policy. Expects READY_TO_DEPLOY with SAM transform
      noted, CAPABILITY_IAM declared, and application policy granting
      the consumer account.
    input: |
      Publish a serverless application named s3-file-processor.
      SAM template with Transform: AWS::Serverless-2016-10-31,
      a Lambda function (AWS::Serverless::Function) with S3 event
      trigger, and an S3 bucket parameter. README.md present.
      LICENSE present (Apache-2.0). Semantic version 1.0.0.
      Private sharing — grant consumer account 999999999999 deploy
      permission. Author: Jacky Chan. Labels: s3, lambda,
      event-driven. Region us-east-1. Publisher account
      123456789012.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "AWS::Serverless-2016-10-31"
        - "999999999999"
        - "1.0.0"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
        - "CAPABILITY_IAM"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: public-app-cross-account-policy
    description: >-
      Publish a SAR application as PUBLIC with LICENSE required,
      application policy implicit (public = anyone can deploy),
      and semantic version 1.2.0. Expects READY_TO_DEPLOY with
      LICENSE noted as required for public, no explicit application
      policy needed, and capabilities declared.
    input: |
      Publish a serverless application named realtime-stream-processor
      as PUBLIC. SAM template with an AWS::Serverless::Function
      processing Kinesis events. README.md present. LICENSE present
      (MIT). Semantic version 1.2.0. Public sharing — anyone can
      discover and deploy. Author: Jacky Chan. Labels: kinesis,
      lambda, streaming. Region us-east-1. Publisher account
      123456789012.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "PUBLIC"
        - "LICENSE"
        - "1.2.0"
        - "VERDICT"
        - "CHECKLIST"
        - "CAPABILITY_IAM"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: nested-applications-composition
    description: >-
      Publish a parent SAR application that nests two child SAR
      applications using AWS::Serverless::Application. Expects
      READY_TO_DEPLOY with CAPABILITY_AUTO_EXPAND declared, nested
      application references noted, and child application ARNs cited.
    input: |
      Publish a parent serverless application named data-pipeline-suite.
      The SAM template nests two child SAR applications:
      arn:aws:serverlessrepo:us-east-1:123456789012:apps/s3-file-processor
      (version 1.0.0) and
      arn:aws:serverlessrepo:us-east-1:123456789012:apps/kinesis-forwarder
      (version 2.0.0). README.md present. LICENSE present (Apache-2.0).
      Semantic version 1.0.0. Private sharing. Author: Jacky Chan.
      Region us-east-1.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "CAPABILITY_AUTO_EXPAND"
        - "AWS::Serverless::Application"
        - "nested"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: semantic-version-update
    description: >-
      Update an existing SAR application from version 1.0.0 to
      version 1.1.0 (MINOR bump for backward-compatible feature).
      Expects READY_TO_DEPLOY with the new semantic version noted,
      the version increment rationale cited, and the update command
      referencing the existing application ARN.
    input: |
      Update the existing SAR application
      arn:aws:serverlessrepo:us-east-1:123456789012:apps/s3-file-processor
      from version 1.0.0 to 1.1.0. The update adds a new optional
      parameter MemorySize (backward-compatible). README updated.
      Packaged template ready. Author: Jacky Chan. Region us-east-1.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "1.1.0"
        - "1.0.0"
        - "semantic version"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: missing-readme-license
    description: >-
      Operator requests to publish a PUBLIC SAR application but the
      LICENSE file is missing. This is a prerequisite failure.
      Expects PREREQUISITES_MISSING with the missing LICENSE cited.
    input: |
      Publish a serverless application named event-router as PUBLIC.
      SAM template with AWS::Serverless::Function. README.md present.
      No LICENSE file (it was never created). Semantic version 1.0.0.
      Author: Jacky Chan. Region us-east-1.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "LICENSE"
        - "VERDICT"
        - "CHECKLIST"
        - "PUBLIC"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"
