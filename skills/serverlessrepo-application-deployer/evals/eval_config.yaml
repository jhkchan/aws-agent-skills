# Eval configuration for serverlessrepo-application-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: serverlessrepo-application-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: private-app-sam-deploy
    difficulty: hard
    prompt_file: prompts/private-app-sam-deploy.md
    baseline_file: baselines/private-app-sam-deploy.md
    expected_verdict: READY_TO_DEPLOY

  - id: public-app-cross-account-policy
    difficulty: hard
    prompt_file: prompts/public-app-cross-account-policy.md
    baseline_file: baselines/public-app-cross-account-policy.md
    expected_verdict: READY_TO_DEPLOY

  - id: nested-applications-composition
    difficulty: hard
    prompt_file: prompts/nested-applications-composition.md
    baseline_file: baselines/nested-applications-composition.md
    expected_verdict: READY_TO_DEPLOY

  - id: semantic-version-update
    difficulty: medium
    prompt_file: prompts/semantic-version-update.md
    baseline_file: baselines/semantic-version-update.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-readme-license
    difficulty: easy
    prompt_file: prompts/missing-readme-license.md
    baseline_file: baselines/missing-readme-license.md
    expected_verdict: PREREQUISITES_MISSING
