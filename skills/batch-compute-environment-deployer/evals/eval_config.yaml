# Eval configuration for batch-compute-environment-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: batch-compute-environment-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: ec2-best-fit-progressive
    difficulty: hard
    prompt_file: prompts/ec2-best-fit-progressive.md
    baseline_file: baselines/ec2-best-fit-progressive.md
    expected_verdict: READY_TO_DEPLOY

  - id: fargate-job-queue-definition
    difficulty: hard
    prompt_file: prompts/fargate-job-queue-definition.md
    baseline_file: baselines/fargate-job-queue-definition.md
    expected_verdict: READY_TO_DEPLOY

  - id: spot-array-jobs-dependencies
    difficulty: hard
    prompt_file: prompts/spot-array-jobs-dependencies.md
    baseline_file: baselines/spot-array-jobs-dependencies.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-instance-role
    difficulty: easy
    prompt_file: prompts/missing-instance-role.md
    baseline_file: baselines/missing-instance-role.md
    expected_verdict: PREREQUISITES_MISSING

  - id: invalid-allocation-strategy-spot
    difficulty: medium
    prompt_file: prompts/invalid-allocation-strategy-spot.md
    baseline_file: baselines/invalid-allocation-strategy-spot.md
    expected_verdict: PREREQUISITES_MISSING
