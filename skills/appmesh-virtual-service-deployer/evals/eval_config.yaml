# Eval configuration for appmesh-virtual-service-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: appmesh-virtual-service-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: weighted-canary-dns-discovery
    difficulty: hard
    prompt_file: prompts/weighted-canary-dns-discovery.md
    baseline_file: baselines/weighted-canary-dns-discovery.md
    expected_verdict: READY_TO_DEPLOY

  - id: cloud-map-service-discovery
    difficulty: hard
    prompt_file: prompts/cloud-map-service-discovery.md
    baseline_file: baselines/cloud-map-service-discovery.md
    expected_verdict: READY_TO_DEPLOY

  - id: virtual-gateway-mtls
    difficulty: hard
    prompt_file: prompts/virtual-gateway-mtls.md
    baseline_file: baselines/virtual-gateway-mtls.md
    expected_verdict: READY_TO_DEPLOY

  - id: envoy-auto-inject-webhook
    difficulty: medium
    prompt_file: prompts/envoy-auto-inject-webhook.md
    baseline_file: baselines/envoy-auto-inject-webhook.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-cloudmap-namespace
    difficulty: easy
    prompt_file: prompts/missing-cloudmap-namespace.md
    baseline_file: baselines/missing-cloudmap-namespace.md
    expected_verdict: PREREQUISITES_MISSING
