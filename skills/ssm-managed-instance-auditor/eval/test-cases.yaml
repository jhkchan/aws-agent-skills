# Eval test cases for ssm-managed-instance-auditor
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Each test case embeds the test-case identifier in the instance ID or
# resource name so the SKILL.md classification logic and the assertions
# share a deterministic anchor. Assertions use CONCEPT tokens
# (UNMANAGED, NONCOMPLIANT, etc.) not API field names.
skill: ssm-managed-instance-auditor
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: ec2-no-iam-profile-unmanaged
    description: >-
      EC2 instance launched with no IAM instance profile attached. The
      SSM Agent on the host has no credentials to authenticate to the
      SSM service — the instance never registers. Coverage gap = no
      other dimension can be audited.
    input: |
      Instance id: i-0ec2noiamprofileunmanaged
      Source: describe-instance-information returned no record for this
      instance. Cross-reference from ec2 describe-instances:
        InstanceId: i-0ec2noiamprofileunmanaged
        State: running
        IamInstanceProfile: (none)
        Platform: Linux
      No SSM associations, patch, session, or inventory data exists for
      this instance — it has never registered with SSM.
      Emit the standard VERDICT block (INSTANCE, VERDICT, REASON,
      FINDINGS, REMEDIATION). Stop at the coverage finding; do not
      evaluate patch/session/inventory on an unregistered instance.
    expected_verdict: UNMANAGED
    assertions:
      must_contain:
        - "UNMANAGED"
        - "ec2noiamprofileunmanaged"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: NONCOMPLIANT"
        - "VERDICT: NO_SESSION_MANAGER"

  - id: hybrid-mi-connection-lost-unmanaged
    description: >-
      Hybrid-activated instance (mi-*) whose SSM Agent has stopped
      pinging. PingStatus is ConnectionLost; LastPingDateTime is 9 days
      stale. Previously managed, now a black box — no association,
      patch, or session data can be trusted as current.
    input: |
      Instance id: mi-hybridconnectionlostu
      describe-instance-information:
        InstanceId: mi-hybridconnectionlostu
        ResourceType: ManagedInstance
        PingStatus: ConnectionLost
        LastPingDateTime: 2026-07-27T03:14:22Z
        PlatformType: Linux
        IamRoleARN: arn:aws:iam::111111111111:role/AmazonSSMManagedInstanceCore-Role
        IsLatestVersion: true
      Snapshot date: 2026-08-05. (LastPingDateTime is ~9 days stale.)
      Emit the standard VERDICT block (INSTANCE, VERDICT, REASON,
      FINDINGS, REMEDIATION). Stop at the coverage finding.
    expected_verdict: UNMANAGED
    assertions:
      must_contain:
        - "UNMANAGED"
        - "hybridconnectionlostu"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
        - "ConnectionLost"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: NONCOMPLIANT"

  - id: noncompliant-critical-patches-missing
    description: >-
      Managed EC2 instance with a healthy agent, all associations
      succeeding, but 14 CRITICAL-severity patches missing against its
      patch baseline. ComplianceStatus is NON_COMPLIANT.
    input: |
      Instance id: i-0noncompliantcriticalpatches
      describe-instance-information:
        InstanceId: i-0noncompliantcriticalpatches
        ResourceType: EC2Instance
        PingStatus: Active
        LastPingDateTime: 2026-08-05T04:12:00Z
        PlatformType: Linux
        IamRoleARN: arn:aws:iam::111111111111:role/AmazonSSMManagedInstanceCore-Role
        IsLatestVersion: true
      Association status (AWS-ApplyPatchBaseline Operation=Scan):
        Status: Success
        ExecutionTime: 2026-08-05T03:00:00Z
      Patch state (list-compliance-items):
        ComplianceStatus: NON_COMPLIANT
        PatchBaselineId: pb-0prodlinuxsecurity
        MissingCount: 14
        InstalledCount: 312
        InstalledRejectedCount: 2
        Severity of missing patches: CRITICAL
      Session Manager: sg-0internalonly (no inbound 0.0.0.0/0 on 22);
      recent active Session Manager session on 2026-08-04.
      Inventory: AWS-GatherSoftwareInventory association present, last
      run 2026-08-05T02:00:00Z.
      Emit the standard VERDICT block.
    expected_verdict: NONCOMPLIANT
    assertions:
      must_contain:
        - "NONCOMPLIANT"
        - "noncompliantcriticalpatches"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: UNMANAGED"
        - "VERDICT: NO_SESSION_MANAGER"

  - id: no-session-manager-ssh-open
    description: >-
      Managed EC2 instance with healthy agent, all associations green,
      patches COMPLIANT, inventory fresh. But its security group allows
      inbound TCP/22 from 0.0.0.0/0 and there is no recent Session
      Manager session. SSH is the de-facto (and weaker) access path.
    input: |
      Instance id: i-0nossessionmanagersshopen
      describe-instance-information:
        InstanceId: i-0nossessionmanagersshopen
        ResourceType: EC2Instance
        PingStatus: Active
        LastPingDateTime: 2026-08-05T04:14:00Z
        PlatformType: Linux
        IamRoleARN: arn:aws:iam::111111111111:role/AmazonSSMManagedInstanceCore-Role
        IsLatestVersion: true
      Association status: all Success.
      Patch state:
        ComplianceStatus: COMPLIANT
        MissingCount: 0
      Inventory: AWS-GatherSoftwareInventory present, last run fresh.
      Security group (describe-security-groups):
        GroupId: sg-0sshexposed
        IpPermissions:
          - FromPort: 22
            ToPort: 22
            IpProtocol: tcp
            IpRanges:
              - CidrIp: 0.0.0.0/0
      Session Manager (describe-sessions --state Active): no sessions.
      Session Manager (describe-sessions history, last 30 days): no
      sessions.
      Emit the standard VERDICT block.
    expected_verdict: NO_SESSION_MANAGER
    assertions:
      must_contain:
        - "NO_SESSION_MANAGER"
        - "nossessionmanagersshopen"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: UNMANAGED"
        - "VERDICT: NONCOMPLIANT"

  - id: config-gap-stale-agent-no-inventory
    description: >-
      Managed EC2 instance with healthy agent, COMPLIANT patches, no
      open SSH (Session Manager recently used), but the agent is out of
      date (IsLatestVersion: false) and there is no
      AWS-GatherSoftwareInventory association. Two operational
      visibility gaps.
    input: |
      Instance id: i-0configgapstaleagentnoinv
      describe-instance-information:
        InstanceId: i-0configgapstaleagentnoinv
        ResourceType: EC2Instance
        PingStatus: Active
        LastPingDateTime: 2026-08-05T04:15:00Z
        PlatformType: Linux
        IamRoleARN: arn:aws:iam::111111111111:role/AmazonSSMManagedInstanceCore-Role
        AgentVersion: 3.0.225.0
        IsLatestVersion: false
      Association status:
        AWS-ApplyPatchBaseline (Operation=Scan): Success
        AWS-UpdateSSMAgent: NOT PRESENT (no auto-update association)
        AWS-GatherSoftwareInventory: NOT PRESENT
      Patch state: COMPLIANT, MissingCount: 0.
      Session Manager: most recent session 2026-08-04 (active within 30
      days). No inbound 0.0.0.0/0 on TCP/22.
      Emit the standard VERDICT block.
    expected_verdict: CONFIG_GAP
    assertions:
      must_contain:
        - "CONFIG_GAP"
        - "configgapstaleagentnoinv"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OK"
        - "VERDICT: UNMANAGED"
        - "VERDICT: NONCOMPLIANT"
        - "VERDICT: NO_SESSION_MANAGER"

  - id: ok-fully-managed-session-manager
    description: >-
      Clean instance: agent current, associations green, patches
      COMPLIANT, Session Manager active and logged, inventory fresh,
      AWS-UpdateSSMAgent present, no open SSH. Verdict OK.
    input: |
      Instance id: i-0okfullymanagedsessma
      describe-instance-information:
        InstanceId: i-0okfullymanagedsessma
        ResourceType: EC2Instance
        PingStatus: Active
        LastPingDateTime: 2026-08-05T04:16:00Z
        PlatformType: Linux
        IamRoleARN: arn:aws:iam::111111111111:role/AmazonSSMManagedInstanceCore-Role
        AgentVersion: 3.1.161.0
        IsLatestVersion: true
      Associations:
        AWS-ApplyPatchBaseline (Operation=Scan): Success, last run 2026-08-05T03:00:00Z
        AWS-UpdateSSMAgent: Success, last run 2026-08-05T02:00:00Z
        AWS-GatherSoftwareInventory: Success, last run 2026-08-05T02:30:00Z
      Patch state: COMPLIANT, MissingCount: 0.
      Session Manager (describe-sessions --state Active): one active
      session, started 2026-08-05T03:45:00Z.
      Session Manager preferences: S3 logging to
      ssm-session-audit-111111111111, CloudWatch Logs group
      /ssm/session-logs, KMS key alias/ssm-session-encryption.
      Security group: no inbound TCP/22 from 0.0.0.0/0 (Session Manager
      is the sole access path).
      Emit the standard VERDICT block.
    expected_verdict: OK
    assertions:
      must_contain:
        - "OK"
        - "okfullymanagedsessma"
        - "VERDICT"
        - "REASON"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: UNMANAGED"
        - "VERDICT: NONCOMPLIANT"
        - "VERDICT: NO_SESSION_MANAGER"
        - "VERDICT: CONFIG_GAP"
