# Eval configuration for rds-instance-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: rds-instance-deployer
snapshot_date: "2026-08-07"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: aurora-postgres-production
    difficulty: hard
    prompt_file: prompts/aurora-postgres-production.md
    baseline_file: baselines/aurora-postgres-production.md
    expected_verdict: READY_TO_DEPLOY

  - id: mysql-multi-az-commerce
    difficulty: medium
    prompt_file: prompts/mysql-multi-az-commerce.md
    baseline_file: baselines/mysql-multi-az-commerce.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-cmk-and-subnet-group
    difficulty: easy
    prompt_file: prompts/missing-cmk-and-subnet-group.md
    baseline_file: baselines/missing-cmk-and-subnet-group.md
    expected_verdict: PREREQUISITES_MISSING

  - id: aurora-global-database
    difficulty: hard
    prompt_file: prompts/aurora-global-database.md
    baseline_file: baselines/aurora-global-database.md
    expected_verdict: READY_TO_DEPLOY

  - id: aurora-serverless-v2-bursty
    difficulty: medium
    prompt_file: prompts/aurora-serverless-v2-bursty.md
    baseline_file: baselines/aurora-serverless-v2-bursty.md
    expected_verdict: READY_TO_DEPLOY
