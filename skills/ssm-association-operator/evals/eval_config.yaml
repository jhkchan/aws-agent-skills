# Eval configuration for ssm-association-operator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: ssm-association-operator
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: tag-target-scheduled-association
    difficulty: hard
    prompt_file: prompts/tag-target-scheduled-association.md
    baseline_file: baselines/tag-target-scheduled-association.md
    expected_verdict: OPERATION_COMPLETED

  - id: instance-id-target-association
    difficulty: medium
    prompt_file: prompts/instance-id-target-association.md
    baseline_file: baselines/instance-id-target-association.md
    expected_verdict: OPERATION_COMPLETED

  - id: compliance-remediation-association
    difficulty: hard
    prompt_file: prompts/compliance-remediation-association.md
    baseline_file: baselines/compliance-remediation-association.md
    expected_verdict: OPERATION_COMPLETED

  - id: multi-document-step-association
    difficulty: medium
    prompt_file: prompts/multi-document-step-association.md
    baseline_file: baselines/multi-document-step-association.md
    expected_verdict: OPERATION_COMPLETED

  - id: missing-s3-kms-key
    difficulty: easy
    prompt_file: prompts/missing-s3-kms-key.md
    baseline_file: baselines/missing-s3-kms-key.md
    expected_verdict: REVIEW_REQUIRED
