# Eval test cases for autoscaling-policy-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
skill: autoscaling-policy-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: target-tracking-cpu-ready
    description: >-
      Standard target tracking policy on CPUUtilization at 50% for a
      multi-AZ web ASG. ASG baseline healthy, single policy on one
      metric, no dual-policy conflict. All checklist dimensions pass.
    input: |
      Design a deployment plan for an Auto Scaling policy. Emit the
      standard VERDICT block (POLICY_SPEC, VERDICT, CHECKLIST,
      VERIFICATION_COMMANDS).

      Requirements:
      - ASG name: prod-web-asg
      - ASG exists, multi-AZ across 3 AZs, ELB health checks, Min=2 Desired=4 Max=10
      - Launch template: my-web-template v3
      - Policy: target tracking on ASGAverageCPUUtilization at target 50.0
      - ScaleOutCooldown: 60, ScaleInCooldown: 300
      - No other scaling policies currently attached
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "target-tracking-cpu-ready"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
        - "TargetTrackingScaling"
        - "ASGAverageCPUUtilization"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: dual-policy-conflict-missing
    description: >-
      Anti-pattern: target tracking on CPU AND step scaling on CPU
      (same metric dimension). Must emit PREREQUISITES_MISSING because
      two reactive policies on the same metric cause oscillation.
    input: |
      Design a deployment plan for Auto Scaling policies. Emit the
      standard VERDICT block (POLICY_SPEC, VERDICT, CHECKLIST,
      VERIFICATION_COMMANDS).

      Requirements:
      - ASG name: billing-api-asg
      - Existing policy: target tracking on ASGAverageCPUUtilization target 50%
      - Add step scaling policy on ASGAverageCPUUtilization: alarm at 70%, +50% capacity
      - Both policies should be active simultaneously
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "dual-policy-conflict-missing"
        - "VERDICT"
        - "dual-policy"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"

  - id: predictive-scaling-no-history-missing
    description: >-
      Predictive scaling on a fresh ASG with no CloudWatch history.
      Must emit PREREQUISITES_MISSING because predictive scaling needs
      >= 24h of LoadMetric data or forecasts are empty.
    input: |
      Design a deployment plan for predictive scaling. Emit the
      standard VERDICT block (POLICY_SPEC, VERDICT, CHECKLIST,
      VERIFICATION_COMMANDS).

      Requirements:
      - ASG name: new-launch-asg
      - ASG created 4 hours ago, Min=2 Desired=2 Max=8, multi-AZ
      - Add predictive scaling on ASGCPUUtilization, TargetValue 40
      - Mode: ForecastAndScale
      - The ASG has only 4 hours of CPU data so far
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "predictive-scaling-no-history-missing"
        - "VERDICT"
        - "history"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"

  - id: spot-mip-capacity-rebalance-ready
    description: >-
      Mixed Instances Policy with capacity-optimized Spot allocation,
      capacity rebalance enabled, warm pool, and target tracking on CPU.
      Spot-backed ASG with proper diversification. All dimensions pass.
    input: |
      Design a deployment plan for an Auto Scaling Group with Mixed
      Instances Policy and scaling. Emit the standard VERDICT block
      (POLICY_SPEC, VERDICT, CHECKLIST, VERIFICATION_COMMANDS).

      Requirements:
      - ASG name: spot-worker-asg
      - ASG exists, multi-AZ across 3 AZs, EC2 health checks, Min=2 Desired=4 Max=10
      - Launch template: worker-template v2
      - Mixed Instances Policy: 3 instance types (m5.large, m5a.large, m4.large)
      - OnDemandPercentageAboveBaseCapacity: 30, SpotAllocationStrategy: capacity-optimized
      - Capacity rebalance enabled
      - Warm pool: Stopped, min 2, ReuseOnScaleIn true
      - Target tracking on ASGAverageCPUUtilization at target 60
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "spot-mip-capacity-rebalance-ready"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
        - "capacity-optimized"
        - "MixedInstancesPolicy"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: scheduled-scaling-timezone-ready
    description: >-
      Scheduled scaling actions for business hours and off hours with
      explicit timezone. Includes target tracking on CPU and a warm
      pool. All dimensions pass.
    input: |
      Design a deployment plan for scheduled scaling and target tracking.
      Emit the standard VERDICT block (POLICY_SPEC, VERDICT, CHECKLIST,
      VERIFICATION_COMMANDS).

      Requirements:
      - ASG name: internal-tools-asg
      - ASG exists, multi-AZ across 3 AZs, ELB health checks, Min=2 Desired=3 Max=8
      - Target tracking on ASGAverageCPUUtilization at target 50
      - Scheduled action: scale up Mon-Fri 9 AM America/New_York, Min=4 Desired=6 Max=8
      - Scheduled action: scale down Mon-Fri 7 PM America/New_York, Min=1 Desired=1 Max=8
      - Warm pool: Stopped, min 1, ReuseOnScaleIn true
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "scheduled-scaling-timezone-ready"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
        - "America/New_York"
        - "put-scheduled-update-group-action"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"
