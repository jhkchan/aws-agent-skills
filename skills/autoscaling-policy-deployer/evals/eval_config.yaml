# Eval configuration for autoscaling-policy-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: autoscaling-policy-deployer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: target-tracking-cpu-ready
    difficulty: easy
    prompt_file: prompts/target-tracking-cpu-ready.md
    baseline_file: baselines/target-tracking-cpu-ready.md
    expected_verdict: READY_TO_DEPLOY
  - id: dual-policy-conflict-missing
    difficulty: hard
    prompt_file: prompts/dual-policy-conflict-missing.md
    baseline_file: baselines/dual-policy-conflict-missing.md
    expected_verdict: PREREQUISITES_MISSING
  - id: predictive-scaling-no-history-missing
    difficulty: hard
    prompt_file: prompts/predictive-scaling-no-history-missing.md
    baseline_file: baselines/predictive-scaling-no-history-missing.md
    expected_verdict: PREREQUISITES_MISSING
  - id: spot-mip-capacity-rebalance-ready
    difficulty: medium
    prompt_file: prompts/spot-mip-capacity-rebalance-ready.md
    baseline_file: baselines/spot-mip-capacity-rebalance-ready.md
    expected_verdict: READY_TO_DEPLOY
  - id: scheduled-scaling-timezone-ready
    difficulty: medium
    prompt_file: prompts/scheduled-scaling-timezone-ready.md
    baseline_file: baselines/scheduled-scaling-timezone-ready.md
    expected_verdict: READY_TO_DEPLOY
