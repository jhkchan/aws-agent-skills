# Eval configuration for lightsail-instance-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: lightsail-instance-deployer
snapshot_date: "2026-08-07"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: lamp-app-static-ip-dns-ready
    difficulty: easy
    prompt_file: prompts/lamp-app-static-ip-dns-ready.md
    baseline_file: baselines/lamp-app-static-ip-dns-ready.md
    expected_verdict: READY_TO_DEPLOY
  - id: wordpress-bundle-lb-ha-ready
    difficulty: medium
    prompt_file: prompts/wordpress-bundle-lb-ha-ready.md
    baseline_file: baselines/wordpress-bundle-lb-ha-ready.md
    expected_verdict: READY_TO_DEPLOY
  - id: vpc-peering-not-enabled-blocked
    difficulty: medium
    prompt_file: prompts/vpc-peering-not-enabled-blocked.md
    baseline_file: baselines/vpc-peering-not-enabled-blocked.md
    expected_verdict: PREREQUISITES_MISSING
  - id: distribution-with-static-origin-ready
    difficulty: hard
    prompt_file: prompts/distribution-with-static-origin-ready.md
    baseline_file: baselines/distribution-with-static-origin-ready.md
    expected_verdict: READY_TO_DEPLOY
  - id: bundle-below-app-os-minimum-blocked
    difficulty: easy
    prompt_file: prompts/bundle-below-app-os-minimum-blocked.md
    baseline_file: baselines/bundle-below-app-os-minimum-blocked.md
    expected_verdict: PREREQUISITES_MISSING
