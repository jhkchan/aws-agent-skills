# Eval configuration for apigateway-rest-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: apigateway-rest-deployer
snapshot_date: "2026-08-07"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: lambda-proxy-rest-api
    difficulty: easy
    prompt_file: prompts/lambda-proxy-rest-api.md
    baseline_file: baselines/lambda-proxy-rest-api.md
    expected_verdict: READY_TO_DEPLOY
  - id: vpc-link-private-integration
    difficulty: hard
    prompt_file: prompts/vpc-link-private-integration.md
    baseline_file: baselines/vpc-link-private-integration.md
    expected_verdict: READY_TO_DEPLOY
  - id: missing-acm-domain-cert
    difficulty: medium
    prompt_file: prompts/missing-acm-domain-cert.md
    baseline_file: baselines/missing-acm-domain-cert.md
    expected_verdict: PREREQUISITES_MISSING
  - id: canary-rest-api-deploy
    difficulty: medium
    prompt_file: prompts/canary-rest-api-deploy.md
    baseline_file: baselines/canary-rest-api-deploy.md
    expected_verdict: READY_TO_DEPLOY
  - id: missing-required-fields
    difficulty: easy
    prompt_file: prompts/missing-required-fields.md
    baseline_file: baselines/missing-required-fields.md
    expected_verdict: PREREQUISITES_MISSING
