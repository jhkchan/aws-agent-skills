# Eval test cases for macie-data-classifier
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the CLASSIFIED /
# PARTIALLY_CLASSIFIED / UNCLASSIFIED classification across Macie
# postures (healthy full-coverage, partial ASDD-only gap, unclassified
# Macie disabled, dangerous broad suppression rule, missing multi-
# account member coverage).
skill: macie-data-classifier
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: healthy-classified-posture
    description: >-
      Audit a healthy Macie posture with Macie enabled, ASDD on, daily
      scheduled jobs for high-sensitivity buckets, custom identifiers
      with healthy regex, narrow suppression rules, Security Hub export
      enabled, and full multi-account coverage. Expects CLASSIFIED with
      all checklist items passing.
    input: |
      Audit the Macie data classification posture for account
      123456789012 in us-east-1. Macie is enabled with FIFTEEN_MINUTES
      frequency. ASDD is enabled with auto-enable for org members.
      There are 4 classification jobs (1 one-time, 3 scheduled daily)
      scoping 28 sensitive S3 buckets with 12 non-sensitive excluded.
      Coverage: 120 total buckets, 108 ASDD, 28 deep-scan, 12
      unmonitored (low-risk logs). Managed identifiers set to ALL.
      3 custom identifiers (employee ID, internal API key, proprietary
      format) — all with word boundaries and ignore-words. 12/12
      high-sensitivity buckets have full-scan daily jobs. Findings
      last 30d: 2 High (triaged), 8 Medium, 15 Low (archived). 4
      suppression rules (1 SUPPRESS for known-public-bucket, 3
      ARCHIVE). 148/150 org accounts enrolled. Security Hub export
      enabled. EventBridge rule active with Lambda remediation target.
    expected_verdict: CLASSIFIED
    assertions:
      must_contain:
        - "CLASSIFIED"
        - "123456789012"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
        - "ASDD"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: UNCLASSIFIED"
        - "VERDICT: PARTIALLY_CLASSIFIED"

  - id: partial-asdd-only-coverage-gap
    description: >-
      Audit a partially-classified posture where Macie is enabled and
      ASDD is on, but only one-time jobs exist (no scheduled), 7/12
      high-sensitivity buckets rely on ASDD sampling only, and Security
      Hub export is disabled. Expects PARTIALLY_CLASSIFIED with
      specific gap citations.
    input: |
      Audit the Macie data classification posture for account
      123456789012 in us-east-1. Macie is enabled with FIFTEEN_MINUTES
      frequency. ASDD is enabled but autoEnableOrganizationMembers is
      false. There are 2 classification jobs — both one-time, zero
      scheduled. Job scoping: 10 buckets included, 0 excluded.
      Coverage: 120 total buckets, 85 ASDD, 10 deep-scan, 35
      unmonitored. Managed identifiers RECOMMENDED. 1 custom
      identifier with regex \d{1,19} (no word boundaries, no
      ignore-words). Only 5/12 high-sensitivity buckets have
      full-scan. Security Hub export is DISABLED. No EventBridge rule.
    expected_verdict: PARTIALLY_CLASSIFIED
    assertions:
      must_contain:
        - "PARTIALLY_CLASSIFIED"
        - "123456789012"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: CLASSIFIED"
        - "VERDICT: UNCLASSIFIED"

  - id: unclassified-macie-disabled
    description: >-
      Audit an account where Macie is not enabled at all. Expects
      UNCLASSIFIED with the enablement gap cited.
    input: |
      Audit the Macie data classification posture for account
      123456789012 in us-east-1. When checking with
      aws macie2 get-macie-session, Macie returns a not-found error.
      Macie has never been enabled in this account. There are 80 S3
      buckets with unknown data classification. No classification
      jobs exist. No custom identifiers exist.
    expected_verdict: UNCLASSIFIED
    assertions:
      must_contain:
        - "UNCLASSIFIED"
        - "123456789012"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: CLASSIFIED"
        - "VERDICT: PARTIALLY_CLASSIFIED"

  - id: dangerous-broad-suppression-rule
    description: >-
      Audit a Macie posture that appears healthy but has a dangerous
      broad suppression rule suppressing all High severity findings.
      Expects PARTIALLY_CLASSIFIED with the suppression scope flagged.
    input: |
      Audit the Macie data classification posture for account
      123456789012 in us-east-1. Macie is enabled. ASDD is enabled.
      3 classification jobs scoping 20 buckets. Coverage looks good:
      20 buckets deep-scanned daily. 2 custom identifiers (healthy
      regex). However, there are 2 suppression rules — one has
      action SUPPRESS with criteria matching ALL findings of severity
      High and Medium. This means all High and Medium findings are
      suppressed before reaching Security Hub. Security Hub shows zero
      Macie findings despite jobs running daily.
    expected_verdict: PARTIALLY_CLASSIFIED
    assertions:
      must_contain:
        - "PARTIALLY_CLASSIFIED"
        - "SUPPRESS"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: CLASSIFIED"
        - "VERDICT: UNCLASSIFIED"

  - id: missing-multi-account-coverage
    description: >-
      Audit a multi-account Macie topology where only 95 of 150 org
      accounts are enrolled, and 5 enrolled members are in PAUSED
      status. Expects PARTIALLY_CLASSIFIED with multi-account gaps and
      member status cited.
    input: |
      Audit the Macie data classification posture for the organization
      with administrator account 123456789012 in us-east-1. Macie is
      enabled in the admin account. ASDD is enabled. Classification
      jobs cover all sensitive buckets in the admin account. Security
      Hub export is enabled. However, when listing members, only 95 of
      150 organization accounts are enrolled in Macie. Of those 95,
      5 are in PAUSED status and 2 are in INVITED status (never
      accepted). ASDD autoEnableOrganizationMembers is false.
    expected_verdict: PARTIALLY_CLASSIFIED
    assertions:
      must_contain:
        - "PARTIALLY_CLASSIFIED"
        - "123456789012"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: CLASSIFIED"
        - "VERDICT: UNCLASSIFIED"
