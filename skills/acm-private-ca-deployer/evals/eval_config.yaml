# Eval configuration for acm-private-ca-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: acm-private-ca-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: root-ca-with-crl
    difficulty: hard
    prompt_file: prompts/root-ca-with-crl.md
    baseline_file: baselines/root-ca-with-crl.md
    expected_verdict: READY_TO_DEPLOY

  - id: subordinate-ca-signed-by-root
    difficulty: hard
    prompt_file: prompts/subordinate-ca-signed-by-root.md
    baseline_file: baselines/subordinate-ca-signed-by-root.md
    expected_verdict: READY_TO_DEPLOY

  - id: end-entity-certificate-issuance
    difficulty: medium
    prompt_file: prompts/end-entity-certificate-issuance.md
    baseline_file: baselines/end-entity-certificate-issuance.md
    expected_verdict: READY_TO_DEPLOY

  - id: ca-deletion-waiting-period
    difficulty: medium
    prompt_file: prompts/ca-deletion-waiting-period.md
    baseline_file: baselines/ca-deletion-waiting-period.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-crl-bucket-policy
    difficulty: easy
    prompt_file: prompts/missing-crl-bucket-policy.md
    baseline_file: baselines/missing-crl-bucket-policy.md
    expected_verdict: PREREQUISITES_MISSING
