# Eval configuration for sitewise-asset-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: sitewise-asset-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: opcua-gateway-asset-model
    difficulty: hard
    prompt_file: prompts/opcua-gateway-asset-model.md
    baseline_file: baselines/opcua-gateway-asset-model.md
    expected_verdict: READY_TO_DEPLOY

  - id: hierarchy-metric-aggregation
    difficulty: hard
    prompt_file: prompts/hierarchy-metric-aggregation.md
    baseline_file: baselines/hierarchy-metric-aggregation.md
    expected_verdict: READY_TO_DEPLOY

  - id: cloud-ingestion-alias
    difficulty: medium
    prompt_file: prompts/cloud-ingestion-alias.md
    baseline_file: baselines/cloud-ingestion-alias.md
    expected_verdict: READY_TO_DEPLOY

  - id: dashboard-portal-sso
    difficulty: medium
    prompt_file: prompts/dashboard-portal-sso.md
    baseline_file: baselines/dashboard-portal-sso.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-greengrass-core-device
    difficulty: easy
    prompt_file: prompts/missing-greengrass-core-device.md
    baseline_file: baselines/missing-greengrass-core-device.md
    expected_verdict: PREREQUISITES_MISSING
