# Eval test cases for ecr-push-pull-troubleshooter
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five deterministic cases — one per root-cause layer family. Each case's
# TARGET embeds the test-case id so the model naturally echoes it (avoids
# assertion-token mismatch). The diagnostic ordering in SKILL.md produces
# exactly the expected verdicts below.
skill: ecr-push-pull-troubleshooter
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: auth-token-expired-ci-cache
    description: >-
      CI runner caches ~/.docker/config.json across jobs. docker push
      fails with "Your authorization token has expired" because the
      cached ECR token's 12-hour validity elapsed 2 hours ago. The
      token is base64(AWS:<signed-url>). Expected layer:
      AUTH_TOKEN_EXPIRED.
    input: |
      Symptom: docker push returns the following on every push from
      the CI runner:

        denied: Your authorization token has expired. Reauthenticate
        at https://111111111111.dkr.ecr.us-east-1.amazonaws.com/

      The push was working 14 hours ago; the first failure appeared
      2 hours ago and has affected every build since.

      Registry: 111111111111.dkr.ecr.us-east-1.amazonaws.com
      Repository: auth-token-expired-ci-cache
      Tag: v1
      Caller IAM principal: arn:aws:iam::111111111111:user/ci-bot
      Push command: docker push
        111111111111.dkr.ecr.us-east-1.amazonaws.com/auth-token-expired-ci-cache:v1
      Last successful push: 14 hours ago
      CI cache: ~/.docker/config.json is cached across CI jobs and
        not invalidated between runs.

      aws ecr get-authorization-token (freshly issued):
        proxyEndpoint: https://111111111111.dkr.ecr.us-east-1.amazonaws.com
        expiresAt: <now + 12 hours>
      Cached token in ~/.docker/config.json:
        decoded username: AWS
        decoded password X-amz-expires value: 43200
        issued approximately 14 hours ago

      aws iam simulate-principal-policy for arn:aws:iam::111111111111:user/ci-bot
        on ecr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability,
        ecr:PutImage, ecr:CompleteLayerUpload: all ALLOWED.

      Emit the standard diagnostic block (TARGET, VERDICT, REASON,
      LAYER, EVIDENCE, REMEDIATION).
    expected_verdict: ROOT_CAUSE_IDENTIFIED
    assertions:
      must_contain:
        - "ROOT_CAUSE_IDENTIFIED"
        - "auth-token-expired-ci-cache"
        - "AUTH_TOKEN_EXPIRED"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: INSUFFICIENT_DATA"
        - "LAYER: AUTH_IAM_DENIED"
        - "LAYER: POLICY_IAM"

  - id: lifecycle-policy-first-match-delete
    description: >-
      Lifecycle policy rule "expire count=3 tagStatus=any" placed
      first in rule order. The 4th-newest image (payments:v3, the
      production release from 2 days ago) was deleted by the ECR
      service principal at 03:17 UTC. Lifecycle evaluates first-match
      top-to-bottom. Expected layer: LIFECYCLE_DELETED.
    input: |
      Symptom: docker pull returns "manifest unknown" for
      111111111111.dkr.ecr.us-east-1.amazonaws.com/lifecycle-policy-first-match-delete:v3
      since 03:17 UTC. The tag was present and serving production
      traffic yesterday; no engineer manually deleted it.

      Registry: 111111111111.dkr.ecr.us-east-1.amazonaws.com
      Repository: lifecycle-policy-first-match-delete
      Tag: v3 (production release, pushed 2 days ago)

      aws ecr describe-images --repository-name lifecycle-policy-first-match-delete:
        v1: pushed 4 days ago, present
        v2: pushed 3 days ago, present
        v3: NOT LISTED (gone since 03:17 UTC)
        v4: pushed 1 hour ago, present
        v5: pushed 30 minutes ago, present

      aws ecr get-lifecycle-policy output (ruleText):
        {
          "rules": [
            {
              "rulePriority": 1,
              "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 3},
              "action": {"type": "expire"}
            },
            {
              "rulePriority": 2,
              "selection": {"tagStatus": "tagged", "countType": "imageCountMoreThan", "countNumber": 10, "tagPrefixList": ["prod-"]},
              "action": {"type": "expire"}
            }
          ]
        }

      aws cloudtrail lookup-events for BatchDeleteImage between
      03:00-04:00 UTC: ECR service principal deleted digest
      sha256:abc123 from lifecycle-policy-first-match-delete;
      requestParameters included imageTag=v3.

      Repository policy: (none — same-account only)
      Manual DeleteImage CloudTrail events from any user: (none)

      Emit the standard diagnostic block.
    expected_verdict: ROOT_CAUSE_IDENTIFIED
    assertions:
      must_contain:
        - "ROOT_CAUSE_IDENTIFIED"
        - "lifecycle-policy-first-match-delete"
        - "LIFECYCLE_DELETED"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: INSUFFICIENT_DATA"
        - "LAYER: POLICY_REPOSITORY"

  - id: cross-account-repo-policy-missing
    description: >-
      Cross-account ECS task in account 222222222222 cannot pull image
      from ECR repo in account 111111111111. The caller's IAM policy
      allows ecr:BatchGetImage but the ECR repository policy does not
      list account 222222222222. Cross-account requires BOTH sides.
      Expected layer: POLICY_REPOSITORY.
    input: |
      Symptom: ECS task in account 222222222222 fails to start with
      CannotPullContainerError. The task definition references
      111111111111.dkr.ecr.us-east-1.amazonaws.com/cross-account-repo-policy-missing:1.0.

      Registry (image source): 111111111111.dkr.ecr.us-east-1.amazonaws.com
      Repository: cross-account-repo-policy-missing
      Tag: 1.0
      Image source account: 111111111111
      Caller (ECS task execution role) account: 222222222222
      Caller IAM role: arn:aws:iam::222222222222:role/ecs-task-exec

      aws iam simulate-principal-policy for
      arn:aws:iam::222222222222:role/ecs-task-exec:
        ecr:BatchGetImage on
          arn:aws:ecr:us-east-1:111111111111:repository/cross-account-repo-policy-missing: ALLOWED
        ecr:GetDownloadUrlForLayer on same repository: ALLOWED
        ecr:GetAuthorizationToken on *: ALLOWED

      aws ecr get-repository-policy --repository-name
      cross-account-repo-policy-missing --region us-east-1
      --profile 111111-profile:
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Sid": "SameAccountOnly",
            "Effect": "Allow",
            "Principal": {"AWS": "arn:aws:iam::111111111111:root"},
            "Action": ["ecr:BatchGetImage", "ecr:GetDownloadUrlForLayer"]
          }]
        }
        Note: Principal lists only account 111111111111. Account
        222222222222 is NOT in any statement.

      aws ecr describe-images (image exists):
        Tag 1.0 exists, size 450 MB compressed, pushed 2 hours ago.

      Emit the standard diagnostic block.
    expected_verdict: ROOT_CAUSE_IDENTIFIED
    assertions:
      must_contain:
        - "ROOT_CAUSE_IDENTIFIED"
        - "cross-account-repo-policy-missing"
        - "POLICY_REPOSITORY"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: INSUFFICIENT_DATA"
        - "LAYER: POLICY_IAM"

  - id: tag-immutability-overwrite-blocked
    description: >-
      CI pipeline attempts to overwrite an existing tag. The ECR
      repository has imageTagMutability: IMMUTABLE. Push fails with
      "image tag already exists". Immutability is per-repository.
      Expected layer: TAG_IMMUTABILITY.
    input: |
      Symptom: CI pipeline push fails with:

        denied: 111111111111.dkr.ecr.us-east-1.amazonaws.com/
        tag-immutability-overwrite-blocked:latest image tag already
        exists and is immutable

      The pipeline re-builds the latest tag on every commit; the first
      build succeeded, every subsequent build fails.

      Registry: 111111111111.dkr.ecr.us-east-1.amazonaws.com
      Repository: tag-immutability-overwrite-blocked
      Tag: latest (overwrite attempt)

      aws ecr describe-repositories --repository-names
      tag-immutability-overwrite-blocked:
        imageTagMutability: IMMUTABLE
        createdAt: 2026-06-01
        encryptionConfiguration.encryptionType: AES256

      aws ecr describe-images (latest exists):
        Tag latest exists, pushed 3 days ago, digest sha256:xyz789

      aws ecr get-repository-policy: (none — same-account IAM only)
      aws iam simulate-principal-policy for the CI role:
        ecr:PutImage on the repository: ALLOWED
        ecr:GetAuthorizationToken: ALLOWED

      Auth token freshly issued (expires in +12 hours); not the cause.

      Emit the standard diagnostic block.
    expected_verdict: ROOT_CAUSE_IDENTIFIED
    assertions:
      must_contain:
        - "ROOT_CAUSE_IDENTIFIED"
        - "tag-immutability-overwrite-blocked"
        - "TAG_IMMUTABILITY"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: INSUFFICIENT_DATA"
        - "LAYER: POLICY_IAM"
        - "LAYER: AUTH_TOKEN_EXPIRED"

  - id: fargate-arm64-arch-mismatch
    description: >-
      Fargate task (x86_64) pulls an image tag that resolves to a
      single-arch arm64 image. Docker manifest inspect shows only
      linux/arm64. The task fails with "no matching manifest for
      platform linux/amd64". Expected layer: ARCHITECTURE_MISMATCH.
    input: |
      Symptom: Fargate task in us-east-1 stops during pull with:

        CannotPullContainerError: inspect image has failed: no
        matching manifest for platform linux/amd64 in the manifest
        list

      Registry: 111111111111.dkr.ecr.us-east-1.amazonaws.com
      Repository: fargate-arm64-arch-mismatch
      Tag: 2026.08
      Task platform: Fargate platformVersion 1.4.0, runtimePlatform:
        LINUX x86_64 (default)

      docker manifest inspect
      111111111111.dkr.ecr.us-east-1.amazonaws.com/fargate-arm64-arch-mismatch:2026.08:
        {
          "schemaVersion": 2,
          "mediaType": "application/vnd.docker.distribution.manifest.v2+json",
          "config": {"architecture": "arm64", "os": "linux"},
          "layers": [...]
        }
        Note: NOT a manifest list. Single-arch arm64 image. No
        linux/amd64 variant included.

      aws ecr describe-images --repository-name
      fargate-arm64-arch-mismatch --image-ids imageTag=2026.08:
        imageManifest mediaType:
          application/vnd.docker.distribution.manifest.v2+json
        (single manifest, not a manifest list)

      aws ecs describe-tasks --cluster prod --tasks <task-id>:
        platformVersion: "1.4.0"
        cpuArchitecture: x86_64
        lastStatus: STOPPED
        stoppedReason: "manifest unknown"

      Auth token freshly issued; repository policy allows same-account
      pull; image exists in describe-images.

      Emit the standard diagnostic block.
    expected_verdict: ROOT_CAUSE_IDENTIFIED
    assertions:
      must_contain:
        - "ROOT_CAUSE_IDENTIFIED"
        - "fargate-arm64-arch-mismatch"
        - "ARCHITECTURE_MISMATCH"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: INSUFFICIENT_DATA"
        - "LAYER: MANIFEST_INVALID"
        - "LAYER: POLICY_REPOSITORY"
