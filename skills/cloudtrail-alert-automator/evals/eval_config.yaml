# Eval configuration for cloudtrail-alert-automator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: cloudtrail-alert-automator
snapshot_date: "2026-08-07"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: root-login-alert
    difficulty: easy
    prompt_file: prompts/root-login-alert.md
    baseline_file: baselines/root-login-alert.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: iam-change-enrichment
    difficulty: medium
    prompt_file: prompts/iam-change-enrichment.md
    baseline_file: baselines/iam-change-enrichment.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: suppression-cicd-service
    difficulty: medium
    prompt_file: prompts/suppression-cicd-service.md
    baseline_file: baselines/suppression-cicd-service.md
    expected_verdict: AUTOMATION_DEPLOYED
  - id: security-hub-missing
    difficulty: hard
    prompt_file: prompts/security-hub-missing.md
    baseline_file: baselines/security-hub-missing.md
    expected_verdict: REVIEW_REQUIRED
  - id: multi-account-org-trail
    difficulty: hard
    prompt_file: prompts/multi-account-org-trail.md
    baseline_file: baselines/multi-account-org-trail.md
    expected_verdict: AUTOMATION_DEPLOYED
