# Eval configuration for glue-job-troubleshooter.
#
# Maps each eval case to its external prompt and baseline files so the
# same case can run with-skill (SKILL.md loaded) vs without-skill
# (baseline only) for delta comparison. This is the canonical
# structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer
# shim discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This
# file does not replace it — it adds the structured with-skill-vs-
# baseline dimension.
skill_name: glue-job-troubleshooter
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: python-exception-attributeerror-script
    difficulty: easy
    prompt_file: prompts/python-exception-attributeerror-script.md
    baseline_file: baselines/python-exception-attributeerror-script.md
    expected_verdict: ROOT_CAUSE_FOUND
  - id: jdbc-connection-missing-security-group
    difficulty: medium
    prompt_file: prompts/jdbc-connection-missing-security-group.md
    baseline_file: baselines/jdbc-connection-missing-security-group.md
    expected_verdict: ROOT_CAUSE_FOUND
  - id: bookmark-not-advancing-layout-drift
    difficulty: hard
    prompt_file: prompts/bookmark-not-advancing-layout-drift.md
    baseline_file: baselines/bookmark-not-advancing-layout-drift.md
    expected_verdict: ROOT_CAUSE_FOUND
  - id: spark-oom-stage-skew
    difficulty: hard
    prompt_file: prompts/spark-oom-stage-skew.md
    baseline_file: baselines/spark-oom-stage-skew.md
    expected_verdict: ROOT_CAUSE_FOUND
  - id: catalog-table-not-found
    difficulty: medium
    prompt_file: prompts/catalog-table-not-found.md
    baseline_file: baselines/catalog-table-not-found.md
    expected_verdict: ROOT_CAUSE_FOUND
