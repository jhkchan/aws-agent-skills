# Eval configuration for sagemaker-pipeline-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: sagemaker-pipeline-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: end-to-end-pipeline-with-registry
    difficulty: hard
    prompt_file: prompts/end-to-end-pipeline-with-registry.md
    baseline_file: baselines/end-to-end-pipeline-with-registry.md
    expected_verdict: READY_TO_DEPLOY

  - id: conditional-branch-on-metric
    difficulty: hard
    prompt_file: prompts/conditional-branch-on-metric.md
    baseline_file: baselines/conditional-branch-on-metric.md
    expected_verdict: READY_TO_DEPLOY

  - id: tuning-step-hpo
    difficulty: medium
    prompt_file: prompts/tuning-step-hpo.md
    baseline_file: baselines/tuning-step-hpo.md
    expected_verdict: READY_TO_DEPLOY

  - id: caching-and-parallelism
    difficulty: medium
    prompt_file: prompts/caching-and-parallelism.md
    baseline_file: baselines/caching-and-parallelism.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-execution-role
    difficulty: easy
    prompt_file: prompts/missing-execution-role.md
    baseline_file: baselines/missing-execution-role.md
    expected_verdict: PREREQUISITES_MISSING
