# Eval configuration for cloudfront-origin-access-control-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: cloudfront-origin-access-control-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: basic-s3-oac
    difficulty: hard
    prompt_file: prompts/basic-s3-oac.md
    baseline_file: baselines/basic-s3-oac.md
    expected_verdict: READY_TO_DEPLOY

  - id: oac-sse-kms
    difficulty: hard
    prompt_file: prompts/oac-sse-kms.md
    baseline_file: baselines/oac-sse-kms.md
    expected_verdict: READY_TO_DEPLOY

  - id: oai-to-oac-migration
    difficulty: medium
    prompt_file: prompts/oai-to-oac-migration.md
    baseline_file: baselines/oai-to-oac-migration.md
    expected_verdict: READY_TO_DEPLOY

  - id: multi-distribution-shared-bucket
    difficulty: medium
    prompt_file: prompts/multi-distribution-shared-bucket.md
    baseline_file: baselines/multi-distribution-shared-bucket.md
    expected_verdict: READY_TO_DEPLOY

  - id: website-endpoint-mismatch
    difficulty: easy
    prompt_file: prompts/website-endpoint-mismatch.md
    baseline_file: baselines/website-endpoint-mismatch.md
    expected_verdict: PREREQUISITES_MISSING
