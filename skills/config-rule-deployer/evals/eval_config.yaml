# Eval configuration for config-rule-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: config-rule-deployer
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: deploy-managed-s3-rule-ready
    difficulty: easy
    prompt_file: prompts/deploy-managed-s3-rule-ready.md
    baseline_file: baselines/deploy-managed-s3-rule-ready.md
    expected_verdict: READY_TO_DEPLOY
    expected_risk: LOW
  - id: deploy-custom-lambda-rule-ready
    difficulty: medium
    prompt_file: prompts/deploy-custom-lambda-rule-ready.md
    baseline_file: baselines/deploy-custom-lambda-rule-ready.md
    expected_verdict: READY_TO_DEPLOY
    expected_risk: MODERATE
  - id: deploy-conformance-pack-ready
    difficulty: medium
    prompt_file: prompts/deploy-conformance-pack-ready.md
    baseline_file: baselines/deploy-conformance-pack-ready.md
    expected_verdict: READY_TO_DEPLOY
    expected_risk: MODERATE
  - id: deploy-org-rule-prereqs-missing
    difficulty: hard
    prompt_file: prompts/deploy-org-rule-prereqs-missing.md
    baseline_file: baselines/deploy-org-rule-prereqs-missing.md
    expected_verdict: PREREQUISITES_MISSING
    expected_risk: HIGH
  - id: deploy-proactive-rule-ready
    difficulty: hard
    prompt_file: prompts/deploy-proactive-rule-ready.md
    baseline_file: baselines/deploy-proactive-rule-ready.md
    expected_verdict: READY_TO_DEPLOY
    expected_risk: MODERATE
