# Eval test cases for config-rule-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
skill: config-rule-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: deploy-managed-s3-rule-ready
    description: >-
      Deploy a managed Config rule s3-bucket-public-read-prohibited.
      Configuration recorder is running, delivery channel is configured,
      the managed rule identifier is valid, and IAM permissions are
      correct. All pre-checks pass; plan should produce READY_TO_DEPLOY
      with the put-config-rule CLI, CONFIRM gate, and the evaluation
      lag caveat.
    input: |
      Operation: create
      Rule name: s3-bucket-public-read-prohibited
      Type: managed
      ManagedRuleIdentifier: S3_BUCKET_PUBLIC_READ_PROHIBITED
      Scope: AWS::S3::Bucket
      Region: us-east-1
      Account: 111111111111

      Pre-checks (already performed by caller):
        aws configservice describe-configuration-recorders:
          recorder: default, recording: true, allSupported: true
        aws configservice describe-delivery-channels:
          channel: default, s3BucketName: config-bucket-111111111111 (exists)
        aws configservice describe-config-rules --config-rule-names s3-bucket-public-read-prohibited:
          NoSuchConfigRule (new rule)
        aws configservice describe-config-rules (rule count): 12

      Emit the standard VERDICT block (RULE, VERDICT, TARGET,
      PRE_CHECKS, STEPS, POST_VERIFY, EVALUATION, COMPLIANCE,
      REMEDIATION, NOTES).
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "s3-bucket-public-read-prohibited"
        - "put-config-rule"
        - "VERDICT"
        - "CONFIRM"
        - "S3_BUCKET_PUBLIC_READ_PROHIBITED"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: deploy-custom-lambda-rule-ready
    description: >-
      Deploy a custom Lambda-based Config rule for EC2 tag enforcement.
      The Lambda function exists, has the correct permission for Config
      invocation, and the recorder is running. All pre-checks pass;
      plan should produce READY_TO_DEPLOY.
    input: |
      Operation: create
      Rule name: ec2-required-tags
      Type: custom
      LambdaFunction: arn:aws:lambda:us-east-1:111111111111:function:config-rule-required-tags
      Scope: AWS::EC2::Instance
      InputParameters: {"requiredTags": "Environment,Owner,CostCenter"}
      EvaluationMode: configuration-change
      Region: us-east-1
      Account: 111111111111

      Pre-checks:
        aws configservice describe-configuration-recorders:
          recorder: default, recording: true, allSupported: true
        aws configservice describe-delivery-channels:
          channel: default, s3BucketName: config-bucket-111111111111 (exists)
        aws lambda get-function --function-name config-rule-required-tags:
          OK (runtime: python3.12, timeout: 30s, role: config-rule-lambda-role)
        aws lambda get-policy --function-name config-rule-required-tags:
          OK (statement AllowConfigToInvoke, principal: config.amazonaws.com, sourceAccount: 111111111111)
        Lambda IAM role config-rule-lambda-role has config:PutEvaluations: true
        aws configservice describe-config-rules (rule count): 13

      Emit the standard VERDICT block.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "ec2-required-tags"
        - "put-config-rule"
        - "VERDICT"
        - "CUSTOM_LAMBDA"
        - "config.amazonaws.com"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: deploy-conformance-pack-ready
    description: >-
      Deploy a conformance pack for CIS AWS Foundations Benchmark with
      5 managed rules. Template body is valid, under 256 KB, and the
      conformance pack count is within limits. All pre-checks pass;
      plan should produce READY_TO_DEPLOY.
    input: |
      Operation: create
      Conformance pack name: cis-aws-foundations-benchmark
      Type: conformance-pack
      Template: CIS benchmark with 5 rules (iam-no-inline-policy, root-mfa-enabled,
        iam-password-policy, multi-region-cloudtrail-enabled, cloudtrail-enabled)
      Region: us-east-1
      Account: 111111111111

      Pre-checks:
        aws configservice describe-configuration-recorders:
          recorder: default, recording: true
        aws configservice describe-delivery-channels:
          channel: default, s3BucketName: config-bucket-111111111111 (exists)
        Template body size: 2.1 KB (< 256 KB)
        All managed rule identifiers valid: YES
        aws configservice describe-conformance-packs (pack count): 3
        Total conformance pack count after deploy: 4 (<= 25)

      Emit the standard VERDICT block.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "cis-aws-foundations-benchmark"
        - "put-conformance-pack"
        - "VERDICT"
        - "CONFIRM"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: deploy-org-rule-prereqs-missing
    description: >-
      Attempt to deploy an organization config rule from a member
      account (not the management account). The organization aggregator
      is not authorized and the account lacks Organizations permissions.
      Pre-checks should produce PREREQUISITES_MISSING.
    input: |
      Operation: create
      Organization rule name: org-s3-public-read-prohibited
      Type: organization-config-rule
      ManagedRuleIdentifier: S3_BUCKET_PUBLIC_READ_PROHIBITED
      ResourceTypesScope: ["AWS::S3::Bucket"]
      Region: us-east-1
      Account: 222222222222 (attempting from MEMBER account, not management)

      Pre-checks:
        aws configservice describe-configuration-recorders:
          recorder: default, recording: true
        aws configservice describe-delivery-channels:
          channel: default, s3BucketName: config-bucket-222222222222 (exists)
        aws organizations describe-organization:
          ERROR: this account is not the organization management account
          (account 222222222222 is a MEMBER account, management is 111111111111)
        aws configservice describe-organization-config-rules:
          ERROR: AccessDeniedException — organization config rules can only
          be managed from the management account or delegated administrator

      Emit the standard VERDICT block.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "management account"
        - "222222222222"
        - "VERDICT"
        - "organization"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: READY_TO_DEPLOY"

  - id: deploy-proactive-rule-ready
    description: >-
      Deploy a proactive Config rule as a CloudFormation hook to block
      non-compliant S3 bucket creation. The hook type is registered,
      Security Hub is enabled, and all pre-checks pass. Plan should
      produce READY_TO_DEPLOY.
    input: |
      Operation: create
      Rule name: proactive-s3-public-read-block
      Type: proactive (CloudFormation hook)
      ManagedRuleIdentifier: S3_BUCKET_PUBLIC_READ_PROHIBITED
      ResourceTypes: ["AWS::S3::Bucket"]
      TargetOperations: ["CREATE", "UPDATE"]
      Region: us-east-1
      Account: 111111111111

      Pre-checks:
        aws configservice describe-configuration-recorders:
          recorder: default, recording: true, allSupported: true
        aws configservice describe-delivery-channels:
          channel: default, s3BucketName: config-bucket-111111111111 (exists)
        aws cloudformation list-types --type HOOK:
          CfnHook::Config::ProactiveRule (registered, version 1, default version)
        aws securityhub get-enabled-standards:
          OK (SecurityHub/ControlsEnabled: true)
        aws configservice describe-config-rules (rule count): 15

      Emit the standard VERDICT block.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "proactive-s3-public-read-block"
        - "VERDICT"
        - "CONFIRM"
        - "CloudFormation"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "VERDICT: PREREQUISITES_MISSING"
