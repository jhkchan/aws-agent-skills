# Eval configuration for dlm-lifecycle-policy-auditor.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: dlm-lifecycle-policy-auditor
snapshot_date: "2026-08-04"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: no-policy-at-all
    difficulty: medium
    prompt_file: prompts/no-policy-at-all.md
    baseline_file: baselines/no-policy-at-all.md
    expected_verdict: NO_POLICY
    expected_risk: CRITICAL
  - id: disabled-policy
    difficulty: easy
    prompt_file: prompts/disabled-policy.md
    baseline_file: baselines/disabled-policy.md
    expected_verdict: MISCONFIGURED
    expected_risk: HIGH
  - id: empty-target-tags
    difficulty: medium
    prompt_file: prompts/empty-target-tags.md
    baseline_file: baselines/empty-target-tags.md
    expected_verdict: MISCONFIGURED
    expected_risk: HIGH
  - id: no-cross-region-copy-gap
    difficulty: hard
    prompt_file: prompts/no-cross-region-copy-gap.md
    baseline_file: baselines/no-cross-region-copy-gap.md
    expected_verdict: CONFIG_GAP
    expected_risk: MODERATE
  - id: short-retention-no-copy-tags-gap
    difficulty: hard
    prompt_file: prompts/short-retention-no-copy-tags-gap.md
    baseline_file: baselines/short-retention-no-copy-tags-gap.md
    expected_verdict: CONFIG_GAP
    expected_risk: MODERATE
  - id: clean-production-policy
    difficulty: easy
    prompt_file: prompts/clean-production-policy.md
    baseline_file: baselines/clean-production-policy.md
    expected_verdict: OK
    expected_risk: LOW
