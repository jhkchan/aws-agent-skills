# Eval test cases for kafka-msk-lag-troubleshooter
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five deterministic cases — one per root-cause layer family. Each
# case's TARGET embeds the test-case id so the model naturally echoes
# it (avoids assertion-token mismatch). The diagnostic ordering in
# SKILL.md produces exactly the expected verdicts below.
skill: kafka-msk-lag-troubleshooter
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: partition-skew-hot-key
    description: >-
      MSK topic tx-events with 12 partitions. RecordsLagMax climbing
      to 8M but only partition 7 shows lag; the other 11 partitions
      are near-zero. Producer uses a device-id key; one device
      generates 80% of traffic. The default partitioner hashes the
      key to partition 7. Expected layer: PARTITION_SKEW.
    input: |
      Symptom: consumer group cg-payments-processor on topic tx-events
      shows RecordsLagMax climbing from 10K to 8M over 4 hours. The
      payments pipeline is falling behind; downstream alerting fired
      at 8M lag threshold.

      ClusterArn: arn:aws:kafka:us-east-1:111111111111:cluster/prod-msk/abc-123
      ClusterType: PROVISIONED (3 brokers, kafka.m5.xlarge)
      Topic: tx-events
      Partitions: 12
      ReplicationFactor: 3
      ConsumerGroup: cg-payments-processor
      ConsumerGroupMembers: 12
      ConsumerGroupState: STABLE

      CloudWatch metrics (last 4 hours, AWS/Kafka namespace):
        - RecordsLagMax: 10000 → 8000000
        - BytesInPerSec (cluster): 12 MB/s (flat)
        - BytesOutPerSec (cluster): 5 MB/s (flat)
        - UnderReplicatedPartitions: 0
        - CpuUser (per broker): broker-1 35%, broker-2 38%, broker-3 33%
        - NetworkProcessorAvgIdlePercent: 0.65

      Per-partition lag (kafka-consumer-groups --describe):
        Partition 0:  LAG 12
        Partition 1:  LAG 5
        Partition 2:  LAG 8
        Partition 3:  LAG 3
        Partition 4:  LAG 10
        Partition 5:  LAG 7
        Partition 6:  LAG 4
        Partition 7:  LAG 8000000
        Partition 8:  LAG 9
        Partition 9:  LAG 6
        Partition 10: LAG 11
        Partition 11: LAG 2

      Per-partition throughput (client-side Micrometer, last 10 min):
        Partition 7:  9.6 MB/s
        All others:   0.1 - 0.3 MB/s each

      Producer context:
        - Keyed by device-id (string key)
        - One device (device-abc123) generating a burst (80% of volume)
        - Default partitioner (hash of key modulo partitions)

      Consumer config:
        - fetch.min.bytes: 1 (default)
        - fetch.max.wait.ms: 500 (default)
        - max.poll.records: 500 (default)

      Emit the standard diagnostic block (TARGET, VERDICT, REASON,
      LAYER, EVIDENCE, REMEDIATION).
    expected_verdict: ROOT_CAUSE_IDENTIFIED
    assertions:
      must_contain:
        - "ROOT_CAUSE_IDENTIFIED"
        - "partition-skew-hot-key"
        - "PARTITION_SKEW"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
        - "REMEDIATION"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: INSUFFICIENT_DATA"
        - "LAYER: CONSUMER_RATE"
        - "LAYER: CONSUMER_FETCH_TUNING"

  - id: broker-disk-isr-shrink
    description: >-
      MSK provisioned cluster (3 brokers). Broker-2 disk hits 92%;
      UnderReplicatedPartitions = 14 sustained; ISRShrink events.
      Producer with acks=all and min.insync.replicas=2 receives
      intermittent NOT_ENOUGH_REPLICAS. Consumer lag is a side
      effect. Expected layer: ISR_SHRINK.
    input: |
      Symptom: consumer group cg-event-processor on topic events
      shows RecordsLagMax climbing. Producer logs show intermittent
      NOT_ENOUGH_REPLICAS (errorCode: 19). Consumer is healthy but
      starved for data because the producer cannot write.

      ClusterArn: arn:aws:kafka:us-east-1:111111111111:cluster/prod-msk/def-456
      ClusterType: PROVISIONED (3 brokers, kafka.m5.large, 1 TB EBS each)
      Topic: events
      Partitions: 30
      ReplicationFactor: 3
      min.insync.replicas: 2
      ConsumerGroup: cg-event-processor

      CloudWatch metrics (last 2 hours, AWS/Kafka namespace):
        - RecordsLagMax: 50000 → 1200000
        - UnderReplicatedPartitions: 0 → 14 (sustained for 90 min)
        - OfflinePartitions: 0
        - ISRShrink: 14 events at the start of the window
        - ISRExpand: 0
        - CpuUser: broker-1 40%, broker-2 82%, broker-3 38%
        - DiskKBWrttnPerSec (broker-2): near device limit
        - Disk usage (broker-2): 92%
        - Disk usage (broker-1): 55%
        - Disk usage (broker-3): 58%

      Producer context:
        - acks: all
        - batch.size: 131072
        - compression.type: lz4

      Consumer context:
        - Consumer is NOT CPU-bound (processing time < 5ms per record)
        - Consumer fetch config is default

      Emit the standard diagnostic block (TARGET, VERDICT, REASON,
      LAYER, EVIDENCE, REMEDIATION).
    expected_verdict: ROOT_CAUSE_IDENTIFIED
    assertions:
      must_contain:
        - "ROOT_CAUSE_IDENTIFIED"
        - "broker-disk-isr-shrink"
        - "ISR_SHRINK"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: INSUFFICIENT_DATA"
        - "LAYER: CONSUMER_RATE"
        - "LAYER: PARTITION_SKEW"

  - id: consumer-fetch-microbatch-stall
    description: >-
      Low-volume Kafka topic user-events (~100 records/min). Consumer
      has fetch.min.bytes=10485760 (10 MB) and fetch.max.wait.ms=500.
      Topic produces ~100 KB/s; consumer waits the full 500ms per
      poll cycle. Effective poll rate is ~2/sec; consumer cannot keep
      up with even modest traffic. Expected layer: CONSUMER_FETCH_TUNING.
    input: |
      Symptom: consumer group cg-user-svc on topic user-events shows
      RecordsLagMax climbing steadily. The consumer is NOT
      CPU-bound (CPU < 10%); downstream DB writes are fast (< 2ms).
      The lag appears to be artificial — the consumer is waiting
      between polls.

      ClusterArn: arn:aws:kafka:us-east-1:111111111111:cluster/dev-msk/ghi-789
      ClusterType: PROVISIONED (3 brokers, kafka.t3.small)
      Topic: user-events
      Partitions: 6
      ConsumerGroup: cg-user-svc
      ConsumerGroupMembers: 6
      ConsumerGroupState: STABLE

      CloudWatch metrics (last hour):
        - RecordsLagMax: 500 → 45000 (climbing)
        - BytesInPerSec: 0.1 MB/s (~100 KB/s)
        - BytesOutPerSec: 0.05 MB/s
        - UnderReplicatedPartitions: 0
        - CpuUser: < 20% on all brokers

      Per-partition lag:
        All 6 partitions show similar lag (~7000-8000 each)
        Distribution is even — no skew

      Consumer config:
        - fetch.min.bytes: 10485760 (10 MB)
        - fetch.max.wait.ms: 500
        - max.poll.records: 500

      Consumer processing:
        - CPU utilization: < 10%
        - Downstream DB write latency: < 2ms
        - Records per poll: ~50 (waiting full 500ms each time)

      Emit the standard diagnostic block (TARGET, VERDICT, REASON,
      LAYER, EVIDENCE, REMEDIATION).
    expected_verdict: ROOT_CAUSE_IDENTIFIED
    assertions:
      must_contain:
        - "ROOT_CAUSE_IDENTIFIED"
        - "consumer-fetch-microbatch-stall"
        - "CONSUMER_FETCH_TUNING"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: INSUFFICIENT_DATA"
        - "LAYER: CONSUMER_RATE"
        - "LAYER: PARTITION_SKEW"

  - id: msk-serverless-cu-throttle
    description: >-
      MSK Serverless cluster. Topic has 4 partitions. One partition
      (partition 2) is hitting ConsumedReadThroughput CU throttle
      because a hot key routes 70% of traffic there. Throttle metric
      shows sustained throttling. Consumer lag on partition 2 only.
      Expected layer: MSK_SERVERLESS_THROTTLE.
    input: |
      Symptom: consumer group cg-iot-processor on topic sensor-data
      shows RecordsLagMax climbing on partition 2 only. MSK
      Serverless cluster; the Throttle metric shows sustained
      throttling on partition 2. Other partitions are near-zero lag.

      ClusterArn: arn:aws:kafka:us-east-1:111111111111:cluster/serverless-msk/jkl-012
      ClusterType: SERVERLESS
      Topic: sensor-data
      Partitions: 4
      ConsumerGroup: cg-iot-processor
      ConsumerGroupMembers: 4
      ConsumerGroupState: STABLE

      CloudWatch metrics (last hour, AWS/Kafka namespace):
        - RecordsLagMax: 1000 → 500000
        - Throttle (Sum): sustained 50+ per 5-min period
        - ConsumedReadThroughput: at partition-level CU cap on partition 2
        - BytesInPerSec: flat at 2 MB/s (cluster aggregate)
        - UnderReplicatedPartitions: 0 (Serverless uses KRaft)
        - (No CpuUser or disk metrics — Serverless manages these)

      Per-partition lag:
        Partition 0: LAG 15
        Partition 1: LAG 8
        Partition 2: LAG 500000
        Partition 3: LAG 12

      Per-partition throughput:
        Partition 2: 1.4 MB/s (70% of traffic)
        Others: 0.2 MB/s each

      Producer context:
        - Keyed by device-id; one device model dominates traffic
        - Hash routes to partition 2

      Consumer config:
        - fetch.min.bytes: 1 (default)
        - fetch.max.wait.ms: 500 (default)

      Emit the standard diagnostic block (TARGET, VERDICT, REASON,
      LAYER, EVIDENCE, REMEDIATION).
    expected_verdict: ROOT_CAUSE_IDENTIFIED
    assertions:
      must_contain:
        - "ROOT_CAUSE_IDENTIFIED"
        - "msk-serverless-cu-throttle"
        - "MSK_SERVERLESS_THROTTLE"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: INSUFFICIENT_DATA"
        - "LAYER: CONSUMER_RATE"
        - "LAYER: BROKER_SATURATION"

  - id: rebalance-storm-no-static-membership
    description: >-
      Consumer group on topic orders shows a sawtooth lag pattern.
      Rebalance events correlate with each lag spike. Consumer
      logs show frequent JoinGroup requests. No static membership
      configured; rolling deployments trigger full group rebalances
      (stop-the-world). Expected layer: REBALANCE_STORM.
    input: |
      Symptom: consumer group cg-order-processor on topic orders
      shows a sawtooth lag pattern. RecordsLagMax spikes every ~3-5
      minutes, then drops, then spikes again. The group is never
      stable long enough to drain the backlog. Consumer logs show
      frequent "Member ... sending JoinGroup request" entries.

      ClusterArn: arn:aws:kafka:us-east-1:111111111111:cluster/prod-msk/mno-345
      ClusterType: PROVISIONED (3 brokers, kafka.m5.xlarge)
      Topic: orders
      Partitions: 24
      ConsumerGroup: cg-order-processor
      ConsumerGroupMembers: 24 (one consumer per partition)
      ConsumerGroupState: oscillating between STABLE and PREPARING_REBALANCE

      CloudWatch metrics (last hour):
        - RecordsLagMax: sawtooth pattern, peaks at 200000, valleys at 5000
        - BytesInPerSec: 8 MB/s (flat, no producer burst)
        - BytesOutPerSec: sawtooth (drops to near-zero during rebalance)
        - UnderReplicatedPartitions: 0
        - CpuUser: < 40% on all brokers

      Per-partition lag:
        Lag is distributed across all 24 partitions (not skewed)
        All partitions spike during rebalance, then drain when STABLE

      Consumer config:
        - session.timeout.ms: 45000 (default)
        - heartbeat.interval.ms: 3000 (default)
        - max.poll.interval.ms: 300000 (default 5 min)
        - group.instance.id: NOT SET (no static membership)
        - partition.assignment.strategy: RangeAssignor (default, stop-the-world)

      Deployment context:
        - Rolling deployment of consumer pods every ~5 minutes during
          a canary rollout
        - Each pod restart triggers a full group rebalance (no static
          membership)

      Producer context:
        - acks: all
        - Producer rate is steady (no burst)

      Emit the standard diagnostic block (TARGET, VERDICT, REASON,
      LAYER, EVIDENCE, REMEDIATION).
    expected_verdict: ROOT_CAUSE_IDENTIFIED
    assertions:
      must_contain:
        - "ROOT_CAUSE_IDENTIFIED"
        - "rebalance-storm-no-static-membership"
        - "REBALANCE_STORM"
        - "VERDICT"
        - "REASON"
        - "EVIDENCE"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: INSUFFICIENT_DATA"
        - "LAYER: CONSUMER_RATE"
        - "LAYER: PARTITION_SKEW"
