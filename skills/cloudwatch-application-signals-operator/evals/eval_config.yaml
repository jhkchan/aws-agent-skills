# Eval configuration for cloudwatch-application-signals-operator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: cloudwatch-application-signals-operator
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: enable-slos-burn-rate
    difficulty: hard
    prompt_file: prompts/enable-slos-burn-rate.md
    baseline_file: baselines/enable-slos-burn-rate.md
    expected_verdict: OPERATION_COMPLETED

  - id: sli-latency-availability
    difficulty: hard
    prompt_file: prompts/sli-latency-availability.md
    baseline_file: baselines/sli-latency-availability.md
    expected_verdict: OPERATION_COMPLETED

  - id: service-map-correlation
    difficulty: hard
    prompt_file: prompts/service-map-correlation.md
    baseline_file: baselines/service-map-correlation.md
    expected_verdict: OPERATION_COMPLETED

  - id: multi-service-slo-tracking
    difficulty: hard
    prompt_file: prompts/multi-service-slo-tracking.md
    baseline_file: baselines/multi-service-slo-tracking.md
    expected_verdict: OPERATION_COMPLETED

  - id: missing-otel-instrumentation
    difficulty: easy
    prompt_file: prompts/missing-otel-instrumentation.md
    baseline_file: baselines/missing-otel-instrumentation.md
    expected_verdict: REVIEW_REQUIRED
