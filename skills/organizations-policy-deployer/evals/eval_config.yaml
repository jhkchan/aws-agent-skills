# Eval configuration for organizations-policy-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: organizations-policy-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: root-deny-list-break-glass
    difficulty: hard
    prompt_file: prompts/root-deny-list-break-glass.md
    baseline_file: baselines/root-deny-list-break-glass.md
    expected_verdict: READY_TO_DEPLOY

  - id: ou-allow-list-fullawsaccess-detach
    difficulty: hard
    prompt_file: prompts/ou-allow-list-fullawsaccess-detach.md
    baseline_file: baselines/ou-allow-list-fullawsaccess-detach.md
    expected_verdict: READY_TO_DEPLOY

  - id: multi-ou-inherited-intersection
    difficulty: medium
    prompt_file: prompts/multi-ou-inherited-intersection.md
    baseline_file: baselines/multi-ou-inherited-intersection.md
    expected_verdict: READY_TO_DEPLOY

  - id: tag-policy-enforced-for
    difficulty: medium
    prompt_file: prompts/tag-policy-enforced-for.md
    baseline_file: baselines/tag-policy-enforced-for.md
    expected_verdict: READY_TO_DEPLOY

  - id: allow-list-without-fullawsaccess-detach
    difficulty: easy
    prompt_file: prompts/allow-list-without-fullawsaccess-detach.md
    baseline_file: baselines/allow-list-without-fullawsaccess-detach.md
    expected_verdict: PREREQUISITES_MISSING
