# Eval test cases for cost-optimization-hub-optimizer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the OPTIMIZED /
# FURTHER_OPTIMIZATION_AVAILABLE classification across Hub
# workflows (enablement + quick-win triage, multi-account
# payer roll-out with Compute Optimizer integration,
# implementation status tracking to OPTIMIZED, idle-resource
# recommendations with effort-level prioritization, and the
# missing-cost-allocation-tag gap that blocks FURTHER
# optimization).
skill: cost-optimization-hub-optimizer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: enable-and-quick-win-triage
    description: >-
      Enable Cost Optimization Hub in a multi-account org and
      triage the Low-effort quick-win queue. Expects
      FURTHER_OPTIMIZATION_AVAILABLE with enrollment ACTIVE,
      Compute Optimizer enrolled, and the quick-win queue sized.
    input: |
      Enable Cost Optimization Hub for the Organizations Payer
      123456789012 with all 14 member accounts included. Use
      AFTER_DISCOUNT savings estimation, 14-day look-back.
      Compute Optimizer is already ACTIVE. List the Low-effort
      recommendations above $50/month in estimated savings as
      the quick-win queue. Tag the deployment Owner=finops.
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
    assertions:
      must_contain:
        - "FURTHER_OPTIMIZATION_AVAILABLE"
        - "ACTIVE"
        - "AFTER_DISCOUNT"
        - "quick-win"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OPTIMIZED"

  - id: multi-account-payer-rollout
    description: >-
      Roll out the Hub across a multi-account org with RI/SP
      coverage gap recommendations. Expects
      FURTHER_OPTIMIZATION_AVAILABLE with multi-account scope
      confirmed and the RI/SP coverage gap cited.
    input: |
      Roll out Cost Optimization Hub across the org managed by
      Payer 123456789012 (15 member accounts). Include member
      accounts. Compute Optimizer is ACTIVE in every region.
      RI/SP coverage gap recommendations exist. Identify the
      multi-account scope and surface the RI/SP coverage gap
      summary.
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
    assertions:
      must_contain:
        - "FURTHER_OPTIMIZATION_AVAILABLE"
        - "Payer"
        - "member"
        - "RI"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OPTIMIZED"

  - id: implementation-status-to-optimized
    description: >-
      All recommendations are APPLIED or IGNORED with rationale.
      Expects OPTIMIZED with implementation tracking showing
      zero Pending.
    input: |
      Cost Optimization Hub has 87 recommendations. 41 are
      APPLIED, 46 are IGNORED with documented rationale in the
      resource tags, and 0 are PENDING. Enrollment is ACTIVE.
      Compute Optimizer is ACTIVE. Confirm the optimization
      posture and emit the verdict.
    expected_verdict: OPTIMIZED
    assertions:
      must_contain:
        - "OPTIMIZED"
        - "APPLIED"
        - "IGNORED"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: FURTHER_OPTIMIZATION_AVAILABLE"

  - id: idle-resource-effort-prioritization
    description: >-
      Triage idle-resource recommendations with effort-level
      prioritization. Expects FURTHER_OPTIMIZATION_AVAILABLE
      with the Low-effort quick-win queue sized and effort
      levels cited.
    input: |
      Cost Optimization Hub shows 12 idle-resource
      recommendations (unattached EIPs, idle ELBs, idle RDS
      instances). Total estimated savings $2,140/month. 8 are
      Low effort, 3 are Medium, 1 is High. Compute Optimizer
      is ACTIVE. Identify the Low-effort quick-win batch and
      the annualized savings.
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
    assertions:
      must_contain:
        - "FURTHER_OPTIMIZATION_AVAILABLE"
        - "Low"
        - "idle"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OPTIMIZED"

  - id: missing-cost-allocation-tag
    description: >-
      Operator wants tag-based filtering but the user-defined
      tags are not activated in Cost Explorer. This is a gap
      that prevents further optimization. Expects
      FURTHER_OPTIMIZATION_AVAILABLE with the cost allocation
      tag gap cited.
    input: |
      Operator wants to group Cost Optimization Hub
      recommendations by the Environment and CostCenter tags.
      The Hub is ACTIVE with 50 recommendations pending. The
      Environment and CostCenter user-defined tags exist on
      resources but are NOT activated in Cost Explorer. Surface
      the gap and the remediation path.
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
    assertions:
      must_contain:
        - "FURTHER_OPTIMIZATION_AVAILABLE"
        - "cost allocation"
        - "tag"
        - "VERDICT"
        - "CHECKLIST"
        - "Activate"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: OPTIMIZED"
