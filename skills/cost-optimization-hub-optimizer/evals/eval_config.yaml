# Eval configuration for cost-optimization-hub-optimizer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: cost-optimization-hub-optimizer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: enable-and-quick-win-triage
    difficulty: hard
    prompt_file: prompts/enable-and-quick-win-triage.md
    baseline_file: baselines/enable-and-quick-win-triage.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE

  - id: multi-account-payer-rollout
    difficulty: hard
    prompt_file: prompts/multi-account-payer-rollout.md
    baseline_file: baselines/multi-account-payer-rollout.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE

  - id: implementation-status-to-optimized
    difficulty: medium
    prompt_file: prompts/implementation-status-to-optimized.md
    baseline_file: baselines/implementation-status-to-optimized.md
    expected_verdict: OPTIMIZED

  - id: idle-resource-effort-prioritization
    difficulty: medium
    prompt_file: prompts/idle-resource-effort-prioritization.md
    baseline_file: baselines/idle-resource-effort-prioritization.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE

  - id: missing-cost-allocation-tag
    difficulty: easy
    prompt_file: prompts/missing-cost-allocation-tag.md
    baseline_file: baselines/missing-cost-allocation-tag.md
    expected_verdict: FURTHER_OPTIMIZATION_AVAILABLE
