# Eval configuration for kinesis-stream-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: kinesis-stream-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: on-demand-enhanced-fanout-sse
    difficulty: hard
    prompt_file: prompts/on-demand-enhanced-fanout-sse.md
    baseline_file: baselines/on-demand-enhanced-fanout-sse.md
    expected_verdict: READY_TO_DEPLOY

  - id: provisioned-shard-sizing
    difficulty: hard
    prompt_file: prompts/provisioned-shard-sizing.md
    baseline_file: baselines/provisioned-shard-sizing.md
    expected_verdict: READY_TO_DEPLOY

  - id: enhanced-fanout-registration
    difficulty: medium
    prompt_file: prompts/enhanced-fanout-registration.md
    baseline_file: baselines/enhanced-fanout-registration.md
    expected_verdict: READY_TO_DEPLOY

  - id: cross-account-resource-policy
    difficulty: medium
    prompt_file: prompts/cross-account-resource-policy.md
    baseline_file: baselines/cross-account-resource-policy.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-stream-mode
    difficulty: easy
    prompt_file: prompts/missing-stream-mode.md
    baseline_file: baselines/missing-stream-mode.md
    expected_verdict: PREREQUISITES_MISSING
