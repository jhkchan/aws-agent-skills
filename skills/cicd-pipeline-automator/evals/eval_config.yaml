# Eval configuration for cicd-pipeline-automator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: cicd-pipeline-automator
snapshot_date: "2026-08-07"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: greenfield-cfn-pipeline-automated
    difficulty: easy
    prompt_file: prompts/greenfield-cfn-pipeline-automated.md
    baseline_file: baselines/greenfield-cfn-pipeline-automated.md
    expected_verdict: AUTOMATED
    expected_risk: LOW
  - id: cross-account-kms-gap-manual
    difficulty: hard
    prompt_file: prompts/cross-account-kms-gap-manual.md
    baseline_file: baselines/cross-account-kms-gap-manual.md
    expected_verdict: MANUAL_STEP_REQUIRED
    expected_risk: HIGH
  - id: cdk-pipeline-with-blue-green-lambda-automated
    difficulty: medium
    prompt_file: prompts/cdk-pipeline-with-blue-green-lambda-automated.md
    baseline_file: baselines/cdk-pipeline-with-blue-green-lambda-automated.md
    expected_verdict: AUTOMATED
    expected_risk: MODERATE
  - id: v1-pipeline-migration-manual
    difficulty: hard
    prompt_file: prompts/v1-pipeline-migration-manual.md
    baseline_file: baselines/v1-pipeline-migration-manual.md
    expected_verdict: MANUAL_STEP_REQUIRED
    expected_risk: HIGH
  - id: ecs-rolling-circuit-breaker-automated
    difficulty: medium
    prompt_file: prompts/ecs-rolling-circuit-breaker-automated.md
    baseline_file: baselines/ecs-rolling-circuit-breaker-automated.md
    expected_verdict: AUTOMATED
    expected_risk: LOW
