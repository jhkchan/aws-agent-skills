# Eval configuration for apigateway-resource-policy-auditor.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: apigateway-resource-policy-auditor
snapshot_date: "2026-08-05"
baseline_model: amazon.nova-pro-v1:0
judge_model: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: public-no-auth-any-method
    difficulty: easy
    prompt_file: prompts/public-no-auth-any-method.md
    baseline_file: baselines/public-no-auth-any-method.md
    expected_verdict: PUBLIC_NO_AUTH
  - id: api-key-not-auth
    difficulty: hard
    prompt_file: prompts/api-key-not-auth.md
    baseline_file: baselines/api-key-not-auth.md
    expected_verdict: PUBLIC_NO_AUTH
  - id: no-usage-plan-no-throttle
    difficulty: medium
    prompt_file: prompts/no-usage-plan-no-throttle.md
    baseline_file: baselines/no-usage-plan-no-throttle.md
    expected_verdict: NO_RATE_LIMIT
  - id: cross-account-resource-policy
    difficulty: hard
    prompt_file: prompts/cross-account-resource-policy.md
    baseline_file: baselines/cross-account-resource-policy.md
    expected_verdict: CONFIG_GAP
  - id: no-waf-association
    difficulty: medium
    prompt_file: prompts/no-waf-association.md
    baseline_file: baselines/no-waf-association.md
    expected_verdict: CONFIG_GAP
  - id: all-controls-ok
    difficulty: easy
    prompt_file: prompts/all-controls-ok.md
    baseline_file: baselines/all-controls-ok.md
    expected_verdict: OK
