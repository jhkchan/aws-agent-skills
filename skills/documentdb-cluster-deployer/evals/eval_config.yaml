# Eval configuration for documentdb-cluster-deployer.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: documentdb-cluster-deployer
snapshot_date: "2026-08-11"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

legacy_spec: ../eval/test-cases.yaml

evals:
  - id: production-multi-az-changestreams
    difficulty: hard
    prompt_file: prompts/production-multi-az-changestreams.md
    baseline_file: baselines/production-multi-az-changestreams.md
    expected_verdict: READY_TO_DEPLOY

  - id: change-streams-cdc
    difficulty: hard
    prompt_file: prompts/change-streams-cdc.md
    baseline_file: baselines/change-streams-cdc.md
    expected_verdict: READY_TO_DEPLOY

  - id: t3-development-cluster
    difficulty: medium
    prompt_file: prompts/t3-development-cluster.md
    baseline_file: baselines/t3-development-cluster.md
    expected_verdict: READY_TO_DEPLOY

  - id: global-cluster-dr
    difficulty: hard
    prompt_file: prompts/global-cluster-dr.md
    baseline_file: baselines/global-cluster-dr.md
    expected_verdict: READY_TO_DEPLOY

  - id: missing-subnet-group
    difficulty: easy
    prompt_file: prompts/missing-subnet-group.md
    baseline_file: baselines/missing-subnet-group.md
    expected_verdict: PREREQUISITES_MISSING
