# Eval test cases for documentdb-cluster-deployer
# Co-located per the eval-backed contract (spec S-002, S-E04).
# Discovered by eval/run_eval.py via skills/*/eval/*.yaml glob.
#
# Five-case proven set exercising the READY_TO_DEPLOY /
# PREREQUISITES_MISSING classification across DocumentDB topologies
# (production multi-AZ with change streams, change streams CDC pipeline,
# t3 development cluster, global cluster for DR, missing subnet group
# prerequisite failure).
skill: documentdb-cluster-deployer
model_id: amazon.nova-pro-v1:0
profile: default
region: us-east-1
temperature: 0.0

test_cases:
  - id: production-multi-az-changestreams
    description: >-
      Provision a production multi-AZ DocumentDB cluster with r5.large
      instances, change streams enabled, KMS encryption, 7-day backup
      retention, and storage autoscaling ceiling. Expects READY_TO_DEPLOY
      with multi-AZ replication, change streams retention noted, and
      indexing strategy documented.
    input: |
      Create a DocumentDB cluster named orders-docdb in us-east-1.
      Engine version 5.0. Instance class db.r5.large with 1 primary and
      2 replicas across 3 AZs. Enable change streams with 2-day
      retention. KMS key arn:aws:kms:us-east-1:123456789012:key/abc123.
      Backup retention 7 days. Storage autoscaling ceiling 10 TB.
      Subnet group docdb-subnet-group. Security group sg-docdb-001
      (port 27017 from 10.0.0.0/16). Indexes on {status, created_at}
      compound and {email} single. Tags: Environment=production,
      Application=orders.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "orders-docdb"
        - "5.0.0"
        - "db.r5.large"
        - "change_streams"
        - "VERDICT"
        - "CHECKLIST"
        - "VERIFICATION_COMMANDS"
        - "multi-AZ"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: change-streams-cdc
    description: >-
      Provision a DocumentDB cluster specifically for a CDC pipeline
      using change streams. Expects READY_TO_DEPLOY with change streams
      enabled and the CDC workflow documented.
    input: |
      Create a DocumentDB cluster named events-cdc in us-east-1 for a
      change data capture pipeline. Engine 5.0. Instance class
      db.r5.xlarge with 1 primary and 1 replica. Change streams with
      3-day retention (259200 seconds). KMS encryption with customer
      key arn:aws:kms:us-east-1:123456789012:key/def456. Backup 14
      days. Subnet group docdb-events-sg. Security group sg-events-001.
      Tags: Environment=production, Pipeline=CDC.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "events-cdc"
        - "change_streams"
        - "259200"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: t3-development-cluster
    description: >-
      Provision a development DocumentDB cluster using t3.medium
      instances. Expects READY_TO_DEPLOY with t3 instance type noted
      as development-only.
    input: |
      Create a DocumentDB cluster named dev-docdb in us-east-1 for
      development. Engine 4.0. Instance class db.t3.medium with 1
      instance only. Backup 1 day. Subnet group docdb-dev-subnet.
      Security group sg-dev-docdb (port 27017 from 10.99.0.0/16).
      Tags: Environment=development.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "dev-docdb"
        - "db.t3.medium"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: global-cluster-dr
    description: >-
      Provision a DocumentDB global cluster for cross-region disaster
      recovery. Expects READY_TO_DEPLOY with primary in us-east-1 and
      secondary in eu-west-1, failover scripting noted.
    input: |
      Create a DocumentDB global cluster named orders-global. Primary
      cluster orders-docdb-primary in us-east-1 with db.r5.2xlarge,
      1 primary + 2 replicas. Secondary cluster orders-docdb-secondary
      in eu-west-1 with db.r5.2xlarge, 1 primary + 2 replicas. Engine
      5.0. KMS encryption. Backup 7 days. Tags: Environment=production,
      DR=active-active.
    expected_verdict: READY_TO_DEPLOY
    assertions:
      must_contain:
        - "READY_TO_DEPLOY"
        - "global"
        - "us-east-1"
        - "eu-west-1"
        - "VERDICT"
        - "CHECKLIST"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: PREREQUISITES_MISSING"

  - id: missing-subnet-group
    description: >-
      Operator requests a DocumentDB cluster but the subnet group has
      not been created. This is a prerequisite failure. Expects
      PREREQUISITES_MISSING with the missing subnet group cited.
    input: |
      Create a DocumentDB cluster named orders-docdb in us-east-1.
      Engine 5.0. Instance class db.r5.large. Use subnet group
      docdb-missing-subnet. Security group sg-docdb-001.
    expected_verdict: PREREQUISITES_MISSING
    assertions:
      must_contain:
        - "PREREQUISITES_MISSING"
        - "subnet"
        - "VERDICT"
        - "CHECKLIST"
        - "docdb-missing-subnet"
      must_not_contain:
        - "Error:"
        - "I cannot"
        - "I'm unable"
        - "VERDICT: READY_TO_DEPLOY"
