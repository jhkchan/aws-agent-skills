# Eval configuration for tag-governance-automator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: tag-governance-automator
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: tag-policy-org-baseline
    difficulty: easy
    prompt_file: prompts/tag-policy-org-baseline.md
    baseline_file: baselines/tag-policy-org-baseline.md
    expected_verdict: AUTOMATED
  - id: auto-tag-on-create
    difficulty: medium
    prompt_file: prompts/auto-tag-on-create.md
    baseline_file: baselines/auto-tag-on-create.md
    expected_verdict: AUTOMATED
  - id: abac-policy-design
    difficulty: hard
    prompt_file: prompts/abac-policy-design.md
    baseline_file: baselines/abac-policy-design.md
    expected_verdict: AUTOMATED
  - id: bulk-remediation-config-ssm
    difficulty: hard
    prompt_file: prompts/bulk-remediation-config-ssm.md
    baseline_file: baselines/bulk-remediation-config-ssm.md
    expected_verdict: AUTOMATED
  - id: manual-gap-billing-activation
    difficulty: medium
    prompt_file: prompts/manual-gap-billing-activation.md
    baseline_file: baselines/manual-gap-billing-activation.md
    expected_verdict: MANUAL_STEP_REQUIRED
