# Eval configuration for backup-cross-region-operator.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: backup-cross-region-operator
snapshot_date: "2026-08-10"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: add-copy-rule-ready
    difficulty: medium
    prompt_file: prompts/add-copy-rule-ready.md
    baseline_file: baselines/add-copy-rule-ready.md
    expected_verdict: READY
    expected_risk: MODERATE
  - id: start-cross-region-copy-ready
    difficulty: medium
    prompt_file: prompts/start-cross-region-copy-ready.md
    baseline_file: baselines/start-cross-region-copy-ready.md
    expected_verdict: READY
    expected_risk: LOW
  - id: cross-account-blocked
    difficulty: hard
    prompt_file: prompts/cross-account-blocked.md
    baseline_file: baselines/cross-account-blocked.md
    expected_verdict: BLOCKED
    expected_risk: HIGH
  - id: lock-dr-vault-ready
    difficulty: hard
    prompt_file: prompts/lock-dr-vault-ready.md
    baseline_file: baselines/lock-dr-vault-ready.md
    expected_verdict: READY
    expected_risk: MODERATE
  - id: cross-region-restore-completed
    difficulty: medium
    prompt_file: prompts/cross-region-restore-completed.md
    baseline_file: baselines/cross-region-restore-completed.md
    expected_verdict: COMPLETED
    expected_risk: LOW
