# Eval configuration for sqs-dlq-policy-auditor.
#
# Maps each eval case to its external prompt and baseline files so the same
# case can run with-skill (SKILL.md loaded) vs without-skill (baseline only)
# for delta comparison. This is the canonical structured-eval eval surface.
#
# The legacy eval/test-cases.yaml is preserved as the CI assertion-layer shim
# discovered by eval/run_eval.py (skills/*/eval/*.yaml glob). This file does
# not replace it — it adds the structured with-skill-vs-baseline dimension.
skill_name: sqs-dlq-policy-auditor
snapshot_date: "2026-08-05"
baseline_model: amazon.nova-pro-v1:0
judge_model_id: openai.gpt-oss-120b-1:0
profile: default
region: us-east-1
temperature: 0.0

evals:
  - id: public-access-no-condition
    difficulty: easy
    prompt_file: prompts/public-access-no-condition.md
    baseline_file: baselines/public-access-no-condition.md
    expected_verdict: PUBLIC_ACCESS
    expected_risk: CRITICAL
  - id: no-dlq-configured
    difficulty: easy
    prompt_file: prompts/no-dlq-configured.md
    baseline_file: baselines/no-dlq-configured.md
    expected_verdict: NO_DLQ
    expected_risk: HIGH
  - id: no-encryption-queue
    difficulty: easy
    prompt_file: prompts/no-encryption-queue.md
    baseline_file: baselines/no-encryption-queue.md
    expected_verdict: NO_ENCRYPTION
    expected_risk: HIGH
  - id: config-gap-maxreceive-one
    difficulty: medium
    prompt_file: prompts/config-gap-maxreceive-one.md
    baseline_file: baselines/config-gap-maxreceive-one.md
    expected_verdict: CONFIG_GAP
    expected_risk: MODERATE
  - id: ok-clean-config
    difficulty: easy
    prompt_file: prompts/ok-clean-config.md
    baseline_file: baselines/ok-clean-config.md
    expected_verdict: OK
    expected_risk: LOW
  - id: public-source-arn-still-ok
    difficulty: hard
    prompt_file: prompts/public-source-arn-still-ok.md
    baseline_file: baselines/public-source-arn-still-ok.md
    expected_verdict: OK
    expected_risk: LOW
